# The whole site in one deploy: static assets (the built app in public/)
# served free and unmetered, plus the Rust API worker, which only runs
# for the routes named in run_worker_first - everything else never
# touches the worker or the bill.
#
# One-time setup:
#   npx wrangler kv namespace create PLANS   # put the id below
# Deploy (after npm run build:web):
#   npx wrangler deploy -c workers/api/wrangler.toml
# The app and API share an origin, so siteconfig api_base stays empty.
name = "reqweaver"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-01"

[build]
command = "cargo install -q worker-build && worker-build --release"

[assets]
directory = "../../public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/encode"]

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "PLANS"
id = "REPLACE_WITH_NAMESPACE_ID"

# Production, deployed by the release workflow on v* tags. Pushes to
# main deploy the default (staging) worker above. Attach the custom
# domain to this one; a separate KV namespace keeps staging saves out
# of production.
[env.production]
name = "reqweaver-prod"

[env.production.assets]
directory = "../../public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/encode"]

[env.production.ai]
binding = "AI"

[[env.production.kv_namespaces]]
binding = "PLANS"
id = "REPLACE_WITH_PROD_NAMESPACE_ID"
