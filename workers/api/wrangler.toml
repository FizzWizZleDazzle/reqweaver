# The API worker alone: goal encoding and plan storage. The site is a
# Cloudflare Pages project (reqweaver-site); the worker serves no
# assets.
#
# One-time setup:
#   npx wrangler kv namespace create PLANS   # put the id below
# Deploy (after npm run build:web), from this directory so the crate
# build runs where Cargo.toml lives:
#   cd workers/api && npx wrangler deploy
# The app and API share an origin, so siteconfig api_base stays empty.
name = "reqweaver"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-01"
account_id = "1df5493dcedcbaa0980b3aa7687ee599"

[build]
# install only when absent: a cache-restored binary makes cargo
# install fail with "binary already exists in destination"
command = "command -v worker-build >/dev/null || cargo install -q worker-build; worker-build --release"

# Cost ceilings. cpu_ms bounds one request's compute; AI_DAILY_LIMIT is
# the global model-call budget per day (cache hits are free and exempt),
# sized well inside the plan's included Workers AI allocation.
[limits]
cpu_ms = 50

[vars]
AI_DAILY_LIMIT = "5000"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "PLANS"
id = "a600911aba3842f4acb91505232805b6"

# Production, deployed by the release workflow on v* tags. Pushes to
# main deploy the default (staging) worker above. Attach the custom
# domain to this one; a separate KV namespace keeps staging saves out
# of production.
[env.production]
name = "reqweaver-prod"
# the workers.dev hostname stays on: the Pages site names it as
# api_base until the apex route exists, and it costs nothing
workers_dev = true
# The apex /api route is attached in the dashboard if same-origin is
# ever wanted; declaring it here needs a token with zone Workers
# Routes permission, which CI's token does not carry.

[env.production.ai]
binding = "AI"

[env.production.limits]
cpu_ms = 50

[env.production.vars]
AI_DAILY_LIMIT = "5000"

[[env.production.kv_namespaces]]
binding = "PLANS"
id = "eb09dfb77da2456d866b35147e636bac"
