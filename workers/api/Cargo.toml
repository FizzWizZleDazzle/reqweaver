[package]
name = "reqweaver-api"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bs58 = "0.5"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
# strip = true is deliberately absent: stripping removes metadata
# wasm-bindgen's externref pass needs ("failed to generate catch
# wrappers"); wasm-opt shrinks the module during worker-build anyway.
