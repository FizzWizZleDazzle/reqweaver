name: deploy
# Deploys the site and API as one Worker on every push to main, once the
# repository has a CLOUDFLARE_API_TOKEN secret (a token scoped to Workers
# Scripts:Edit, Workers KV:Edit, and Workers AI). Without the secret the
# job skips cleanly, so forks and the pre-release period stay green.
on:
  push:
    branches: [main]
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check for deploy credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "no CLOUDFLARE_API_TOKEN secret; skipping deploy"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.creds.outputs.present == 'true'
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci && npm run build:web
        if: steps.creds.outputs.present == 'true'
      - run: npx wrangler deploy -c workers/api/wrangler.toml
        if: steps.creds.outputs.present == 'true'
