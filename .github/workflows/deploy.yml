name: deploy
# Deploys the site and API as one Worker on every push to main, once the
# repository has a CLOUDFLARE_API_TOKEN secret (a token scoped to Workers
# Scripts:Edit, Workers KV:Edit, and Workers AI). Without the secret the
# job skips cleanly, so forks and the pre-release period stay green.
on:
  push:
    branches: [main]
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check for deploy credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "no CLOUDFLARE_API_TOKEN secret; skipping deploy"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.creds.outputs.present == 'true'
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci && npm run build:web
        if: steps.creds.outputs.present == 'true'
      - uses: actions/cache@v4
        if: steps.creds.outputs.present == 'true'
        with:
          path: |
            ~/.cache/worker-build
            ~/.cargo/bin/worker-build
          key: worker-build-${{ hashFiles('workers/api/Cargo.lock') }}
      - name: Deploy (retried; the wasm-bindgen download flakes)
        if: steps.creds.outputs.present == 'true'
        working-directory: workers/api
        run: |
          for i in 1 2 3; do
            npx wrangler deploy && exit 0
            echo "deploy attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
      - name: Deploy the Pages site from the same build
        if: steps.creds.outputs.present == 'true'
        env:
          # the Pages-scoped token; the main token cannot touch Pages,
          # and the account must be pinned in non-interactive mode
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_API_BASE: https://reqweaver-prod.arturmisiurev.workers.dev
        run: |
          node lib/tools/webdata.js
          npx wrangler pages deploy public --project-name reqweaver-site --branch main
