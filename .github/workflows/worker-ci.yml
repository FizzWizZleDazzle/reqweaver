name: worker-ci
# Validates the Rust worker build on pull requests that touch it, so a
# broken crate or toolchain mismatch surfaces before merge instead of
# in the post-merge deploy. --dry-run builds everything and uploads
# nothing.
on:
  pull_request:
    paths:
      - 'workers/**'
  push:
    branches: [main]
    paths:
      - 'workers/**'
jobs:
  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/worker-build
            ~/.cargo/bin/worker-build
          key: worker-build-${{ hashFiles('workers/api/Cargo.lock') }}
      - name: Dry-run build (retried; the wasm-bindgen download flakes)
        working-directory: workers/api
        run: |
          mkdir -p ../../public
          for i in 1 2 3; do
            npx wrangler deploy --dry-run --outdir dist && exit 0
            echo "build attempt $i failed; retrying" >&2
            sleep 20
          done
          exit 1
