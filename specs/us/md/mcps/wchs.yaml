  - id: SOC2055
    name: Sociology 1
    description: >-
      Sociology 1 is concerned with human groups and factors that unite or divide them, including culture, values, social groups, social stratification, population, the family, socialization, propaganda, and social institutions. Focus is on the impact of change on mores, norms, and customs. In Sociology 2, emphasis is placed on the application of the basic concepts of social change to American institutions, particularly education and the family. Research papers focus on community or on-site research.
