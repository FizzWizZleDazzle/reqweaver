specsheet: school
schema_version: 1
catalog_year: 2026
id: us/md/mcps/wchs
kind: high_school
name: Winston Churchill High School (MCPS 2026-27 catalog)
credit_unit: carnegie
terms_per_year:
  - { id: fall,   sequence: 1 }
  - { id: spring, sequence: 2 }
  # Summer school offers select original-credit courses only. This list
  # is the typical MCPS offering (health, PE, NSL Government, Algebra 1,
  # Geometry); verify against the yearly summer catalog.
  - id: summer
    sequence: 3
    optional: true
    max_courses: 2   # 2 slots; an A/B pair taken together fills one
    sequential: true # sessions run consecutively, so B may follow A
    max_credits: 1.0 # one credit per summer, the current MCPS policy
    offerings: [HPE2047A, HPE2047B, HPE2011, HPE2016, SOC2004A, SOC2004B,
                MAT2000A, MAT2000B, MAT2003A, MAT2003B]
grade_levels: [9, 10, 11, 12]
max_courses_per_term: 7
pre_hs_credit:
  satisfies_prereqs: true
  counts_toward_grad: true

notes:
  - >-
    Mathematics - of the four required credits, one must be an algebra credit and one must be a geometry credit, and students must be enrolled in a math course in each year of high school. Neither rule is expressible as a credit total, so both are recorded here rather than in grad_requirements.
  - >-
    Science - of the three required NGSS-aligned credits, one must be a biology credit and one must be a physical science credit. The school recommends that all students take biology, chemistry, and physics.
  - >-
    Technology - MSDE requires a state-approved technology course. The MCPS courses that meet it are marked TE in the catalog (ITC2083, TEC2016, TEC2006, ITC2084, ITC2081). This is not recorded in grad_requirements because the subject tag vocabulary cannot single out the TE-designated subset of CTE courses.
  - >-
    Social studies - the course descriptions state that U.S. History, NSL Government, and Modern World History are each required for graduation. AP U.S. History satisfies the U.S. History year, AP Government and Politics U.S. NSL satisfies the NSL Government requirement, and AP World History satisfies the Modern World History requirement. The file states no credit total for social studies, so none is recorded.
  - >-
    The English Language Arts file states no graduation requirement, so none is recorded for English.
  - >-
    Prerequisite naming - the science file names prerequisites without the Honors prefix ("Biology A/B", "Chemistry A/B", "Physics A/B"). These resolve to the only courses of that subject offered (SCI2001, SCI2004, SCI2006). "Algebra 2 A/B" in a science prerequisite is read as either Algebra 2 or Honors Algebra 2.
  - >-
    Course ids are taken from each department's course-selection table. Where a detail section states a different id, the course carries a note recording it. Grade levels are taken from the detail section where one exists, and from the table otherwise.
  - >-
    Summer offerings vary from year to year, so no course lists summer in offered_terms.
  - >-
    MAT2038A may also be paired with MAT2041B as "Multivariable Calculus A / BC Calculus B", a combination listed in the mathematics course-selection table.
  - >-
    NSS5112 "Dual Enrollment" appears in the Computer Science and Broadcast Media program-of-study tables as a capstone option. It is a pointer to the Montgomery College dual enrollment program rather than a school course, so it is not listed under courses; see dual_enrollment.
  - >-
    Content groups mark courses that teach the same material at different rigor tiers, so a student takes one or the other but not both. Groups are formed per semester half. A family is grouped only when no prerequisite path connects its members; where the catalog allows one tier to serve as a prerequisite for another, the two are a possible sequence rather than variants and are left ungrouped. The families left ungrouped for that reason and for content ambiguity are recorded in the notes below.
  - >-
    AP BC Calculus (MAT2041A/B) is left ungrouped. It is a first-year calculus variant alongside AP AB Calculus and Calculus w/Applications, but the catalog also accepts AP AB Calculus A/B as its prerequisite, so a student may take AB and then BC in sequence. Grouping the three would make that catalog-legal path unplannable. Calculus w/Applications and AP AB Calculus are grouped.
  - >-
    AP Statistics (MAT2068A/B) and Honors Statistics (MAT2046A/B) are left ungrouped. The catalog accepts "Completion of Honors Statistics A/B or Honors Algebra 2 A/B" as the AP Statistics prerequisite, so Honors Statistics followed by AP Statistics is a legal sequence.
  - >-
    2YR Algebra 2 A/B (MAT2015A/B) is left out of the algebra2 content groups. It is the first year of the two-year stretch of Algebra 2, and 2YR Algebra 2 C/D requires it; grouping the two years together would make the two-year path unplannable. The second year, 2YR Algebra 2 C/D (MAT2016A/B), is grouped with Algebra 2 and Honors Algebra 2 as the whole-course family, since a student completes the same Algebra 2 content by one route or the other.
  - >-
    Honors Physics (SCI2006A/B) and AP Physics 1 (SCI2072A/B) are left ungrouped. The AP Physics 1 prerequisite is Geometry rather than Physics, which suggests it is the first-year physics alternative, but its description says it "builds on concepts covered in Physics", which suggests a sequel. The catalog does not settle it.
  - >-
    Science has no regular tier to pair with Honors Biology, Honors Chemistry, or Honors Physics; only the honors version of each is offered. AP Biology, AP Chemistry, and AP Environmental Science all require Biology and Chemistry outright and are sequels rather than variants.
  - >-
    Each world language level is offered at a single tier, so there are no within-level rigor pairs to group. The exception is Chinese, where the catalog states that students registering for AP Chinese may be placed in Chinese 6 and students registering for Chinese 6 may be placed in AP Chinese if enrollment is insufficient; those two are grouped. AP Spanish Language and AP Spanish Literature are separate exams and separate content, and are not grouped.
  - >-
    The double-period AP art courses that carry one id across both semesters, AP Art 2D Design DP (ART2065) and AP Art 3D Design DP (ART2067), are left ungrouped. They are the same content as AP 2D Art & Design (ART2064A/B) and AP 3D Art & Design (ART2066A/B), but a single-id full-year course cannot join per-half groups when a course may carry only one content id. AP Drawing (ART2062A/B) and AP Drawing DP (ART2063A/B) both have separate halves and are grouped.
  - >-
    AP 2D Photography (ART2040A/B) and AP 2D Art & Design (ART2064A/B) are left ungrouped. Both prepare the same AP 2D Art and Design portfolio, but they are taught in different media through different studio strands and carry different prerequisites.
  - >-
    Economics (SOC2052) and AP Microeconomics/AP Macroeconomics (SOC2065, SOC2064) are left ungrouped. Economics is a one-semester survey and the two AP courses are separate one-semester college-level courses, so the tiers do not line up one to one.
  - >-
    Psychology 1/2 (SOC2053, SOC2054) and AP Psychology (SOC2069A/B) are left ungrouped. Their descriptions cover the same domains, but the catalog presents Psychology 1/2 as a numbered sequence rather than as semester halves, so which half of AP Psychology corresponds to which Psychology course is not stated.
  - >-
    African American History (SOC2019) and AP African American Studies (SOC2101A/B) are left ungrouped. The first is a one-semester survey and the second a full-year interdisciplinary course, so they are not the same content at two tiers.
  - >-
    Found Computer Sci (ITC2083A/B) and AP Computer Sci Prin (ITC2084A/B) are left ungrouped. Both are introductory Code.org courses carrying the TE designation, but they follow different curricula and neither is stated as a substitute for the other.
  - >-
    Fnd of Engr and Technology (TEC2016A/B) and Making for Engineers (TEC2006A/B) are left ungrouped. Design for Engineers accepts either one as its prerequisite, which suggests they occupy the same slot, but they follow different curricula and are offered at different levels and grade ranges.
  - >-
    The program-of-study capstone lists ("Must choose one") are program rules rather than content groups, so the capstone options for Computer Science and for Broadcast Media are not grouped. Internship, Internship DP, and Internship TP (WBL2014, WBL2015, WBL2016) are grouped, because they carry the same description and differ only in required hours.

grad_requirements:
  - id: math
    label: Mathematics
    credits: 4.0
    satisfied_by: { tag: math }
  - id: science
    label: Science
    credits: 3.0
    satisfied_by: { tag: science }
  - id: pe
    label: Physical Education
    credits: 1.0
    satisfied_by: { tag: pe }
  - id: fine-arts
    label: Fine Arts
    credits: 1.0
    satisfied_by: { tag: fine_arts }
  - id: english9
    label: English 9
    credits: 1.0
    satisfied_by: { content: [english9_a, english9_b] }
    notes: >-
      MCPS requires the English 9-12 sequence, not any four English credits; the content groups let honors and EML placement tiers satisfy each slot. The ELA file states no requirement; verify against school policy.
  - id: english10
    label: English 10
    credits: 1.0
    satisfied_by: { content: [english10_a, english10_b] }
  - id: english11
    label: English 11
    credits: 1.0
    satisfied_by: { content: [english11_a, english11_b] }
  - id: english12
    label: English 12
    credits: 1.0
    satisfied_by:
      any:
        - { content: [english12_a, english12_b] }
        - { courses: [ENGL101, ENGL102, ENGL103, ENGL190, ENGL264, ENGL265] }
    notes: >-
      An approved Montgomery College English course through dual enrollment stands in for senior English; the counselor schedules it as ENG5111, CE Adv English. Taking it in an MC summer session is the known path to finishing the English sequence early.
  - id: us-history
    label: U.S. History
    credits: 1.0
    satisfied_by: { content: [us_history_a, us_history_b] }
    notes: >-
      The Social Studies file requires U.S. History, NSL Government, and Modern World History specifically; the content groups let the AP variants satisfy each slot.
  - id: nsl-government
    label: NSL Government
    credits: 1.0
    satisfied_by: { content: [nsl_government_a, nsl_government_b] }
  - id: modern-world-history
    label: Modern World History
    credits: 1.0
    satisfied_by: { content: [modern_world_history_a, modern_world_history_b] }
  - id: health
    label: Health
    credits: 1.0
    satisfied_by: { tag: health }
    notes: >-
      The Health and Physical Education file states a requirement for physical education only. 0.5 credits of health is the standard MSDE requirement, recorded here so that plans do not skip health, and should be verified against the school policy.

  - id: program
    label: World Language or CTE Program
    credits: 2.0
    satisfied_by:
      any:
        - { tag: world_language }
        - { tag: cte }
    notes: >-
      The MSDE program requirement: 2.0 credits of one world language or of career and technical education. The 4-credit career-pathway alternative is not modeled separately; two CTE credits satisfy this entry.

courses:
  # --- Mathematics -------------------------------------------------------
  - id: MAT2000A
    name: Algebra 1 A
    description: >-
      Algebra 1 is designed to analyze and model real-world phenomena. Exploration of linear, exponential, and quadratic functions forms the foundation of the course. Key characteristics and representations of functions--graphic, numeric, symbolic, and verbal--are analyzed and compared. Students develop fluency in solving equations and inequalities. One- and two-variable data sets are interpreted using mathematical models.
    credits: 0.5
    tags: [math]
    level: regular
    offered_terms: [fall]
    grade_levels: [9, 10, 11, 12]
    prereqs:
      all_of: []
      any_of: []
  - id: MAT2000B
    name: Algebra 1 B
