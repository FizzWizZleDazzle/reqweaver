  - id: ART2082A
    name: Guitar A
    description: >-
      Students will learn to create, perform, and respond to guitar music in a variety of styles/genres. Students will learn and develop beginning guitar skills, including selected major, minor, seventh, and power chords; major, minor and pentatonic scales; basic strumming, picking, and fingerpicking; and tuning technique. Cultural, historical, personal, and social context are studied as they relate to guitar repertoire. Students develop effective practice habits so they will be able to progress independently. This course is open to all students, regardless of music background. This course satisfies the fine art graduation requirement and may be taken up to three times for credit.
