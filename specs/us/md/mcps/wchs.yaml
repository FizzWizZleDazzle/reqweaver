      Students will create, perform, and respond to music in a variety of styles/genres. Students will refine proper vocal technique and choral singing in relation to posture, breath control, tone, intonation, diction, blending, singing in harmony, music literacy, and sight-singing in multiple keys and parts. Students will sing primarily state-level 5-6 music, often without accompaniment. This choir is a highly demanding ensemble, generally between 16-24 students, requiring an advanced level of vocal independence. This ensemble has a very active performance schedule, which may include multiple concerts, school performances, and festivals and students are expected to participate in all performances. An audition and/or a prerequisite of HS Chorus 1,2 and/or 3 may be required to participate. This satisfies the fine arts requirement and may be taken up to four times for credit.
