    description: >-
      Programming is integral to solving many engineering problems but often the actual programs and math involved can be cumbersome. Matlab is an online software platform used by colleges, universities and businesses to help analyze and design different systems to solve engineering problems. Programming for Engineers e4usa will allow students to make use of the powerful Matlab software to: 1. Design and evaluate computational solutions for an engineering problem using Matlab as part of their solution. 2. Investigate engineering solutions that include computing innovations. 3. Contribute to an inclusive, safe, collaborative, and ethical computing culture as part of the engineering design process. Students can use this course to prepare them for the AP-Computer Science Principles test.
