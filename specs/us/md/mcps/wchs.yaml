  - id: SOC2095
    name: Holocaust Studies
    description: >-
      This course is a one semester high school elective course that will provide students with an in-depth historical analysis of the Holocaust and the events and ideas which lead to the Holocaust and the aftermath of the Holocaust. This course design would use the 100% free and well tested curriculum of Echoes and Reflections which was created in 2005. Using the leadership and research of the USC Shoah Foundation, ADL and Yad Vashem, in addition to resources from the United States Holocaust Memorial Museum, this course will provide educators without a great depth of knowledge of the Holocaust to offer a robust and meaningful course. Additionally, since the curriculum is supplied with paid experts and facilitators, educators from MCPS will have great support in the terms of training and even travel opportunities to support their work of teaching this course. As the CEO of the Anti-Defamation League Jonathan Greenblatt recently said at a conference to combat modern antisemitism "Learning about the Holocaust is one of the best ways to fight prejudice and discrimination." Lessons are organized by topics that represent major themes associated with the Holocaust in an order that is roughly chronological; the modular design of the Lessons allows for adaption and customization to specific grade levels and subject areas. The integration of rich content in each Lesson helps students construct an authentic and comprehensive portrait of the past as they frame their own thoughts about what they are learning, resulting in a deeper level of interest and inquiry.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [10, 11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      May only be taken for one semester, in either semester 1 or semester 2.

  - id: SOC2059
    name: Law
    description: >-
      This course is designed to help students understand the processes by which American society seeks justice and order through law, and ways in which people can participate in those processes. Students examine history and philosophy of law, how the law works and can be made to work in actual situations, and major substantive areas of law such as torts, property, criminal, and juvenile law.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [10, 11, 12]
