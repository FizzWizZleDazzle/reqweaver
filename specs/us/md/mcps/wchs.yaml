  - id: ART2105A
    name: Play Directing
    description: >-
      Students focus on the skills required in Theatre directing. Study centers on the director as interpretative and creative artist, selecting and casting the play, coordinating design functions, blocking the play, developing characterization, and rehearsing the play and developing an ensemble effect in performance. Through the study of various theories, students direct both traditional and experimental theatre forms as culminating productions. This course may be repeated for credit.
    credits: 0.5
    tags: [fine_arts]
    level: advanced
    offered_terms: [fall]
    grade_levels: [11, 12]
    prereqs:
      all_of: [ART2107B]
      any_of: []
    notes: >-
      Offered in semester 1, paired in the course-selection table with Advanced Acting (ART2103B) in semester 2.

  - id: ART2103B
    name: Advanced Acting
    description: >-
      This course provides complex development of acting skills and theories begun in Theatre 2. Carefully structured methods of role/character development are introduced. The vocal and physical techniques of period and stylized acting are studied. Group experiences such as Children's and Readers' Theatre are provided. This course may be repeated for credit.
