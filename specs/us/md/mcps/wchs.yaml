  - id: NSS2034A
    name: Career Seminar A
    description: >-
      Taken concurrently with Site-Based Work Experience, students will apply knowledge learned in CCRD to the practical experience of their site-based learning placement. This course teaches how to effectively manage career and educational choices through incorporating employment, education and training. It builds financial literacy skills and integrates the Maryland's Skills for Success competencies. Students will learn how to navigate FAFSA, how to pay for college/post secondary training, and how to keep their job (focusing on the traits of a good employee). Credit card basics, taxes and other practical financial skills are highlighted in this course.
