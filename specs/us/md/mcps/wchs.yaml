  - id: ART2024A
    name: Adv Fashion Production 2A
    description: >-
      Students will present a collection of garments, after refining fabrication skills and craftsmanship needed to create functional attire. They will experiment with and manipulate formal qualities and compositional devices in a way that enhances their own point of view as a designer. This course will challenge students to analyze perceptions of fashion from different times and places, with a focus on how cultural tradition and available tradition and available materials influence designers' ideas and work. Writing, academic language, and critical-thinking skills are developed through artist statements, critiques, and the close reading of artworks as text.
