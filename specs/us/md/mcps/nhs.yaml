    description: >-
      The Introduction to Agriculture, Food, and Natural Resources course is structured to enable all students to have a variety of experiences that will provide an overview of the fields of agricultural science and natural resources. This course provides students the opportunity to experience exciting "hands-on" activities, projects, and problems that will involve the study of communication, the science of agriculture, plants, animals, natural resources, and agricultural mechanics. While surveying the career opportunities available in agriculture and natural resources, in this course students will also learn to solve problems, conduct research, analyze data, and work in teams.
