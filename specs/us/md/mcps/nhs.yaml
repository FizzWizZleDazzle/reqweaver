    name: English 10 AP Seminar A
    description: >-
      English 10 AP Seminar combines the English 10 curriculum with a seminar-style course where students complete readings from different genres and concentrate on specific topics for their discussions. Students build a powerful foundation for critical and transferable research skills including investigation, collaboration, writing, and presentation. These skills help improve their outcomes in future high school courses, college, and career. Students explore ideas and topics of their own interest through the English 10 curriculum and learn to work in teams to investigate real-world issues and present an argument for their proposed solution. English 10/AP Seminar satisfies the graduation requirement of a year in English 10.
