  - id: MAT2033A
    name: AP Pre-Calculus A
    description: >-
      AP Precalculus is a course designed to better prepare students for college-level calculus as well as provide the foundation for other mathematics and science courses. Students focus on the use of technology, modeling and problem solving that are foundational for careers in mathematics, physics, biology, health science, social science, and data science. Students develop a conceptual understanding of polynomial and rational functions, exponential and logarithmic functions, trigonometric and polar functions, and functions involving parameters, vectors, and matrices to support their learning and application of mathematics in the real world. Additionally, AP Precalculus is structured to be a stepping block to AP Calculus as well as a College Board Exam that assesses three practices: procedural and symbolic fluency, multiple representations, and communication and reasoning. AP Precalculus satisfies one of the Math graduation requirements.
