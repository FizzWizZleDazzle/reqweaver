specsheet: school
schema_version: 1
catalog_year: 2026
id: us/md/mcps/nhs
kind: high_school
name: Northwood High School (MCPS 2026-27 catalog)
credit_unit: carnegie
terms_per_year:
  - { id: fall,   sequence: 1 }
  - { id: spring, sequence: 2 }
  # Summer school offers select original-credit courses only. This is the
  # Churchill list filtered to what Northwood offers; verify against the
  # yearly summer catalog.
  - id: summer
    sequence: 3
    optional: true
    max_courses: 2   # 2 slots; an A/B pair taken together fills one
    sequential: true # sessions run consecutively, so B may follow A
    max_credits: 1.0 # one credit per summer, the current MCPS policy
    offerings: [HPE2047A, HPE2047B, HPE2016, SOC2004A, SOC2004B, MAT2000A, MAT2000B, MAT2003A, MAT2003B]
grade_levels: [9, 10, 11, 12]
max_courses_per_term: 7
pre_hs_credit:
  satisfies_prereqs: true
  counts_toward_grad: true

notes:
  - >-
    The source file is named "NHS Courses 25-26" but the owner states it is the 2026-27 offering list, so catalog_year is 2026. The filename year is a discrepancy in the source, not in this sheet.
  - >-
    The Northwood source lists course ids and names only: no descriptions, no prerequisites, no credits. Where an id also appears in the Churchill sheet (specs/us/md/mcps/wchs.yaml) the description, prerequisites, tags, level, exam, content group, excludes and periods are taken from there unchanged, because both schools draw on the same district course bulletin. Every other course was looked up in the MCPS 2026-27 High School Course Catalog at coursecatalog.montgomeryschoolsmd.org; where the catalog had no entry, a few descriptions come from the MCPS High School Course Bulletin 2020-2021, the most recent published PDF edition. Courses carrying a note that the bulletin entry was not found have no description rather than an invented one.
  - >-
    Grade windows come from the parenthetical notes in the Northwood file where it gives one, from the district catalog where it does not, and from the Churchill sheet otherwise.
  - >-
    Prerequisite rewriting: a prerequisite copied from the Churchill sheet that names a course Northwood offers at more than one tier is widened to an any_of over the Northwood tiers of that content group, so that the on-level path is not blocked by a prerequisite naming only the honors course. Prerequisites naming a course Northwood does not offer are dropped.
  - >-
    Northwood offers on-level tiers that Churchill does not: English 9, English 10, English 11, Biology, Chemistry, U.S. History, National State and Local Government, and Modern World History. Each is grouped with its honors and AP tiers, so the English and named social studies graduation requirements are satisfied by whichever tier a student takes.
  - >-
    max_courses_per_term is carried over from the Churchill sheet at 7. Northwood's bell schedule was not part of the source file; verify the period count against the school's schedule.
  - >-
    Summer offerings are the Churchill list filtered to the courses Northwood actually offers. Northwood does not offer CPE Net Sports (HPE2011), so that entry is dropped. Summer offerings vary yearly; verify against the summer catalog.
  - >-
    Source-file typos resolved, each to the sensible pair: "MAT2003A/MAT2004B Geometry" reads as MAT2003A/MAT2003B, since MAT2004B is the Honors Geometry B half listed on the next line; "MAT2004A/MAT2004/B" as MAT2004A/MAT2004B; "TEC2006A/TEC206B" as TEC2006A/TEC2006B; "WLG2131A/WGL2131B" as WLG2131A/WLG2131B; "ART2045A/ART2045/B" as ART2045A/ART2045B; "ITC20861A/ITC2086B" as ITC2086A/ITC2086B; "ENG253A/ENG2053B" as ENG2053A/ENG2053B; "PGS2011A/PGS2001B" as PGS2011A/PGS2011B.
  - >-
    The MC2/Dual Enrollment list at the end of the source file (BMF5100, BMF5102, BMF5103, ITC5104, PGS5106, ART5107, BMF5108, ENG5111, HPE5114, ART5117, MAT5119, SOC5121, BHP5123, SOC5124, ENG5125, ART5127, ART5128, WLG5130, AMC5120, TEC5126) is not listed under courses. These are Montgomery College concurrent-enrollment courses taken through the partner college; see dual_enrollment.
  - >-
    AP Computer Science Principles appears twice in the source under two ids, TEC2005A/B in the Technology and Computer Science department and ITC2011A/B in the Computer Science and Technology electives. Both are kept and share the ap_cs_principles content group so a student is planned into only one.
  - >-
    The Northwood file lists Play Directing and Advanced Acting as full-year A/B pairs (ART2105A/B and ART2103A/B); the Churchill catalog offers them as single semesters. The A/B reading is used here, with the missing half taken from the district catalog.
  - >-
    ART2104 Stage Design is printed twice in the Drama section, once with a stray colon. It is one course.
  - >-
    HPE2017 Dance as PE is printed in both the Physical Education list and the Dance pathway, in the latter as "HPE2017/HPE201710". It is one single-semester course; HPE201710 is not a course id.
  - >-
    Northwood offers no Chinese, so the Churchill chinese_level6 content group has no counterpart here. Spanish for Spanish Speakers 1-3 is a Northwood sequence with no Churchill equivalent.
  - >-
    Content groups follow the Churchill sheet: a family is grouped only when no prerequisite path connects its members. AP BC Calculus and AP Statistics stay ungrouped for that reason, and AP BC Calculus keeps its excludes pair with AP AB Calculus.

grad_requirements:
  - id: math
    label: Mathematics
    credits: 4.0
    satisfied_by: { tag: math }
  - id: science
    label: Science
    credits: 3.0
    satisfied_by: { tag: science }
  - id: pe
    label: Physical Education
    credits: 1.0
    satisfied_by: { tag: pe }
  - id: fine-arts
    label: Fine Arts
    credits: 1.0
    satisfied_by: { tag: fine_arts }
  - id: english9
    label: English 9
    credits: 1.0
    satisfied_by: { content: [english9_a, english9_b] }
    notes: >-
      MCPS requires the English 9-12 sequence, not any four English credits; the content groups let honors and EML placement tiers satisfy each slot. The ELA file states no requirement; verify against school policy.
  - id: english10
    label: English 10
    credits: 1.0
    satisfied_by: { content: [english10_a, english10_b] }
  - id: english11
    label: English 11
    credits: 1.0
    satisfied_by: { content: [english11_a, english11_b] }
  - id: english12
    label: English 12
    credits: 1.0
    satisfied_by:
      any:
        - { content: [english12_a, english12_b] }
        - { courses: [ENGL101, ENGL102, ENGL103, ENGL190, ENGL264, ENGL265] }
    notes: >-
      An approved Montgomery College English course through dual enrollment stands in for senior English; the counselor schedules it as ENG5111, CE Adv English. Taking it in an MC summer session is the known path to finishing the English sequence early.
  - id: us-history
    label: U.S. History
    credits: 1.0
    satisfied_by: { content: [us_history_a, us_history_b] }
    notes: >-
      The Social Studies file requires U.S. History, NSL Government, and Modern World History specifically; the content groups let the AP variants satisfy each slot.
  - id: nsl-government
    label: NSL Government
    credits: 1.0
    satisfied_by: { content: [nsl_government_a, nsl_government_b] }
  - id: modern-world-history
    label: Modern World History
    credits: 1.0
    satisfied_by: { content: [modern_world_history_a, modern_world_history_b] }
  - id: health
    label: Health
    credits: 1.0
    satisfied_by: { tag: health }
    notes: >-
      The Health and Physical Education file states a requirement for physical education only. 0.5 credits of health is the standard MSDE requirement, recorded here so that plans do not skip health, and should be verified against the school policy.

  - id: program
    label: World Language or CTE Program
    credits: 2.0
    satisfied_by:
      any:
        - { tag: world_language }
        - { tag: cte }
    notes: >-
      The MSDE program requirement: 2.0 credits of one world language or of career and technical education. The 4-credit career-pathway alternative is not modeled separately; two CTE credits satisfy this entry.

courses:
  - id: ENG2000A
    name: English 9 A
    description: >-
      English 9 lays the foundation for the detailed analysis and argumentation that is expected of students throughout high school. In Writing and Language 9A, students explore and develop their voices as writers. Approaching literature as apprentice writers, they examine models such as short stories, essays, and novels to explore the choices writers make and the effects arising from those choices. They learn to emulate those effects in their own work and practice reflection, revision, and rewriting. In Literature and Language 9B, students hone their critical reading skills by studying texts closely. Through careful reading and analysis, students learn to consider diverse interpretations of experience that arise out of a wide variety of perspectives.
    credits: 0.5
