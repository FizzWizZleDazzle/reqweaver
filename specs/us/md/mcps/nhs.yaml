  - id: ART2052A
    name: Art History A
    description: >-
      Every artwork tells a story. In this course, students will explore how perception, experience, and inquiry are incorporated into the narrative of artworks from a wide range of times and places. Students will be able to describe how responses to art may change after gaining awareness of the context in which it was created. By creating a visual journal, students will experience how artists can incorporate both image and text to capture and communicate ideas. Writing, academic language, and critical thinking skills are developed through artist statements, critiques, and the close reading of artworks as text.
