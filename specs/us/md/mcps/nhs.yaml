  - id: SOC2035
    name: Hip Hop History Culture
    description: >-
      This course terraces the development and impact of Hip Hop culture on contemporary society with a focus on enhancing students' cultural competence and socio-political consciousness. Students will explore the process of how marginalized groups utilized the strength of their cultural capital to create and implement a dynamic and empowering modality of survival to eventually become Hip Hop culture. Students will also research how many issues within society such as race, gender, class, violence, self identity and expression, socio-emotional competencies, censorship and politics are expressed through the lens of Hip Hop.
