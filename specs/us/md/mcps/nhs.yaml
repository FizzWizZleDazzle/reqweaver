  - id: SOC2051
    name: Women's Studies
    description: >-
      Students will examine how the political, economic, and social status of women has changed over time in the United States and the world. Students will analyze how the experiences of women today often differ in a variety of cultural and socioeconomic contexts. Students will examine how women have made advances in key areas of life, including employment, education, health, media images, and family roles. Examples of women in the U.S. and world will be used to analyze how women have made significant contributions in addressing issues of national and global concern.
