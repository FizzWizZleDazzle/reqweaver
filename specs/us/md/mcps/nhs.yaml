  - id: ART2087A
    name: Chorus 1A
    description: >-
      Students will create, perform, and respond to music in a variety of styles/genres. Students will develop the fundamentals of proper vocal technique and choral singing in relation to posture, breath control, tone, intonation, diction, blending, singing in harmony, music literacy, and sight-singing in multiple keys and parts. Students will sing primarily state-level 3-4 music. There will likely be a minimum of two school concerts as well as the opportunity to participate in other festivals/performances, and students are expected to participate in all performances. This level may be represented in multiple formats, such as Concert Choir, Treble/Baritone Choir. This course is open to all students, regardless of music background. This course satisfies the fine arts graduation requirement and can be taken up to three times for credit.
