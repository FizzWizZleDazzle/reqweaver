  - id: HPE2047A
    name: Hon Health Education A
    description: >-
      Provides students with the instruction on knowledge and skills necessary to help them make healthful decisions-both now and in the future. Through the implementation of an effective, standards-based health education instructional program, students develop and practice life skills to enhance academic success, and positive behaviors that will equip them to meet the challenges and demands of their lives. The Health promotion and disease prevention concepts presented in this course: Mental and Emotional Health; Substance Abuse Prevention; Family Life and Human Sexuality; Safety and Violence Prevention; Healthy Eating; and Disease Prevention and Control. Health Education aligns with Be Well 365 by emphasizing lifelong positive health-related attitudes and behaviors that promote self-reliance and self-regulation for all students.
    credits: 0.5
    tags: [health]
    level: honors
    offered_terms: [fall]
    grade_levels: [10]
    prereqs:
      all_of: []
      any_of: []
  - id: HPE2047B
    name: Hon Health Education B
    description: >-
      Builds on the prerequisite course Honors Health Education A. In this course, students engage further with health promotion concepts. The goal of this course is to engage more through health literacy skill development to promote and support health-enhancing behaviors. The health literacy skills include analyzing influences of family, peers, culture, media, technology, and other factors on health behaviors; accessing valid information; using interpersonal communication skills; demonstrating ability to use decision-making and goal setting skills; practicing health-enhancing behaviors and avoid or reduce health risks; and advocating for personal, family, and community health. Health Education aligns with Be Well 365 by emphasizing lifelong positive health-related attitudes and behaviors that promote self-reliance and self-regulation for all students.
    credits: 0.5
    tags: [health]
    level: honors
    offered_terms: [spring]
    grade_levels: [10]
    prereqs:
      all_of: [HPE2047A]
      any_of: []
