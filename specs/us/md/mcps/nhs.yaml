  - id: AMC2008A
    name: Research Art Media A
    description: >-
      This capstone course enables students to apply what they learned in their previous academic and POS classes to complete a challenging, client-driven project. Students work in teams to design and create a solution to satisfy or fill a client's need or want. Students are also expected to refine the products that comprise their portfolio to meet the specifications identified by the affiliate partner. Student teams make progress reports to their peers, meet regularly with their clients, and exchange constructive criticism and consultation. At the end of the course, teams present their projects to industry partners for feedback and professional review. This course equips students with the independent study skills that they will need in postsecondary education and careers in Media Production.
