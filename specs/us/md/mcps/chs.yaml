  - id: SOC2064
    name: AP Macroeconomics
    description: >-
      This course is for students interested in college-level work in economics. Study begins with fundamental economic concepts such as scarcity, opportunity costs, production possibilities, specialization, comparative advantage, demand, supply, and price determination. Major topics include measurement of economic performance, national income and price determination, and international economics and growth.
    credits: 0.5
    tags: [social_studies]
    level: ap
    exam: AP_MACROECONOMICS
    offered_terms: [fall]
    grade_levels: [11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      Only available semester 2. The stated prerequisite, "Completion of Honors Algebra 2 or higher recommended", is a recommendation rather than a requirement and is not modelled as a prerequisite edge. Seniors will receive priority in the event of enrollment limitations. Offered fall semester at Clarksburg.

  - id: SOC2065
    name: AP Microeconomics
    description: >-
      This course is for advanced students interested in college-level work in economics and/or gaining advanced standing in college. The course begins with a study of fundamental economic concepts such as scarcity, opportunity costs, production possibilities, specialization, and comparative advantage. Major topics include the nature of functions of product markets; factor markets; and efficiency, equity, and the role of government.
    credits: 0.5
    tags: [social_studies]
    level: ap
