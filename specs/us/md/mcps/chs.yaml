  - id: ART2105
    name: Play Directing
    description: >-
      Students focus on the skills required in Theatre directing. Study centers on the director as interpretative and creative artist, selecting and casting the play, coordinating design functions, blocking the play, developing characterization, and rehearsing the play and developing an ensemble effect in performance. Through the study of various theories, students direct both traditional and experimental theatre forms as culminating productions. This course may be repeated for credit.
