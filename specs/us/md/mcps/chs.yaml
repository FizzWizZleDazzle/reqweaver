  - id: TEC2017A
    name: Introduction to Engineering Design A
    description: >-
      This introductory course develops students' problem-solving skills, with emphasis on visualization and communication skills, using a computer and 3-D solid modeling software. This course emphasizes the development of a design using computer software to produce, analyze, and evaluate models of projects and solutions. Students will study the design concepts of form and function and then use state-of-the-art technology to translate conceptual design into reproducible products. End of course exam to earn three college credits.
    credits: 0.5
    tags: [cte]
    level: advanced
    offered_terms: [fall]
    grade_levels: [9, 10, 11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      Designated TE, a state-approved technology course, and the entry course of the PLTW engineering pathway. Algebra 1 is a corequisite, recorded here rather than as a prerequisite edge. The technology table lists grades 9-12; the PLTW table lists grade 9 for the A half.

