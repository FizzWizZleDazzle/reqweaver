  - id: ART2106A
    name: Theatre 1A
    description: >-
      Students gain an understanding of the entire process through which human behavior is translated into a written drama, produced as a play, and presented to an audience. The study of theatre aesthetics, history, and criticism is balanced with workshop training in acting and basic Theatre production skills. This course is the prerequisite for all other high school Theatre courses.
