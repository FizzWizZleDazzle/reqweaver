  - id: ENG2069
    name: Informative & Argumentative Speaking
    description: >-
      This is a full year course. Students interested in competitive debate, forensics, and effective speaking will enjoy this course. Students develop their skills in speechwriting, argumentation, and extemporaneous and impromptu speaking. Students experience all phases of speech planning, preparation, delivery, and analysis and become familiar with the protocols of competitive forensics and debate. Student activities include interpreting literature, analyzing texts for oral interpretation, communicating experiences through writing, studying characteristics of radio and television, and exploring career implications of speech in the media.
    credits: 0.5
    tags: [english]
    level: regular
    offered_terms: [fall]
    grade_levels: [10, 11, 12]
    prereqs:
      all_of: []
      any_of:
        - [ENG2001B]
    notes: >-
      The published prerequisite is English 9; Honors English 9 is the only mainstream English 9 course at Clarksburg.

  - id: ENG2053A
    name: Journalism A
    description: >-
      This basic journalism course is recommended for all students interested in working on school publications and is required for those seeking editorial positions. Students develop skills in gathering and reporting news, editing, copyreading, and headlining. Students also consider issues such as the responsibilities of the press, libel and slander laws, problems of censorship, and the role of the news media in shaping public opinion.
    credits: 0.5
    tags: [english]
    level: regular
    offered_terms: [fall]
    grade_levels: [9, 10, 11, 12]
    prereqs:
      all_of: []
      any_of: []

  - id: ENG2053B
    name: Journalism B
    description: >-
      Students develop their skills in straight news writing and learn to write sports stories, feature stories, and interpretive pieces. Students research and write a wide sampling of features focusing on newspaper or magazine writing. Students study the principles of newspaper layout and makeup and are encouraged to contribute stories and apply layout principles to the school newspaper production process.
