    name: Law 2
    description: >-
      Law 2 provides a comprehensive overview of the history, philosophy and organization of our legal system, with special emphasis on the interpretive role of the courts. The units include constitutional law, law and the American family, and consumer law. Students apply legal precedents to real and hypothetical situations. Opportunities are provided to observe the legal process in action, explore law-related careers, and participate in mock trials.
