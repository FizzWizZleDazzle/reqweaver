  # --- English Language Development (ELD) ------------------------------------
  - id: ESL2060A
    name: English 9 for English Learners I A
    description: >-
      English Language Arts I (ninth grade) courses build upon students' prior knowledge of grammar, vocabulary, word usage, and the mechanics of writing and usually include the four aspects of language use: reading, writing, speaking, and listening. Typically, these courses introduce and define various genres of literature, with writing exercises often linked to reading selections. These courses also provide an explanation of the English language, enabling students to progress from a beginning level of understanding of English vocabulary and grammatical structures to a more comprehensive grasp of various formal and informal styles of using Academic English in the context of English Language Arts. These courses also provide an explanation of the English language, enabling students to progress from a beginning level of understanding of English vocabulary and grammatical structures to a more comprehensive grasp of various formal and informal styles of using Academic English in the context of English Language Arts. Per MSDE guidelines, only two ESOL courses can be used for English credit. This is one of the courses that may be offered for English credit.
    credits: 0.5
    tags: [eml, english]
    level: regular
    content: english9_a
    offered_terms: [fall]
    grade_levels: [9]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
