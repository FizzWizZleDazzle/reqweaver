  - id: ENG2039
    name: African American Literature
    description: >-
      In this course, students will learn to critically analyze texts within the African American literary tradition written from the later part of the eighteenth century to the present. These texts will be approached as manifestations of the struggle of African-Americans to create identity and to articulate their concerns for justice and equality. Students will examine closely the literary character of these texts while seeking to place these works within the context of the socio-cultural milieu in which they were generated.
    credits: 0.5
    tags: [english]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [10, 11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      May only be taken as a semester course, in either semester 1 or semester 2.

  - id: ENG2072
    name: Media in Society
    description: >-
      This is a full year course. In the first semester, students will examine texts whose authors represent cultural and ethnic groups from around the world. Through their reading of essays, poems, short stories, novels, and films, students develop a greater awareness of cultural dynamics and a deeper understanding of how cultural perspectives are reflected in literature. In the second semester, Media in Society focuses on the systematic analysis of information received through various mass media to help students develop independent judgments about media content. Students investigate The Culture of Media in an Image-Based Society; Media, Law, and Ethics; and Media and the Political Process. To complete a research project, students study a current media issue in depth and extend their knowledge of research techniques.
    credits: 0.5
    tags: [english]
    level: regular
    offered_terms: [spring]
    grade_levels: [9, 10, 11, 12]
    prereqs:
      all_of: [ENG2033]
      any_of: []
    notes: >-
      Semester 2 of the full-year pairing ENG2033 (Culture in Literature) and ENG2072 (Media in Society); one description covers both semesters.

