    name: Personal Finance
    description: >-
      This course is designed to help students identify and learn personal strategies for managing financial resources. Investment simulations are used to focus on the importance of managing funds and investing wisely. Topics include consumerism, personal finance, credit, and investment planning. Students may earn SSL hours upon successful completion of assignments and course.
