specsheet: school
schema_version: 1
catalog_year: 2026
id: us/md/mcps/chs
kind: high_school
name: Clarksburg High School (MCPS 2026-27 catalog)
credit_unit: carnegie
terms_per_year:
  - { id: fall,   sequence: 1 }
  - { id: spring, sequence: 2 }
  # Summer school offers select original-credit courses only. This list
  # is the typical MCPS offering (health, PE, NSL Government, Algebra 1,
  # Geometry); verify against the yearly summer catalog.
  - id: summer
    sequence: 3
    optional: true
    max_courses: 2   # 2 slots; an A/B pair taken together fills one
    sequential: true # sessions run consecutively, so B may follow A
    max_credits: 1.0 # one credit per summer, the current MCPS policy
    offerings: [HPE2047A, HPE2047B, HPE2011, HPE2016, SOC2004A, SOC2004B,
                MAT2000A, MAT2000B, MAT2003A, MAT2003B]
grade_levels: [9, 10, 11, 12]
# Tags whose courses are placement-restricted: they satisfy the same
# requirements but only join plans for students actually in the
# program (inferred from course history, or set in the profile).
placement_groups: [eml]
max_courses_per_term: 7
pre_hs_credit:
  satisfies_prereqs: true
  counts_toward_grad: true

notes:
  - >-
    Built from the Clarksburg High School 2026-27 Course Bulletin. Course ids come from the bulletin's course-selection tables; where a detail section states a different id, the course carries a note recording it. Where an id also appears in the Churchill sheet (specs/us/md/mcps/wchs.yaml) or the Northwood sheet (specs/us/md/mcps/nhs.yaml), the description, tags, level, exam, content group, excludes and periods are taken from there unchanged, because all three schools draw on the same district course bulletin; grade levels and prerequisites follow the Clarksburg tables where they differ. Descriptions for the remaining courses come from the bulletin itself, and one (BHP2011) from the MCPS online course catalog at coursecatalog.montgomeryschoolsmd.org.
  - >-
    Mathematics - of the four required credits, one must be an algebra credit and one must be a geometry credit, and students must be enrolled in a math course in each year of high school. Neither rule is expressible as a credit total, so both are recorded here rather than in grad_requirements.
  - >-
    Science - of the three required NGSS-aligned credits, one must be a life science credit, one a physical science credit, and one an Earth/space science credit or a course with the topics integrated. The bulletin marks Astronomy, Anatomy and Physiology, Forensic Science, Horticultural Science, Organic Chemistry, and Intro to Genetic Analysis as not satisfying the NGSS requirement; the subject tag vocabulary cannot single out the NGSS subset, so the rule is recorded here.
  - >-
    Technology - MSDE requires a state-approved technology course. The Clarksburg courses that meet it are marked in the bulletin's technology table (ITC2083, TEC2000, TEC2017, ITC2084, ITC2081). This is not recorded in grad_requirements because the subject tag vocabulary cannot single out the TE-designated subset of CTE courses.
  - >-
    English - all core English classes at Clarksburg are offered at the honors level; every student is eligible to receive honors credit for English 9-12. The regular-tier district English ids are not offered, and the semester and year-long English electives cannot be taken for the English graduation requirement.
  - >-
    Social studies - U.S. History, NSL Government, and Modern World History are each required for graduation, with the AP courses as stated alternatives. Clarksburg blends honors and on-level students in one classroom for these courses, with differentiated assessments; both tiers are listed and grouped, and students may move between tiers at the first marking period.
  - >-
    Summer offerings vary from year to year, so no course lists summer in offered_terms.
  - >-
    Content groups mark courses that teach the same material at different rigor tiers, so a student takes one or the other but not both. Groups are formed per semester half. A family is grouped only when no prerequisite path connects its members. AP BC Calculus stays ungrouped because AP AB Calculus is an accepted prerequisite for it, and it keeps its excludes pair with AP AB Calculus. AP Statistics and Honors Statistics stay ungrouped because Honors Statistics is an accepted prerequisite for AP Statistics.
  - >-
    2YR Algebra 2 A/B (MAT2015A/B) is left out of the algebra2 content groups; it is the first year of the two-year stretch and 2YR Algebra 2 C/D requires it. The second year (MAT2016C/D) is grouped with Algebra 2 and Honors Algebra 2 as the whole-course family.
  - >-
    Biology, Chemistry, and Physics are each offered at regular and honors tiers, grouped per half. AP Physics 1 joins the physics group because the bulletin states it may be taken in lieu of Physics or Honors Physics; its own prerequisite is a geometry corequisite, so no prerequisite path connects it to the other physics tiers.
  - >-
    Psychology 1/2 (SOC2053, SOC2054) and AP Psychology (SOC2069A/B) are left ungrouped: the catalog presents Psychology 1/2 as a numbered sequence rather than as semester halves. African American History (SOC2019) and AP African American Studies (SOC2101A/B) are left ungrouped: a one-semester survey and a full-year interdisciplinary course are not the same content at two tiers. Television Production 1/2 are a numbered sequence, not halves.
  - >-
    AP Computer Science Principles appears under two ids, ITC2084A/B (TE) and ITC2047A/B (PLTW elective), and AP Computer Science Java appears under two ids, ITC2081A/B (technology table) and ITC2007A/B (electives and pathway tables). Both pairs are kept, sharing the ap_cs_principles and ap_cs_java content groups so a student is planned into only one of each.
  - >-
    AP 2D Photography year 1 (ART2040A/B) and Photography 2 (ART2039A/B) are left ungrouped: Photography 2 is an accepted step toward the portfolio courses rather than a same-material variant, and the bulletin allows AP 2D Photography directly after Photography 1.
  - >-
    The P-TECH Pathways in Network and Information Technology program (dual enrollment toward a Montgomery College AAS) admits students only at the start of grade 9 by application; its MC course components are not listed under courses. The CDA/FEP dual-enrollment capstone (EDU5110A/B) and the pathway-table "CE ADV" dual-enrollment rows are Montgomery College concurrent-enrollment pointers, not school courses; see dual_enrollment.
  - >-
    Cybersecurity Capstone (ITC2006A/B) and Fire and Rescue (PGS2013, PGS2017) meet off campus (Thomas Edison High School of Technology and the Public Safety Training Academy); travel is folded into their period counts.

grad_requirements:
  - id: math
    label: Mathematics
    credits: 4.0
    satisfied_by: { tag: math }
  - id: science
    label: Science
    credits: 3.0
    satisfied_by: { tag: science }
  - id: pe
    label: Physical Education
    credits: 1.0
    satisfied_by: { tag: pe }
  - id: fine-arts
    label: Fine Arts
    credits: 1.0
    satisfied_by: { tag: fine_arts }
  - id: english9
    label: English 9
    credits: 1.0
    satisfied_by: { content: [english9_a, english9_b] }
    notes: >-
      MCPS requires the English 9-12 sequence, not any four English credits; the content groups let honors and EML placement tiers satisfy each slot.
  - id: english10
    label: English 10
    credits: 1.0
    satisfied_by: { content: [english10_a, english10_b] }
  - id: english11
    label: English 11
    credits: 1.0
    satisfied_by: { content: [english11_a, english11_b] }
  - id: english12
    label: English 12
    credits: 1.0
    satisfied_by:
      any:
        - { content: [english12_a, english12_b] }
        - { courses: [ENGL101, ENGL102, ENGL103, ENGL190, ENGL264, ENGL265] }
    notes: >-
      An approved Montgomery College English course through dual enrollment stands in for senior English; the counselor schedules it as ENG5111, CE Adv English. Taking it in an MC summer session is the known path to finishing the English sequence early.
  - id: us-history
    label: U.S. History
    credits: 1.0
    satisfied_by: { content: [us_history_a, us_history_b] }
    notes: >-
      The bulletin requires U.S. History, NSL Government, and Modern World History specifically; the content groups let the honors and AP variants satisfy each slot.
  - id: nsl-government
    label: NSL Government
    credits: 1.0
    satisfied_by: { content: [nsl_government_a, nsl_government_b] }
  - id: modern-world-history
    label: Modern World History
    credits: 1.0
    satisfied_by: { content: [modern_world_history_a, modern_world_history_b] }
  - id: health
    label: Health
    credits: 1.0
    satisfied_by: { tag: health }
    notes: >-
      The bulletin states one full credit of health education (HPE2047A/B), the MCPS policy above the 0.5-credit MSDE floor.

  - id: program
    label: World Language or CTE Program
    credits: 2.0
    satisfied_by:
      any:
        - { tag: world_language }
        - { tag: cte }
    notes: >-
      The MSDE program requirement: 2.0 credits of one world language or of career and technical education. The 4-credit career-pathway alternative is not modeled separately; two CTE credits satisfy this entry.

