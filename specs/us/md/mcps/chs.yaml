  - id: ESL2066A
    name: English 9 for English Learners III A
    description: >-
      English Language Arts I (ninth grade) courses build upon students' prior knowledge of grammar, vocabulary, word usage, and the mechanics of writing and usually include the four aspects of language use: reading, writing, speaking, and listening. Typically, these courses introduce and define various genres of literature, with writing exercises often linked to reading selections. These courses also provide an explanation of the English language, enabling students to progress from an advanced level of understanding of English vocabulary and complex grammatical structures to a more comprehensive grasp of various formal and informal styles of using Academic English in the context of English Language Arts. Per MSDE guidelines, only two ESOL courses can be used for English credit. This is one of the courses that may be offered for English credit.
