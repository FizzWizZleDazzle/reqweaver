  - id: SOC2066
    name: Humanities
    description: >-
      This hands-on lab class gives students the opportunity to paint, draw, sculpt, design, compose, write, and create as they learn about the Renaissance. Modern art, music, architecture, science, philosophy, food, literature, theater, and thinking have their roots in the changes that swept Europe and ultimately the world 500 years ago. Students in this class look at each topic, at the changes that took place, at the talented people who were involved, and then take time to create their own works in class.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [10, 11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      One semester only at Clarksburg; the district catalog lists Humanities as an A/B pair.

  - id: SOC2063
    name: Philosophy
    description: >-
      This course acquaints students with the discipline and history of philosophy. Major philosophers and their works are studied with focus on such issues as the nature of the universe; the basic moral and intellectual superstructure of society; good and evil; free will and determinism; and the relationship of a person to other individuals and to the state. Current trends in philosophy are studied as well.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [10, 11, 12]
    prereqs:
      all_of: []
      any_of: []

  - id: SOC2087
    name: LGBTQ Studies
    description: >-
      This course is an interdisciplinary exploration of Lesbian, Gay, Bisexual, Transgender, Queer/Questioning (LGBTQ+) identity, history, and culture. The course is designed for all students interested in learning more about the LGBTQ+ community and its history, including those who do and who do not identify as LGBTQ+. In Unit One students will examine the factors that shape identity, with a focus on intersectionality. In Unit Two students will investigate which voices are included in the historical narrative by exploring the resistance and resilience of the LGBTQ+ community in the U.S. Unit 3 focuses on the cultural contributions of LGBTQ+ individuals and their representation in media. Unit 4 will engage students in examining and addressing contemporary challenges faced by LGBTQ+ individuals locally, nationally, and globally.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [spring]
    grade_levels: [11, 12]
    prereqs:
      all_of: []
      any_of: []

  - id: SOC2089
    name: American History Through Film
    description: >-
      In this one-semester class, students will study modern American history through the medium of film. This will be done through viewing, writing, and discussing both historical and contemporary pieces on topics related to the political, social, economic, and racial history of the United States. Besides examining these historical events, students will examine the legacy of racism, poverty, corruption, patriotism, civics, and ideology on contemporary American culture. In addition to each film's historical and cultural importance, the course will also concentrate on film appreciation and the study of cinematography.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [9, 10, 11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      May only be taken for one semester, in either semester 1 or semester 2.

  - id: SOC2094
    name: Asian/Pacific Islander/Desi/American Studies (APIDA)
    description: >-
      The goal of this course is to introduce students to the histories, social issues, cultures, and politics of people who identify under the umbrella term Asian/Pacific Islander/Desi/American (APIDA). With this lens, students will engage with topics such as identity, racism and other -isms, immigration, activism, and current events. By the end of the course, students will have developed an understanding of the rich diversity within what is broadly labeled as the "Asian" community in the United States.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [9, 10, 11, 12]
    prereqs:
      all_of: []
      any_of: []

  - id: SOC2097
    name: Positive Psychology
    description: >-
      In this course, students will learn how positive psychology can impact one's happiness and well-being and improve the condition of their community as a whole. Students will explore their expectations of what will make them happy and look at the research into why these expectations are often incorrect. Students will learn how the principles of positive psychology can lead to improved daily experiences and life satisfaction.
