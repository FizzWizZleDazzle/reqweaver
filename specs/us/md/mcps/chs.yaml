  - id: ENG2044A
    name: Myth and Modern Culture A
    description: >-
      The first semester of Myth and Modern Culture focuses on the myths of the Ancient World: Mesopotamia, Egypt, and Greece and Rome. Students examine creation and fertility myths, pantheons, heroes, the afterlife beliefs and the similarities that exist in these cultures. By comparing the differences among the three ancient cultures' myths, students see how a culture's environment and social norms impact the mythological stories. Using epic poems, short stories, films, and historical documents as texts, students analyze the purpose of mythological stories and the impact of mythology on art, literature, and culture. All students have the opportunity to incorporate art, film, research, and analytical and creative writing into assignments and lessons.
