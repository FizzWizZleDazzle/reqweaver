  - id: ENG2073
    name: Literature in Film
    description: >-
      This is a full year course. In the first semester, students will study literature in film. Many movies originally started out as novels, plays, or short stories. This course examines the original texts and choices made by writers and directors in the adaptation process. Students gain the skills necessary to critically read and analyze texts and films to evaluate the works of professionals and peers. Opportunity exists to produce original essays, storyboards, critiques, and short films. Genres covered include drama, mystery and film noir, western, comedy, gangster, and horror/thriller. In the second semester, students will be introduced to graphic novels as literary texts suitable for critical analysis. Students will encounter graphic novels of literary merit representing multiple genres such as memoir, fiction, historical narrative, and autobiography. Reading and discussion of texts will focus on both the content of the literature (the story) and the craft (the use of formal conventions in both writing and art). Students will use their knowledge of these formal conventions to engage in class discussions and respond to the text in informal and formal written critical analyses.
    credits: 0.5
    tags: [english]
    level: regular
    offered_terms: [fall]
    grade_levels: [9, 10, 11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      Semester 1 of the full-year pairing ENG2073 (Literature in Film) and ENG2040 (Graphic Novel Literature); one description covers both semesters.

  - id: ENG2040
    name: Graphic Novel Literature
    description: >-
      This is a full year course. In the first semester, students will study literature in film. Many movies originally started out as novels, plays, or short stories. This course examines the original texts and choices made by writers and directors in the adaptation process. Students gain the skills necessary to critically read and analyze texts and films to evaluate the works of professionals and peers. Opportunity exists to produce original essays, storyboards, critiques, and short films. Genres covered include drama, mystery and film noir, western, comedy, gangster, and horror/thriller. In the second semester, students will be introduced to graphic novels as literary texts suitable for critical analysis. Students will encounter graphic novels of literary merit representing multiple genres such as memoir, fiction, historical narrative, and autobiography. Reading and discussion of texts will focus on both the content of the literature (the story) and the craft (the use of formal conventions in both writing and art). Students will use their knowledge of these formal conventions to engage in class discussions and respond to the text in informal and formal written critical analyses.
    credits: 0.5
    tags: [english]
