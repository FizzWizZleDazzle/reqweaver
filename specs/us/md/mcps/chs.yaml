    description: >-
      This semester course is designed to develop leadership skills within the physical education setting for individuals interested in pursuing careers in education or physical therapy. Throughout the course, participants will have the opportunity to assist students who have various physical and learning disabilities in their development of sport/movement skills and fitness. Participants will explore and analyze a variety of disabilities and develop sport and recreation goals or fitness plans for their peer with a disability.
