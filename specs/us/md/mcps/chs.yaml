  - id: SOC2019
    name: African American History
    description: >-
      This course is a survey of the individuals, forces, and events that make up the experiences of African Americans in the United States. By exploring those forces, and by highlighting those individuals who helped shape the development of America, students learn that the "Black Experience" can serve as the testing ground for American democratic ideas. Emphasis is given to the impact of major events in our history on African Americans.
