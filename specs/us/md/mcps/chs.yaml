  - id: ART2107A
    name: Theatre 2A
    description: >-
      Knowledge and skills learned in Theatre 1 are applied to production and performance. Students study script analysis, character development, performance skills and processes, and beginning technical production skills. Studying the aesthetics and history of the Theatre, reading plays, and attending plays provide a balanced framework for application of Theatre criticism. Writing and thinking skills are reinforced through journaling. Careers in acting and technical Theatre are discussed. This course may be repeated for credit.
