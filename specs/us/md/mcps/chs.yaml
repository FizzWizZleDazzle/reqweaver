  - id: PGS2013A
    periods: 3
    name: Fire and Rescue 1 TP A
    description: >-
      The Fire Science and Rescue program prepares juniors and seniors for a variety of careers in fire prevention and control and emergency medical technology. Students spend part of the day in their home high school and also attend formal training at the Montgomery County Public Safety Training Academy. Students must complete a minimum of 393 hours of work-based learning and take certification exams. By the time they graduate from high school, students will have earned seven industry certifications and college credit.
    credits: 1.5
    tags: [cte]
    level: advanced
    offered_terms: [fall]
    grade_levels: [11]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      A triple-period course at the Public Safety Training Academy. Applicants must be 16 years old and pass the Fire Department selection process; neither gate is expressible here.

