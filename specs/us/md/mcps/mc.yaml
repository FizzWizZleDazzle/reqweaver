  - id: ENGL235
    name: "Film and Literature"
    description: >-
      (ARTD, GEIR, GEEL, GCP) A comparative study of films and the literary sources upon which
      they are based. Special attention is given to the practical and theoretical problems of
      adapting literature to film and the basic differences between the two. The course explores
      how character development, plot, narrative, symbols, and language are translated from
      literary texts to film, and considers the limitations of film adaptation. Students read,
      analyze, and respond critically to literature and films in class discussions,
      examinations, and essays. PREREQUISITE(S): A grade of C or better in ENGL 101 or ENGL 101A
      or consent of department. Three hours lecture/discussion each week, plus film viewings.
    credits: 3
    level: college
    tags: [elective, english]
    grade_levels: [11, 12]
