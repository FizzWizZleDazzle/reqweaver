    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHED166] }
    approved: false
  - id: PHED170
    name: "Strength Training and Conditioning I"
    description: >-
      Application of training principles and the development of safe and effective techniques
      involved in progressive resistance weight training. Free weights, resistance machines, and
      specific strength exercises will be utilized by the student to implement an individualized
      program for optimal gains in muscular strength, muscular endurance, lean body composition,
      and motor performance. Assessment Level(s): ELAI 990/ELAW 980/ELAR 980, IERW 002. Two
      hours each week.
    credits: 1
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: PHED171
    name: "Strength Training and Conditioning II"
    description: >-
      Research-supported techniques and training procedures are applied in the development of
      strength training and conditioning for sport and physical activity. Programs for absolute
      strength, speed strength, strength endurance, power, quickness, agility, running speed,
      jumping ability, anaerobic endurance, and flexibility will be planned and implemented
      based on personal sport or fitness interests. PREREQUISITE(S): PHED 170 or consent of
      department. Two hours each week.
    credits: 1
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[PHED170]] }
    approved: false
  - id: PHED174
    name: "Circuit Fitness"
    description: >-
      Utilizes timed sequences of exercises to produce gains in total fitness. A variety of
      circuit training techniques will be used during this class including HITT techniques,
      multi-planar exercises Alternate strength-cardio circuits, Body weight circuits, and the
      use of a variety of exercise equipment. Participants need to be able to safely exercise at
      higher intensities. The benefits of this class can include improvement in muscular
      strength and endurance, balance, agility, body composition, and cardiovascular endurance.
      Assessment Level(s): ELAI 990/ELAW 980/ELAR 980, IERW 002. Two hours each week.
    credits: 1
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: PHED177
    name: "Rock Climbing and Outdoor Challenges"
    description: >-
      Introduction to basic skills, techniques, equipment, and safety practices used in rock
      climbing and rappelling. Additional activities include initiative problems, confidence
      course tasks, and rope traverse events, all designed to challenge students both
      individually and in group situations. Students will participate in off-campus experiences
      at Carderock, Great Falls, and the Smith Outdoor Education Center. Assessment Level(s):
      ELAI 990/ELAW 980/ELAR 980, IERW 002. Two and a quarter hours each week for 12 weeks.
    credits: 1
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: PHED201
    name: "Overview of Physical Education"
    description: >-
      (R only) Covers the historical, philosophical, social, and practical aspects of American
      physical education. Students evaluate the field of physical education and its unique
      contribution to students' physical, social and emotional development. Assessment Level(s):
      ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "Physical Education", synergy: "HPE5122, CE Adv Physical Education" }
    grad_tags: [pe]
  - id: PHED204
    name: "Foundations of Elementary School Physical Education"
    description: >-
      (R only) Emphasizes the concepts, theories, and practical application of both
      activity-based and movement education-based elementary school physical education programs.
      Material will include movement concepts, locomotor and nonlocomotor activities,
      manipulative skills, and skill themes. Additional topics will focus on rhythmic
      activities, low-organized games, educational gymnastics, and other movement experiences
      for early childhood and elementary school-aged children. Evaluative techniques, teaching
      strategies, and organizational plans will also be discussed. PREREQUISITE(S): A grade of C
      or better in PHED 201. Three hours each week.
    credits: 3
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHED201] }
    approved: true
    hs_credit: { category: "Physical Education", synergy: "HPE5122, CE Adv Physical Education" }
    grad_tags: [pe]
  - id: PHED206
    name: "Principles and Practices of Health-Related Fitness"
    description: >-
      (R only) Covers fundamental principles of health-related fitness. Students develop
      individualized programs, acquire knowledge of relevant concepts and techniques, assess
      fitness status, utilize a variety of fitness equipment, and participate in physical
      activities to promote an understanding of the value of exercise and to encourage permanent
      lifestyle change. Note: Successful completion of course prepares student to sit for a
      variety of NCCA-approved Personal Trainer Exam certifications including one from the
      American Council on Exercise (ACE), American College of Sports Medicine (ACSM), and
      National Academy of Sports Medicine (NASM). Students should contact the departmental
      advisor before enrolling in this class. Assessment Level(s): ENGL 101/ENGL 011, MATH 050.
      Three hours each week. May not be taken concurrently with MATH 017 or MATH 020 or MATH 030
      or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "Physical Education", synergy: "HPE5122, CE Adv Physical Education" }
    grad_tags: [pe]
  - id: PHED225
    name: "Invasion Games: a Tactical Games Approach"
    description: >-
      (R only) Focuses on teaching methodologies and performance of several field/court invasion
      games including ultimate, team handball, soccer, hockey, and lacrosse. Students will
      improve teaching aspects related to skill analysis, planning of developmentally
      appropriate learning activities and development of appropriate activity progressions and
      modifications for effective differentiated teaching and learning. The content of this
      course will be presented using diverse approaches including hands-on teaching experiences,
      group activities and lectures. PREREQUISITE(S): PHED 201. Assessment Level(s): ENGL
      101/ENGL 011, MATH 050. Three hours lecture each week.
    credits: 3
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHED201] }
    approved: true
    hs_credit: { category: "Physical Education", synergy: "HPE5122, CE Adv Physical Education" }
    grad_tags: [pe]
  - id: PHED226
    name: "Net-Wall Games: a Tactical Games Approach"
    description: >-
      Focuses on teaching methodologies and technical and tactical performance of several net
      and wall activities, which may include badminton, tennis, volleyball, and pickle ball.
      Application of multiple learning models, including tactical games for understanding model,
      sport education, and cooperative learning, will be used to link these sports.
      PREREQUISITE(S): A grade of C or better in PHED 225. Three hours lecture each week.
    credits: 3
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHED225] }
    approved: false
  - id: PHED228
    name: "Group Fitness Instructor Training"
    description: >-
      (R and TP/SS only) Course designed to develop skills and knowledge necessary to provide
      safe and effective group fitness instruction using a variety of exercise modalities. This
      course includes knowledge and application of training principles and exercise techniques
      to develop cardiorespiratory fitness, muscular strength, muscular endurance, and muscular
      flexibility. Scientific principles of anatomy, kinesiology, and exercise physiology are
      studied and applied. Instructional techniques such as effective communication,
      motivational skills, class design, injury prevention, cueing, and accommodations for
      special populations are studied and applied. Course assignments include lesson and unit
      plan preparations and class teaching experiences. Students successfully completing the
      course will have the opportunity to sit for the ACE Group Fitness Instructor Certification
      Exam. Assessment Level(s): ENGL 101/ENGL 011. One and a half hour lecture, two hours
      laboratory each week.
    credits: 3
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "Physical Education", synergy: "HPE5122, CE Adv Physical Education" }
    grad_tags: [pe]
  - id: PHED230
    name: "Advanced Weight Training: Theory and Program Design"
    description: >-
      (R only) Emphasis on instructional techniques and skill development in progressive
      resistance strength training. Anatomical, physiological, and biomechanical principles are
      studied and applied to design effective programs for individuals and specific populations.
      Equipment considerations, maintenance, safety, organization, and injury prevention are
      covered in the use of free weights, resistance machines, and plyometric training methods.
      Students develop the skills to assess, develop, and evaluate muscular strength and
      endurance programs. Course assignments include in-class practice teaching experiences.
      Students should contact the departmental advisor before enrolling in this class.
      PREREQUISITE(S): A grade of C or better in PHED 206, or consent of department. Three hours
      each week.
    credits: 3
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[PHED206]] }
    approved: true
    hs_credit: { category: "Physical Education", synergy: "HPE5122, CE Adv Physical Education" }
    grad_tags: [pe]
  - id: PHED232
    name: "Health Fitness/PE Major Practicum"
    description: >-
      (R only) In-service training and practical experience, totaling a minimum of 60 hours in
      an approved health and fitness or physical education setting. Students will meet with a
      full-time faculty member to develop goals and objectives for their practicum experiences,
      will keep a weekly journal of accomplishments, and will submit a final report analyzing
      their overall experiences. PREREQUISITE(S): Consent of department. Combines 60 hours of
      practicum and faculty preceptor's meetings.
    credits: 1
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: PHED237
    name: "Fitness Assessment and Programming"
    description: >-
      (R only) An examination of scientifically-based assessment techniques used to evaluate
      cardio-respiratory endurance and body composition. Principles of exercise, interpretation
      of assessment results, and program design are applied to develop safe, individualized
      exercise programs for apparently healthy individuals and special populations using
      American College of Sports Medicine guidelines. Safety considerations, identification of
      risk factors, and contradictions are emphasized. PREREQUISITE(S): A grade of C or better
      in PHED 206, or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[PHED206]] }
    approved: true
    hs_credit: { category: "Physical Education", synergy: "HPE5122, CE Adv Physical Education" }
    grad_tags: [pe]
  - id: PHED240
    name: "Personal Training Techniques"
    description: >-
      (R and TP/SS only) An examination of personal training programming concepts, training
      methodology, and business practices. Creative program design, motivation strategies,
      appropriate assessment techniques, communications and interpersonal skills, training
      styles, and client expectation issues are explored. Students learn various one-to-one
      instructional techniques appropriate for working with clients at a fitness center, in the
      home, and in other activity settings. Topics concerning career opportunities, role and
      responsibilities of trainers, recruitment and retention of clients, business ethics,
      promotion and marketing strategies, liability insurance, fee structures, certification,
      and continuing education opportunities will be addressed. Students will gain experience as
      an apprentice personal trainer during the course sequence. PREREQUISITE(S): PHED 230, PHED
      237, HLTH 220, or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHED230, PHED237, HLTH220] }
    approved: true
    hs_credit: { category: "Physical Education", synergy: "HPE5122, CE Adv Physical Education" }
    grad_tags: [pe]
  - id: PHED250
    name: "Prevention and Management of Exercise Injuries"
    description: >-
      (R only) Concepts of prevention, recognition, treatment, and management of injuries and
      physical disabilities, which affect physical activity and conditioning. Course will
      include medical history and physical assessment, as well as, adaptations for training and
      program design needed for various diseases, functional disabilities, injuries, and
      functional imbalances for the prevention of injuries and safe physical conditioning. This
      course includes both theoretical and practical aspects of exercise design and program
      development for healthy populations and those populations with special needs.
      PREREQUISITE(S): HLTH 220, PHED 230, PHED 237, or consent of department. Three hours each
      week.
    credits: 3
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [HLTH220, PHED230, PHED237] }
    approved: true
    hs_credit: { category: "Physical Education", synergy: "HPE5122, CE Adv Physical Education" }
    grad_tags: [pe]
  # --- PHIL ----------------------------------------------------------------
  - id: PHIL101
    name: "Introduction to Philosophy"
    description: >-
      (HUMD, GEIR, GEEL) Introduction to philosophical analysis of the problem of knowledge, the
      problem of reality, and the problem of the good. Major philosophical attitudes of Western
      civilization are introduced. Special attention is paid to some of the philosophical
      implications of contemporary natural and social science. The basic themes of the course
      are that the major questions philosophy deals with are present in the lives of all
      persons; that we must clarify the questions, if possible, before we try to answer them;
      and that the basic questions are always concerned with the nature and meaning of human
      existence. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: PHIL140
    name: "Introduction to the Study of Ethics"
    description: >-
      (HUMD, GEIR, GEEL) Covers contemporary ethical issues in public policy and personal
      conduct. Topic areas may include bioethics and medicine; inequality and discrimination;
      justice and punishment; information ethics; environmental ethics; or other areas.
      Practical issues in these areas will be discussed in relation to ethical theories. Various
      ethical perspectives will be critically examined. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: PHIL143
    name: "Introduction to the Study of Religion"
    description: >-
      (HUMD, GEIR, GEEL, GCP) Discusses theories of the source of religion and examines
      representative Eastern and Western religions. Philosophical implications of the presence
      of religion in human life will be explored. Assessment Level(s): ENGL 101/ENGL 011. Three
      hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: PHIL190
    name: "Elementary Logic and Semantics"
    description: >-
      (HUMD, GEIR, GEEL) An introductory study of logic and language, intended to increase the
      student's ability to use language with precision and to reason correctly. Topics include
      the logic of science and the principles of induction and deduction. Assessment Level(s):
      ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: PHIL201
    name: "Morality and Contemporary Law"
    description: >-
      (HUMD, GEIR, GEEL) An examination of some social issues that seem to be of current
      interest from the legal/ethical viewpoint, e.g.: privacy, crime and punishment, civil and
      human rights, victimless crimes, police and court practice, sexual and medical practice,
      freedom and authority. An attempt will be made to view these contemporary problems in a
      historical perspective. The student is encouraged and expected to know facts, think
      logically, and develop an independent sense of critical judgment. PREREQUISITE(S): One
      course in philosophy, political science, or sociology, or consent of department.
      Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: PHIL205
    name: "Philosophy in Literature"
    description: >-
      (HUMD, GEIR, GEEL, GCP) Reading and philosophical criticism of novels and plays containing
      ideas significant for ethics, metaphysics, religion, and social policy. Particular
      attention will be given to modern writers. Assessment Level(s): ENGL 101/ENGL 011. Three
      hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: PHIL212
    name: "Women in Philosophy I"
    description: >-
      (HUMD, GEIR, GEEL, GCP) Introduces the student to the contributions by women in philosophy
      from ancient times through the Middle Ages. The course provides a critical examination of
      their philosophic views and explores philosophical issues such as oppression, morality,
      the meaning of equality, and the role of the family. Assessment Level(s): ENGL 101/ENGL
      011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: PHIL218
    name: "Women in Philosophy II"
    description: >-
      Introduces the student to the contributions by women in philosophy in modern and
      contemporary times. The course provides a critical examination of their philosophic views
      and explores philosophical issues such as oppression, morality, the meaning of equality,
      and the role of the family. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: PHIL222
    name: "Asian Thought"
    description: >-
      Explores the philosophical, mythical, and religious thought of the traditions of the East,
      examining secular thought and religious convictions and studying their influence on each
      other. Buddhism, Hinduism, Shintoism, Taoism, Confucianism, and other substantive thought
      systems, as well as some indigenous religions, will be discussed. Each tradition's views
      of nature, society, self, deity, and afterlife will be studied; attention will be paid to
      the roles of women and/or minority groups within the traditions. Assessment Level(s): ENGL
      101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: PHIL231
    name: "Western Religions"
    description: >-
      Western Religions. This course is on the MCPS approved dual-enrollment list but has no
      page in the current MC catalog; name is from the approved list and the credit value is a
      placeholder.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  # --- PHOT ----------------------------------------------------------------
  - id: PHOT110
    name: "Contemporary Topics in Photography"
    description: >-
      (R only) Variable topics in photography, presented as a result of community or student
      interest, to include a variety of photography-related skills or intensive study in a
      specific area. Topics to be announced each semester in the class schedule. Assessment
      Level(s): ELAR 980/IERW 002, MATH 050. May be repeated for credit. Minimum 15 hours of
      instruction for each credit hour. May not be taken concurrently with MATH 017 or MATH 020
      or MATH 030 or MATH 045 without appropriate Math assessment score. Variable credit: 1-3
      semester hours.
    credits: 1
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: PHOT161
    name: "Introduction to Digital Photography"
    description: >-
      (ARTD, GEIR, GEEL) (R only) An introduction to digital photography using digital cameras
      and basic image editing software. This course includes print production for making
      black-and-white and color photographs and studio techniques that include portrait lighting
      and still life photography. No prior photography experience is required. Students use
      digital photography for the production of a photographic portfolio. One hour lecture, four
      hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: PHOT201
    name: "Photography II"
    description: >-
      (R only) A transition course between basic photography and advanced photography courses.
      Students learn control techniques resulting in high-quality digital files and prints.
      Students work with various camera designs and explore photographic color theory. Lighting
      techniques are taught in detail including studio strobes and continuous lighting. The
      working methods of the professional photographer are explored in the production of a
      portfolio of black-and-white and color images for commercial or fine art applications.
      PREREQUISITE(S): PHOT 161, or consent of department. Two hours lecture, four hours
      laboratory each week.
    credits: 4
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[PHOT161]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: PHOT210
    name: "Photojournalism"
    description: >-
      (G and R only) Designed to acquire the skill of story telling within the context of
      exploring social justice as it relates to political, social, ethical and cultural issues.
      In addition to digital stills, the incorporation of fundamental video technology wiil be
      taught providing a complementary dynamic to the narrative. The end product will be
      optimized for publication across multiple and current social media platforms.
      PREREQUISITE(S): PHOT 161, or consent of department. Two hours lecture, three hours
      laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[PHOT161]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: PHOT214
    name: "Photoshop for Graphics and Photography"
    description: >-
      (R only) (Also offered as GDES 214. Credit cannot be received for both PHOT 214 and GDES
      214.) An in-depth study of digital editing as it applies to the needs of the graphics or
      photography student and professional. Students manipulate scanned images and digital
      photographs in preparation for publication layout and design, web output, use in other
      software packages, or immediate output. Topics include photo-restoration, composite
      imaging, masking, and the adjustment and correction of images used in graphic design and
      photography. PREREQUISITE(S): None, but previous computer experience is necessary. It is
      strongly recommended that photography majors take PHOT 161 prior to this course. Two hours
      lecture, four hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: PHOT230
    name: "Photoshop: Advanced Image Editing"
    description: >-
      (R only) (Also offered as GDES 230. Credit cannot be received for both PHOT 230 and GDES
      230.) An advanced study of Adobe Photoshop as it applies to both graphics and photography.
      Topics include advanced sharpening techniques, advanced image restoration, contrast
      control, masking techniques, the utilization of RGB, CMYK, and Lab color models for image
      correction, and the study of emerging technologies. Students will also learn to calibrate
      all equipment used in Photoshop imaging, including building individual profiles for
      output. PREREQUISITE(S): GDES 214 or PHOT 214 or consent of department. Two hours lecture,
      four hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[GDES214, PHOT214]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: PHOT251
    name: "Portrait and Fashion Photography"
    description: >-
      (R only) Advanced techniques for photographing portraits and fashion for illustrative
      purposes. Lighting for both studio and location shoots are covered in detail implementing
      known techniques of digital capture. Completed assignments will be used to create a
      professional printed portfolio in both black-and-white and color. PREREQUISITE(S): PHOT
      201 or consent of department. Two hours lecture, three hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[PHOT201]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: PHOT265
    name: "Advanced Color/Black and White Imaging"
    description: >-
      Exposes students to the contemporary and traditional use of color and black and white
      imaging and printing techniques. This involves color theory applications, tonal control
      and advanced metering functions derived from the concepts and practices of traditional
      film photography. Current Image editing software will continue to be explored for advanced
      features as they relate to the outcomes of this course. Students will develop strategies
      for producing a printed fine art color and black and white portfolios utilizing some of
      the highest quality fine art papers on the market. PREREQUISITE(S): PHOT 201 or consent of
      department. Two hours lecture, three hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[PHOT201]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: PHOT269
    name: "Special Photography Assignment"
    description: >-
      (R only) Offered on an individual basis to majors with advanced standing. Students may
      extend their in-depth studies by exploration of a particular specialization within the
      curriculum. PREREQUISITE(S): Consent of curriculum coordinator and department chairperson.
      Hours to be assigned by chairperson. Minimum of 30 hours work per semester hour. Variable
      credit: 1-4 semester hours.
    credits: 1
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: PHOT275
    name: "Business Practices and Portfolio Development"
    description: >-
      (R only) This course surveys the usual and customary practices in the field of
      photography, both as salaried employment and as an independent contracting enterprise.
      Topics include the role of professional organizations in photographic business; staff and
      freelance work; self-assessment and self-marketing strategies; forms of business
      organization; differentiation of types of business expenses for billing purposes;
      estimating and pricing of photographs and photographic services; use rights fees and
      licensing; the design of contracts; release agreements; the ownership of photographic
      images and of related intellectual property; copyright; stock photography; First Amendment
      and privacy issues; and the new business aspects of digital imaging. Individual and group
      portfolio and print critiques lead to improvement in the marketability of the student's
      portfolio, and of the student, through strengthening of image quality and variety and
      improvement of job interview and portfolio presentation skills. PREREQUISITE(S): Advanced
      standing (PHOT 201 plus one other 200-level photography course) or consent of curriculum
      coordinator. Three hours lecture and discussion each week, plus scheduled individual
      conferences.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[PHOT201]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: PHOT277
    name: "Advanced Concepts in Digital Capture"
    description: >-
      (R only) The purpose of this course is for students to expand the realm of possibilities
      in creating dynamic imagery beyond the fundamentals of image capture. Your previous
      knowledge of lighting, exposure, image editing, printing, and problem solving will be
      explored utilizing advanced concepts of photography with merging technologies. Students
      will develop strategies and multiple skillsets for the production of panoramic stitching,
      timelapse capture, focus stacking, extended and multiple exposures, cinemagraphs along
      with the use of ambient, continuous, and strobe lighting applications. PREREQUISITE(S):
      PHOT 265. Two hours lecture, two hours laboratory each week
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHOT265] }
    approved: false
  # --- PHTH ----------------------------------------------------------------
  - id: PHTH101
    name: "Introduction to Physical Therapy"
    description: >-
      (TP/SS only) Provides an introduction and orientation to the field of physical therapy.
      Course includes historical background, medical-professional ethics and conduct, the role
      of physical therapist assistant as part of the health care team, PT/PTA collaboration, and
      orientation to psychological and social needs of the ill and disabled. PREREQUISITE(S):
      Admission to the physical therapist assistant program or consent of program coordinator.
      Assessment Level(s): Credit by exam offered to qualified individuals, determined by PTA
      Program Coordinator. Two hours each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: PHTH102
    name: "Basic Health Skills for the Physical Therapist Assistant"
    description: >-
      (TP/SS only) Instruction in basic health skills used in physical therapy, including
      anatomical and movement terminology, and chemical, mechanical, and physical principles
      relative to body function. Skills and practice in body mechanics, patient positioning and
      transfers, gait training, bandaging, vital signs, and medical asepsis also included.
      PREREQUISITE(S): Admission to the physical therapist assistant program or consent of
      program coordinator. COREQUISITE(S): PHTH 101, PHTH 102L, PHTH 104/PHTH 104L, and PHTH
      112. Two hours lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: PHTH103
    name: "Therapeutic Procedures I"
    description: >-
      (TP/SS only) Presents therapeutic modalities used by physical therapist assistants,
      including therapeutic use of heat and cold, massage, and hydrotherapy. In addition,
      traction, intermittent pressure pumps, and use of electrical currents. Specific conditions
      requiring use of these treatment modalities will be presented, and contraindications and
      special precautions for their use will be discussed. Procedures for documentation of
      patient care will be included. PREREQUISITE(S): PHTH 101, PHTH 102, PHTH 104, PHTH 112.
      COREQUISITE(S): PHTH 103L, PHTH 105, PHTH 105L, and PHTH 116. Credit by exam offered to
      qualified individuals, determined by PTA Program Coordinator. Two hours lecture, three
      hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHTH101, PHTH102, PHTH104, PHTH112] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: PHTH104
    name: "Surface Anatomy, Palpation, and Soft Tissue"
    description: >-
      (TP/SS only) In-depth exploration of surface anatomy and palpation of structures essential
      for physical therapy practice. Students are introduced to joint movement terminology and
      performance. Techniques are presented along with tests and measures necessary for the safe
      application of range of motion and soft tissue techniques. COREQUISITE(S): PHTH 101, PHTH
      102/PHTH 102L, PHTH 104L and PHTH 112. Two hours lecture, three hours laboratory each
      week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: PHTH105
    name: "Kinesiology I"
    description: >-
      (TP/SS only) First of a two part course is the study of human movement. Provides an
      introduction to kinetics, mechanics, and science. Regional anatomy and kinesiology of the
      extremities is covered along with the skills of goniometry and MMT. PREREQUISITE(S): PHTH
      101, PHTH 102, PHTH 104, PHTH 112. COREQUISITE(S): PHTH 103, PHTH 105L, PHTH 116. Two
      hours lecture, three hours laboratory each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHTH101, PHTH102, PHTH104, PHTH112] }
    approved: false
  - id: PHTH106
    name: "Kinesiology II"
    description: >-
      (TP/SS only) Second part of the two-part course in the study of human movement. Rational
      anatomy and kinesiology of the cervical, thoracic, lumbar spine, and pelvis are discussed.
      Principles of kinesiology are applied to posture and gait. PREREQUISITE(S): PHTH 103, PHTH
      105, and PHTH 116. COREQUISITE(S): PHTH 106L, PHTH 201. One hour lecture, two hours
      laboratory each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHTH103, PHTH105, PHTH116] }
    approved: false
  - id: PHTH112
    name: "Pathology for the Physical Therapist Assistant"
    description: >-
      (TP/SS only) General pathology with emphasis on the study of diseases and disorders most
      commonly seen in physical therapy practice. Diseases of the musculoskeletal, nervous, and
      cardiopulmonary systems as well as metabolic disorders will be emphasized.
      PREREQUISITE(S): BIOL 212. COREQUISITE(S): PHTH 102, PHTH 104. Two hours each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOL212] }
    approved: false
  - id: PHTH116
    name: "Measures and Interventions for Clinical Problems I"
    description: >-
      (TP/SS only) First course in the three-course sequence that integrates clinical tests and
      measures with clinical interventions for common problems encountered in physical therapy
      care. This course includes tests, measures, and interventions for problems of the
      integument and non-complex problems of the musculoskeletal system. PREREQUISITE(S): PHTH
      101, PHTH 102, PHTH 104, PHTH 112. COREQUISITE(S): PHTH 103, PHTH 105, PHTH 116L. One hour
      lecture, two hours laboratory each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHTH101, PHTH102, PHTH104, PHTH112] }
    approved: false
  - id: PHTH201
    name: "Medical Reporting for the Physical Therapist Assistant"
    description: >-
      (TP/SS only) Principles of medical reporting, including the ability to abstract pertinent
      information from actual medical records. The writing of patient progress notes in
      standardized formats and medical terminology is emphasized. Evidence-based practice,
      clinical research, and justifying interventions based on clinical literature are
      integrated in the study of medical documentation. An introduction to quality assessment
      and improvement, fiscal and organizational management is provided. PREREQUISITE(S): PHTH
      103, PHTH 105, PHTH 116. COREQUISITE(S): PHTH 106, PHTH 106L. Two hours lecture each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHTH103, PHTH105, PHTH116] }
    approved: false
  - id: PHTH202
    name: "Independent Study in Physical Therapist Assistant"
    description: >-
      (TP/SS only) Through independent study, physical therapist assistant students will conduct
      research in special topics in physical therapy and rehabilitation technology, professional
      advancements, and/or case studies. Students will be assigned to a physical therapist
      assistant faculty member for guidance and supervision. Letter designators in the schedule
      of classes will distinguish the 1, 2, 3, and 4-credit versions of PHTH 202.
      PREREQUISITE(S): BIOL 150. COREQUISITE(S): Current enrollment in the physical therapist
      assistant program and consent of program coordinator. Minimum 45 hours of work for each
      credit hour. Variable credit: 1-4 semester hours.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOL150] }
    approved: false
  - id: PHTH203
    name: "Neurophysiology and Neuromuscular Rehabilitation"
    description: >-
      (TP/SS only) Provides students with essential knowledge and clinical skills in
      neurorehabilitation. It includes lectures and hands-on lab practices to demonstrate common
      techniques. Students will gain foundational knowledge in physiology, anatomy, motor
      control, and learning, as well as disease and conditions of the neuromuscular and nervous
      systems. This course will integrate the application of tests and measures with clinical
      interventions of the neuromuscular and nervous systems using evidence-based practices.
      Students will gain important insights into rehabilitating individuals with neuromuscular
      disorders, including spinal cord injuries, traumatic brain injuries, strokes, and various
      progressive and non-progressive conditions across all ages. PREREQUISITE(S): PHTH 106,
      PHTH 201. COREQUISITE(S): PHTH 203L, PHTH 206, PHTH 223. Four hours lecture, four hours
      laboratory each week
    credits: 4
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHTH106, PHTH201] }
    approved: false
  - id: PHTH206
    name: "Measures and Interventions for Clinical Problems II"
    description: >-
      (TP/SS only) Second course in the three course sequence which integrates tests and
      measures with clinical interventions for common problems encountered in physical therapy
      care. This course includes tests, measures, and interventions for complex problems of the
      musculoskeletal and cardiopulmonary systems. Posture awareness training, conditioning and
      reconditioning, skills training, and plyometrics are discussed. An introduction to
      post-surgical protocols and return to function and activity are discussed along with
      aerobic conditioning, changes in vital signs with exercise, breathing patterns, Chest
      PHTH, and pulmonary function rehabilitation. PREREQUISITE(S): PHTH 106, PHTH 201.
      COREQUISITE(S): PHTH 203, PHTH 206L, and PHTH 223. One and one half hour lecture, three
      hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHTH106, PHTH201] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: PHTH215
    name: "Seminar"
    description: >-
      (TP/SS only) Capstone seminar dealing with professional issues, core values, and the
      development of a portfolio. The theme for Seminar is career development, continuing
      professional competence, and social responsibility. Activities completed include national
      board exam review preparation, job search strategies, resume development, and professional
      interview skills. PREREQUISITE(S): PHTH 203, PHTH 206/PHTH 206L, and PHTH 223.
      COREQUISITE(S): PHTH 220, and PHTH 224. Two hours each week.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHTH203, PHTH206, PHTH223] }
    approved: false
  - id: PHTH220
    name: "Therapeutic Procedures II"
    description: >-
      (TP/SS only) Study of advanced technical skills in therapeutic practice. Orthotics and
      prosthetics, as well as modifying intervention principles for unique populations such as
      women's health, work injury, elite sports, emerging clinical evidence, and nontraditional
      therapies will be examined. PREREQUISITE(S): PHTH 206/PHTH 206L and PHTH 223.
      COREQUISITE(S): PHTH 203, PHTH 215, and PHTH 224. One hour lecture, two hours laboratory
      each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHTH206, PHTH223] }
    approved: false
  - id: PHTH223
    name: "Clinical Practicum I"
    description: >-
      (TP/SS only) Supervised clinical experience in a physical therapy setting. The student
      will practice skills learned on actual patients under the supervision and direction of a
      licensed physical therapist of a licensed physical therapist assistant in a variety of
      local clinical facilities. PREREQUISITE(S): PHTH 106, PHTH 201. COREQUISITE(S): PHTH 203,
      PHTH 206. 240 clinical hours.
    credits: 5
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHTH106, PHTH201] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: PHTH224
    name: "Clinical Practicum II"
    description: >-
      (TP/SS only) Capstone clinical course consisting of eight full-time weeks of supervised
      clinical experience in a physical therapy setting. The student will practice advanced
      skills learned in the physical therapist assistant curriculum under the supervision and
      direction of a licensed physical therapist or supervision team of licensed physical
      therapist and physical therapist assistant. The student will develop entry-level skills in
      the legal and ethical issues of clinical practice, the measures and interventions required
      of a clinical population, documentation and progression of patient care, and the
      comprehensive non-direct patient related skills necessary for the professional role and
      responsibilities of the entry level physical therapist assistant. PREREQUISITE(S): PHTH
      206/PHTH 206L, and PHTH 223. COREQUISITE(S): PHTH 203, PHTH 215, and PHTH 220. 280
      clinical hours.
    credits: 7
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHTH206, PHTH223] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  # --- PHYS ----------------------------------------------------------------
  - id: PHYS103
    name: "Introduction to Physics"
    description: >-
      Basic concepts in physics and their mathematical framework including problem solving
      techniques, experimental measurements, and simple data analysis. Topics include force,
      energy, momentum, density, pressure, waves, dimensional analysis, measurement, precision,
      and estimation; and power, trigonometric, exponential, and logarithmic functions.
      Assessment Level(s): MATH 050. One hour lecture, two hours laboratory each week. May not
      be taken concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without
      appropriate Math assessment score.
    credits: 2
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: PHYS105
    name: "Conceptual Physics"
    description: >-
      (NSND, GEEL) This course introduces fundamental concepts of physics with emphasis on
      applications to the world around us. The course is concept oriented and does not make
      extensive use of mathematics. Although the course does not satisfy the requirements of
      professional or engineering schools, it provides familiarity with basic principles prior
      to enrolling in other physics courses. Assessment Level(s): ENGL 101/ENGL 011, MATH 050.
      Three hours each week. May not be taken concurrently with MATH 017 or MATH 020 or MATH 030
      or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "NGSS Physical Science", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [science]
  - id: PHYS110
    name: "Sound and Light in the Arts"
    description: >-
      (NSLD, GEEL) (R only) Selected topics in sound and hearing; traditional and electronic
      music; light and vision; lasers and holography; color theory; photography; recording and
      reproduction of sound and light; the broadcast media. Frequent demonstrations, occasional
      field trips, and guest lecturers. Laboratory work consists of further exploration of
      lecture-related topics by individuals or small groups. Projects are encouraged if time
      permits. Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Three hours lecture, three
      hours laboratory each week. May not be taken concurrently with MATH 017 or MATH 020 or
      MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 4
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: PHYS161
    name: "General Physics I: Mechanics and Heat"
    description: >-
      (NSND, GEEL) Fundamental laws of motion, force and energy, particle collisions, rotational
      mechanics, gravitation, thermodynamics, and kinetic theory. A calculus-based general
      physics course, required for students majoring in engineering or one of the physical
      sciences. PREREQUISITE(S): MATH 181. PRE- or COREQUISITE(S): MATH 182 or consent of
      department. Three hours lecture, one hour discussion each week. A calculus-based general
      physics course, required for students majoring in engineering or one of the physical
      sciences.
    credits: 3
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [MATH181] }
    approved: true
    hs_credit: { category: "NGSS Physical Science", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [science]
    exam_equivalent: [AP_PHYSICS_C_MECH]
  - id: PHYS203
    name: "General Physics I (Non-Engineering)"
    description: >-
      (NSLD, GEEL) The first of two related courses (with PHYS 204) designed for
      pre-professional programs and for transfer to four-year institutions. The two-course
      series presents fundamental concepts and laws of physics with emphasis on principles and
      development of scientific methods applied to physical relationships. PHYS 203 presents the
      laws of mechanics, including waves and sound, and selected topics in material properties
      and thermodynamics. Calculus is not needed, but strong algebra and trigonometry knowledge
      is required. Assessment Level(s): ENGL 101/ENGL 011, MATH 165. Three hours lecture, four
      hours laboratory/discussion each week.
    credits: 4
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "NGSS Physical Science", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [science]
    exam_equivalent: [AP_PHYSICS_1, AP_PHYSICS_C_MECH]
  - id: PHYS204
    name: "General Physics II (Non-Engineering)"
    description: >-
      (NSLD, GEEL) The second of two related courses (with PHYS 203) designed for
      pre-professional programs and for transfer to four-year institutions. The two-course
      series presents fundamental concepts and laws of physics with emphasis on principles and
      development of scientific methods applied to physical relationships. PHYS 204 presents the
      laws of electricity and magnetism, optics, and selected topics in modern physics. Calculus
      is not needed, but strong algebra and trigonometry knowledge is required. PREREQUISITE(S):
      PHYS 203 or consent of department. Assessment Level(s): ENGL 101/ENGL 011. Three hours
      lecture, four hours laboratory/discussion each week.
    credits: 4
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[PHYS203]] }
    approved: true
    hs_credit: { category: "NGSS Physical Science", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [science]
    exam_equivalent: [AP_PHYSICS_2, AP_PHYSICS_C_EM]
  - id: PHYS233
    name: "Physics for the Life Sciences I"
    description: >-
      The first part of a two-semester course in general physics specifically oriented towards
      applications relevant for students in biology and pre-medical programs. The course covers
      basic mechanics including forces and energy, properties of matter, and thermodynamics done
      in authentic biological contexts. PREREQUISITE(S): BIOL 150, CHEM 131, and MATH 181 or
      consent of department. PRE- or COREQUISITE(S): MATH 182. Three hours lecture, four hours
      laboratory/discussion each week.
    credits: 4
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOL150, CHEM131, MATH181] }
    approved: true
    hs_credit: { category: "NGSS Physical Science", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [science]
  - id: PHYS234
    name: "Physics for the Life Sciences II"
    description: >-
      The second part of a two-semester course in general physics specifically oriented towards
      applications relevant for students in biology and pre-medical programs. The course covers
      basic statistical physics, electricity and magnetism, and optics done in authentic
      biological contexts. PREREQUISITE(S): PHYS 233 or consent of department. Three hours
      lecture, four hours laboratory/discussion each week.
    credits: 4
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[PHYS233]] }
    approved: true
    hs_credit: { category: "NGSS Physical Science", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [science]
  - id: PHYS262
    name: "General Physics II: Electricity and Magnetism"
    description: >-
      (NSLD, GEEL) Topics incude Coulomb's law, electric fields, Gauss' law, direct-current and
      alternating-current circuits, magnetic fields, Ampere's law, electromagnetic induction,
      and electromagnetic waves. Laboratory exercises also develop familiarity with electrical
      measuring instruments. A calculus-based general physics course, required for students
      majoring in engineering or one of the physical sciences. PREREQUISITE(S): A grade of C or
      better in both MATH 182 and PHYS 161. PRE- or COREQUISITE(S): MATH 280 or MATH 282 or MATH
      284, or ENEE 290, or consent of department. Three hours lecture, three hours laboratory,
      one hour discussion each week
    credits: 4
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [MATH182, PHYS161] }
    approved: true
    hs_credit: { category: "NGSS Physical Science", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [science]
    exam_equivalent: [AP_PHYSICS_C_EM]
  - id: PHYS263
    name: "General Physics III: Waves, Optics, and Modern Physics"
    description: >-
      (NSLD, GEEL) Topics include mechanical and electromagnetic waves, geometrical and wave
      optics, selected topics in special relativity, quantum mechanics, atomic, nuclear physics,
      and solid state physics, and related fields. A calculus-based general physics course,
      required for students majoring in engineering or one of the physical sciences.
      PREREQUISITE(S): A grade of C or better in PHYS 262 or consent of department. Three hours
      lecture, three hours laboratory, one hour discussion each week.
    credits: 4
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[PHYS262]] }
    approved: true
    hs_credit: { category: "NGSS Physical Science", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [science]
  # --- POLI ----------------------------------------------------------------
  - id: POLI101
    name: "American Government"
    description: >-
      (BSSD, GEEL) Structure, powers, and processes of the American political system: executive,
      legislative, and judicial branches; civil liberties, federalism, democratic patterns and
      backgrounds, public opinion, pressure group politics, political parties, constitutional
      mechanisms, and administrative establishment; foreign and domestic policy. Emphasis on
      national level. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
    exam_equivalent: [AP_US_GOV]
  - id: POLI105
    name: "Introduction to Political Science"
    description: >-
      (BSSD, GEEL, GCP) Basic principles and concepts of political science. Scope and methods of
      political science, nature and purposes of the state; government, its organization and
      functions; politics, elections, parties, pressure groups, international relations, and
      political thought. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: POLI201
    name: "Fundamentals of Public Policy"
    description: >-
      Introduces the discipline of public policy. The role of key institutions, processes, and
      public policy actors such as Congress, the presidency, the bureaucracy, the courts,
      interest groups, and the media will be explored. Students learn basic analytic strategies
      for assessing public policies. Various policy areas will be examined such as inequality,
      education, health care, economic and budgetary, immigration, environmental, and/or
      homeland security policies. This course can help students understand, evaluate, and affect
      public policies throughout their lives. PREREQUISITE(S): ENGL 101/ENGL 101A. Three hours
      each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ENGL101] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: POLI203
    name: "International Relations"
    description: >-
      (BSSD, GEEL, GCP) Critical analysis of international problems. A survey of the concepts
      and problems of sovereignty and nationalism as well as the successes and failures of
      international institutions and organizations. Special attention given to the role of the
      United Nations in today's world and to contemporary situations that affect world politics.
      Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: POLI205
    name: "Introduction to Human Rights"
    description: >-
      A survey of the field of human rights, from the local to the international level. The idea
      of humane treatment will be traced from the ancient societies down to the present "global
      village." Perspectives on human rights from a wide variety of academic disciplines will be
      considered, including cultural expressions and sustainable development. A significant part
      of the classroom time will be spent on an activity related to community service.
      Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: POLI206
    name: "Political Ideologies"
    description: >-
      (BSSD, GEEL, GCP) A survey and analysis of leading ideologies of the modern world such as
      anarchism, nationalism, fascism and national socialism, classical liberalism and
      conservatism, Fabian socialism, Marxism-Leninism, and liberal democracy. Some
      consideration of current extremist ideologies of both left and right. Examination of the
      nature and function of ideologies in political movements and in governance. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: POLI211
    name: "Comparative Politics and Governments"
    description: >-
      (BSSD, GEEL, GCP) This course introduces students to the comparative study of politics and
      governments. Topics include political culture, participation, government structures, and
      public policies. The course compares historical processes and current issues facing
      countries domestically and internationally. Selected countries from both the developed and
      developing worlds illustrate broader concepts and provide practice in comparative
      political analysis. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
    exam_equivalent: [AP_COMP_GOV]
  - id: POLI221
    name: "Western Political Thought"
    description: >-
      Surveys Western political thought from Plato to Foucault. The course critically examines
      the contributions of political theorists both ancient and modern, especially major ideas
      that have shaped modern democratic societies. The course also explores challenges posed by
      Marxist, feminist, and postmodern theorists and focuses on values and concepts that
      underlie political discourse: power, legitimacy, change, freedom, equality, and justice.
      Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: POLI230
    name: "Introduction to International Conflict Resolution"
    description: >-
      Introduction to the design, management, theory, and analysis of international conflict.
      The course explores the nature of international conflict and the combination of
      psychological, social, anthropological, political, and legal strategies that can be used
      to resolve such conflict. Assessment Level(s): ENGL 101/ENGL 011.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: POLI242
    name: "State and Local Government"
    description: >-
      Powers, organization, and functions of state and local governments; case studies. Emphasis
      on the governments of the state of Maryland and of Montgomery County. Assessment Level(s):
      ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: POLI252
    name: "Race and Ethnicity in U.S. Politics"
    description: >-
      Examines the role of race/ethnicity in the American political system. Themes discussed
      include the social construction of race; the concept of racial hierarchy; racial/ethnic
      origins of political institutions (e.g., the Constitution); minority representation; the
      relationship among race, racism, and public/foreign policy; immigration and citizenship;
      and the role of race in campaigns. Assessment Level(s): ENGL 101/ENGL 011. Three hours
      each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: POLI256
    name: "Politics of the Developing World"
    description: >-
      (BSSD, GEEL, GCP) (R only) Explores the domestic, regional, and international politics of
      the developing world. The course covers political institutions; processes; challenges
      common to many states in Africa, Asia, Latin America, and the Middle East; and regional
      differences. Topics include colonialism, the environment, development, nationalism,
      democratization, and globalization. Assessment Level(s): ENGL 101/ENGL 011. Three hours
      each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: POLI270
    name: "Politics in Action"
    description: >-
      A fieldwork course in politics. Approximately one-half of the semester is devoted to an
      activity such as preparing a legislative proposal, monitoring the progress of a bill,
      lobbying, or campaigning; the other half of the semester is spent in research, report
      writing, and seminar-style presentation and discussion of individual fieldwork projects.
      Assessment Level(s): ENGL 101/ENGL 011. Hours per week vary.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  # --- PORT ----------------------------------------------------------------
