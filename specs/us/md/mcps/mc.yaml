  - id: MATH092
    name: "Foundations of Mathematical Reasoning"
    description: >-
      Development of algebraic and numerical skills in a context of applications and
      problem-solving skills and to prepare students for a mathematics foundation course. Topics
      include quantitative relationships, patterning and algebraic reasoning, functional
      reasoning, probabilistic and statistical reasoning, incorporating quantitative
      communication skills and technology. This course does not satisfy the prerequisite for
      MATH 130, MATH 150, or MATH 165. Not intended for students who have a grade of C or better
