  - id: MATH132
    name: "Probability, Statistics, and Problem Solving Techniques"
    description: >-
      Intended for early childhood and elementary education majors, this course covers
      descriptive statistics, sampling, standardized tests, basic probability, counting
      techniques, expectations, and a variety of problem solving techniques. PREREQUISITE(S): A
      grade of C or better in MATH 130 or consent of department. Four hours each week. May not
      be taken concurrently with MATH 131 without consent of department.
    credits: 4
    level: college
    tags: [math]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[MATH130]] }
    approved: true
    hs_credit: { category: "Math", synergy: "MAT5119, CE Adv Mathematics" }
    grad_tags: [math]
  - id: MATH150
    name: "Elementary Applied Calculus I"
    description: >-
      (MATF, GEEL) Differential and integral calculus with applications in business, economics,
      social and the life sciences. Topics include functions and their graphs, constructing
      mathematical models, the derivative and its applications, the integral and its
      applications, exponential and logarithmic functions, and functions of several variables.
      This course is recommended for business majors and does not fulfill the calculus
      requirement for most science or engineering degrees. This course is not open for credit to
      students who have a grade of C or better in MATH 181 or equivalent. PRE- or
      COREQUISITE(S): Appropriate score on mathematics assessment test, a grade of C or better
      in MATH 050, or concurrent enrollment in MATH 055, or consent of department. Assessment
      Level(s): ENGL 101/ENGL 011 or ELAI 990. Four hours each week.
    credits: 4
    level: college
    tags: [math]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "Math", synergy: "MAT5119, CE Adv Mathematics" }
    grad_tags: [math]
  - id: MATH165
    name: "Precalculus"
    description: >-
      (MATF, GEEL) An examination of topics from advanced algebra, trigonometry, conics, and
      functions and applied problems. This course is designed to prepare students for MATH 181.
      PRE- or COREQUISITE(S): A grade of C or better in MATH 050 and concurrent enrollment in
      MATH 065, a grade of C or better in MATH 098, concurrent enrollment in MATH 065, or
      appropriate score on the mathematics assessment test, or consent of department. Assessment
