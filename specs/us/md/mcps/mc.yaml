    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5127, CE Adv Theater" }
    grad_tags: [elective]
  - id: THET188
    name: "Performing Arts Production"
    description: >-
      An exploration, development, and creation of all devices necessary to present a performing
      arts offering such as a play, dance concert, or musical theatre production. Lectures
      include all phases of drama, music, dance, and business production. Open to all students.
      MUSC 188 and THET 188 may be repeated for a total of 6 semester hours. A minimum of 15
