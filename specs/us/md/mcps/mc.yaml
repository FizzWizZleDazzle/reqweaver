  - id: GEOG240
    name: "Introduction to Cartography"
    description: >-
      (R only) General introduction to cartography's history, theory, and use of maps. Study of
      various types of maps, charts, and plans, mapscales, coordinates, and projections.
      Techniques, methods, problems of design, compilation, and construction of maps and
      graphics. Map symbolization and representation of topographic, hydrographic, geographic,
