    offered_terms: [fall, spring]
    approved: false
  - id: MATH050
    name: "Foundations of Algebra"
    description: >-
      An examination of algebraic skills and concepts intended to prepare students for MATH 130,
      MATH 150, and MATH 165. Numerical, graphical, and algebraic approaches are represented
      throughout as well as applications. Topics include operations on polynomial and rational
      expressions, analysis of quadratic and rational functions and graphs, solving quadratic,
      rational, and radical equations, and graphing and evaluating polynomial and exponential
      functions. PREREQUISITE(S): Appropriate score on the mathematics assessment test; or
      concurrent enrollment in MATH 045; or consent of the department. Assessment Level(s): IERW
      002 or ELAR 980. Four hours each week. FOUR EQUIVALENT CREDIT HOURS. NOT APPLICABLE TO A
      DEGREE OR CERTIFICATE. MAY NOT BE USED TO SATISFY DEGREE REQUIREMENTS. NOT INCLUDED IN GPA
      CALCULATION.
    credits: 4
    level: college
    tags: [math]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: MATH055
    name: "Elementary Applied Calculus I Support"
    description: >-
      A corequisite course intended to equip students with the skills needed to be successful in
      MATH 150 by providing support in fundamental mathematics. Topics include exponent rules,
      rational exponents and radicals, factoring, operations on polynomials and rational
      expressions, solving equations and inequalities, interval notation, basic geometry,
      functions and function composition, properties and graphs of various function types
      (including linear, quadratic, power, polynomial, rational, radical, exponential,
      logarithm, piecewise, and absolute value functions), graphing technology, and study
      skills. PREREQUISITE(S): Appropriate score on the mathematics assessment test or consent
      of the department. COREQUISITE(S): MATH 150. Assessment Level(s): ENGL 101/ENGL 011 or
      ELAI 990. Two hours lecture each week. TWO EQUIVALENT CREDIT HOURS. NOT APPLICABLE TO A
