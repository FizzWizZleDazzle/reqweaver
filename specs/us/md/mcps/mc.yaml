    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT272
    name: "Asian Art"
    description: >-
      (ARTD, GEIR, GEEL, GCP) A survey of visual art, media, and culture created in Asia and the
