    description: >-
      (R only) Intensive technical instruction in the principles of lighting design: light
      source and fixture selection, fixture specification, and installation. Real projects will
      be examined and possible solutions explored in order to determine appropriate decisions
      relative to product selection, placement, and electrical requirements. Drafting
      proficiency will be applied to exercises or assignments. PREREQUISITE(S): IDES 101 and
