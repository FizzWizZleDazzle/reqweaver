  - id: BIOL228
    name: "Pathophysiology"
    description: >-
      (TP/SS only) Presents the underlying concepts and biological basis for common pathological
      disorders of all body systems. PREREQUISITE(S): A grade of C or better in BIOL 212. PRE-
      or COREQUISITE(S): BIOL 213. Three hours each week.
    credits: 3
    level: college
    tags: [elective, science]
