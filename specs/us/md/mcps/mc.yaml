courses:
  # --- ACCT ----------------------------------------------------------------
  - id: ACCT221
    name: "Accounting I"
    description: >-
      An introduction to the principles and procedures related to accounting theory and practice
      from the perspective of users of financial information. Topics include the accounting
      cycle, the preparation and analysis of financial statements, and accounting information.
      PREREQUISITE(S): Two units of high school mathematics or appropriate score on the
      College's assessment test. Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Four hours
      each week. May not be taken concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045
      without appropriate Math assessment score.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5100, CE Adv Accounting" }
    grad_tags: [elective]
  - id: ACCT222
    name: "Accounting II"
    description: >-
      The study and analysis of managerial accounting. Topics include cost accumulation,
      evaluation, and analysis for decision making, as well as coverage of the statement of cash
      flows and financial statement analysis. PREREQUISITE(S): ACCT 221. Four hours each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ACCT221] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5100, CE Adv Accounting" }
    grad_tags: [elective]
  - id: ACCT223
    name: "Computer Applications for Accounting"
    description: >-
      A hands-on experience with applications widely used in accounting practice. Students use
      computer spreadsheets and industry-specific accounting and analytics software to develop
      work-ready skills. Assignments link accounting theory to practice. PREREQUISITE(S): ACCT
      221. Three hours lecture each week. May not be taken concurrently with MATH 017, MATH 020,
      MATH 030, or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ACCT221] }
    approved: false
  - id: ACCT225
    name: "Governmental and Nonprofit Accounting"
    description: >-
      General principles of fund accounting for municipal, governmental, and nonprofit
      institutions. The course will emphasize fund principles, budgetary controls, and financial
      reporting statements. PREREQUISITE(S): ACCT 222. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ACCT222] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5100, CE Adv Accounting" }
    grad_tags: [elective]
  - id: ACCT228
    name: "Ethics and Professionalism in Accounting"
    description: >-
      Provides an examination of the major ethical issues encountered by accountants in the
      business environment. The AICPA Code of Professional Conduct and the reasoning,
      philosophy, and application of that code are examined. PREREQUISITE(S): ACCT 221 or
      consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ACCT221]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5100, CE Adv Accounting" }
    grad_tags: [elective]
  - id: ACCT231
    name: "Intermediate Accounting I"
    description: >-
      An overview of the financial accounting process with an in-depth study of cash,
      receivables, inventory costing, property, plant and equipment, intangible assets, and
      current liabilities. The course also includes an introduction to financial accounting
      research analysis. PREREQUISITE(S): ACCT 222. Four hours each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ACCT222] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5100, CE Adv Accounting" }
    grad_tags: [elective]
  - id: ACCT232
    name: "Intermediate Accounting II"
    description: >-
      Major topics include accounting for long-term liabilities, stockholders equity, earnings
      per share, investments, accounting for income taxes, pensions, leases, and statement of
      cash flows. The course also includes financial accounting research analysis.
      PREREQUISITE(S): ACCT 231. Four hours each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ACCT231] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5100, CE Adv Accounting" }
    grad_tags: [elective]
  - id: ACCT235
    name: "Cost Accounting and Analysis"
    description: >-
      The study and analysis of cost accumulation and product costing procedures for both job
      order and process costing systems, absorption versus variable costing in manufacturing,
      activity-based costing, standard costing and performance, and relevant costs for decision
      making. Accounting for capital budgeting decisions and ethical challenges in managerial
      accounting are also covered. PREREQUISITE(S): ACCT 222. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ACCT222] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5100, CE Adv Accounting" }
    grad_tags: [elective]
  - id: ACCT237
    name: "Federal Income Taxation I"
    description: >-
      A critical examination, analysis, and application of the tax law for individuals.
      Interrelated subjects include income inclusions and exclusions, property transactions,
      nontaxable exchanges, capital asset transactions, general deductions and losses, business
      expenses, depreciation and amortization, and passive activities. Attention is given to tax
      procedures, accounting and inventory methods, retirement planning, exemptions, credits,
      filing status, and the alternative minimum tax. Students also engage in both electronic
      research and return preparation. PREREQUISITE(S): ACCT 221 or consent of department. Four
      hours each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ACCT221]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5100, CE Adv Accounting" }
    grad_tags: [elective]
  - id: ACCT239
    name: "Business Finance"
    description: >-
      The study and analysis of the theories and applications that the financial manager uses in
      making decisions. Emphasis is placed on financial analysis, economic value added, cash
      flow analysis, profit planning, risk and return, security valuation, and capital budgeting
      analysis. Capital markets, working capital policy, current asset and liability management,
      financial structure, dividend policy, and internal financing are to be addressed.
      PREREQUISITE(S): ACCT 221. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ACCT221] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5100, CE Adv Accounting" }
    grad_tags: [elective]
  - id: ACCT240
    name: "Auditing Theory and Practice"
    description: >-
      The study and analysis of fundamental components of auditing theory and risk, including
      inherent risk, control risk, and detection risk. Emphasis is placed on internal control
      procedures, risk assessment and examination of accounts. Additionally, the role of
      regulatory organizations and professional standards such as Generally Accepted Auditing
      Standards and Standards of the Public Company Accounting Oversight Board are discussed.
      PREREQUISITE(S): ACCT 231 or consent of department. Four hours each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ACCT231]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5100, CE Adv Accounting" }
    grad_tags: [elective]
  - id: ACCT245
    name: "Accounting Information Systems"
    description: >-
      (R only) Concepts and techniques of analyzing, designing, and implementing accounting
      information systems. Evaluation of computer- and non-computer-based information systems
      and software for organizations of various kinds. PREREQUISITE(S): ACCT 222 or consent of
      department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ACCT222]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5100, CE Adv Accounting" }
    grad_tags: [elective]
  - id: ACCT247
    name: "Federal Income Taxation II"
    description: >-
      A critical examination, analysis, and application of the tax law for Subchapter C and S
      corporations, limited liability companies, partnerships, estates and trusts. Attention is
      given to taxation of gifts, exclusions, net operating losses, determination of shareholder
      and partner basis, consolidated entities, book and income tax reconciliation, owner
      contributions and distributions, and beneficiary share of income. Students also engage in
      both electronic research and return preparation practica. PREREQUISITE(S): ACCT 237. Four
      hours each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ACCT237] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5100, CE Adv Accounting" }
    grad_tags: [elective]
  # --- ANIM ----------------------------------------------------------------
  - id: ANIM200
    name: "Animation I: Introduction to 2D Animation"
    description: >-
      This course provides an introduction to 2D animation, covering key topics such as the
      history of animation, animation principles, storyboard creation, techniques in 2D
      hand-drawn and stop-motion animation, and a hands-on exploration of the animation
      production process. It also includes an overview of the animation job market.
      PREREQUISITE(S): GDES 116. Two hours lecture, four hours studio each week. It is
      recommended that animation students complete ARTT 100 - Introduction to Drawing prior to
      taking this course. It is also recommended that students take ARTT 205 - Figure Drawing I
      in the same semester as this course.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [GDES116] }
    approved: false
  - id: ANIM210
    name: "Animation II: Introduction to 3D Animation"
    description: >-
      An introduction to the fundamentals of 3D animation focusing on key areas such as
      animation principles, modeling, material, lighting, rigging, and rendering practices.
      PREREQUISITE(S): ANIM 200. Two hours lecture, four hours studio each week. It is
      recommended that animation students complete ARTT 100 - Introduction to Drawing prior to
      taking this course.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ANIM200] }
    approved: false
  - id: ANIM220
    name: "Animation III: Character Animation and Motion Capture"
    description: >-
      (R only) A comprehensive study of both 2D and 3D character development and character
      animation. Students will gain practical hands-on experience applying animation principles
      in both 2D and 3D animation. Students will explore full-body motion capture and its
      practical use in collecting real-time data to create animations. PREREQUISITE(S): ANIM
      210. Two hours lecture, four hours studio each week.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ANIM210] }
    approved: false
  # --- ANTH ----------------------------------------------------------------
  - id: ANTH201
    name: "Introduction to Sociocultural Anthropology"
    description: >-
      (BSSD, GEEL, GCP) An exploration of fundamental anthropological concepts, methods, and
      theories used to interpret traditional and modern cultures. Emphasis is placed on the
      components of cultural systems and the investigation of the impact of globalization on
      changing cultures worldwide. Assessment Level(s): ENGL 101/ENGL 011. Three hours each
      week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: ANTH215
    name: "Human Evolution and Archaeology"
    description: >-
      (NSND, GEEL, GCP) An introduction to the theories and evidence concerning human's
      biological evolution and archaeology worldwide. Emphasis is placed on the genetic and
      adaptive evidence for human variation, the fossil evidence for human evolution,
      primatology, domestication, state societies, and archaeological methods and techniques.
      ANTH 215 will satisfy the NSND General Education requirement. A combination of ANTH 215
      and ANTH 216 will satisfy the NSLD General Education requirement. Assessment Level(s):
      ENGL 101/ENGL 011, MATH 050. Three hours each week. May not be taken concurrently with
      MATH 017 or MATH 020 or MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: ANTH216
    name: "Human Evolution and Archaeology Laboratory"
    description: >-
      (NSLD, GEEL, GCP) Introduction to anthropological study of the biology and behavior of
      humans and primates. A combination of laboratory investigations and field trips are used
      to introduce students to the scientific method, bioarchaeology and paleoanthropology, and
      concepts of macro and microevolution, adaptation, and human and primate origins. A
      combination of ANTH 215 and ANTH 216 must be taken to satisfy the NSLD General Education
      requirement. PRE- or COREQUISITE(S): ANTH 215. Assessment Level(s): ENGL 101/ENGL 011,
      MATH 050. Three hours of laboratory each week. May not be taken concurrently with MATH 017
      or MATH 020 or MATH 030 or MATH 045 without appropriate Math assessment score. Course may
      be repeated without the co-requisite with consent of department.
    credits: 1
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: ANTH240
    name: "Introduction to Archaeology"
    description: >-
      (BSSD, GEEL, GCP) An introduction to the discipline of archaeology. The course provides
      background to the development of archaeology as a science, various theoretical approaches,
      archaeological data and dating, and interpretation. The course also includes a survey of
      global prehistoric archaeological cultures. Assessment Level(s): ENGL 101/ENGL 011. Three
      hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: ANTH256
    name: "World Cultures"
    description: >-
      (BSSD, GEEL, GCP) (G and R only) An examination of one culture area in a particular
      geographic region using theories and methods of anthropology. The emphasis is on the
      prehistory, colonialism, cultural systems, modernization, and globalization of the region.
      Case studies are used to examine current conditions. Assessment Level(s): ENGL 101/ENGL
      011. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: ANTH260
    name: "Independent Study Anthropology"
    description: >-
      (G and R only) A course designed to enable advanced students to pursue a topic of their
      own choosing with the guidance and supervision of an assigned faculty member. Topics
      should not duplicate any course topics already offered in the program. PREREQUISITE(S):
      ANTH 201, ANTH 215, ANTH 240 or ANTH 256 and consent of department. Three hours
      lecture/discussion each week.
    credits: 3
    level: college
    tags: [social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ANTH201, ANTH215, ANTH240, ANTH256]] }
    approved: false
  # --- AOSC ----------------------------------------------------------------
  - id: AOSC100
    name: "Weather and Climate"
    description: >-
      (NSND, GEEL) Covers local and global weather phenomena. Topics include global and local
      energy budgets, geographic and seasonal variation, surface and upper air weather patterns,
      clouds and precipitation, catastrophic occurrences (snowstorms, thunderstorms, tornadoes,
      hurricanes, floods), and global climate change. Using real-time and archived web-based
      data, students analyze local and regional weather patterns and events. Students may
      receive credit for either AOSC 100 or AOSC 105, but not both. Assessment Level(s): ENGL
      101/ENGL 011, MATH 050. Three hours each week. May not be taken concurrently with MATH 017
      or MATH 020 or MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: AOSC105
    name: "Meteorology: An Introduction to Weather"
    description: >-
      (NSLD, GEEL) (R only) Designed to give students an understanding of important global and
      local weather events. Lectures explore the elements responsible for weather and climate.
      Individual topics include global and local energy budgets, geographic and seasonal
      variation, surface and upper air weather patterns, clouds and precipitation, catastrophic
      occurrences (snowstorms, thunderstorms, tornadoes, hurricanes, floods), and global climate
      change. In laboratories, students apply lecture concepts through use of weather
      instruments, interpret and analyze real-time and archived data and make their own
      forecasts. Students may receive credit for either AOSC 100 or AOSC 105, but not both.
      Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Three hours lecture, three hours
      laboratory each week. May not be taken concurrently with MATH 017 or MATH 020 or MATH 030
      or MATH 045 without appropriate Math assessment score.
    credits: 4
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  # --- ARAB ----------------------------------------------------------------
  - id: ARAB101
    name: "Elementary Arabic I"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A beginning language course focusing on the study of Modern
      Standard Arabic (MSA) language. Students begin to develop the ability to communicate in
      Arabic through the consideration of cultural themes, language functions, and authentic
      situations as they acquire the structures and lexicon to work with written language,
      conversation, and composition. No prior knowledge of Arabic is required. In-class work is
      supplemented by 20 hours of online homework. Five hours each week.
    credits: 5
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "World Languages: Arabic", synergy: "WLG5130, CE Adv World Language" }
    grad_tags: [world_language]
  - id: ARAB102
    name: "Elementary Arabic II"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A continuation of ARAB 101. Students continue their study of
      written language, conversation, and composition in Modern Standard Arabic (MSA) as they
      consider cultural themes, language functions, and authentic situations. In-class work is
      supplemented by 20 hours of online homework. PREREQUISITE(S): ARAB 101 or equivalent
      proficiency. Five hours each week.
    credits: 5
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ARAB101]] }
    approved: true
    hs_credit: { category: "World Languages: Arabic", synergy: "WLG5130, CE Adv World Language" }
    grad_tags: [world_language]
  # --- ARCH ----------------------------------------------------------------
  - id: ARCH101
    name: "Introduction to Architecture and the Built Environment"
    description: >-
      (R only) An introduction to the architectural profession and the related fields of design
      and construction. An exploration of the impact of architecture within the built
      environment, including conservation and interior design issues; urban and regional
      planning; and construction implications. An examination of the entire building process and
      the legal, social, and cultural implications. Assessment Level(s): ENGL 101/ENGL 011, MATH
      098. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  - id: ARCH103
    name: "Building Technology and Documentation"
    description: >-
      (R only) An in-depth examination of structural, surface, and detail elements of a building
      and its documentation. An introduction to drafting techniques of architectural and
      interior design spaces. A hands-on experience in which the student develops skills in the
      professional drafting standards, format and layout of drawings. Assessment Level(s): ENGL
      101/ENGL 011, MATH 117 or higher. Two hours lecture, four hours laboratory each week. May
      not be taken concurrently with MATH 017 or MATH 020 or MATH 030 without appropriate Math
      assessment score.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  - id: ARCH104
    name: "Introduction to Architectural Graphics"
    description: >-
      (R only) The study of the various visual communications methods most commonly used in the
      architectural profession. Techniques will include both color and black/white, a variety of
      perspective systems, shade/shadow, exploded views, pencil-and-pen work, and watercolor.
      PREREQUISITE(S): ARCH 101 or IDES 101 and ARCH 103. Assessment Level(s): ENGL 101/ENGL
      011, MATH 098. Two hours lecture, four hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ARCH103], any_of: [[ARCH101, IDES101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  - id: ARCH183
    name: "CAD: Architectural Applications"
    description: >-
      (R only) Focuses on the mastering of computer aided drafting commands and drawing
      techniques for design professionals in the fields of architecture, design, and
      construction. Students create a series of drawings with the final assignment being a
      multi-page set of plans, elevations, and details. PREREQUISITE(S): A grade of B or better
      in ARCH 103 or consent of department. Two hours lecture, four hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ARCH103]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  - id: ARCH200
    name: "CAD: 3D Presentation"
    description: >-
      (R only) Development of skills and understanding of a variety of graphic software to
      utilize the computer as a tool for rendering and presentation. Three-dimensional design
      development is emphasized including perspective views, rendering scenes with materials and
      lighting and backgrounds, and presentation packaging. Students create a series of projects
      and create a portfolio of 3D architectural designs. PREREQUISITE(S): ARCH 183 or consent
      of department. Two hours lecture, four hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ARCH183]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  - id: ARCH201
    name: "Introduction to Architectural Design"
    description: >-
      (R only) Introduces design principles and their application to architectural design. The
      course develops and strengthens problem-solving skills from conceptual, environmentally
      sensitive, and sociocultural points of view resulting in three-dimensional forms.
      Instruction emphasizes model making and presentation skills as they resolve architectural
      problems. PREREQUISITE(S): ARCH 101, ARCH 104, and CMGT 100. Two hours lecture, four hours
      laboratory each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ARCH101, ARCH104, CMGT100] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  - id: ARCH202
    name: "CAD: REVIT I"
    description: >-
      (R only) Development of skills and understanding of a parametric computer drafting system
      based on construction components, elements, and types. Students will learn to create
      building models with building information modeling software (BIM), and students will use
      skills such as views, sheets, tagging and scheduling, annotating and dimensioning, and
      detailing. Final project will be a set of BIM documents based on residential and
      commercial structure. PREREQUISITE(S): A grade of B or better in ARCH 103 or consent of
      department. Two hours lecture, four hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ARCH103]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  - id: ARCH203
    name: "Principles of Sustainability"
    description: >-
      (R only) Fundamentals of sustainability in terms of the environment as a foundation for
      architectural design. Study of the various energy rating systems and exploration of the
      impact of architecture in terms of global environmental health, energy conservation
      concepts, and urban and regional planning. Topics include analysis of various mechanical
      and technical systems. Exploration of theories and practices of sustainable design with an
      actual building as students engage in hands-on experiences to analyze materials, systems,
      and construction methodology. Assessment Level(s): ELAW 980/ELAR 980. Three hours each
      week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  # --- ARTT ----------------------------------------------------------------
  - id: ARTT100
    name: "Introduction to Drawing"
    description: >-
      (ARTD, GEIR, GEEL) An introduction to drawing and creative visual problem solving.
      Emphasis is on the analysis and exploration of basic observational drawing techniques in
      the visual interpretation of natural and fabricated forms. Students will be introduced to
      a variety of drawing media. Two hours lecture, four hours studio each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
    exam_equivalent: [AP_ART_DRAWING]
  - id: ARTT102
    name: "Introduction to 2D Design"
    description: >-
      (ARTD, GEIR, GEEL) An introduction to the elements and principles of visual expression
      with an emphasis on two-dimensional form. Students will explore a wide range of conceptual
      approaches and media to develop critical visual thinking and the capacity to engage in
      creative problem solving. An interdisciplinary, cross-cultural approach will be stressed
      to connect the formal and conceptual elements of visual expression within the context of
      both historical and contemporary visual culture. Two hours lecture, four hours studio each
      week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
    exam_equivalent: [AP_ART_2D_DESIGN]
  - id: ARTT103
    name: "Introduction to 3D Design"
    description: >-
      (ARTD, GEIR, GEEL) An introduction to the elements and principles of visual expression,
      with an emphasis on three-dimensional form. Students will develop the visual vocabulary,
      technical skills, and critical thinking necessary to engage in creative problem solving.
      Students will employ a wide range of formal and conceptual approaches, and media, in an
      exploration of the interaction between surface, form, space, and time. An
      interdisciplinary, cross-cultural approach will be utilized in introducing methods,
      materials and concepts of visual expression within the context of both historical and
      contemporary visual culture. Two hours lecture, four hours studio each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
    exam_equivalent: [AP_ART_3D_DESIGN]
  - id: ARTT105
    name: "Color Theory and Application"
    description: >-
      An introduction to the expressive, symbolic, decorative, and aesthetic aspects of color.
      Investigation of color theories and solutions to a variety of problems using color as a
      tool. Two hours lecture, four hours studio each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT112
    name: "Digital Photography for Fine Arts I"
    description: >-
      (ARTD, GEIR, GEEL) A general introduction to electronic still photography, beginning with
      traditional photographic and art concepts. Students explore image manipulation using
      personal computers supported by digital cameras and other available technologies. Students
      create a series of projects using the most advanced photo editing software available to
      create artistic images. Two hours lecture, four hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT120
    name: "Ceramics I"
    description: >-
      (ARTD, GEIR, GEEL, GCP) First of two related courses (with ARTT 220) that focus on the
      aesthetic and technical aspects of the ceramic process. Studio sessions will involve an
      exploration of the nature of clay, decorative processes, glazes, and firing via hand-built
      pottery. A survey of historical and contemporary ceramic art forms is included. Design and
      craftsmanship are emphasized. Two hours lecture, four hours studio each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT123
    name: "Crafts"
    description: >-
      (ARTD, GEIR, GEEL) (R and TP/SS only) An introduction to working in processes such as
      metalsmithing, enameling, ceramics, fiber craft, basketry, or paper craft. While
      cultivating respect for craft, students create functional or nonfunctional objects while
      they explore material as an art form. Students analyze the social and ethical aspects
      within craft as they develop technical competency. Coursework encourages an investigation
      into the potential of objects to possess visual, tactile, and conceptual information.
      Creative design and technical craftsmanship are emphasized. No prior experience required.
      Course may be repeated for audit without limit. Two hours lecture, four hours studio each
      week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT127
    name: "Art Appreciation (Art in Culture)"
    description: >-
      (ARTD, GEIR, GEEL, GCP) An appreciation of the visual arts through an aesthetic
      understanding of the various art forms and their historical development throughout the
      world. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
    exam_equivalent: [AP_ART_HISTORY, AP_ART_2D_DESIGN, AP_ART_3D_DESIGN, AP_ART_DRAWING]
  - id: ARTT152
    name: "Photographic Expression I"
    description: >-
      (ARTD, GEIR, GEEL) Designed to achieve the basics of black-and-white still photographic
      techniques with additional emphasis on the development of ability to express and
      understand ideas and feelings communicated in photographs. Students are expected to supply
      own camera (35mm with manual controls), paper, and film. One hour lecture, four hours
      laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT200
    name: "Global Art History I"
    description: >-
      (ARTD, GEIR, GEEL, GCP) A global survey of artistic production from the earliest art
      through the Medieval period with an emphasis on learning to look at works of art and
      architecture in their historical, social, and cultural contexts. Assessment Level(s): ENGL
      101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
    exam_equivalent: [AP_ART_HISTORY]
  - id: ARTT201
    name: "Global Art History II"
    description: >-
      (ARTD, GEIR, GEEL, GCP) A global survey of artistic production from the Early Modern
      period to the present with an emphasis on learning to look at works of art and
      architecture in their historical, social, and cultural contexts. Assessment Level(s): ENGL
      101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT202
    name: "Introduction to Museums"
    description: >-
      (HUMD, GEIR, GEEL, GCP) Provides an introduction to museum history, theory, and practice
      in a global context. Using an interdisciplinary approach, the course examines the complex
      histories, roles, and responsibilities museums have as cultural institutions and stewards
      of public trust. The course considers diverse types of museums through case studies and
      global perspectives on topics such as exhibitions, collections, education, operations, and
      ethics. Students have the option to complete coursework using physical and/or virtual
      museums. Assessment Level(s): ENGL 101/ENGL 011. Three hours lecture each week.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: ARTT204
    name: "Intermediate Drawing"
    description: >-
      A continuation of ARTT 100, with the further analysis and exploration of drawing skills,
      techniques, and concepts. Emphasis is on more complex problem solving in the visual
      interpretation of natural and fabricated forms. Students will utilize a variety of
      black-and-white and color drawing media. PREREQUISITE(S): ARTT 100 or consent of
      department. Two hours lecture, four hours studio each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ARTT100]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT205
    name: "Figure Drawing I"
    description: >-
      An introduction to figure drawing. Emphasis is placed on the problems involved in the
      visual interpretation of the human figure as a separate study, and in relation to its
      environment. Students will utilize a variety of drawing media. PREREQUISITE(S): ARTT 100
      or consent of department. Two hours lecture, four hours studio each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ARTT100]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT206
    name: "Figure Drawing II"
    description: >-
      A continuation of ARTT 205, with further analysis and exploration of the concepts and
      techniques introduced in ARTT 205. Emphasis is placed on more complex problem solving in
      the visual interpretation of the human figure as a separate study and in relation to its
      environment. Students will use a variety of black-and-white and color drawing media.
      PREREQUISITE(S): ARTT 205 or consent of department. Two hours lecture, four hours studio
      each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ARTT205]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT211
    name: "Painting I"
    description: >-
      An introductory studio course involving solutions to the problems related to the creation
      of representational, abstract, and non-objective paintings. Technical skills such as the
      ability to size and prime a canvas and to work in varied media are developed.
      Demonstrations, lectures, and class critiques will be employed. PREREQUISITE(S): ARTT 100
      or consent of department. Two hours lecture, four hours studio each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ARTT100]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT212
    name: "Painting II"
    description: >-
      A continuation of ARTT 211, with emphasis on solution to advanced problems related to the
      creation of representational, abstract, and non-objective paintings. Technical skills to
      work in varied media are developed. Demonstrations, lectures, and class critiques will be
      employed. PREREQUISITE(S): ARTT 211 or consent of department. Two hours lecture, four
      hours studio each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ARTT211]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT213
    name: "Digital Photography for Fine Arts II"
    description: >-
      An advanced course that will enable students to use digital photography to create
      sophisticated, aesthetic images. The student will be encouraged to develop a personal
      style and technical proficiency for personal expression. PREREQUISITE(S): ARTT 112 or
      consent of department. Two hours lecture, four hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ARTT112]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT220
    name: "Ceramics II"
    description: >-
      Second of two related courses (with ARTT 120, which must be taken first). The aesthetic
      and technical aspects of the ceramic process. Studio sessions will involve a continued
      study of the nature of clay with the development of forms derived from the potter's wheel.
      Increased emphasis placed on surface decoration, glaze formulation, and kiln firing
      skills. Design and craftsmanship are emphasized. PREREQUISITE(S): ARTT 120 or consent of
      department. Two hours lecture, four hours studio each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ARTT120]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT221
    name: "Sculpture I"
    description: >-
      The problems and principles of sculpture. Theory and basic techniques involved in additive
      and subtractive methods in both relief sculpture and sculpture in the round. Materials may
      include clay, wood, stone, modern plastics, plaster, and metal. PREREQUISITE(S): ARTT 102
      and ARTT 103, or consent of department. Two hours lecture, four hours studio each week.
