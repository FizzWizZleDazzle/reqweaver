  - id: TVRA236
    name: "Video Production Portfolio"
    description: >-
      Advanced video projects selected and completed by students in consultation with the
      instructor, departmental faculty, or working professionals. Students develop a
      professional portfolio designed to convey their technical and aesthetic skills. To further
