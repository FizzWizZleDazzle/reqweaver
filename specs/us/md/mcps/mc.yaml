  # --- FIRE ----------------------------------------------------------------
  - id: FIRE101
    name: "Principles of Emergency Services"
    description: >-
      Provides an overview to fire protection and emergency services; career opportunities in
      fire protection and related fields; philosophy and history of fire protection and
      emergency services; fire loss analysis; organization and function of public and private
      fire protection and emergency services; fire/rescue departments as part of local
      government; laws and regulations affecting the fire service; fire and emergency service
      nomenclature; specific fire protection functions; basic fire chemistry and physics;
      introduction to fire protection systems; introduction to fire strategy and tactics.
      Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: FIRE102
    name: "Fire Behavior and Combustion"
    description: >-
      Explores the theories and fundamentals of how and why fires start and spread, and how they
      are controlled. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: FIRE103
    name: "Building Construction for Fire Protection"
    description: >-
      Provides the components of building construction related to firefighter and life safety.
      The elements of construction and design of structures are shown to be key factors when
      inspecting buildings, preplanning fire operations, and operating at emergencies.
      Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Three hours each week. May not be taken
      concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without appropriate Math
      assessment score.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: FIRE104
    name: "Principles of Fire and Emergency Services Safety & Survival"
    description: >-
      Introduces the basic principles and history related to the national firefighter life
      safety initiatives, focusing on the need for cultural and behavior change throughout the
      emergency services. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: FIRE105
    name: "Fire Prevention"
    description: >-
      Provides fundamental knowledge relating to the field of fire prevention. Topics include:
      history and philosophy of fire prevention; organization and operation of a fire prevention
      bureau; use and application of codes and standards; plans review; fire inspections; fire
      and life safety education; and fire investigation. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: FIRE201
    name: "Fire Protection Systems"
    description: >-
      Provides information relating to the features of design and operation of fire detection
      and alarm systems, heat and smoke control systems, special protection and sprinkler
      systems, water supply for fire protection, and portable fire extinguishers. Assessment
      Level(s): ENGL 101/ENGL 011, or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: FIRE202
    name: "Fire Protection Hydraulics and Water Supply"
    description: >-
      Provides a foundation of theoretical knowledge in order to understand the principles of
      the use of water in fire protection and to apply hydraulic principles to analyze and solve
      water supply problems. Assessment Level(s): ENGL 101/ENGL 011, or consent of department.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: FIRE203
    name: "Principles of Fire and Emergency Service Administration"
    description: >-
      Introduces the student to the organization and management of a fire and emergency services
      department and the relationship of government agencies to the fire service. Emphasis is
      placed on fire and emergency service, ethics, and leadership from the perspective of the
      company officer. PREREQUISITE(S): FIRE 202 or consent of department. Three hours each
      week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[FIRE202]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: FIRE220
    name: "Strategy and Tactics"
    description: >-
      Provides the principles of fire ground control utilization of personnel, equipment, and
      extinguishing agents. PREREQUISITE(S): FIRE 101 or consent of department. Three hours each
      week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[FIRE101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: FIRE250
    name: "Fire Protection Internship"
    description: >-
      Students work for college credit in the professional setting of a fire protection agency,
      doing management or research-related work for such agencies at the federal, state, local
      government, or private sector level. PREREQUISITE(S): Consent of department. Minimum
      average of 110 hours work experience and 10 one-hour seminars per semester.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  # --- FREN ----------------------------------------------------------------
  - id: FREN101
    name: "Elementary French I"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A beginning language course focusing on the study of French
      language and culture. Students begin to develop the ability to communicate in French
      through the consideration of cultural themes, language functions, and authentic situations
      as they acquire the structures and lexicon to work with written language, conversation,
      and composition. No prior knowledge of French is required. In-class work is supplemented
      by 20 hours of online homework. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "World Languages: French", synergy: "WLG5130, CE Adv World Language" }
