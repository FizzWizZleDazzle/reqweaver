    name: "Codes for Interiors"
    description: >-
      (R only) An introduction to issues related to codes and building requirements for
      furniture, finishes, systems, accessibility, and installations in the interior
      environment. Students examine standards, codes, National Kitchen and Bath Association
      (NKBA) guidelines, resources, and local code procedures. Students analyze sample projects
      and resolve issues related to codes and specify accordingly. PREREQUISITE(S): IDES 101 or
