    name: "Research Topics in Applied Geography"
    description: >-
      (R only) Research topics in geography, designed to develop the ability to originate,
      formulate, and perform geographic studies commonly encountered in public and private
      agencies. Special topics cover physical, economic, social, and political matters selected
      to fit individual and team approaches to geography problems characteristic of the
      Washington metropolitan area. Standard research techniques are stressed. PREREQUISITE(S):
