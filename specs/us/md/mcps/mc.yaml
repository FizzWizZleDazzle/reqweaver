    approved: false
  - id: NURS122
    name: "Supplemental Clinical Practicum"
    description: >-
      (TP/SS only) Optional clinical elective for nursing students who want the opportunity to
      increase their clinical skills, their ability to organize and prioritize patient care, and
      their familiarity with the hospital setting. Students work under the guidance of a
      clinical instructor. PREREQUISITE(S): Consent of program coordinator. This course may be
      repeated for credit. Three eight-hour days each week for three weeks.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: NURS125
    name: "Nursing in Health and Illness I"
    description: >-
      (TP/SS only) Introductory medical surgical nursing course which builds on the conceptual
      foundations and core integrated nursing concepts taught in previous courses. Nursing
      concepts are applied in an interdisciplinary practice environment where emphasized.
      PREREQUISITE(S): NURS 113, NURS 114, NURS 121, NURS 129. COREQUISITE(S): NURS 126. Two
      hours lecture, twelve hours of clinical each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [NURS113, NURS114, NURS121, NURS129] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: NURS126
    name: "Nursing Care of Special Populations I: Psychiatric and Mental Health Nursing"
    description: >-
      (TP/SS only) Introduces concepts related to the promotion of mental health and the nursing
      care of patients with related disorders across the lifespan. PREREQUISITE(S): NURS 113,
      NURS 114, NURS 121, NURS 129. COREQUISITE(S): NURS 125. Two hours lecture, twelve hours of
      clinical each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [NURS113, NURS114, NURS121, NURS129] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: NURS129
    name: "Pathophysiology and Pharmacology in Nursing"
    description: >-
      (TP/SS only) Introduces pharmacodynamics, pharmacokinetics, and pharmacotherapeutics of
      various classifications of medications as they relate to basic pathophysiology seen in
      each body system. Emphasis is on the nursing implications and patient education required
      for safe administration of each class. Students explore the role and responsibility of the
      registered nurse in administering and evaluating medications. COREQUISITE(S): NURS 113,
      NURS 114, NURS 121. Minimum of two hours each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: NURS130
    name: "Transition to Nursing"
    description: >-
      (TP/SS only) Designed to ease the transition of para-professional healthcare workers into
      the Associate Degree Nursing (ADN) program. Specific concepts drawn from the first year of
      the AD nursing program, related to professional nursing practice, are taught. Other
      concepts familiar to para-professional healthcare workers are enlarged upon in both
      breadth and depth. The nursing process is stressed with a focus on health assessment and
      the use of care plans for planning, implementing and evaluating nursing care. All aspects
      of professional communication are explored and practiced. Supervised clinical experiences
      enhance the para-professional healthcare worker's grasp of professional nursing care for
      patient with alterations in the physiological and psychosocial processes.
    credits: 7
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOL212, BIOL213], any_of: [[ENGL102, ENGL103]] }
    approved: false
  - id: NURS140
    name: "Independent Study in Nursing"
    description: >-
      (TP/SS only) An independent study course to enable nursing students to pursue a topic of
      their own choosing with the guidance and supervision of an assigned faculty member. It
      will provide a structured learning experience to broaden the student's understanding of a
      particular aspect of nursing, health care, or disease modality. Topics will not duplicate
      curriculum content, but may expand on that content. This course may be repeated provided
      that a different topic is covered each time. PREREQUISITE(S): Admission to the nursing
      program and consent of program coordinator. Forty-five hours of work required per semester
      hour of credit. Letter designators in the schedule of classes will indicate the number of
      credits. Variable credit: 1-4 semester hours.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: NURS205
    name: "Transition to Professional Nursing Practice"
    description: >-
      (TP/SS only) Facilitates the entry of the graduate into the profession of nursing,
      including trends in the scope of practice and roles of the nurse in an ever-changing
      health care delivery system. Includes discussion of professional nursing organizations,
      accountability in nursing practice, identification of socio-political factors influencing
      professional nursing, and evidence based practice. Legal and ethical responsibilities
      related to nursing practice are further considered. Aspects of nursing leadership and
      healthcare management are reviewed. Must be taken during the final semester of the
      program. PREREQUISITE(S): Admission to the nursing program or consent of program
      coordinator. COREQUISITE(S): NURS 240. One hour each week.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: NURS225
    name: "Nursing in Health and Illness II"
    description: >-
      (TP/SS only) Intermediate medical-surgical nursing course continues the progression of
      concepts learned in the first two nursing semesters. Students now apply the basic
      principles learned in prior nursing courses to patients with complex, multi-system disease
      processes. Core integrated nursing concepts include: safety, clinical reasoning, patient
      centered care, interdisciplinary collaboration, professionalism, informatics and evidence
      based practice. Students are now expected to assess, plan and deliver care, evaluate
      outcomes, and critically reflect on learning while providing care for multiple complex
      medical-surgical patients. PREREQUISITE(S): NURS 125, NURS 126. COREQUISITE(S): NURS 226.
      Two hours lecture/discussion, twelve hours of clinical each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [NURS125, NURS126] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: NURS226
    name: "Nursing Care of Special Populations II: Maternal/Child Nursing"
    description: >-
      (TP/SS only) Provides the student opportunities to implement the nursing process in acute
      and community settings. The focus of care is on women and the family during the
      childbearing cycle, the newborn, and the child through adolescence. PREREQUISITE(S): NURS
      125, NURS 126. COREQUISITE(S): NURS 225. Three hours lecture/discussion, twelve hours of
      clinical each week.
    credits: 5
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [NURS125, NURS126] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: NURS240
    name: "Nursing in Health and Illness III"
    description: >-
      (TP/SS only) Concentration is placed on the principles involved in organizing, managing
      and delivering care appropriate for the adult with various complex health problems. The
      focus moves from self-limiting and chronic health issues to acute emergent care of the
      adult patient. PREREQUISITE(S): NURS 225, NURS 226. COREQUISITE(S): NURS 205. Three hours
      lecture/discussion, twelve hours of clinical each week.
    credits: 7
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [NURS225, NURS226] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  # --- NUTR ----------------------------------------------------------------
  - id: NUTR101
    name: "Introduction to Nutrition"
    description: >-
      (NSND, GEEL) Study of nutrition as it relates to health and disease. Includes functions of
      nutrients; factors affecting nutrient intake, absorption, and utilization; and nutrient
      needs during the life cycle and illness. Emphasis on planning and preparing daily diets
      for optimal health. Course concludes by applying the principles of diet modifications to
      the treatment of disease. Assessment Level(s): ENGL 101/ENGL 011, MATH 050, appropriate
      score on the mathematics placement test, or consent of department. Three hours each week.
      May not be taken concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without
      appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: NUTR202
    name: "Nutrition Through the Life Cycle"
    description: >-
      (R only) Designed to examine the nutritional needs of humans as they move through the life
      cycle stages from pre-conception through elder years. It also examines conditions that may
      alter or substantially impact nutrition at these stages; reviews programs which provide
      support for food or nutrition education at various life cycle stages; and uses case study
      data to assess nutrition issues/conditions. Students will assess adequacy of diets as well
      as design diets to meet needs during various life cycle stages. PREREQUISITE(S): BIOL 226,
      NUTR 101 or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOL226, NUTR101] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: NUTR212
    name: "Food Science and Technology"
    description: >-
      A general overview of principles of food science and technology, covering food
      constituents and properties; quality and safety; preservation methods; food regulation;
      and sensory evaluation. PREREQUISITE(S): BIOL 226 or NUTR 101, or consent of department.
      Three hours lecture each week.
    credits: 3
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[BIOL226, NUTR101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  # --- NWIT ----------------------------------------------------------------
  - id: NWIT101
    name: "Introduction to the Internet of Things (IoT)"
    description: >-
      An introduction to the development of inter-connectivity of objects involving electronics
      in all aspects of life including transportation, health care, safety, environment, energy,
      etc. This class covers theoretical and practical applications of Internet of Things (IoT)
      concepts such as sensing, actuation and configuration. Students will gain applied
      experience in the fundamentals of electricity, components, circuitry, wireless
      communication and programming associated with physical computing as well as databases.
      Assessment Level(s): MATH 050. Three hours each week. May not be taken concurrently with
      MATH 017 or MATH 020 or MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT105
    name: "Introduction to Cloud Computing"
    description: >-
      Introduces essential characteristics of a cloud environment, various cloud services and
      deployment models, the role of virtualization in cloud computing, and major cloud
      providers. Students will explore some of the challenges of cloud deployment, with emphasis
      in the area of security. Assessment Level(s): ELAR 980/IERW 002. Three hours each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT127
    name: "Microcomputer Essentials"
    description: >-
      An introduction to microcomputer hardware, peripheral, networking, and security
      components. Students will understand the basic functionality of the operating system and
      basic troubleshooting methodology, practice proper safety procedures, and will effectively
      interact with customers and peers. In addition, the course includes programming concepts,
      the study of applications, such as spreadsheets, databases, presentation, and web site
      development. This course also prepares students to take the Essential exam for the CompTIA
      A+ Certificate. Assessment Level(s): ELAR 980/IERW 002. Three hours each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT130
    name: "Network Cabling Technology"
    description: >-
      (G only) Features hands-on instruction designed to cover cabling techniques using co-ax,
      copper, and fiber for video, voice data communications, and networking. Students will
      master basic cabling techniques using state-of-the-market equipment in accordance with
      industry standards. Assessment Level(s): MATH 050, ELAR 980/IERW 002. Three hours each
      week. May not be taken concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045
      without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT151
    name: "Introduction to Networking"
    description: >-
      An introduction to networking technologies. This course covers the basics of networking,
      the open systems interconnection (OSI) reference model, transmission control
      protocol/Internet protocol (TCP/IP) addressing, electricity, specifications and techniques
      of building data cabling, and local area network/wide area network (LAN/WAN) technologies.
      In addition, this course is also the first in a series of courses designed to prepare
      students for the Cisco Certified Network Associate (CCNA) examination. Assessment
      Level(s): MATH 050. Three hours each week. May not be taken concurrently with MATH 017 or
      MATH 020 or MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT170
    name: "Network and Cloud Infrastructure"
    description: >-
      An introduction to computer network and cloud components that enable connectivity,
      communication, operations, and management of modern enterprise infrastructure. The topics
      include networking devices, network operating systems (OS), cloud services and storage
      area network (SAN). Students will install and configure Windows, Linux, and Mac OS servers
      as well as virtual machines (VM) and virtual private cloud (VPC)/Network (VPN). Assessment
      Level(s): MATH 050, ELAR 980/IERW 002. Three hours each week. May not be taken
      concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without appropriate Math
      assessment score.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT173
    name: "Network Security"
    description: >-
      An in-depth review of systems security, access control, network infrastructure,
      assessments and audits, cryptography and organizational security across both private and
      public enterprises. Real-world scenarios reinforce material covered. This course will help
      prepare students for the CompTIA Security+ certification exam. Assessment Level(s): MATH
      050. Three hours each week. May not be taken concurrently with MATH 017 or MATH 020 or
      MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT200
    name: "Microsoft Modern Desktops"
    description: >-
      An introduction to the concepts and skills necessary to support the most current Microsoft
      Windows network client operating system. The course covers technical areas that include
      installation, administration, basic security, and troubleshooting, and is designed for
      students seeking Microsoft professional certification (MCSA and MCSE). PREREQUISITE(S):
      NWIT 151 or NWIT 170 or successful completion of CompTIA's Network+ certification
      examination, or appropriate networking experience with consent of department. Three hours
      each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[NWIT151, NWIT170]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT203
    name: "Microsoft Windows Server"
    description: >-
      (G only) Introduction to the concepts and skills necessary to support the current Windows
      server operating system. Enterprise server systems areas include installation,
      administration, and troubleshooting. Designed for students on the Microsoft Certified
      Systems Engineer Track, this course provides them with the knowledge and skills required
      for NWIT 204 and helps prepare them for Microsoft Professional Certification for
      installing, configuring, and administering the current version of Microsoft Windows.
      PREREQUISITE(S): NWIT 151 or NWIT 170 or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[NWIT151, NWIT170]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT204
    name: "Network Virtualization and System Administrator"
    description: >-
      Introduces concepts and skills necessary to install, configure, manage and support a
      virtual network infrastructure. Students will learn why companies are steadily
      virtualizing, the differences between technical alternatives, and how to optimize a
      virtualized environment. Lecture topics will be reinforced through hands-on exercises
      involving the installation, configuration, and management of both virtual workstations and
      servers. PREREQUISITE(S): NWIT 200 or NWIT 203 or consent of department. Four hours each
      week.
    credits: 4
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[NWIT200, NWIT203]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT208
    name: "Cloud Architecting"
    description: >-
      Fundamentals of building IT infrastructure on AWS. The course is designed to teach
      students how to optimize their use of the AWS Cloud by understanding AWS services and how
      they fit into cloud-based solutions. Best practices for applying to all solutions are
      emphasized. Throughout the course, students will explore a scenario that provides
      opportunities for students to build a variety of infrastructures through a guided,
      hands-on approach. PREREQUISITE(S): NWIT 105 and (NWIT 151 or NWIT 170). Three hours
      lecture each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [NWIT105], any_of: [[NWIT151, NWIT170]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT209
    name: "Cloud Administration"
    description: >-
      Fundamentals of implementing, managing, and monitoring IT infrastructure on Microsoft
      cloud platform - Azure. The course is designed to teach students technical skills that
      manage Azure identities and governance, implement and manage storage, deploy and manage
      Azure computer resources, configure and manage virtual networking, and monitor and back up
      Azure resources. PREREQUISITE(S): NWIT 105 and (NWIT 151 or NWIT 170). Three hours lecture
      each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [NWIT105], any_of: [[NWIT151, NWIT170]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT230
    name: "Intro to Cyber Ops"
    description: >-
      An online/applied lab course providing an overview of the architecture of modern
      computers, including how a CPU works, memory and hardware relationships with operating
      systems, an introduction to both Windows and Linux, programming and scripting logic, as
      well as security limitations that allow systems to be exploited. The course offers
      lab-based exercises to increase familiarity with the command line and provides experiences
      with the underlying facets of a modern operating system. Instruction includes a balance of
      lab applications and theory for practical security experience. NWIT 230 also prepares
      students for the SANS Five Basics of Cybersecurity Certification(s). PREREQUISITE(S): NWIT
      127, NWIT 245, and CMSC 253 or consent of the department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [NWIT127, NWIT245, CMSC253] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT245
    name: "Defending the Network"
    description: >-
      An overview of network defense and countermeasures and the fundamentals of defending
      networks, such as layered defense. The course introduces students to protective
      technologies commonly deployed on today's networks, such as system hardening, enterprise
      firewalls, VPNs, IDS, and antivirus. The course also develops and examines risk analysis
      and security policies to help build a secure network within Windows and Linux operating
      systems. PREREQUISITE(S): NWIT 173 or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[NWIT173]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT246
    name: "Attacker Tools and Techniques"
    description: >-
      Focuses on methods attackers use to successfully compromise target networks. Students
      learn how attackers perform initial reconnaissance and footprinting and then move on to
      scanning and eventual exploitation. This course approaches security from the hacker's
      perspective. PREREQUISITE(S): CMSC 253 and NWIT 245, or consent of department. Three hours
      each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [CMSC253, NWIT245] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT247
    name: "Introduction to Incident Response"
    description: >-
      A methodical approach to dealing with the aftermath of a security breach (also known as an
      incident). Students will learn how to manage incidents so that damage is limited and
      recovery time is optimal. Most organizations accept the fact that they will eventually be
      compromised despite implementing security best practices. As a result, they redirect
      strategies from the traditional defense-in-depth approach to an assume breach model.
      Organizations are improving their incident response capabilities by creating sophisticated
      incident response plans and elite incident response teams. PREREQUISITE(S): NWIT 246 or
      consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[NWIT246]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT252
    name: "Cisco Networking 2"
    description: >-
      Describe basic switching concepts and technologies such as Switching, VLANs, and trunking.
      Learn Spanning Tree Protocol and EtherChannel architecture. Configure and troubleshoot a
      small switched network. Describe the purpose and operation of a router. Perform basic
      router configurations, including static routing, default routing, and Inter-VLAN routing.
      Describe the concepts of FHRP and Switch Security Configuration. It also describes the
      WLAN concepts and configuration. Describe the operations and benefits of Dynamic Host
      Configuration Protocol (DHCP) and SLAAC/DHCPv6. In addition, this course is the second in
      a series of courses designed to prepare students for the Cisco Certified Network Associate
      (CCNA) examination. PREREQUISITE(S): NWIT 151 or completion of Cisco Academy Semester 1
      (Exploration 1), or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[NWIT151]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT253
    name: "Cisco Networking 3"
    description: >-
      An examination of initial switch configuration, Cisco ISO Software managements, and LAN
      design. Students configure Virtual LANs (VLANs), Virtual Trunking Protocol (VTP), Spanning
      Tree Protocol (VTP), Inter-VLAN Routing, and are introduced to basic Cisco wireless
      concepts and configuration. This course is the third in a series of four designed to help
      prepare students to take the CCNA certification exam. This course is equivalent to
      CyberWATCH course CW 250. PREREQUISITE(S): NWIT 252 or completion of Cisco Academy
      Semester 2 (Exploration 2), or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[NWIT252]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT254
    name: "Cisco Networking 4"
    description: >-
      (G only) An examination of Cisco IOS Software management, WAN protocols and technologies,
      and WAN design. Students configure Point-to-Point Protocol (PPP), Frame Relay, Network
      Security, Access Control Lists (ACLs), and TCP/IP. In addition, this course is the fourth
      in a series of four designed to help prepare students for the CCNA certification exam.
      This course is equivalent to CyberWATCH course CW 251. PREREQUISITE(S): NWIT 253 or
      completion of Cisco Academy Semester 3 (Exploration 3), or consent of department. Three
      hours each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[NWIT253]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT261
    name: "CCNA SECURITY"
    description: >-
      (G only) Focuses on the overall security processes in a network with particular emphasis
      on skills in the following areas: (1) security policy design and management; (2) security
      technologies, products, and solutions; (3) firewall and secure router design,
      installation, configuration, and maintenance; (4) AAA implementation using routers and
      firewalls; and (5) securing the network at both layer 2 and 3 of the OSI model. This
      course helps prepare students to sit for the Securing Networks with Cisco Routers and
      Switches (SNRS) and Securing Networks with PIX and ASA (SNPA) Security Certification
      exams. These are two of the five exams that count toward the Cisco Certified Security
      Professional (CCSP) certification. In addition, Cisco Network Academy students who pass
      these two exams will be able to apply for Cisco Firewall/ASA Specialist status.
      PREREQUISITE(S): NWIT 254 or CCNA certification or consent of department. Four hours each
      week.
    credits: 4
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[NWIT254]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT263
    name: "Introduction to Digital Forensics"
    description: >-
      Introduction to the techniques and tools of digital forensics investigations. The course
      emphasizes digital forensic procedures, digital forensic tools, and legal issues relating
      to digital forensics. Students receive step-by-step explanations on how to use the most
      popular forensic tools. Topics include coverage of the latest technology, including PDAs,
      cell phones, and thumb drives. This course includes many hands-on activities that allow
      students to practice skills as they are learned. This course is equivalent to Cyber WATCH
      course CW 170. PREREQUISITE(S): NWIT 127. Three hours each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [NWIT127] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT264
    name: "Network and Cloud Forensics"
    description: >-
      Focuses on the technical aspects of network and cloud intrusions and discusses the
      methodology commonly used by attackers. The course begins with an overview of networking
      protocols and then addresses topics, such as session hijacking, capturing network traffic,
      and the importance of collecting volatile data from on-premise and/or cloud-hosted
      environments. Students learn how to examine a compromised server or workstation in the
      field to obtain log files and forensic images of hard disk drives. Students examine server
      log files and forensic artifacts for evidence of the attacker's methods and activities.
      PREREQUISITE(S): NWIT 151 or NWIT 170 or consent of department. Three hours lecture each
      week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[NWIT151, NWIT170]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT269
    name: "Network and Wireless Technologies Internship"
    description: >-
      (G only) Internship in a professional environment related to the network and wireless
      technologies program. Students accumulate appropriate work experience that enriches their
      knowledge and expands career possibilities. Students must propose the internship on their
      own, but assistance is provided in developing their resume. Students maintain
      comprehensive records of work experience for course purposes and for seminar discussions.
      An internship credit requires a minimum of five hours of work experience per semester hour
      each week for 15 weeks and eight hours of seminar discussions each semester. Students may
      work five hours per week for one semester to earn 1 credit and can earn 4 credits in four
      semesters or may work 20 hours per week for one semester and earn four credits in a
      semester. PREREQUISITE(S): Consent of department. Five to twenty hours work experience per
      week and eight hours of seminar discussions. Variable credit: 1-4 semester hours.
    credits: 1
    level: college
    tags: [computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: NWIT270
    name: "Advanced Topics in Cloud Computing"
    description: >-
      This course covers advanced topics in cloud computing. Current trends as well as new cloud
      technologies will be examined and explored. Focus will be on applications and innovation
      to various industries. PREREQUISITE(S): NWIT 101 and NWIT 105. Three hours lecture each
      week.
    credits: 3
    level: college
    tags: [computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [NWIT101, NWIT105] }
    approved: false
  - id: NWIT275
    name: "Wi-Fi Pen Testing"
    description: >-
      An examination of the latest wireless local area network (WLAN) security protocols,
      techniques, and applications. Students will learn how to use software tools to capture
      very specific types of WLAN traffic related to security. They will then learn the most
      common applications used to attack and compromise today's WLANs. Linux is the primary OS
      environment for this course. PREREQUISITE(S): CMSC 253 and NWIT 245, or consent of
      department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [CMSC253, NWIT245] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: NWIT290
    name: "Information Security Capstone"
    description: >-
      Provides a review of methods for identifying network vulnerabilities, implementing net-
      work defense, and exploring network forensics. Students have opportunities to implement a
      layered defense on a practical network, including using tools to analyze the
      vulnerabilities of a net- work. Additionally, students will research products that could
      serve as countermeasures against potential attacks, implement security features of the
      network's operating systems, and develop alternate solutions based upon cost and level of
      security required. The course also provides students with the practice skills necessary to
      enhance their existing network security background and prepare for Professional Security
      Certification(s). PREREQUISITE(S): NWIT 246 or consent of department. Three hours each
      week.
    credits: 3
    level: college
    tags: [computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[NWIT246]] }
    approved: false
  - id: NWIT291
    name: "Cybersecurity Capstone"
    description: >-
      A culmination of cybersecurity and networking theory and practice. Students will combine
      knowledge and skills gained by implementing the eight CISSP domain topic areas into a
      fictitious organization. Students will learn how to apply the tools, techniques, and
      knowledge gained in the program in a practical real-world example. The course culminates
      with a formal capstone paper and presentation. The course also prepares students for the
      ISC2 Professional Security Certification(s). PREREQUISITE(S): NWIT 246 or consent of
      department. One hour each week.
    credits: 1
    level: college
    tags: [computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[NWIT246]] }
    approved: false
