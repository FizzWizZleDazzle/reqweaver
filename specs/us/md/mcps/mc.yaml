    grad_tags: [math]
  - id: MATH171
    name: "Calculus for Life Sciences II"
    description: >-
      A continuation of MATH 170; intended primarily for students of the life sciences. Topics
      include: integration, partial derivatives, systems of linear equations, normal and
      binomial distributions, sampling distributions, an introduction to differential equations,
      and discrete dynamical systems. Alongside the mathematical concepts will be applications
      to the life sciences. Not intended for students of the physical sciences, engineering, or
      mathematics. PREREQUISITE(S): A grade of C or better in MATH 170 or MATH 181. For
      computation of tuition, this course is equivalent to five semester hours. Five hours each
      week. MATH 171 is NOT a substitute for MATH 182. This course appears on the MCPS approved
      list but is no longer in the current MC catalog; the description is from the 2025-2026
      catalog.
