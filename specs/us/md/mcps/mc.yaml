    description: >-
      (ECEC and TP/SS only) Third course in the series of practical nursing training. Topics
      include health promotion in special populations and concerns: reproductive health,
      obstetrics/neonates, growth and development across the lifespan, and mental health and
      illnesses. Application of pathophysiology, nutrition, and pharmacology to common diseases
