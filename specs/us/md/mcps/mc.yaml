  - id: GHUM101
    name: "Introduction to Global Humanities"
    description: >-
      (HUMD, GEIR, GEEL, GCP) Study of the many humanities themes from the standpoint of global
      interconnections. This course takes an interdisciplinary humanities approach to a number
      of themes. Specifically, it encourages students to consider a number of topics related to
      global issues using historical, literary, linguistic, and philosophical lenses. The course
      encourages students to recognize their responsibilities to society-locally, nationally,
      and globally-and to consider their academic and personal goals. Students will also
      consider current issues of global importance. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
