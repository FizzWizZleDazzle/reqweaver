  - id: MATH207
    name: "Introduction to Discrete Structures"
    description: >-
      Credit will only be earned for CMSC 207 or MATH 207. An introduction to discrete
      structures as they relate to computer science. The course will stress computer science
      applications and will include relations, functions and algorithms, Naive Set Theory,
      combinatorics, logic, and mathematical induction. PREREQUISITE(S): ENGL 101/ENGL 101A or
      appropriate score on English assessment test, and MATH 182. Four hours each week.
    credits: 4
    level: college
    tags: [math]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [MATH182], any_of: [[ENGL101]] }
    approved: true
    hs_credit: { category: "Math", synergy: "MAT5119, CE Adv Mathematics" }
    grad_tags: [math]
  - id: MATH217
    name: "Statistics for Scientists"
    description: >-
      A course in statistical methods for students in STEM disciplines. The course will explore
      foundational concepts and applications in descriptive and inferential statistics
      including: conditional probability, sampling distribution, estimation, odds ratios, formal
      probability distributions (e.g., binomial, Gaussian and Poisson), confidence intervals,
      hypothesis testing (e.g., t-tests, Wilcoxon Rank Test, ANOVA, chi-square tests),
      correlation, simple and multiple linear regression, relative risk, and logistic
      regression. Coursework will rely heavily on technology in order to focus on the
      applications of statistical concepts and methods within STEM disciplines. PRE- or
      COREQUISITE(S): MATH 150 or MATH 181 or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [math]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "Math", synergy: "MAT5119, CE Adv Mathematics" }
    grad_tags: [math]
  - id: MATH264
    name: "Applications in Linear Algebra"
    description: >-
      For students who wish to focus on the practical applications of Linear Algebra. A wide
      range of applications are discussed and coursework will rely heavily on technology in
      order to focus on the applications of concepts and methods. The main topics include matrix
      calculations and determinants, vector spaces over the real numbers, orthogonality, linear
      transformations, eigenvalues, eigenvectors, graphical explorations of vectors, and inner
      products. Applications incorporating problem solving are presented in the context of
      real-world situations with an emphasis on model creation and interpretation.
      PREREQUISITE(S): A grade of C or better in MATH 150 or MATH 181 or consent of department.
      Four hours lecture each week.
    credits: 4
    level: college
    tags: [math]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[MATH150, MATH181]] }
    approved: true
    hs_credit: { category: "Math", synergy: "MAT5119, CE Adv Mathematics" }
    grad_tags: [math]
  - id: MATH280
    name: "Multivariable Calculus"
    description: >-
