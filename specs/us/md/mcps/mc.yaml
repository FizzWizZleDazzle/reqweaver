  - id: THET114
    name: "Stagecraft I"
    description: >-
      (R only) The principles and practice of drama production, with emphasis on planning,
      constructing, and shifting scenery, and on the management of backstage operations.
      Additional laboratory hours and actual work on College productions. Assessment Level(s):
      ENGL 101/ENGL 011, MATH 050. Three hours lecture, two hours laboratory each week. May not
      be taken concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without
      appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5127, CE Adv Theater" }
    grad_tags: [elective]
  - id: THET118
    name: "Theatrical Makeup Techniques"
    description: >-
      (R only) A study of theories and techniques of theatrical makeup. This course is designed
      to familiarize students with the materials and their application, with each student
      experiencing the techniques involved in corrective, character, and special effects makeup.
      Assessment Level(s): ENGL 101/ENGL 011. Two hours lecture/demonstration, two hours
      laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5127, CE Adv Theater" }
    grad_tags: [elective]
  - id: THET122
    name: "Performance Production"
    description: >-
      (R and TP/SS only) Practical experience in the production aspects of the performing arts.
      Students are assigned tasks in the areas of acting, dancing, choreography, costuming,
      lighting, scene construction and painting, and house and stage management for College
      productions. Acting and/or dancing in a production is by audition only. Assessment
      Level(s): ENGL 101/ENGL 011. The course may be repeated for a total of three credits.
      Students will spend a minimum of 70 hours per semester in production and 30 hours per
      semester in a laboratory, in addition to a one-hour lecture each week.
    credits: 1
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: THET125
    name: "Script Analysis"
    description: >-
      Examines plays from the point of view of the director, the actor, the designers, and the
      audience. Students will study form, structure, genre, character, language, theme, and
      action as components of a text that provide the theatre artist with the tools for the
      creation a theatrical production. Assessment Level(s): ENGL 101/ENGL 011. Three hours each
