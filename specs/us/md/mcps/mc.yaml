  - id: TECH288
    name: "Advanced Web Application Development Using ColdFusion"
    description: >-
      A hands-on exploration of advanced Web application design and construction using
      ColdFusion. Students learn the basics of creating an e-commerce site by building a fully
      operational storefront, shopping cart, and sales reporting system. Topics include creating
      and using complex variables, maintaining state, reusing code, creating user-defined and
      full-text search facilities, building interactive data-driven graphs, and integrating an
      automatic e-mail facility. PREREQUISITE(S): TECH 278 or consent of department. Three hours
      lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[TECH278]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: TECH290
    name: "Building Game Worlds"
    description: >-
      Topics include level design, world building, and quality assurance. Provides an overview
      of level design and testing, two of the most common entry-level positions in the game
      industry. Students use industry standard tools to create interactive 3D game prototypes.
      PREREQUISITE(S): TECH 190 or consent of department. Assessment Level(s): ENGL 101/ENGL
      011. Four hours each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[TECH190]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: TECH295
    name: "Tabletop and Mixed Media Game Design"
    description: >-
      Explore the world of non-digital and hybrid games, from traditional tabletop experiences
      like board games and card games to innovative augmented reality (AR) and mixed media
      formats. This course covers the history and evolution of analog games, the fundamentals of
      game design, and the integration of digital elements into physical game environments.
      Topics include design principles, teamwork, production processes, and industry insights,
      with opportunities to create your own original game projects. PREREQUISITE(S): NONE, but
      TECH 190, TECH 290, and a computer graphics course are strongly recommended. Assessment
      Level(s): ENGL 101/ENGL 011. Four hours each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: TECH299
    name: "Web Certificate/Degree Portfolio"
    description: >-
      This Capstone course for the Web Careers certificate/degree provides an opportunity to
      produce a professional print and/or Web-based portfolio and resume. Students work on Web
      development team to design and implement a prototype Web site for a local small business
      or nonprofit organization. Topics include content development, universal Website design,
      project management, usability practices, resume and portfolio preparation, and effective
      writing for the Web. PREREQUISITE(S): Consent of department. Three hours
      lecture/discussion each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
