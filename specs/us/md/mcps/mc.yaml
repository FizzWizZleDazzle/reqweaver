    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: ARTT290
    name: "Art Internship"
    description: >-
      Students work for College credit in a museum or other professional arts organization or
      venue. Students may propose an internship for one of the limited number available in the
      arts each year. Typically, the internships are awarded during the last year of study at
      Montgomery College. PREREQUISITE(S): Open to art majors who have completed 15 arts-related
      credits. A 3.2 GPA and consent of departmental arts internship coordinator and the Arts
      Institute internship coordinator are required. May be repeated for a maximum of six
      credits with consent of department. Fifteen hours each week per semester.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  # --- ASLP ----------------------------------------------------------------
  - id: ASLP100
    name: "ASL I"
    description: >-
      (HUMD, GEIR, GEEL, GCP) (R only) A survey of conversational ASL hand-shapes and basic
      grammatical structures. Basic cultural information that influences forms and communication
      in ASL will be presented and studied. Assessment Level(s): ENGL 101/ENGL 011. Three hours
      each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "World Languages: American Sign Language", synergy: "WLG5129, CE Adv WL Am Sign Lang" }
    grad_tags: [world_language]
  - id: ASLP105
    name: "Visual Gestural Communication"
    description: >-
      (R only) An introduction to the comprehension and expression of visual-gestural aspects of
      communication in relation to ASL. This course includes instruction in forms and hand
      shapes involved in mime and gesticulation. Emphasis is placed on activities that create
      visual, motor, and cognitive readiness for signed languages. Instructional activities will
      foster the development of visual, spatial, and motor language memory. Recommended to be
      taken with ASLP 106. Assessment Level(s): ENGL 101/ENGL 011. In-class is supplemented by
      one hour each week in the language learning laboratory. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "World Languages: American Sign Language", synergy: "WLG5129, CE Adv WL Am Sign Lang" }
    grad_tags: [world_language]
  - id: ASLP106
    name: "Fingerspelling and Number Use in ASL"
    description: >-
      (R only) A foundation for comprehension, expression, and understanding of ASL hand-shapes
      as they are used in fingerspelling and numbers. The course includes an introduction to
      historical and physiological aspects of fingerspelling and number use in ASL. The course
      focuses on development skills for receptive and expressive spelling and reading of
      fingerspelling words and numbers, on proper biomechanical functions, on recognizing hand
      movements. Recommended to be taken concurrently with ASLP 105. Assessment Level(s): ENGL
      101/ENGL 011. In-class is supplemented by one hour each week in the language learning
      laboratory. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "World Languages: American Sign Language", synergy: "WLG5129, CE Adv WL Am Sign Lang" }
    grad_tags: [world_language]
  - id: ASLP110
    name: "ASL II"
    description: >-
      (HUMD, GEIR, GEEL, GCP) (R only) Broadens the use of conversational ASL hand-shapes and
      basic grammatical structures. Co-selection of features and mutual monitoring possibilities
      for topics will be examined to formulate ASL conversational context for occupation,
      activities, location, and stages of life. PREREQUISITE(S): A grade of C or better in ASLP
      100 or equivalent, or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ASLP100]] }
    approved: true
    hs_credit: { category: "World Languages: American Sign Language", synergy: "WLG5129, CE Adv WL Am Sign Lang" }
    grad_tags: [world_language]
  - id: ASLP121
    name: "Introduction to the Deaf Community and Culture"
    description: >-
      (BSSD, GEEL GCP) (R only) Provides a broad introduction to concepts related to the Deaf,
      Deaf culture, and the languages of people within Deaf communities in particular and Deaf
      society in general. The course examines current issues and languages in the Deaf
      community, including technology and diversity. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "World Languages: American Sign Language", synergy: "WLG5129, CE Adv WL Am Sign Lang" }
    grad_tags: [world_language]
  - id: ASLP200
    name: "ASL III"
    description: >-
      (R only) Development of advanced receptive and expressive skills in ASL, including
      politeness principles in ASL: fluency, tact, generosity, modesty, and solidarity. This
      course includes intensive work on conversational maxims in ASL: quantity, quality,
      relation, manner, and appropriateness. Recommended to be taken concurrently with ASLP 205.
      PREREQUISITE(S): A grade of C or better in ASLP 110 or equivalent, or consent of
      department. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ASLP110]] }
    approved: true
    hs_credit: { category: "World Languages: American Sign Language", synergy: "WLG5129, CE Adv WL Am Sign Lang" }
    grad_tags: [world_language]
  - id: ASLP205
    name: "Structural ASL I"
    description: >-
      (R only) A consideration of the phonological, morphological, semantic, and pragmatic
      components of ASL. This course provides a foundation for the comprehension, expression,
      and understanding of ASL classifiers and their linguistic symbols and signing space for
      the ASL native. Topics include an examination of the grounded mental spaces utilized in
      narrative, constructed dialogue, constructed activity, and the non-manual signals used in
      narrative form. Recommended to be taken concurrently with ASLP 200. PREREQUISITE(S): A
      grade of C or better in ASLP 105, ASLP 106, and ASLP 110; or consent of department. Three
      hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ASLP105, ASLP106, ASLP110] }
    approved: true
    hs_credit: { category: "World Languages: American Sign Language", synergy: "WLG5129, CE Adv WL Am Sign Lang" }
    grad_tags: [world_language]
  - id: ASLP206
    name: "Structural ASL II"
    description: >-
      (R only) A further consideration of the phonological, morphological, semantic, syntactic,
      and pragmatic components of ASL. This course includes a consideration of the
      sociolinguistic principles in American Sign Language and the cultural practices from which
      they derive, specifically focusing on language taboos, discourse, and linguistic
      variation. Recommended to be taken concurrently with ASLP 210. PREREQUISITE(S): A grade of
      C or better in ASLP 205 or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ASLP205]] }
    approved: true
    hs_credit: { category: "World Languages: American Sign Language", synergy: "WLG5129, CE Adv WL Am Sign Lang" }
    grad_tags: [world_language]
  - id: ASLP207
    name: "ASL Translation and Interpretation"
    description: >-
      (R only) Builds an integrated model of ASL translation and interpretation and includes
      skill development in the area of line-by-line translation, textual glossing, the
      interpretation of narratives, consecutive and simultaneous interpretation, semantic and
      syntactic circumlocution, and general interpretation. The course includes a consideration
      of ethics and issues in the practice of translation and interpretation. PREREQUISITE(S): A
      grade of C or better in ASLP 200 and ASLP 205, or consent of department. Three hours each
      week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ASLP200, ASLP205] }
    approved: true
    hs_credit: { category: "World Languages: American Sign Language", synergy: "WLG5129, CE Adv WL Am Sign Lang" }
    grad_tags: [world_language]
  - id: ASLP210
    name: "ASL IV"
    description: >-
      (R only) Cultivating the communicative approach by learning ASL functions in interactive
      contexts. Methods of confirming and correcting information, asking for clarification,
      agreeing, declining or hedging and appropriate ways of getting and directing attention in
      various situations will be examined to frame effective communication in ASL. Recommended
      to be taken concurrently with ASLP 206. PREREQUISITE(S): A grade of C or better in ASLP
      200 or equivalent, or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ASLP200]] }
    approved: true
    hs_credit: { category: "World Languages: American Sign Language", synergy: "WLG5129, CE Adv WL Am Sign Lang" }
    grad_tags: [world_language]
  - id: ASLP222
    name: "Deaf History and Culture"
    description: >-
      (R only) Provides students the opportunity to immerse themselves in Deaf culture, history,
      and language. This course will present an in-depth consideration of Deaf history and the
      social, cultural, political, educational, and social aspects of the community as a
      cohesive American co-culture. Students will examine the norms and values of Deaf culture,
      as well as the linguistic, educational, social, and professional influences in Deaf
      culture and history. Recommended to be taken concurrently with ASLP 210. PREREQUISITE(S):
      ASLP 121 and ASLP 200, or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ASLP121, ASLP200] }
    approved: true
    hs_credit: { category: "World Languages: American Sign Language", synergy: "WLG5129, CE Adv WL Am Sign Lang" }
    grad_tags: [world_language]
  - id: ASLP269
    name: "Independent Study in ASL"
    description: >-
      This course invites advanced students to pursue a further in-depth independent study of a
      specialized aspect of ASL, to explore specific grammatical and cultural aspects of ASL, to
      consider the historical and practical implications of these aspects, or to explore their
      own specialization within the curriculum more closely. PREREQUISITE(S): ASLP 207 or
      consent of department. Minimum of 30 hours per semester hour. Variable credit: 1-4
      semester hours.
    credits: 1
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ASLP207]] }
    approved: false
  - id: ASLP285
    name: "Practicum in ASL"
    description: >-
      This course invites students to explore some specific practical applications of ASL, to
      consider the implications of these applications, and to examine their own assumptions of
      these ASL aspects more closely. The studies in this independent course will help students
      who want to make the most of their skills, using ASL in practical situations
      (interpreting, peer tutoring, helping other students, or working in ASL environment). PRE-
      or COREQUISITE(S): ASLP 269 and an earned score of 3.0 or better in the ASL Proficiency
      Interview, or consent of department. Nine hours of work each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "World Languages: American Sign Language", synergy: "WLG5129, CE Adv WL Am Sign Lang" }
    grad_tags: [world_language]
  # --- ASTR ----------------------------------------------------------------
  - id: ASTR101
    name: "Introductory Astronomy"
    description: >-
      (NSLD, GEEL) A basic introduction to astronomy that emphasizes appreciation of the Earth's
      relationship to the universe. The basic laws of physics as they apply to astronomy are
      covered, along with telescopes and data collection and analysis techniques utilized by
      astronomers. Also covered are the evolution of stars, the solar system, galaxies, and the
      origin and evolution of the universe. Laboratory sessions, both computer- based and other,
      give practical application to material covered in lectures. Two nighttime observing
      sessions are also included. Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Three hours
      lecture, two hours laboratory, one hour discussion each week. May not be taken
      concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without appropriate Math
      assessment score.
    credits: 4
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: ASTR202
    name: "Introduction to Modern Astronomy"
    description: >-
      A basic course elaborating on topics briefly covered in ASTR 101 including black holes,
      pulsars, planetary structure, galactic structure, radio and x-ray astronomy. A major
      portion of the course is devoted to observing and observational techniques. Laboratory
      sessions cover such topics as the use of computer-controlled telescopes for visual and
      electronic observation, planning observations, CCD imaging and image processing
      techniques. Numerous nighttime observing sessions will be conducted. PREREQUISITE(S): ASTR
      101 or consent of course instructor. Three hours lecture, three hours laboratory each
      week.
    credits: 4
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ASTR101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  # --- AUTO ----------------------------------------------------------------
  - id: AUTO101
    name: "Introduction to Automotive Technology"
    description: >-
      (R only) An introduction to the operating systems of the modern automobile. Explores
      current changes in the industry along with career opportunities. Covers identification and
      the safe use of hand, pneumatic, and electrical tools used in automotive service. Explains
      the basic operating procedures of shop equipment. Presents Occupational Safety and Health
      Act standards pertaining to the automotive field for greater individual and environmental
      safety. Two hours lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: AUTO111
    name: "Engine Repair"
    description: >-
      (R only) Preparation for ASE A-1 Engine Repair technician certification exam. Course
      details the purpose, parts, and operation of the gasoline internal combustion engine.
      Class concentrates on engine rebuilding including mechanical assessment, removal,
      disassembly and cleaning, inspection, reconditioning and repair, assembly, installation,
      and break-in. All upper- and lower-end services are discussed. Laboratory exercises guide
      the student through their engine rebuild project. It is strongly recommended the student
      supply a personally owned engine for the class, but not required. PREREQUISITE(S): A grade
      of C or better in AUTO 101. Two hours lecture, four hours laboratory each week.
    credits: 4
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [AUTO101] }
    approved: false
  - id: AUTO130
    name: "Manual Drive Train and Axles"
    description: >-
      (R only) Preparation for ASE A-3 Manual Drive Train and Axles technician certification
      exam. Discusses purpose, parts, operation, failure diagnosis, and overhaul of manual
      transmissions, transaxles, clutch assemblies, differentials and transfer cases, shafts,
      and joints. Laboratory exercises emphasize current service and diagnostic procedures.
      PREREQUISITE(S): A grade of C or better in AUTO 101. Three hours lecture, four hours
      laboratory each week.
    credits: 5
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [AUTO101] }
    approved: false
  - id: AUTO140
    name: "Suspension and Steering"
    description: >-
      (R only) Preparation for ASE A-4 Suspension and Steering technician certification exam.
      Discusses purpose, parts, operation, and failure diagnosis of automotive suspension and
      steering systems. Topics include inspection, service, repair, and replacement of
      suspension system links, control arms, ball joints, bushings, shocks, struts, and springs.
      Steering columns, linkages, gearboxes, rack and pinion assemblies, pumps, lines, and hoses
      are covered. Two- and four-wheel alignment is included. Laboratory exercises emphasize
      current service and diagnostic procedures. PREREQUISITE(S): AUTO 101. Three hours lecture,
      four hours laboratory each week.
    credits: 5
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [AUTO101] }
    approved: false
  - id: AUTO150
    name: "Brakes"
    description: >-
      (R only) Preparation for ASE A-5 Brakes technician certification exam. Discusses purpose,
      parts, operation, and failure diagnosis of automotive disc and drum brake systems. Topics
      include inspection, repair, and replacement of master cylinders, power boosters, hydraulic
      lines and hoses, control valves, friction linings, calipers and wheel cylinders, cables,
      brackets, and hardware. ABS operation and diagnosis is included. Laboratory exercises
      emphasize current service and diagnostic procedures. PRE- or COREQUISITE(S): AUTO 101.
      Three hours lecture, four hours laboratory each week.
    credits: 5
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: AUTO161
    name: "Automotive Electricity I"
    description: >-
      (R only) Discusses basic electrical concepts applicable to automotive components,
      circuits, and systems. Common failures, diagnostic techniques, and repair procedures are
      covered. Selection, use, and maintenance of specialized service tools are emphasized. Use
      of printed and electronic wiring diagrams and service information to diagnose and repair
      faults is included. Laboratory exercises emphasize on-vehicle application of theory,
      tools, and technique. Assessment Level(s): ELAR 980/IERW 002. Two hours lecture, three
      hours laboratory, one hour discussion each week.
    credits: 4
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: AUTO180
    name: "Basic Engine Performance"
    description: >-
      (R only) Concentrates on engine mechanical evaluation and electronic engine control. First
      half of the class discusses fluid leaks, engine noises, engine vibration, and exhaust
      smoke. Lubrication, induction, and cooling system assessment is also included. Second half
      of the class discusses PCMs, scanners, DTCs, and open- versus closed-loop mode. Sensor
      types, operation, diagnosis, and replacement are covered. Laboratory exercises emphasize
      current service and diagnostic procedures. PRE- or COREQUISITE(S): AUTO 101 and AUTO 161.
      Two hours lecture, three hours laboratory, one hour discussion each week.
    credits: 4
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: AUTO200
    name: "Auto Tech Practicum"
    description: >-
      (R only) A cooperative effort with the automotive industry. Program is jointly developed
      to assure the student's participation is consistent with chosen academic plan and the
      employer's facilities and interests. The practicum enables the student to apply learned
      material in an automotive industrial environment. Periodic meetings monitor work progress
      and skills development. Minimum of 75 hours of work experience. PREREQUISITE(S): 10
      credits or more in AUTO classes and consent of department. Five hours each week.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: AUTO220
    name: "Automatic Transmission/Transaxles"
    description: >-
      (R only) Preparation for ASE A-2 Automatic Transmission/Transaxle technician certification
      exam. Discusses purpose, parts, operation, failure diagnosis, and overhaul of automatic
      transmissions and transaxles. Laboratory exercises emphasize current service and
      diagnostic procedures. PREREQUISITE(S): A grade of C or better in AUTO 101, AUTO 161, and
      AUTO 180. Two hours lecture, six hours laboratory each week.
    credits: 5
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [AUTO101, AUTO161, AUTO180] }
    approved: false
  - id: AUTO262
    name: "Battery/Starting/Charging"
    description: >-
      (R only) Discusses purpose, parts, operation, and failure diagnosis of automotive
      batteries, cranking systems, and charging systems. Cruise control, remote keyless entry,
      theft deterrent, and remote start systems are also covered. Laboratory exercises emphasize
      on-vehicle use of common and specialized electrical service tools. May be taken with AUTO
      263. PREREQUISITE(S): A grade of C or better in AUTO 161. Two hours lecture, two hours
      laboratory each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [AUTO161] }
    approved: false
  - id: AUTO263
    name: "Chassis Circuits"
    description: >-
      (R only) Discusses purpose, parts, operation, and failure diagnosis of interior/exterior
      lighting systems; gauge, warning, and driver information systems; horn, wiper/washer, and
      heated glass circuits; motor-driven accessory circuits and supplementary restraint
      systems. Laboratory exercises emphasize the use of common electrical service tools
      on-vehicle to diagnose failures. May be taken with AUTO 262. PREREQUISITE(S): A grade of C
      or better in AUTO 161. Two hours lecture, three hours laboratory, one hour discussion each
      week.
    credits: 4
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [AUTO161] }
    approved: false
  - id: AUTO264
    name: "Hybrid/Electric Vehicles"
    description: >-
      (R only) Preparation for ASE L-3 Light Duty Hybrid/Electric Vehicle technician
      certification exam. Discusses the purpose, parts, operation and failure diagnosis of
      automotive hybrid electric vehicles. Topics include inspection, maintenance, testing,
      diagnosis and repair of high voltage battery systems, electric motor drive systems, power
      electronics and hybrid supporting systems. Special diagnostic requirements for the hybrid
      "ICE" will be included. Current hybrid platforms will also be discussed. PREREQUISITE(S):
      A grade of C or better in AUTO 262 and AUTO 263. Two hours each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [AUTO262, AUTO263] }
    approved: false
  - id: AUTO270
    name: "Automotive HVAC"
    description: >-
      (R only) Preparation for ASE A-7 Heating and Air Conditioning technician certification
      exam and EPA 609 Refrigerant Handlers license. Discusses purpose, parts, operation, and
      failure diagnosis of heating, ventilation, and air conditioning systems. Manual,
      semiautomatic, and automatic systems are covered. Safe and proper use of refrigerant
      recovery/recycling/recharging machines is emphasized during the service of systems.
      Laboratory exercises concentrate on current service and diagnostic procedures.
      PREREQUISITE(S): A grade of C or better in AUTO 161. Two hours lecture, three hours
      laboratory, one hour discussion each week.
    credits: 4
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [AUTO161] }
    approved: false
  - id: AUTO282
    name: "Engine Performance II"
    description: >-
      (R only) An advanced course covering fuel delivery and ignition systems. Course discusses
      inspection, testing, service, and repair of induction, fuel supply, and exhaust systems.
      Fuel pumps, pressure regulators, gauges, sending units, tanks, lines, and hoses are
      included. Fuel injector design, operation, testing, and replacement is covered.
      Distributor and electronic ignition systems are discussed. Laboratory exercises emphasize
      current service and diagnostic procedures. May be taken with AUTO 283. PREREQUISITE(S): A
      grade of C or better in AUTO 180. Two hours lecture, three hours laboratory, one hour
      discussion each week.
    credits: 4
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [AUTO180] }
    approved: false
  - id: AUTO283
    name: "Engine Performance III"
    description: >-
      (R only) An advanced course focusing on emission controls and driveability. Class
      discusses current OBD formats in detail including interpretation of DTCs, freeze-frame
      data, serial data, and readiness monitors. Exhaust gas analysis is covered. Laboratory
      exercises emphasize current service and diagnostic procedures. May be taken with AUTO 282.
      PREREQUISITE(S): A grade of C or better in AUTO 180. Two hours lecture, three hours
      laboratory, one hour discussion each week.
    credits: 4
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [AUTO180] }
    approved: false
  # --- BEHE ----------------------------------------------------------------
  - id: BEHE100
    name: "Introduction to Behavioral Health"
    description: >-
      A study of the fundamental concepts of behavioral health, including emotional,
      psychological, physical, and social well-being. It includes the ability to cope with
      stressors, establish and maintain healthy relationships, engage in meaningful work, and
      contribute to society. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: BEHE200
    name: "Group Dynamics"
    description: >-
      A study of the fundamental concepts and principles of group dynamics including group
      formation, structure, inclusion, and identity. This course also includes the study of
      processes which occur within a group such as influence, power, conflict and leadership.
      PREREQUISITE(S): PSYC 100. PRE- or COREQUISITE(S): BEHE 100 or consent of department.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PSYC100] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: BEHE201
    name: "Field Experience in Behavioral Health"
    description: >-
      An opportunity for students to demonstrate an understanding of the fundamental concepts
      and skills of behavioral health in a community setting. In addition to the field work,
      students will explore core knowledge and fundamental principles of behavioral health in
      weekly lecture/discussion sessions. This course must be taken in the last semester prior
      to completion of the degree program. PREREQUISITE(S): A grade of C or better in BEHE 100,
      HLTH 225, and PSYC 100. PRE- or COREQUISITE(S): BEHE 200 or consent of department. Two
      hours lecture, nine hours clinical each week. Hours: Class meets 100 minutes per week for
      15 weeks. Additional Hours: Students are expected to complete 9 hours per week at the
      field placement of their choice. Over a 15 week semester, this equals the required 135
      hours.
    credits: 5
    level: college
    tags: [elective, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BEHE100, HLTH225, PSYC100] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  # --- BIOL ----------------------------------------------------------------
  - id: BIOL101
    name: "General Biology"
    description: >-
      (NSLD, GEEL) Designed to satisfy the General Education science requirement, this course
      introduces the basic principles governing living organisms with emphasis on the molecular
      and cellular basis of life. Concepts in genetics, reproduction, development, evolution,
      and ecology are discussed. Not recommended to those students with credit in BIOL 150 or
      BIOL 151. Assessment Level(s): ELAI 990 or ENGL 101/ENGL 011, ELAI 990, MATH 050. Two
      hours lecture, four hours laboratory each week. May not be taken concurrently with MATH
      017 or MATH 020 or MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 4
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "NGSS Biology", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [science]
    exam_equivalent: [AP_BIOLOGY]
  - id: BIOL105
    name: "Environmental Biology"
    description: >-
      (NSND, GEEL, GCP) This course is designed for non-science majors and emphasizes
      environmental problems facing society. Topics include ecological principles, human
      population dynamics, energy sources, land and soil use, air pollution, water pollution,
      and endangered species. BIOL 105 will satisfy the NSND General Education requirement. A
      combination of BIOL 105 and BIOL 106 will satisfy the NSLD General Education requirement.
      Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Three hours each week. May not be taken
      concurrently with MATH 017 or MATH 020 or MATH 045 without appropriate Math assessment
      score.
    credits: 3
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "NGSS Biology OR NGSS Earth/Space Science", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [science]
    exam_equivalent: [AP_ENVIRONMENTAL_SCIENCE]
  - id: BIOL106
    name: "Environmental Biology Laboratory"
    description: >-
      (NSLD, GEEL, GCP) A combination of laboratory investigations and field trips is used to
      introduce students to the scientific method and experimental design, demonstrate basic
      ecological principles, and familiarize students with local resources. A combination of
      BIOL 105 and BIOL 106 must be taken to satisfy the NSLD General Education requirement.
      PRE- or COREQUISITE(S): BIOL 105. Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Course
      may be repeated without the corequisite with consent of department. Three hours laboratory
      each week. May not be taken concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045
      without appropriate Math assessment score.
    credits: 1
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
    exam_equivalent: [AP_ENVIRONMENTAL_SCIENCE]
  - id: BIOL114
    name: "Understanding Viruses"
    description: >-
      Designed for non-science majors, this is an introduction to the foundation of modern
      virology from smallpox to AIDS. The approach will be both historical and experimental,
      emphasizing the discovery of viruses as a biological form, the role of viruses in disease,
      and the impact of viruses in the development of modern cell and molecular biology. Various
      aspects of AIDS as a viral disease will be explored. Assessment Level(s): ENGL 101/ENGL
      011. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: BIOL130
    name: "The Human Body"
    description: >-
      (NSND, GEEL) This course is designed for non-biology majors. Introduces the student to the
      structure and function of human body systems. Topics include basic chemistry, cell
      structure and function, tissues, organ systems (e.g. digestive, circulatory, reproductive
      systems), and associated common disease and illnesses. BIOL 130 will satisfy the NSND
      General Education requirement. A combination of BIOL 130 and BIOL 131 will satisfy the
      NSLD General Education requirement. Assessment Level(s): ENGL 101/ENGL 011, MATH 050.
      Three hours each week. May not be taken concurrently with MATH 017 or MATH 020 or MATH 030
      or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: BIOL131
    name: "The Human Body Laboratory"
    description: >-
      (NSLD, GEEL) This course is designed for non-biology majors. Laboratory work that
      illustrates and reinforces the concepts discussed in BIOL 130. A combination of BIOL 130
      and BIOL 131 must be taken to satisfy the NSLD General Education requirement. PRE- or
      COREQUISITE(S): BIOL 130. Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Three hours
      laboratory each week. May not be taken concurrently with MATH 017 or MATH 020 or MATH 045
      without appropriate Math assessment score.
    credits: 1
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: BIOL136
    name: "Introduction to the Biology of Human Reproduction"
    description: >-
      This course introduces anatomical, hormonal, and neurological aspects of human
      reproductive biology. Topics include basic male/female anatomy, reproductive
      endocrinology, sexual differentiation, fertilization and early fetal development,
      pregnancy, labor and birth, and factors influencing fertility. Assessment Level(s): ENGL
      101/ENGL 011, MATH 050. Three hours each week. May not be taken concurrently with MATH 017
      or MATH 020 or MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: BIOL150
    name: "Principles of Biology I"
    description: >-
      (NSLD, GEEL) First in a two-semester sequence intended for natural science majors. This
      course covers the molecular and cellular basis of life, enzymes, energy transformation
      processes, genetics, and gene expression, with a particular emphasis on applying
      quantitative skills to interpret biological processes. PREREQUISITE(S): MATH 117 or
      higher, OR PRE- OR COREQUISITE: MATH 150 or MATH 165 or higher. Assessment Level(s): ENGL
      101/ENGL 011. Three hours lecture, three hours laboratory each week. Students should
      consult with a program advisor about the MATH options: MATH 117 or higher is the
      pre-requisite for Nursing and Health Sciences students, and MATH 150 or MATH 165 or higher
      is the pre- or co-requisite for Business or Biological Science majors.
