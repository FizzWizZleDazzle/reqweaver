      (HUMD, GEIR, GEEL, GCP) A continuation of ITAL 101. Students continue their study of
      written language, conversation, and composition as they consider cultural themes, language
      functions, and authentic situations. In-class work is supplemented by 20 hours of online
      homework. PREREQUISITE(S): ITAL 101 or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
