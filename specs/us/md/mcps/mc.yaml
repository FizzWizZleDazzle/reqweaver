    description: >-
      Fundamental computer concepts. Studies methods of object-oriented program development and
      design. The course also covers language systems and semantics, structured program
      verification, different language paradigms, and documentation techniques. Students use a
      structured, high-level object-oriented programming language and learn to use both
      text-oriented and Windows-based user interfaces. Designing and implementing solutions to
      intermediate-level programming assignments are an integral part of the course.
      PREREQUISITE(S): A grade of C or better in CMSC 140 or consent of department. PRE- or
      COREQUISITE(S): MATH 181. Four hours each week.
