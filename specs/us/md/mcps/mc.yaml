    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[TECH272]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: TECH277
    name: "Advanced JavaScript"
    description: >-
      Continues with JavaScript features introduced in TECH 276, emphasizing web development
      utilizing open source libraries. In this advanced course, students will learn how to build
      highly interactive web interfaces and applications, known as Rich Internet Applications
