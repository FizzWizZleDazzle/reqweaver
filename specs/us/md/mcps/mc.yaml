    name: "Movement for the Performer"
    description: >-
      (R only) The introduction of self-use techniques as applied to the development of a
      theatrical character. These techniques include discussion and application of relaxation,
      Alexander, LeCoq, and Laban theory. Improvisation technique is also explored and
      practiced. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5127, CE Adv Theater" }
    grad_tags: [elective]
  - id: THET208
    name: "Drafting/Painting for the Performing Arts"
    description: >-
      (R only) Study of the graphic processes utilized by the scene designer in transferring
      concepts and ideas to the stage. The students develop basic skills in theatrical drafting
      and scene painting techniques through their work on assigned projects. PREREQUISITE(S):
      THET 114 or consent of department. Three hours lecture, two hours practical laboratory
      each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[THET114]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5127, CE Adv Theater" }
    grad_tags: [elective]
  - id: THET216
    name: "Stage Lighting for the Performing Arts"
    description: >-
      (R only) An exploration of the theory of and theatrical practice in the use of basic
      elements of electricity, lighting equipment and design in the production of theatre,
      television, and dance. Students will be involved in the exploration of the theory and
      practice of basic fundamentals of lighting techniques, electricity, equipment and
      standards, and the use of light in the production of theatre, dance, and television.
      Students will be required to work additional hours on lighting for productions. Assessment
      Level(s): ENGL 101/ENGL 011, MATH 050. Three hours each week. May not be taken
      concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without appropriate Math
      assessment score.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5127, CE Adv Theater" }
    grad_tags: [elective]
  - id: THET225
    name: "Acting for Film and Television"
    description: >-
      (TP/SS only) An approach to the art and craft of performance before a camera in both the
      motion picture and television studio. The student begins work with narrative film and TV
      materials that require artistic and technical involvement peculiar to film and electronic
      entertainment media. A small film fee may be required. Assessment Level(s): ENGL 101/ENGL
      011. Two hours lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5127, CE Adv Theater" }
    grad_tags: [elective]
  - id: THET230
    name: "Costuming Crafts for the Performing Arts"
    description: >-
      (R only) An introduction to sewing techniques, patterning, fabrics, and costume shop
      equipment, with a survey of costume crafts and shop organization. Students will
      participate in costuming for productions. Assessment Level(s): ENGL 101/ENGL 011, MATH
      050. Three hours each week. May not be taken concurrently with MATH 017 or MATH 020 or
      MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5127, CE Adv Theater" }
    grad_tags: [elective]
  - id: THET237
    name: "Fundamentals of Play Directing"
    description: >-
      (R only) An introduction to the basic techniques, principles, and disciplines of directing
      for the theatre. The director's role, composition, script analysis, movement and rhythm,
      production preparation and procedures will be covered. At the conclusion of the course,
      the student will prepare a one-half hour production for performance. Additional time
