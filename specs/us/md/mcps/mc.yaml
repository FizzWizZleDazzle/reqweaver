    name: "The Bible as Literature"
    description: >-
      A survey of major books of the Hebrew and Christian Scriptures considered from literary
      and historical points of view. Major attention is devoted to themes, symbols, and
      archetypes that have influenced subsequent literature. Students read, analyze, and respond
      critically to texts in class discussions, examinations, and essays. PREREQUISITE(S): A
