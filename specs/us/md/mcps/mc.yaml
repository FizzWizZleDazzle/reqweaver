    approved: false
  # --- EMGT ----------------------------------------------------------------
  - id: EMGT101
    name: "Principles of Emergency Management"
    description: >-
      This course introduces students to the field of emergency management. Emphasis is on the
      role, duties, and importance of the Emergency Manager and how various emergency management
      services (fire personnel, police, security, healthcare providers, etc.) work together in a
      system of resources and capabilities. It includes the role of national, regional, and
      local services in a variety of disasters. Assessment Level(s): ENGL 101/ENGL 011. Three
      hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: EMGT103
    name: "Emergency Response and Recovery"
    description: >-
      Examines the necessary components required for incident response and recovery. The course
      will emphasize the role of human services organizations in providing assistance to people
      and communities affected by disasters in the immediate aftermath and for long-term
      recovery, as well as the roles and responsibilities of local, state, and federal officials
      and public service, private sector, and voluntary organizations. PREREQUISITE(S): EMGT 101
      or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[EMGT101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: EMGT104
    name: "Incident Management System and EOC Interface"
    description: >-
      Overview of incident command, its role in emergency management, and how incident command
      and the emergency operations center interface to manage an emergency situation. Includes
      organization and staffing, organizing for incidents and events, incident resource
      management, air operations, and incident planning. PREREQUISITE(S): EMGT 101 or consent of
      department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[EMGT101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: EMGT105
    name: "Hazard Mitigation and Preparedness"
    description: >-
      Introduces the major principles involved in preparing for and mitigating the impacts of
      hazards in the context of emergency management. Examines the role of the federal, state,
      and local governments in developing and carrying out hazard mitigation and preparedness
      policies, as well as the role that the private sector can play in protecting economic
      vitality. Characteristics of various hazards, both natural and man-made, that can affect
      our communities are investigated. PREREQUISITE(S): EMGT 101 or consent of department.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[EMGT101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: EMGT106
    name: "Technology in Emergency Management"
    description: >-
      Provides an introduction and overview of the application of technology in emergency
      management. Students learn how to utilize technology in the support of emergency
      preparedness, response, recovery, and mitigation efforts and the key elements that must be
      in place for technology to enhance the emergency management process. PREREQUISITE(S): EMGT
      101 or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[EMGT101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: EMGT200
    name: "Emergency Planning"
    description: >-
      Introduces students to the process and practice of emergency planning. Examines the
      concepts of writing an emergency operating plan and the elements necessary for inclusion
      in the plan (all-risk hazard planning). PREREQUISITE(S): EMGT 101. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [EMGT101] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: EMGT206
    name: "Public Health Preparedness"
    description: >-
      Provides an overview of the foundations of public health preparedness and response. Course
      content includes emergencies such as natural disasters, infectious disease and terrorism;
      topics such as working with vulnerable populations and mental health in disasters, as well
      as the role of public health in local planning and response to natural, accidental and
      intentional emergency events. Course replaces EMGT 205; Students cannot receive credit for
      both EMGT 205 and EMGT 206. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: EMGT210
    name: "Health Care Emergency Management"
    description: >-
      Provides students with fundamental knowledge of healthcare emergency management. This
      course is designed for personnel who are responsible for development, implementation, and
      administration of emergency management plans for hospitals, clinics, community health
      centers, and other healthcare organizations. Course provides an overview of
      healthcare-oriented emergency management planning processes. Topics include standards and
      regulations, hazard vulnerability assessments, emergency operations plans, communication
      strategies, managing resources and assets, staff roles and responsibilities, and managing
      patients during an emergency. PREREQUISITE(S): EMGT 101 or consent of department. Three
      hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[EMGT101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: EMGT230
    name: "Community Emergency Response Teams"
    description: >-
      Trains students to be better prepared to respond to emergency situations in their
      communities. This course provides the students with the skills required by the Federal
      Emergency Management Agency (FEMA) to serve as a Community Emergency Response Team (CERT)
      member within their community. Topics covered include: disaster preparedness, fire safety,
      medical operations, search and rescue, organization, communications, operations, personal
      readiness and equipment and terrorism recognition. Assessment Level(s): ENGL 101/ENGL 011,
      or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: EMGT240
    name: "Capstone Emergency Management"
    description: >-
      Capstone course that provides an introduction to leadership and organizational theory in
      the context of emergency management. Students will also complete an internship or project
      related to Emergency Management. PREREQUISITE(S): EMGT 101 and consent of department.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [EMGT101] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  # --- ENEE ----------------------------------------------------------------
  - id: ENEE140
    name: "Introduction to Programming Concepts for Engineers"
    description: >-
      Principles of software development, high-level languages, input/output, data types and
      variables, operators and expressions, program selection, repetition, functions, arrays,
      strings, introduction to algorithms, software projects, debugging, and documentation.
      Programs will use the C language. PREREQUISITE(S): MATH 165. Assessment Level(s): ENGL
      101/ENGL 011. Two hours lecture, one hour laboratory each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [MATH165] }
    approved: false
  - id: ENEE150
    name: "Intermediate Programming Concepts for Engineers"
    description: >-
      Intermediate principles of software development: high-level languages, object-oriented
      design, documentation, data structures, graphs, dynamic memory allocation, software
      development for applications in electrical and computer engineering, and software
      development in teams. Programs will use the C and Java languages. PREREQUISITE(S): A grade
      of C or better in ENEE 140 or consent of instructor and MATH 181. Three hours lecture, one
      hour laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [MATH181], any_of: [[ENEE140]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ENR5110, CE Adv Engineering" }
    grad_tags: [elective]
  - id: ENEE207
    name: "Electric Circuits"
    description: >-
      Design, analysis, simulation, construction, and evaluation of electric circuits. Covers
      basic concepts of electrical engineering such as terminal relationships; applications of
      Kirchhoff's laws to simple resistive circuits; solution of resistor networks using mesh
      and node analysis and Thevenin and Norton's theorems; transient analysis of first and
      second-order circuits; DC and AC steady state analysis; frequency response and transfer
      functions; ideal op-amp circuits and diode and transistor circuits. PREREQUISITE(S): PHYS
      262. PRE- or COREQUISITE(S): ENEE 290 or MATH 282. Three hours lecture, two hour
      laboratory each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHYS262] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ENR5110, CE Adv Engineering" }
    grad_tags: [elective]
  - id: ENEE222
    name: "Elements of Discrete Signal Analysis"
    description: >-
      Introduction to discrete-time and continuous-time signals. Topics covered include
      sampling, linear transformations, discrete Fourier Transform and its
      properties/applications, Fourier Series, and discrete-time linear filters and their
      applications. Example problems in the context of electrical engineering applications are
      solved using a variety of software tools, including structured programming and high-level
      computational packages such as Matlab. PREREQUISITE(S): ENEE 140 or CMSC 140 or CMSC 203,
      and ENEE 290. Three hours lecture, two hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ENEE290], any_of: [[ENEE140, CMSC140, CMSC203]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ENR5110, CE Adv Engineering" }
    grad_tags: [elective]
  - id: ENEE244
    name: "Digital Logic Design"
    description: >-
      (G and R only) This course is designed to introduce sophomores in electrical engineering
      to basic principles and design procedures of digital systems at the gate and chip levels.
      PREREQUISITE(S): ENES 100 or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ENES100]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ENR5110, CE Adv Engineering" }
    grad_tags: [elective]
  - id: ENEE245
    name: "Digital Circuits and Systems Laboratory"
    description: >-
      Introduction to basic measurement techniques and electrical laboratory equipment such as
      design, construction, and characterization of digital circuits containing logic gates,
      sequential elements, oscillators, and digital integrated circuits; introduction to digital
      design and simulation with the Verilog Hardware Description Language (HDL).
      PREREQUISITE(S): ENEE 244, PHYS 262. PRE- or COREQUISITE(S): ENEE 150 or CMSC 204. One
      hour lecture, three hour laboratory each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ENEE244, PHYS262] }
    approved: false
  - id: ENEE269
    name: "Electrical and Computer Engineering Internship/Practicum"
    description: >-
      Earn college credit in a professional environment related to their particular path in the
      electrical engineering or computer engineering program. The intent is to give students an
      appropriate practical experience that will expand their knowledge and aid them in making
      career decisions. Credit may be earned for work in a professional environment (industry
      internship, academic research) or participation in an intensive experiential
      learning-based workshop or equivalent. A comprehensive record of the work experience is
      kept by the student and discussed in seminar meetings. PREREQUISITE(S): Instructor
      permission. PRE- or COREQUISITE(S): ENEE 244 or 6 semester hours of ENEE, ENES, CMSC,
      MATH, PHYS, or CHEM required by the EE or CE program. Course may be repeated for a total
      of 3 credits. A minimum of five hours of experience per semester hour each week for 15
      weeks. Variable credit: 1-3 semester hours.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: ENEE290
    name: "Introduction to Differential Equations and Linear Algebra for Engineers"
    description: >-
      Introduces basic techniques in ordinary differential equations and linear algebra with
      applications in electrical and computer engineering. Topics covered include: first and
      second-order differential equations; matrices and systems of linear equations; vector
      spaces; eigenvalues and eigenvectors; linear differential equations of higher order; and
      systems of differential equations. The techniques will be reinforced through MATLAB
      projects. PREREQUISITE(S): MATH 182 and PHYS 161, both with a grade of C or better. Three
      hours lecture, two hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [MATH182, PHYS161] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ENR5110, CE Adv Engineering" }
    grad_tags: [elective]
  - id: ENEE299
    name: "Special Topics in Electrical and Computer Engineering"
    description: >-
      Focused on selected topics in Electrical and Computer Engineering, presented as a result
      of technological change, new research emphasis, or community or student interest. Topics
      may extend any of the regular ENEE course offerings. New topics may appear each semester
      in the class schedule. PREREQUISITE(S): Instructor consent. PRE- or COREQUISITE(S): ENEE
      244 or 6 semester hours of ENEE, ENES, CMSC, MATH, PHYS, or CHEM required in EE or CE
      program. Course may be repeated for a total of 3 credits. A minimum of 15 hours of
      instruction for each credit hour. Variable credit: 1-3 semester hours.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  # --- ENES ----------------------------------------------------------------
  - id: ENES100
    name: "Introduction to Engineering Design"
    description: >-
      (NSND, GEEL) Overview and application of the basic tools and techniques of engineering
      design and graphic communications, including CAD, engineering reports, cost analysis, and
      use of software tools. Group projects are assigned. Assessment Level(s): ELAI 990 or ENGL
      101/ENGL 011, MATH 165. Two hours lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [technology, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "Technology Credit", synergy: "TEC5126, CE Adv Technology Credit" }
    grad_tags: [technology]
  - id: ENES102
    name: "Statics"
    description: >-
      Introduction to statics of particles and rigid bodies, equivalent systems of forces and
      moments, and equilibrium of rigid bodies. Topics include distributed forces, analysis of
      trusses, frames and simple machines, friction, centroids, and moment of inertia.
      PREREQUISITE(S): MATH 181 with a grade of C or better. PRE- or COREQUISITE(S): PHYS 161.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [MATH181] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ENR5110, CE Adv Engineering" }
    grad_tags: [elective]
  - id: ENES104
    name: "Introduction to Engineering Professions"
    description: >-
      An introduction to the profession of engineering; guidance in the study of engineering and
      the fields of engineering, ethical responsibilities of engineers, and engineering hands-on
      activities. The course will provide information useful for making decisions in engineering
      fields of study and careers. Ethical and legal aspects of the engineering profession will
      be discussed. Workshops for resume writing, participation in the engineering club, and
      field trips may be required. Assessment Level(s): ENGL 101/ENGL 011, MATH 050. One and
      one-half hours lecture/seminar each week. May not be taken concurrently with MATH 017 or
      MATH 020 or MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: ENES120
    name: "Biology for Engineers"
    description: >-
      Introduction to the functions and interactions of biological systems from a quantitative
      perspective. Topics including concepts in molecular and cellular biology, mechanisms of
      concepts in molecular and cellular biology, mechanisms of thermodynamics, genetics, gene
      expression and regulation. Introduction to the modern biological experimental techniques,
      methods of data analysis and biostatistics. An overview of role of bioengineers. Students
      are strongly recommended to have taken a college-level biology course. PREREQUISITE(S):
      CHEM 132 or CHEM 135 with grade of C or better, and MATH 181 with a grade C or better.
      Three hours lecture/one hour discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [MATH181], any_of: [[CHEM132, CHEM135]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ENR5110, CE Adv Engineering" }
    grad_tags: [elective]
  - id: ENES206
    name: "MATLAB for Engineers"
    description: >-
      Introduction to MATLAB and prepare students for subsequent courses requiring computation
      with MATLAB in engineering. It covers basics of MATLAB including simple commands,
      variables, vector, matrix, plotting, solving equations, differentiation, integration,
      differential equations and fundamentals of programming in the MATLAB environment. Examples
      will be given in the applications of physics and engineering. As examples will be given in
      physics or engineering, students are strongly recommended to have taken a physics course.
      PREREQUISITE(S): MATH 182. One hour lecture, one hour laboratory each week.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [MATH182] }
    approved: false
  - id: ENES220
    name: "Mechanics of Materials"
    description: >-
      Distortion of engineering materials in relation to changes in stress or temperature.
      Geometry of internal strain and external displacement. Elementary applications of beams,
      columns, shafts, tanks, trusses, and connections. PREREQUISITE(S): A grade of C or better
      in ENES 102. PRE- or COREQUISITE(S): A grade C or better in MATH 182. Three hours each
      week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ENES102] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ENR5110, CE Adv Engineering" }
    grad_tags: [elective]
  - id: ENES221
    name: "Dynamics"
    description: >-
      Kinematics of particles, force, mass, and acceleration. Kinetics of particles, work and
      energy, impulse, and momentum. Kinematics of rigid bodies, plane motion of rigid bodies,
      forces and accelerations, energy, and momentum methods. Kinetics of rigid bodies in three
      dimensions. PREREQUISITE(S): A grade of C or better in ENES 102, MATH 182, and PHYS 161.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ENES102, MATH182, PHYS161] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ENR5110, CE Adv Engineering" }
    grad_tags: [elective]
  - id: ENES232
    name: "Thermodynamics"
    description: >-
      A study of the properties, characteristics, and fundamental equations of substances in the
      solid, liquid, and vapor states, as well as the basic laws of work and heat transfer.
      Application of the first and second laws of thermodynamics to the analysis of heat
      engines, refrigeration systems, gas mixtures, and reactions. PREREQUISITE(S): PHYS 161
      with a grade of C or better. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PHYS161] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ENR5110, CE Adv Engineering" }
    grad_tags: [elective]
  - id: ENES240
    name: "Scientific and Engineering Computation"
    description: >-
      Course covers: elementary numerical analysis, roots of equations, systems of linear
      equations (Gaussian elimination, matrix diagonalization and inversion, iterative methods),
      interpolation and curve fitting, numerical integration, differential equations. Example
      problems in the context of engineering applications are solved using a variety of software
      tools, including structured programming and high-level computational packages such as
      Matlab. PREREQUISITE(S): MATH 182 with a grade of C or better. Two hours lecture, two
      hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [MATH182] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ENR5110, CE Adv Engineering" }
    grad_tags: [elective]
  - id: ENES272
    name: "Introduction to Computer Aided Design"
    description: >-
      Fundamentals of CAD, using solid modeling packages (such as, Creo Parametric, SolidWorks,
      and Autodesk Inventor). Two and three dimensional drawing. Dimensioning and
      specifications. Introduction of CAD based analysis tools. Student teams will complete and
      present a design project. PREREQUISITE(S): ENES 100 and ENES 102. Two hours lecture, one
      hour laboratory each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ENES100, ENES102] }
    approved: false
  # --- ENGL ----------------------------------------------------------------
  - id: ENGL011
    name: "Introduction to College Writing Support"
    description: >-
      A corequisite course designed to equip students with the skills needed to be successful in
      ENGL 101. ENGL 011 provides extended guidance and in-class practice with all stages of the
      writing process, with deliberate emphasis on grammar skills and critical reading and
      thinking. Upon successful completion, students will advance to ENGL 102 or ENGL 103
      according to discipline guidelines. PREREQUISITE(S): Placement through assessment testing;
      or completion of IERW 001 with a grade of B or better; or completion of IERW 002 with a
      grade of C or better; or completion of AELW 940/ELAI 990 with a grade of C or better; or
      consent of the department. COREQUISITE(S): ENGL 101. ENGL 101 and ENGL 011 must be taken
      concurrently. Two hours each week. TWO EQUIVALENT CREDIT HOURS. NOT APPLICABLE TO A DEGREE
      OR CERTIFICATE. MAY NOT BE USED TO SATISFY DEGREE REQUIREMENTS. NOT INCLUDED IN GPA
      CALCULATION.
    credits: 2
    level: college
    tags: [english]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[IERW001, IERW002, ELAI990]] }
    approved: false
  - id: ENGL101
    name: "Introduction to College Writing"
    description: >-
      An introduction to college writing. The first of two sequential freshman composition
      courses, this course emphasizes the process of critical thinking, reading, and writing.
      Student writing progresses from a personal to an academic perspective. Students write for
      different audiences and purposes using a variety of rhetorical strategies. Students will
      strengthen grammar skills, including usage, mechanics, and punctuation. Students write in
      response to reading and are introduced to standard documentation procedures. Students are
      required to submit a final portfolio that meets department requirements. PREREQUISITE(S):
      Placement through assessment testing; or concurrent enrollment in ENGL 011; or completion
      of IERW 002 with a grade of A; or completion of AELW 940/ELAI 990 with a grade of C or
      better; or consent of the department. Three hours each week.
    credits: 3
    level: college
    tags: [english]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[IERW002, ELAI990]] }
    approved: true
    hs_credit: { category: "English", synergy: "ENG5111, CE Adv English" }
    grad_tags: [english]
    exam_equivalent: [AP_ENGLISH_LANG]
  - id: ENGL102
    name: "Critical Reading, Writing, and Research"
    description: >-
      (ENGF) Studies in argumentation and research. A second of two sequential freshman
      composition courses, this course is designed to help students learn to identify,
      critically read, analyze and evaluate, and write arguments using logic and appropriate
      rhetorical techniques. Students construct thesis-driven academic essays, synthesizing and
      incorporating the words and ideas of others and using formal documentation. Students learn
      to identify audience as well as employ effective tone, word choice, and sentence patterns.
      PREREQUISITE(S): A grade of C or better in ENGL 101/ENGL 011 or consent of department. To
      comply with Maryland state requirements for English Foundation (ENGF), ENGL 102 must be
      completed with a final grade of C or better for a student to graduate with an associate's
      degree. Three hours each week.
    credits: 3
    level: college
    tags: [english]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ENGL101]] }
    approved: true
    hs_credit: { category: "English", synergy: "ENG5111, CE Adv English" }
    grad_tags: [english]
    exam_equivalent: [AP_ENGLISH_LANG]
  - id: ENGL103
    name: "Critical Reading, Writing, and Research in the Work Place"
    description: >-
      (ENGF) Studies in argumentation and research in the workplace. A second of two sequential
      freshman composition courses, this course is designed to help students understand the
      processes and products associated with writing used in technology and business. Emphasis
      will be on the writing process, including writing to different audiences and supporting
      claims persuasively with appropriate evidence and detail. Students will write a variety of
      reports, documentation, and proposals, employing a range of stylistic options. The course
      will include an introduction to the rules for integrating visual aids into technical
      documents and a major research project focusing on developing an appropriate research
      question, conducting scholarly research, and incorporating information into writing with
      the proper conventions of citation. PREREQUISITE(S): A grade of C or better in ENGL
      101/ENGL 011 or consent of department. To comply with Maryland state requirements for
      English Foundation (ENGF), ENGL 103 must be completed with a final grade of C or better
      for a student to graduate with an associate's degree. Three hours each week.
