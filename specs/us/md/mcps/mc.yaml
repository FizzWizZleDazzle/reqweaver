notes:
  - >-
    This sheet covers Montgomery College, the dual-enrollment college for MCPS high school
    students in grades 11-12. Course data comes from the Montgomery College 2026-2027 catalog
    (catalog.montgomerycollege.edu). Credits are MC semester hours, not Carnegie units.
  - >-
    Courses with approved: true appear on the MCPS approved dual-enrollment course list and
    carry hs_credit recording the MCPS graduation-credit category and the Synergy course code a
    counselor enters. Courses with approved: false are in the MC catalog but not on the approved
    list; they carry subject tags only.
  - >-
    A small number of approved-list courses no longer appear in the MC catalog. Where an earlier
    catalog still describes the course, that description is used. Where no catalog page exists
    at all, the course keeps the name from the approved list and is recorded at 3 credits as a
    placeholder; each such course says so in its description.
  - >-
    Prerequisites are recorded in prereqs as the MC courses the catalog names. Non-course
    alternatives (an assessment or placement score, departmental consent, an equivalent course)
    are not encoded; a student who placed out uses the app's waiver mechanism. A requirement
    that carries such an alternative keeps its named course in an any_of group. Corequisites
    and pre- or corequisites are not encoded; their prose stays in the description. A few
    prerequisites that vary by studio track (ARTT255, ARTT256) are prose only.
  - >-
    Variable-credit courses are recorded at the minimum of their credit range; the description
    states the range.
  - >-
    credit_by_exam lists MC's credit-by-examination awards for AP exams, one entry per exam and
    score tier, from the AP equivalency table published by the Office of Learning Recognition
    and Advancement (updated 6/2025). A higher tier supersedes a lower one. exam_equivalent on a
    course lists the AP exams whose award includes that course.
  - >-
    MUSC141 is offered fall semester only and MUSC142 spring semester only; the catalog states
    no term restriction for any other course.

