  - id: LING200
    name: "Introduction to Linguistics"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A survey of the core areas of linguistic analysis-phonology,
      morphology, syntax, semantics, and pragmatics-and of the major areas of study to which
      linguistic theory can be applied. The latter include psycholinguistics, sociolinguistics,
      first and second language learning, history of languages, writing systems, and language
      universals. PREREQUISITE(S): A grade of C or better in ENGL 101/ENGL 101A or consent of
      department. Three hours each week.
