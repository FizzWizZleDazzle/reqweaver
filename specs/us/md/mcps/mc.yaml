      Designed for students with no prior programming experience, this course introduces
      students to fundamental structures of sequence, selection, and repetition, emphasizes
      solving simple problems using a flowchart. With a high-level language, students code,
      test, and debug short programs. Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Two
      hours each week. May not be taken concurrently with MATH 017 or MATH 020 or MATH 030 or
      MATH 045 without appropriate Math assessment score.
