  - id: IDES262
    name: "Interiors: Professional Experience"
    description: >-
      (R only) Provides work experience and field study on an actual project related to the
      student's curriculum. Each student drafts a comprehensive record of the work experience
      and discusses it with the interior design adviser. Each student submits a descriptive
      paper, documenting the learning outcomes and benefits of the work, as related to the
      career goals and program objectives. Students may receive credit by examination for work
      experience, as demonstrated by examination, portfolio review, resume, and employer
      recommendations. PREREQUISITE(S): Consent of interior design coordinator or department.
      Minimum of 50 hours of work experience required per semester hour. Students may not
      accumulate more than 3 semester hours. Variable credit: 1-3 semester hours.
