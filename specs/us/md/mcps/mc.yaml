    grad_tags: [elective]
  - id: TECH272
    name: "Website Development"
    description: >-
      Provides instruction for creating, uploading, and maintaining professional-quality
      websites containing graphics, style sheets, mulitmedia, and other basic enhancements using
      hand-coded HTML as well as Adobe Dreamweaver's fundamental tools. Topics include website
      development and emerging Internet technologies and trends. PRE- or COREQUISITE(S): Any
