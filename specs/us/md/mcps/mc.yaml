    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[TECH272]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5103, CE Adv Computer Apps" }
    grad_tags: [elective]
  - id: TECH274
    name: "Web Content Management Systems and Strategy"
    description: >-
      An introduction to Content Management Systems (CMS) for the web with a focus on content
      strategy. Course topics include strategy, types of CMS, the use and customization of
      plug-ins and add-ons, as well as building themes and dynamic content for cross-platform
      delivery. Students will learn how to audit content for a website, choose an appropriate
      CMS, and convert a static design into a dynamic CMS-powered site. No programming
      experience is required, although knowledge of a modern web programming language is
      helpful. Knowledge of HTML and CSS is assumed. PREREQUISITE(S): TECH 272 or consent of
      department. Three hours each week.
