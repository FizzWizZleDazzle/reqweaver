  - id: TVRA230
    name: "Video Production II"
    description: >-
      (R only) Advanced theory and practice of video production skills acquired through
      practical applications in challenging studio and field production formats. In addition to
      further developing basic skills of lighting, camera operation, audio design and control
      room functions, students will demonstrate the ability to work effectively in both
      pre-production and production as television producers and effective crew members in a
      professional setting. PREREQUISITE(S): A grade of C or better in TVRA 120 and TVRA 140.
      Two hours lecture, four hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [TVRA120, TVRA140] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5120, CE Adv Media" }
