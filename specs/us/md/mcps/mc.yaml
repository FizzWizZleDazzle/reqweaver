      CALCULATION.
    credits: 2
    level: college
    tags: [math]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: MATH065
    name: "Precalculus Support"
    description: >-
      A corequisite course designed to equip students with the skills needed to be successful in
      MATH 165 by providing support in fundamental mathematics. Topics include exponent rules,
      polynomial and rational operations, polynomial factoring, solving equations and
      inequalities, interval notation, functions, function properties, and various function
      types (including linear, quadratic, rational, exponential, and logarithmic functions),
      function evaluation, graphing technology, an examination of right triangle trigonometry
      and applications, graphs and equations involving sine, cosine, tangent, and related basic
      concepts. PREREQUISITE(S): A grade of C or better in MATH 050, appropriate score on
      mathematics assessment test, or consent of department. COREQUISITE(S): MATH 165.
      Assessment Level(s): ENGL 101/ENGL 011 or ELAI 990. Two hours lecture. TWO EQUIVALENT
