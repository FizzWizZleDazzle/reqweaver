    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: IDES280
    name: "Interiors: Independent Study/Research"
    description: >-
      (R only) Provides independent research and study in an area not listed among the credit
      courses in interior design. Individual students are tutored in specific areas (e.g., study
      of psychological or sociological implications of spatial interpretations); students
      research and record data related to a selected topic of interior design. The course
      culminates in the production of a research paper. Students may repeat this course to
      advance the previous topic or for a different topic. PREREQUISITE(S): Consent of interior
      design coordinator or department. Minimum of 50 hours of work experience required per
      semester hour. Students may not accumulate more than 3 semester hours combined for IDES
      280 and IDES 285. Variable credit: 1-3 semester hours.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: IDES285
    name: "Interiors: Advanced Independent Project"
    description: >-
      (R only) Provides independent research and study in an area not listed among the credit
      courses in interior design. Individual students are tutored in specific areas (e.g., study
      of psychological or sociological implications of spatial interpretations); students
      research and produce a project related to a selected topic of interior design, which
      culminates in the production of a design project or product. Students may repeat this
      course provided that each time it is taken, a different project is produced, for a maximum
      of 3 semester hours. PREREQUISITE(S): Consent of interior design coordinator or
      department. Minimum of 50 hours of work experience required per semester hour. Students
      may not accumulate more than 3 semester hours combined for IDES 280 and IDES 285. Variable
      credit: 1-3 semester hours.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  # --- IERW ----------------------------------------------------------------
  - id: IERW001
    name: "Integrated Reading and Writing I"
    description: >-
      A developmental course for native speakers of English designed to improve reading and
      writing skills. This course integrates the critical reading and writing skills students
      need to comprehend and interact with college-level texts and to produce original
      college-level writing in standard written English. Writing skills start at the sentence
      and paragraph level and culminate in multi-paragraph essays. Upon successful completion,
      students will advance to IERW 002 or ENGL 101 or ENGL 101A according to discipline
      guidelines. PREREQUISITE(S): Placement through assessment testing or consent of the
      department. Six hours each week. SIX EQUIVALENT CREDIT HOURS. NOT APPLICABLE TO A DEGREE
      OR CERTIFICATE. MAY NOT BE USED TO SATISFY DEGREE REQUIREMENTS. NOT INCLUDED IN GPA
      CALCULATION.
    credits: 6
    level: college
    tags: [english]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: IERW002
    name: "Integrated Reading and Writing II"
    description: >-
      A developmental course for native speakers of English designed to improve reading and
      writing skills. This course integrates the critical reading and writing skills students
      need to comprehend and interact with college-level texts and to produce original
