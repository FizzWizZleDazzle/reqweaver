  - id: CMSC216
    name: "Introduction to Computer Systems"
    description: >-
      Conveys the fundamental concepts that enable programs to execute on real hardware. These
      include how the operating system virtualizes the hardware to provide services and
      abstractions to allow a user program to effectively use available resources. The course
      also addresses how different programming constructs work at a low level. The basic
      abstraction of a program running as one or more threads of control in a single flat
      address space (a UNIX process), and emphasizing it as the model for understanding how a
      program works, from both the user program and hardware perspective (with the operating
      system in between), is a theme throughout the course. PREREQUISITE(S): A grade of C or
      better in CMSC 204 and MATH 182. Four hours each week.
