  - id: PHED155
    name: "Self-Defense for Men"
    description: >-
      An introduction to basic self-defense skills. The course includes an exploration of escape
      and avoidance strategies, offensive and defensive postures, defensive techniques, and
      simulated attacks. The course will also examine male violence prevention, managing anger,
      and communication principles in confrontational situations. Finally, fitness principles,
      such as strength, flexibility, and cardiovascular fitness, will be addressed, particularly
      in regard to the impact of personal fitness on one's ability to perform the self-defense
      skills presented in the class. Assessment Level(s): ELAI 990/ELAW 980/ELAR 980. Two hours
      each week.
    credits: 2
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: PHED156
    name: "Self-Defense for Women"
    description: >-
      An introduction to basic self-defense skills. The course includes an exploration of escape
      and avoidance strategies, offensive and defensive postures, defensive techniques, and
      simulated attacks. The course will also examine community services available for both
      violence prevention and victim abuse services. Finally, fitness principles, such as
      strength, flexibility, and cardiovascular fitness, will be addressed, particularly in
      regard to the impact of personal fitness on one's ability to perform the self-defense
