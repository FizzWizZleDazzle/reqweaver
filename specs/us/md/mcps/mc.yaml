  - id: TVRA220
    name: "Radio Production"
    description: >-
      (R only) Study in the techniques of production of radio programs, radio program logs,
      special types of audio productions, and advanced techniques of control room operations.
      The student will be required to demonstrate competencies through a series of laboratory
      exercises and will be required to produce radio programs of specific design.
      PREREQUISITE(S): A grade of C or better in TVRA 125. Three hours lecture, three hours
      laboratory each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [TVRA125] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5120, CE Adv Media" }
    grad_tags: [elective]
  - id: TVRA227
    name: "Broadcast Journalism"
    description: >-
      Further exploration of writing and reporting news and current events material for various
      forms of publication. Designed for practical application in producing audio or video news
      programs for broadcast or web outlets PREREQUISITE(S): A grade of C or better in TVRA 129
      and either TVRA 120 or TVRA 125. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [TVRA129], any_of: [[TVRA120, TVRA125]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5120, CE Adv Media" }
