    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[RADT125]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: RADT225
    name: "Clinical Radiology VI"
    description: >-
      (TP/SS only) Strengthens clinical instruction essential to the mastery of the actual
      practice of radiography. Students attend a variety of assigned clinical affiliates to
      participate in the completion of radiographic exams on actual patients under the
      direct/indirect supervision of a professional radiographer. In this competency-based
      program students are assessed in their compliance with radiation safety and their
      performance of radiographic examinations in the areas of general radiography, fluoroscopy,
      and portable radiography, operating room, pediatrics, and outpatients. Students observe
      advanced modalities, including computed tomography and Interventional Radiography. The
      student must complete 360 hours to successfully complete this course. PREREQUISITE(S):
      RADT 206, RADT 211, RADT 224 or consent of program coordinator. COREQUISITE(S): RADT 207
      and RADT 240. 360 Hours.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [RADT206, RADT211, RADT224] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: RADT240
    name: "Radiologic Technology V"
    description: >-
      (TP/SS only) Professional entry into the diagnostic medical imaging career. Resume writing
      and job interviewing skills, certification examination preparation, test-taking
      strategies, and comprehensive review of content specifications of the certifying exam are
      presented to the student for successful entry into the diagnostic imaging profession as a
      graduate radiographer. PREREQUISITE(S): RADT 206 and RADT 224. COREQUISITE(S): RADT 207
      and RADT 225, or consent of program coordinator. Two hours each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [RADT206, RADT224] }
    approved: false
  # --- READ ----------------------------------------------------------------
  - id: READ238
    name: "Literacy in the Content Area Part I"
    description: >-
      Designed for current and prospective secondary educators, covers the essentials of the
      reading processes necessary for secondary students to become proficient readers. Students
      will investigate five areas: types of reading, assessment, reading skills, reading
      instruction, and motivation for reading. This course meets the Maryland State Department
      of Education's reading requirement for secondary educators. PREREQUISITE(S): Successful
      completion of one year of college-level English, or consent of department.
    credits: 3
    level: college
    tags: [elective, english]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: READ239
    name: "Literacy in the Content Area Part II"
    description: >-
      Designed for current and prospective secondary educators, focuses on teaching secondary
      students to learn from text. Students will apply theories, strategies, and practices in
      classroom lessons. The course introduces three areas: types of reading, reading skills,
      and instruction that integrates content with reading goals. This course meets the Maryland
      State Department of Education's reading requirement for secondary educators.
      PREREQUISITE(S): READ 238 or consent of department.
