  - id: IDES244
    name: "Bath Design"
    description: >-
      (R only) The design of baths using National Kitchen and Bath Association (NKBA) guidelines
      and graphic standards. Mechanical, electrical, and plumbing requirements are analyzed and
      incorporated into design. Students must demonstrate drafting skills and knowledge of space
      planning and design or meet prerequisites. PREREQUISITE(S): IDES 101 and IDES 110 or
      consent of interior design coordinator. One hour lecture, one hour laboratory each week.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [IDES101, IDES110] }
    approved: false
  - id: IDES245
    name: "Kitchen and Bath Appliances and Equipment"
    description: >-
      (R only) An introduction to the selection, specification, and installation of appliances
      and equipment used in residential and commercial kitchens and baths. Hands-on
      demonstrations of appliances and equipment will be provided by representatives, vendors,
      and contract specialists. PREREQUISITE(S): IDES 101 or IDES 110 or consent of interior
      design adviser. Assessment Level(s): ELAR 980/IERW 002. Field trip(s) required. One hour
      lecture/discussion; one hour laboratory each week.
