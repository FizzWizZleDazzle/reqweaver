  - id: TVRA239
    name: "Broadcast Management"
    description: >-
      The combined study of television and radio broadcast management in the areas of station
      structure, personnel, promotion, programming, sales, engineering and legal requirements,
      audiences and fiscal structures, as well as personnel functions and responsibilities.
      Basic management skills are included to prepare students for a career in the broadcasting
      and mass media production industry. PREREQUISITE(S): A grade of C or better in either TVRA
      120 or TVRA 125. Three hours each week.
