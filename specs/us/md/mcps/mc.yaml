      and recursion; data abstraction, encapsulation, and structure implementation;
      object-oriented program design; specification, implementation and application of these
      traditional ADTs. The course also emphasizes dynamic memory allocation, search and sorting
      algorithms, and introduces algorithm complexity. Designing and implementing advanced-level
