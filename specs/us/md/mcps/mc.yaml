    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ARTT102, ARTT103] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT222
    name: "Sculpture II"
    description: >-
      A continuation of ARTT 221 for students who have successfully completed that course.
      Emphasis on individual experimentation and expression. In addition to direct methods,
      casting methods are used. PREREQUISITE(S): ARTT 221 or consent of department. Two hours
      lecture, four hours studio each week.
