      language and culture. Students begin to develop the ability to communicate in Chinese
      through the consideration of cultural themes, language functions, and authentic situations
      as they acquire the structures and lexicon to work with written language, conversation,
      and composition. No prior knowledge of Chinese is required. In-class work is supplemented
      by 20 hours of online homework. Five hours each week.
