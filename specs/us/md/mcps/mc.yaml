    name: "The Short Story"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A study of the short story in world literature with emphasis on
      the literary form. Students will examine the basic elements of fiction as they appear in
      short stories. Concentration will be on the literary analysis of short stories from a
      variety of critical perspectives. PREREQUISITE(S): A grade of C or better in ENGL 101 or
      ENGL 101A or consent of department. Three hours lecture/discussion each week.
