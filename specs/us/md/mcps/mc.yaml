  # --- RADT ----------------------------------------------------------------
  - id: RADT101
    name: "Radiologic Technology I"
    description: >-
      (TP/SS only) An introductory course to the science of medical radiographic exposure
      techniques. A correlated laboratory will aid the student in synthesizing the material
      presented in class. Topics include X-ray formation from its discovery to present day,
      X-ray interaction with matter, radiation protection, and digital imaging acquisition.
      Mathematical formulas to calculate technical exposure and occupational exposures are
      presented. In addition, basic atomic structure and fundamental physics will be presented
      as a foundational support to objectives of this course. PREREQUISITE(S): RADT 119 or
      consent of program coordinator. PRE- or COREQUISITE(S): Mathematics foundation.
      COREQUISITE(S): RADT 111 and RADT 120. Assessment Level(s): ENGL 101/ENGL 011. Three hours
      lecture, two hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[RADT119]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: RADT102
    name: "Radiologic Technology II"
    description: >-
      (TP/SS only) A continuation of RADT 101 with more complex imaging theories. Course
      objectives include image quality, conventional and digital fluoroscopy, X-ray machinery
      circuitry and design, pre and post processing image acquisition through digital capture,
      equipment quality control, and federally regulated radiation safety room design for
      radiation protection. Mathematical formulas for basic circuitry problems, greater density
      problems, and magnification calculations are presented. Basic concepts of MRI and CT are
      introduced with more complex theories to further the knowledge of the student. Artificial
      Intelligence as it pertains to imaging will be discussed. A correlated laboratory will aid
      the student in synthesizing the material presented in class. PREREQUISITE(S): A grade of C
      or better in mathematics foundation and RADT 101, or consent of program coordinator.
      COREQUISITE(S): RADT 112 and RADT 124. Three hours lecture, two hours laboratory each
      week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[RADT101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: RADT111
    name: "Radiographic Positioning I"
    description: >-
      (TP/SS only) Covers knowledge and skills necessary to position quality radiographs.
      Students relate theoretical concepts to actual hands on laboratory demonstration for the
      respiratory system, abdomen, and upper and lower extremities. Students demonstrate
      appropriate positioning, technical, radiation safety, and communication principles.
      Supplemental radiographic positioning skills and adjustments necessary to compensate for
      patient and pathological limitations are introduced. PREREQUISITE(S): RADT 119 or consent
      of program coordinator. COREQUISITE(S): RADT 101 and RADT 120. Two hours lecture, two
      hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[RADT119]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: RADT112
    name: "Radiographic Positioning II"
    description: >-
      (TP/SS only) Covers knowledge and skills necessary to position quality radiographs.
      Students relate theoretical concepts to actual hands-on laboratory demonstration for the
      femur, pelvis, complete spine, and contrast studies of the urinary and digestive tracts.
      Students demonstrate appropriate positioning, technical, radiation safety, and
      communication principles. The essentials of contrast media, contrast reactions and
      venipuncture are studied, and skills specific to these objectives are performed in a
      simulated environment. Supplemental radiographic positioning skills and adjustments
      necessary to compensate for patient and pathological limitations are introduced.
      PREREQUISITE(S): RADT 101, RADT 111, RADT 120, or consent of program coordinator.
      COREQUISITE(S): RADT 102 and RADT 124. One hour lecture, three hours laboratory each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [RADT101, RADT111, RADT120] }
    approved: false
  - id: RADT119
    name: "Clinical Radiology I"
    description: >-
      (TP/SS only) Provides the radiology student with the critical instruction essential to the
      actual practice of radiography. As an introduction to the medical profession, this course
      explores radiology's role in health care. Patient care, vital signs, sterile and aseptic
      technique, transportation and transfer skills, radiation protection concepts, legal and
      ethical responsibilities, and critical thinking skills appropriate for the radiology
      department are covered. Interpersonal, communication, customer service and diversity
      skills necessary to interact with patients, peers, and other professionals are addressed.
      General anatomy, terminology and positioning principles related to the chest are covered.
      Concepts of surgical radiography are introduced. PREREQUISITE(S): Admission into the
      program or consent of program coordinator. Assessment Level(s): ENGL 101/ENGL 011, MATH
      117 or higher. Two hours lecture, two hours laboratory each week. May not be taken
      concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without appropriate Math
      assessment score.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: RADT120
    name: "Clinical Radiology II"
    description: >-
      (TP/SS only) Provides the inexperienced first year radiologic technology student with the
      introductory clinical instruction essential to the actual practice of radiography.
      Students attend an assigned clinical affiliate to observe and participate in the
      completion of radiographic exams on actual patients under the direct/indirect supervision
      of a professional radiographer. In this competency-based program, students are assessed in
      their compliance with radiation safety and their performance of radiographic examinations
      in the areas of general radiography, fluoroscopy, and portable radiography. Specialized
      rotations introduce students to the surgical suite (operating room). The student must
      complete 240 clinical hours to successfully complete this course. PREREQUISITE(S): RADT
      119 or consent of program coordinator. COREQUISITE(S): RADT 101 and RADT 111. 240 Hours.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[RADT119]] }
    approved: false
  - id: RADT124
    name: "Clinical Radiology III"
    description: >-
      (TP/SS only) Continues clinical instruction essential to the applied practice of
      radiography. Students attend an assigned clinical affiliate to observe and participate in
      the completion of radiographic exams on actual patients under the direct/indirect
      supervision of a professional radiographer. In this competency-based program students are
      assessed in their compliance with radiation safety and their performance of radiographic
      examinations in the areas of general radiography, fluoroscopy, portable radiography, and
      the surgical suite. The student must complete 240 hours to successfully complete this
      course. PREREQUISITE(S): RADT 101, RADT 111, RADT 120 or consent of program coordinator.
      COREQUISITE(S): RADT 102 and RADT 112. 240 Hours.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [RADT101, RADT111, RADT120] }
    approved: false
  - id: RADT125
    name: "Clinical Radiology IV"
    description: >-
      (TP/SS only) Continues clinical instruction essential to the applied practice of
      radiography. Students are assigned to a new clinical affiliate to observe and participate
      in the completion of radiographic exams on actual patients under the direct/indirect
      supervision of a professional radiographer. In this competency-based program students are
      assessed in their compliance with radiation safety and their performance of radiographic
      examinations in the areas of general radiography, fluoroscopy, and portable radiography.
      Specialized rotations offer the student an opportunity to develop competence in the areas
      of the operating room and pediatrics. The student must complete 360 hours to successfully
      complete this course. PREREQUISITE(S): RADT 102, RADT 112, RADT 124 or consent of program
      coordinator. 360 Hours.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [RADT102, RADT112, RADT124] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: RADT200
    name: "Independent Study in Radiologic Technology"
    description: >-
      (TP/SS only) Provides an opportunity to conduct research in cutting edge Radiologic
      Technology procedures, professional advancements, and/or case studies. Students will be
      assigned to Radiologic Technology Faculty for guidance and supervision. For those students
      where intensive review to prepare for the National Registry is required, students will be
      assigned to Radiologic Technology Faculty for guidance and supervision. Letter designators
      in the schedule of classes will distinguish the 1, 2, 3, and 4-credit versions of RADT
      200. COREQUISITE(S): Current enrollment in the Radiography program or consent of program
      coordinator. Minimum 45 hours of work for each credit hour. Variable credit: 1-4 semester
      hours.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: RADT206
    name: "Radiologic Technology III"
    description: >-
      (TP/SS only) Introduction to radiobiology and pathology. The effect of radiation on human
      biology, the history of human and experimental exposures to radiation and the calculations
      of effects of radiation are presented. Review of Radiation Safety Practices are reviewed
      as part of the objectives in radiobiology. Radiation therapy as it relates to radiobiology
      is introduced. Quality assurance and quality control are reviewed. Identification of
      pathologies impacting the body systems and commonly diagnosed via routine radiography are
      discussed. Students participate in completing simulated Mock registries exam.
      PREREQUISITE(S): RADT 102 or consent of program coordinator. COREQUISITE(S): RADT 211 and
      RADT 224. Two hours each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[RADT102]] }
    approved: false
  - id: RADT207
    name: "Radiologic Technology IV"
    description: >-
      (TP/SS only) Advanced radiographic modalities, procedures and equipment. Advanced contrast
      studies including angiography, interventional studies, arthrography, myelography,
      genitourinary system studies, and biliary system studies are covered. Identification of
      pathologies commonly diagnosed by various imaging modalities (computed tomography, MRI,
      mammography, sonography, nuclear medicine, PET CT, DEXA) is presented. Instruction in
      cross sectional anatomy and the components of computed tomography imaging are presented.
      Basic pharmacology concepts as required by ASRT are discussed. Review of the anatomical
      structures of the major body systems is included. Review of medicolegal considerations for
      imaging. PREREQUISITE(S): RADT 206 or consent of program coordinator. COREQUISITE(S): RADT
      225 and RADT 240. Two hours each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[RADT206]] }
    approved: false
  - id: RADT211
    name: "Radiographic Positioning III"
    description: >-
      (TP/SS only) Covers knowledge and skills necessary to produce quality radiographs.
      Students relate theoretical concepts to actual laboratory demonstration for the bony
      thorax, skull and facial bones. Students continue to develop and demonstrate appropriate
      positioning, technical and communication principles. Supplemental radiographic views and
      adjustments necessary to compensate for patient and pathological limitations are
      discussed. PREREQUISITE(S): RADT 112 or consent of program coordinator. COREQUISITE(S):
      RADT 206 and RADT 224. One hour lecture, two hours laboratory each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[RADT112]] }
    approved: false
  - id: RADT224
    name: "Clinical Radiology V"
    description: >-
      (TP/SS only) Continues clinical instruction essential to the mastery of actual practice of
      radiography. Students observe and participate in the completion of more complex
      radiographic exams on actual patients under the direct/indirect supervision of a
      professional radiographer. In this competency-based program students are assessed in their
      compliance with radiation safety and their performance of radiographic examinations in the
      areas of general radiography, fluoroscopy, and portable radiography. Specialized rotations
      offer the student an opportunity to develop competency in the areas of the operating room
      and pediatrics. Students participate in trauma workshop to support advanced training in
      trauma radiography. Students must complete 360 hours to successfully complete this course.
      PREREQUISITE(S): RADT 125 or consent of program coordinator. COREQUISITE(S): RADT 206 and
      RADT 211. 360 Hours.
