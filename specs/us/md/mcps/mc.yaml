      multiple integrals; classical theorems of Green, Gauss, and Stokes. PREREQUISITE(S): A
      grade of C or better in MATH 182 or equivalent, or consent of department. Four hours
      lecture each week.
    credits: 4
    level: college
    tags: [math]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[MATH182]] }
    approved: true
