    grad_tags: [elective]
  - id: ARTT268
    name: "History of Photography"
    description: >-
      Explores the global history of photography as an artform and 'way of seeing' from the 19th
      century to the present. Students will develop visual and media literacy skills through
      understanding the art and science of photography as a creative process and the history of
      photography as a mode of visual communication. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours lecture each week.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: ARTT270
    name: "African Art"
    description: >-
      (ARTD, GEIR, GEEL, GCP) A survey of visual art, media, and culture created in Africa and
      the African Diaspora from the earliest art to the present with an emphasis on learning to
      look at African art and architecture in its historical, social, and cultural contexts.
      Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
