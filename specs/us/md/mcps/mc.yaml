  - id: ARTT228
    name: "Lithography and Relief Printmaking"
    description: >-
      Materials and techniques of fine art lithography will be investigated, with an emphasis on
      the expression of one's ideas through appropriate technical manipulations. In addition,
      students may explore various relief printmaking procedures to produce woodcuts, linocuts,
