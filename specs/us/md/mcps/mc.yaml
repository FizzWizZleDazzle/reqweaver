    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: GEOG130
    name: "Global Geography"
    description: >-
      (BSSD, GEEL, GCP) Examination for the general student of global regions, patterns, trends,
      and geographic relationships which together form a basis for comprehending the mosaic of
      world affairs. An introduction to geographic facts and development of skills needed to
      appraise critical topics and issues normally covered in college-level disciplines.
      Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Three hours each week. May not be taken
      concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without appropriate Math
      assessment score.
