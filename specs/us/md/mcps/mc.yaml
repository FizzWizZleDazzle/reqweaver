    name: "Web Application Development Using ColdFusion"
    description: >-
      A hands-on introduction to Web database applications using ColdFusion. Topics include
      creating a simple database, connecting a server-side database to a Web page viewing,
      sorting, updating, and searching a database through the client-side interface, creating
      and customizing reusable code, integrating an e-mail facility, and maintaining site
      security through user logins and limiting site access. PREREQUISITE(S): TECH 272 or
      consent of department. Four hours lecture/discussion each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[TECH272]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
