  # --- LGST ----------------------------------------------------------------
  - id: LGST101
    name: "Introduction to the Legal System"
    description: >-
      An overview of the U.S. legal system with an additional focus on the role of the paralegal
      professional within that system. Specific topics studied include the operation and
      structures of federal and state criminal and civil law systems; federal and state court
      organization; career opportunities for the paralegal professional in various sectors of
      the U.S. legal system; basic ethical considerations in the practice of law; legal research
      and writing skills; trial preparation activities and interviewing techniques; and
      introduction to specific areas of law such as real property law, tort law, contract law,
      environmental law, criminal law/procedure etc. PRE- or COREQUISITE(S): ENGL 101 and POLI
      101. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST102
    name: "Legal Research"
    description: >-
      Focuses on the importance of legal research as a valuable skill set for the paralegal
      professional. This introductory course will explore the elements of an organized approach
      to legal research, including traditional and electronic sources of research and commonly
      used research tools to include online research and use of secondary sources to include
      treatises, annotations, and legislative histories. PREREQUISITE(S): LGST 101. Three hours
      lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [LGST101] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST103
    name: "Legal Writing"
    description: >-
      Focuses on the language, format, and content of legal writings. This introductory legal
      writing course will emphasize the techniques of legal composition and the required
      application of key facts, relevant law, and citation of sources, among others, in various
      forms of legal writings such as memoranda, letters, and legal instruments.
      PREREQUISITE(S): LGST 101. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [LGST101] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST104
    name: "Interviewing, Investigating, and Communication Techniques"
    description: >-
      Introduction to the factors underlying effective communications and investigation within
      the legal environment. Techniques in interviewing, listening, and investigating will be
      presented and discussed. Students will have an opportunity to prepare for and to conduct
      interviews and draft investigation plans. PRE- or COREQUISITE(S): LGST 101. Three hours
      lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST106
    name: "Legal Ethics"
    description: >-
      An exploration of fundamentals in ethics as applied to individuals in public and private
      settings affecting both personal and public policy judgments and decisions. In addition to
      the ABA Model Rules of Professional Conduct, this course will focus on the Maryland
      Attorneys' Rules of Professional Conduct. PREREQUISITE(S): LGST 101. Three hours each
      week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [LGST101] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST122
    name: "Law Office Administration"
    description: >-
      A study of the principles of law office administration including organizational
      structures, law office personnel, systems approach, equipment, timekeeping, bookkeeping
      and accounting practices, indexing and filing, calendar and monitoring systems, library
      and retrieval systems, the office manual, and the law office layout. Students will
      complete practical problems in several areas. Major emphasis will be on the development
      and use of systems in the law office, including software, with the expectation of
      increasing efficiency and reducing legal costs. PRE- or COREQUISITE(S): LGST 101. Three
      hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST200
    name: "Cyber Law"
    description: >-
      Examine the developing and growing body of laws associated with cyberspace. Students will
      examine laws governing e-commerce including intellectual property rights laws and discuss
      issues related to the internet involving contracts, criminal law, torts, constitutional
      and privacy matters, among others. PREREQUISITE(S): LGST 101 or consent of department.
      Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[LGST101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST205
    name: "Alternative Dispute Resolution"
    description: >-
      In this course students will examine negotiation, mediation, and arbitration as
      alternatives for dispute settlement to avoid litigation. The course will focus on the
      resolution of conflicts utilizing the developed techniques, strategies, and methodology
      associated with mediation and arbitration and goal achievement negotiation. Students will
      also learn the training required for ADR practitioners and the role of the paralegal in
      this process. PREREQUISITE(S): LGST 101 or consent of department. Three hours
      lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[LGST101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST210
    name: "Torts"
    description: >-
      The study of civil wrongs regarding the liability for harm caused by wrongful acts that
      violate non-contractual duties imposed by law. This course will cover various theories of
      tortious liabilities to include: negligence, intentional torts, and strict liability. The
      course will cover defenses and remedies arising from civil actions. PREREQUISITE(S): LGST
      101. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [LGST101] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST211
    name: "Maryland Contract Law"
    description: >-
      This course focuses on the common law of contracts and sales. Emphasis is placed on the
      elements of a contract, the types of sales, and the legal consequences as a result of a
      contract or sale. Students will become familiar with the negotiation of a contract,
      creation of a sale, and the interpretation of the relevant laws. Students will be required
      to draft several contracts and sales agreements according to the laws of Maryland and the
      Uniform Commercial Code. Includes the paralegal's role in assisting attorneys in contract
      review. PREREQUISITE(S): LGST 101. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [LGST101] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST212
    name: "Immigration Law"
    description: >-
      An introduction to U.S. immigration laws as applied to personal, corporate, and public
      policy judgments. This course concentrates on questions of philosophy, public policy, and
      constitutional interpretation and will develop an awareness of how legislation affects
      administrative and judicial decisions involving immigration. PREREQUISITE(S): LGST 101 or
      consent of department. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[LGST101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST214
    name: "Domestic Relations"
    description: >-
      An introduction to the practice of domestic relations law in Maryland. Instruction
      includes an overview of the process through which a divorce or child custody action
      proceeds from the attorney's office through the courts. The rights of the parties are
      examined to include alimony, child custody, child support, and property. The role of the
      paralegal in this field will also be examined. PREREQUISITE(S): LGST 101. Three hours
      lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [LGST101] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST216
    name: "Real Property"
    description: >-
      An introduction to the basics of real property law designed to enable students to identify
      the various forms of holding title to real property; to recognize the most commonly used
      types of deeds and to assess their validity; to understand the purpose and mechanics of
      title searches; and to recognize the parties and documentation associated with real
      property sales transactions. Students will have an opportunity to draft valid deed clauses
      and to conduct online title searches. PREREQUISITE(S): LGST 101. Three hours
      lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [LGST101] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST218
    name: "Civil Litigation"
    description: >-
      A practical course in examining the process through which a civil lawsuit advances from
      the lowest to the highest courts in the Federal and state court systems with a focus on
      the role and participation of the paralegal professional at every stage of the process.
      Students will have an opportunity to draft pleadings, motions, discovery requests, and
      letters related to legal matters. PREREQUISITE(S): LGST 101. Three hours
      lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [LGST101] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST220
    name: "Wills and Estate Administration in Maryland"
    description: >-
      A practical course in managing probate proceedings. The first of the course will be
      devoted to the types of Wills recognized in Maryland; the elements necessary to create a
      valid Will; and what happens if the decedent dies without a Will. The second half of the
      course will be devoted exclusively to the steps necessary to administer Small, Regular,
      and Modified estates in Maryland and to identify when Judicial Probate becomes necessary.
      PREREQUISITE(S): LGST 101. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [LGST101] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST230
    name: "Criminal Law and Procedure for Paralegals"
    description: >-
      An introduction to substantive criminal laws as well as procedures and rules related to
      criminal trials in the Federal system and in Maryland. Students will learn the elements of
      substantive criminal laws and the application of those elements to various fact patterns.
      Students will also be introduced to the rules of practice directly related to criminal law
      trials. Students may not earn credit for CCJS 221 and this course. PREREQUISITE(S): LGST
      101. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [LGST101] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST250
    name: "Paralegal Internship"
    description: >-
      Students will gain on the job training and practical experience as a paralegal. The intent
      is to give students an appropriate work experience that will expand their knowledge and
      aide them in making career decisions. Responsibilities will include assisting attorneys
      with preparing court documents, client interviews, and appearing in court. In lieu of
      clinic, students may be placed within their current employment under the supervision of an
      attorney to participate in legal work. PREREQUISITE(S): LGST 101, LGST 102, LGST 103, LGST
      104, LGST 106, LGST 122, and with a grade point average of 3.0 or better in all LGST
      courses. Students are required to complete 45 hours of 50 minutes each for one credit hour
      including a one-hour weekly seminar. Variable credit: 1-3 semester hours.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [LGST101, LGST102, LGST103, LGST104, LGST106, LGST122] }
    approved: false
  - id: LGST260
    name: "Law Office Technology"
    description: >-
      Provides training in a variety of specialized legal software applications in use in the
      modern practice of law through lecture, discussion, and other classroom and online
      activities which include legal software utilized for law practice management, timekeeping,
      litigation support, and trial preparation/management, among others. Successful completion
      of course modules will lead to a Legal Technology Certification by the National Society
      for Legal Technology. PREREQUISITE(S): LGST 101 and LGST 122. Three hours
      lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [LGST101, LGST122] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: LGST265
    name: "eDiscovery Software Applications"
    description: >-
      Explores the rapidly developing role of software in the area of legal data, eDiscovery,
      and information governance. We will take an in-depth look at the role of software in the
      litigation lifecycle from data collection and document review to production and
      presentation at trial. Exploration of technology used in litigation support and by
      litigation teams in the acquisition of data and eDiscovery processing. Successful
      completion of the course will lead to the award of a certificate in eDiscovery Software
      Application Basics being jointly presented by National Society for Legal Technology (NSLT)
      and Association of Certified E-Discovery Specialists (ACEDS). PREREQUISITE(S): LGST 218 or
      consent of the department. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[LGST218]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
