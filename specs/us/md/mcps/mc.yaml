    level: college
    tags: [elective, english]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ENGL101, ENGL110] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: ENGL259
    name: "Designing Digital Communication for Professional Writers"
    description: >-
      For students in or preparing for careers that require preparation, editing, or production
      of technical documents of significant length. Students examine the roles and functions of
      managers, reviewers, editors, and writers throughout the document development cycle and
      study tools and techniques appropriate to each role. By studying relationships among
      functions, tools, and techniques, students will be able to assess and recommend procedures
      and policies for developing documents in the workplace. PREREQUISITE(S): A grade of C or
      better in ENGL 101 or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, english]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ENGL101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: ENGL264
    name: "Introduction to Creative Writing of Fiction"
    description: >-
      (ARTD, GEIR, GEEL) A foundation course in the forms and techniques of short story writing.
      Special attention is given to point of view, plot, characterization, setting, and
      atmosphere in standard and experimental modes in the pursuit of establishing each
      student's style and expression. Extensive class discussion of fiction of proven merit and
      student writing. Designed for students who have fully mastered basic writing skills and
      who are literate writers but who have written little or no fiction previously. One
      college-level literature course or extensive previous outside reading of fiction is
      desirable. Assessment Level(s): ENGL 101/ENGL 011. Three hours lecture/discussion each
      week.
    credits: 3
    level: college
    tags: [english]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "English", synergy: "ENG5111, CE Adv English" }
    grad_tags: [english]
  - id: ENGL265
    name: "Advanced Creative Writing of Fiction"
    description: >-
      An advanced workshop designed to raise a student's work to a professional level for
      eventual publication. Manuscripts are analyzed in class discussion with emphasis on the
      finer elements of narrative, characterization, dialogue, and pacing. Techniques of novella
      and novel writing are presented. The work of established mainstream and genre writers is
      also scrutinized to heighten awareness of various literary approaches. May not be taken
      concurrently with other fiction writing courses. PREREQUISITE(S): ENGL 264 or the
      equivalent or consent of instructor based upon a writing sample. May be repeated for
      credit. Three hours each week.
    credits: 3
    level: college
    tags: [english]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ENGL264]] }
    approved: true
    hs_credit: { category: "English", synergy: "ENG5111, CE Adv English" }
    grad_tags: [english]
  - id: ENGL272
    name: "Introduction to Creative Writing of Poetry"
    description: >-
      (ARTD, GEIR, GEEL) Designed to provide students a foundation for understanding the forms,
      techniques, and aesthetics of poetry writing in order that they may develop their skills.
      Emphasis will be on both traditional and contemporary modes to establish each student's
      style of expression and understanding of the craft. Students' poems, the poems of their
      peers, and poetry of proven merit will be discussed in a workshop setting.
      PREREQUISITE(S): A grade of C or better in ENGL 101 or ENGL 101A or consent of instructor
      based on a writing sample. Three hours each week.
    credits: 3
    level: college
    tags: [elective, english]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ENGL101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  # --- FILM ----------------------------------------------------------------
  - id: FILM110
    name: "Introduction to Film"
    description: >-
      (ARTD, GEIR, GEEL) (TP/SS only) This course presents a basic introduction to the study of
      narrative film. Analysis of film structure and content will be developed through the use
      of genre analysis system. Basic film technique and language as it affects structure and
      content will also be examined. Students will view and discuss examples of both historic
      and contemporary film at the American Film Institute Theatre and in class, and will read
      and write about film structure and technique. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours each week. This course appears on the MCPS approved list but is no longer in
      the current MC catalog; the description is from the 2025-2026 catalog.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "Fine Art", synergy: "ART5117, CE Adv Integrated Arts" }
    grad_tags: [fine_arts]
  - id: FILM200
    name: "Introduction to Film Studies"
    description: >-
      Explores the global history of film as an artform and 'way of seeing' from the 19th
      century to the present. Students will develop visual and media literacy skills through
      understanding the art and science of film as a creative process and the history of film as
      a mode of visual communication. Assessment Level(s): ENGL 101/ENGL 011. Three hours each
      week.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: FILM210
    name: "Screenwriting"
    description: >-
      (TP/SS only) This course will teach the techniques of narrative storytelling through the
      camera arts. The student will study writing dialogue and action for film and television
      through several small projects culminating in a final 10-minute script. Films will be
      screened at the American Film Institute Theatre and in class as examples of effective
      screenwriting. PREREQUISITE(S): FILM 200 or consent of instructor. Two hours lecture, two
      hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[FILM200]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5120, CE Adv Media" }
    grad_tags: [elective]
  - id: FILM220
    name: "Basic Movie Production"
    description: >-
      (R and TP/SS only) The theory and practice of single video camera filmmaking, including
      script preparation, shooting, and editing. The student will produce several short video
      projects that tell stories that are artistic and with cultural relevance. PREREQUISITE(S):
      FILM 200 and TVRA 120, or consent of instructor. Two hours lecture, three hours laboratory
      each week.
