  # --- TECH ----------------------------------------------------------------
  - id: TECH190
    name: "Introduction to Game and Simulation Development"
    description: >-
      Explore the foundations of the gaming and simulation industries, with a focus on game
      design, development processes, and careers. This course covers the history of gaming, key
      terminology, and the evolution of game genres and platforms. Students will gain insights
      into various career paths in the industry, from design and production to business and
      marketing. In addition to understanding the societal impact of games, including serious
      games for advocacy, education, and simulation, students will design and prototype their
      own 2D games, test user experiences, and develop a portfolio of original work.
      PREREQUISITE(S): None, but previous computer experience strongly recommended. Assessment
      Level(s): ENGL 101/ENGL 011. Four hours each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5103, CE Adv Computer Apps" }
    grad_tags: [elective]
  - id: TECH225
    name: "Game Programming"
    description: >-
      A study of introductory programming techniques for interactivity and game development
      using industry standard software applications and tools. Students will focus on practical
      code exercises to build interactive game mechanics. PREREQUISITE(S): TECH 190 or consent
      of department. Assessment Level(s): MATH 050. Four hours each week. May not be taken
