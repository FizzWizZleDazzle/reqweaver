  - id: THET110
    name: "Fundamentals of Acting"
    description: >-
      (ARTD, GEIR, GEEL) (R and TP/SS only) An introduction to basic acting skills, including
      exercises in speech, movement, and imagination. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
