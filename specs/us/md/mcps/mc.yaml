    name: "Techniques of Proofreading and Editing"
    description: >-
      For students in or preparing for careers that require them to proofread or edit material
      written by others. Emphasis is placed on the fundamental concepts of proofreading and
      editing, including copy marking, levels of editing, and procedures. PREREQUISITE(S): A
      grade of C or better in ENGL 101 and ENGL 110, or consent of department. Three hours each
      week.
