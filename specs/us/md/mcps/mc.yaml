    grad_tags: [world_language]
    exam_equivalent: [AP_SPANISH_LIT]
  # --- STBR ----------------------------------------------------------------
  - id: STBR200
    name: "Foreign Study Program"
    description: >-
      An orientation and goal-setting course for students who will be studying abroad and
      earning credits at accredited non-U.S. institutions. Working with the study abroad
      coordinator prior to their semester abroad, students will establish goals, select courses
      abroad in conjunction with their discipline of study, and determine transferability of
      credits to Montgomery College upon course completion, according to transcript evaluator
      guidelines. A post-program conference will determine completed objectives.
      PREREQUISITE(S): Consent of college-wide study abroad coordinator. Three hours each week.
      No credit/No quality points
    credits: 0
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  # --- STSU ----------------------------------------------------------------
  - id: STSU100
    name: "First Year Seminar"
    description: >-
      Designed to assist the student in adjusting to college. Includes academic and student
      services available, study habit techniques, career and educational planning, and
      adjustment concerns. Especially intended for students during their initial semester of
      enrollment. One hour lecture/discussion each week.
    credits: 1
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: STSU101
    name: "Seminar for International Students"
    description: >-
      Orientation course for international students. Includes study skills, academic
      regulations, the American educational system, individual educational and vocational goals,
      communication skills, and American customs. Especially intended for students during their
      initial semester of enrollment in conjunction with American language developmental course
      offerings. Two hours lecture/discussion each week.
    credits: 2
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: STSU102
    name: "Mindfulness and Resilience in College"
    description: >-
      Designed for students interested in exploring the basic core principles of mindfulness
      (non-judgmental awareness) as it relates to coping with the unique challenges that come
      with being a college student. This course introduces students to mindfulness-based
      practices and activities effective in helping to be non-judgmentally present, to improve
      focus and academic performance, to build resiliency, and to boost social and emotional
      wellbeing. Students will also examine research on the effectiveness of mindfulness-based
      practices in building resiliency and improving academic performance. One hour
      lecture/discussion each week.
    credits: 1
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: STSU110
    name: "Study Habits Development"
    description: >-
      Stresses development of positive attitudes and improvement of basic learning habits.
      Includes value assessment and educational goal setting. Stresses strategies in
      understanding and responding to textbooks, lectures, and other methods and materials
      encountered in the academic environment. Emphasis on organization of materials,
      utilization of time, and preparing for and taking examinations. One hour
      lecture/discussion each week.
    credits: 1
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: STSU114
    name: "Memory Development"
    description: >-
      Designed to assist the student in developing memory through simple systems of association.
      Topics include development of memory for author organization, course organization, course
      relationships, and practical application to everyday life situations. One hour
      lecture/discussion each week.
    credits: 1
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: STSU120
    name: "Career Development: Dynamics and Application"
    description: >-
      Designed for students interested in developing career goals and creating a plan of action.
      The course provides students with an opportunity to learn and develop skills for a
      lifetime of career-related decision making. Emphasis will be placed on personal academic
      and occupational exploration, resume writing, interviewing, and effective job search
      strategies. Two hours lecture/discussion each week.
    credits: 2
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: STSU122
    name: "Principles of Academic Success"
    description: >-
      Designed specifically for students who want to improve their academic performance and
      achievement in college courses, this course explores the development of the qualities,
      attitudes, and behaviors of successful students. Topics include accepting personal
      responsibility, discovering self-motivation, setting and achieving academic and personal
      goals, mastering self-management, and gaining self-awareness. Two hours lecture/discussion
      each week.
    credits: 2
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: STSU124
    name: "Happiness and Well-Being"
    description: >-
      A course that explores the roots of a happy and meaningful life. Students will engage in
      practical lessons from the science of positive psychology, neurobiology, and social and
      behavioral sciences. The course will offer students practical strategies for tapping into
      and nurturing their own happiness, including activities that foster social and emotional
      well-being and that enable students to observe a measure of their own happiness. Three
      hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: STSU200
    name: "Introduction to Student Leadership"
    description: >-
      A highly experiential course that provides an overview of leadership fundamentals and
      theory. Students will explore a variety of leadership models and concepts to discover
      their own personal leadership style. With an emphasis on peer leadership, students will
      learn how to effectively work with first year students. This course prepares students to
      assume leadership roles in a variety of academic, social, and professional contexts.
      PREREQUISITE(S): A grade of B or better in STSU 100 or STSU 101 and consent of the
      department. Assessment Level(s): ENGL 101/ENGL 011. Two hours experiential learning each
      week. Two-hour seminar and two hours experiential learning each week. May be repeated for
      a maximum of four credits. To register for this course, students must be accepted and
      active members of the First Year Experience (FYE) Student Ambassador program.
    credits: 2
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[STSU100, STSU101]] }
    approved: false
  # --- SURG ----------------------------------------------------------------
  - id: SURG100
    name: "Introduction Surgical Technology"
    description: >-
      (TP/SS only) Introduces the foundation, history, and principles related to Surgical
      Technology including the skills and techniques needed to perform as a surgical
      technologist in the operating room. Surgical instrumentation and basic principles of
      aseptic technique for the surgical technologist are included. PREREQUISITE(S): Admission
      to the surgical technology program or consent of program coordinator, ENGL 101/ENGL 011,
      MATH 117 or higher, and BIOL 212. PRE- or COREQUISITE(S): BIOL 213. Two hours lecture,
      four hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [MATH117, BIOL212], any_of: [[ENGL101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: SURG101
    name: "Surgical Technology I"
    description: >-
      (TP/SS only) A continued study of the principles and practice needed for preparing the
      operating room for surgical procedures. Legal, ethical, and moral aspects are covered in
      addition to perioperative case management. The course will also include medical
      terminology with focus on combine prefixes, word roots, abbreviations, and suffixes to
      create medical terms related to surgery with additional components by systems.
      PREREQUISITE(S): Consent of program coordinator, SURG 100. PRE- or COREQUISITE(S): BIOL
      213. Four hours lecture, four hours laboratory each week.
    credits: 6
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [SURG100] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: SURG102
    name: "Surgical Technology II"
    description: >-
      (TP/SS only) A continued study of the principles and practice of surgical case management
      including the technological sciences and disaster of public health emergency management.
      Microbiology for the surgical technologist, methods of disinfection and sterilization of
      the OR, supplies, and equipment are included. PREREQUISITE(S): A grade of C or better in
      SURG 101 or consent of program coordinator. Four hours lecture, four hours laboratory each
      week.
    credits: 6
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[SURG101]] }
    approved: false
  - id: SURG103
    name: "Pharmacology and Anesthesia"
    description: >-
      (TP/SS only) Covers action and usage of commonly used drugs, the computation of drug
      dosages, solutions and the methods by which they are administered. PREREQUISITE(S):
      Admission to the surgical technology program or consent of program coordinator, and a
      grade of C or better in both BIOL 212 and MATH 117 or higher. Two hours each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOL212, MATH117] }
    approved: false
  - id: SURG201
    name: "Surgical Technology III"
    description: >-
      (TP/SS only) The study of actual surgical procedures and intraoperative performance. It
      combines pathology, anatomy, and physiology and a step-by-step process of specific
      surgical procedures to provide the student with a broad knowledge base and the skills
      needed to perform as a surgical technologist and Assistant Circulator. Students will gain
      an understanding of the roles and responsibilities of the surgical technologist and
      reflect the dynamic professional process that is needed in operating room endeavors.
      Correlates intraoperative procedures with postoperative care. PREREQUISITE(S): A grade of
      C or better in SURG 101 or consent of program coordinator. Four hours lecture, four hours
      laboratory each week.
    credits: 6
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[SURG101]] }
    approved: false
  - id: SURG205
    name: "Clinical Practicum I"
    description: >-
      (TP/SS only) Provides the student with opportunities to apply those theories learned in
      SURG 101 to the actual practice of surgical procedures. PRE- or COREQUISITE(S): A grade of
      C or better in SURG 101 and SURG 201 or consent of program coordinator. Three hundred
      (300) hours of clinical practice.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: SURG211
    name: "Surgical Technology IV"
    description: >-
      (TP/SS only) Focuses on the role transition to beginning surgical technologist
      practitioner. This course combines pharmacology, pathology, anatomy, and physiology, and
      continues a step-by-step process of surgical procedures. Students are required to apply
      and pay for the national certification exam for surgical technologist given by the
      National Board of Surgical Technology and Surgical Assisting (NBSTSA). This course will
      provide the student with the necessary review in preparation for the National
      Certification Exam. Materials covered will include a comprehensive review of all body
      systems, instrumentation, procedural methods, supplies, medications, as well as
      test-taking techniques. The exam will be proctored in the MC Testing Center. Notification
      of the date and time to take the exam will be provided. Resume development and employment
      preparation are included. PREREQUISITE(S): A grade of C or better in SURG 201 and SURG
      205, or consent of program coordinator. COREQUISITE(S): SURG 215. Four hours lecture, four
      hours laboratory each week.
    credits: 6
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [SURG201, SURG205] }
    approved: false
  - id: SURG215
    name: "Clinical Practicum II"
    description: >-
      (TP/SS only) This course emphasizes a common systematic approach to all surgeries and
      introduces the surgical technologist's role on specialty teams, as second circulator and
      second assistant. PREREQUISITE(S): A grade of C or better in SURG 201 and SURG 205, or
      consent of program coordinator. COREQUISITE(S): SURG 211. Three hundred (300) hours of
      clinical practice.
