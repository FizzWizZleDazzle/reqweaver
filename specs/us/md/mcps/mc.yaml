  # --- GDES ----------------------------------------------------------------
  - id: GDES116
    name: "Digital Tools for the Visual Arts"
    description: >-
      (ARTD, GEIR, GEEL) An introduction to the digital tools used in the visual arts and the
      social, cultural and ethical application of those tools. Students are exposed to the
      theory and function of the major software packages, basic digital design principles, and
      collaborative processes utilized in the visual arts. Topics include operating systems,
      typography, vector and bitmap imaging, page layout, PDF creation and editing,
      timeline-based video editing, file transfer, output, web, emerging technologies, and other
      material relative to the digital visual arts workflow. Two hours lecture, four hours
      laboratory each week.
    credits: 4
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5113, CE Adv Graphic Design" }
    grad_tags: [elective]
  - id: GDES121
    name: "Fundamentals of Graphic Design I"
    description: >-
      An introduction to elements of design, spatial relationships, typography, and imagery as
      they apply to practical visual solutions for self-promotion, resumes, logo design, web
      design, and sequential systems. This course instructs the student in graphic design skills
      employing traditional and digital tools, materials and procedures employed in the
      communication arts industry. The focus will be on finding creative visual solutions to
      communication problems using technical skills. Two hours lecture, three hours laboratory
      each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5113, CE Adv Graphic Design" }
    grad_tags: [elective]
  - id: GDES124
    name: "Fundamentals of Graphic Design II"
    description: >-
      A continuing examination of elements of design, spatial relationships, typography, and
      imagery as they apply to practical visual solutions for print and web applications.
      PREREQUISITE(S): GDES 121 or consent of department. Two hours lecture, three hours
      laboratory each week. This course appears on the MCPS approved list but is no longer in
      the current MC catalog; the description is from the 2025-2026 catalog.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[GDES121]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5113, CE Adv Graphic Design" }
    grad_tags: [elective]
  - id: GDES134
    name: "Illustration I"
    description: >-
      (R only) Introduction to illustrative drawing and painting, using traditional and digital
      media. Topics include units on drawing from observation, basic composition,
      conceptualizing, visual narrative and sequential storytelling, and output for print and
      interactive media, the employment market, and business practices. PREREQUISITE(S): ARTT
      100 or portfolio placement by consent of department. Two hours lecture, three hours
      laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ARTT100]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5113, CE Adv Graphic Design" }
    grad_tags: [elective]
  - id: GDES135
    name: "Illustration II"
    description: >-
      (R only) A study of major illustration topics, including advertising, editorial,
      narrative, sequential illustration, and storyboards. Students explore drawing from life
      and photo reference material, basic composition, output for print reproduction and web,
      the employment market and business practices. PREREQUISITE(S): GDES 134 or consent of
      department. Two hours lecture, three hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[GDES134]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5113, CE Adv Graphic Design" }
