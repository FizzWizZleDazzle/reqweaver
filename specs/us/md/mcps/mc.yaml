    grad_tags: [elective]
  - id: BIOL217
    name: "Ecology"
    description: >-
      Study of the relationships of organisms to their environment, with emphasis on classic
      studies and on recent advances in the field. Topics include evolutionary ecology,
      population growth and regulation, interspecific relationships (e.g., competition,
      predation), behavioral ecology, community ecology, systems ecology (e.g., energy flow,
      biogeochemical cycles), and ecological effects of human activities. Assessment Level(s):
      ENGL 101/ENGL 011, MATH 117 or higher. Three hours lecture, three hours laboratory each
      week. May not be taken concurrently with MATH 017 or MATH 020 or MATH 030 without
      appropriate Math assessment score.
    credits: 4
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: BIOL222
    name: "Principles of Genetics"
    description: >-
      An introduction to the underlying principles, theories, technology, and vocabulary that
      constitute the discipline of genetics. Concentrating on the molecular aspect of classical
      and extended genetics, course topics include molecular organization of genetic information
      in viruses, prokaryotes, and eukaryotes; the molecular basis of phenotypic variation; and
      the molecular aspects of gene action, expression, and regulation. Collectively, this
      course provides a framework for understanding how genetics is used as a tool for
      investigation of issues related to human health, medicine, and in biotechnology.
      PREREQUISITE(S): A grade of C or better in BIOL 150, CHEM 131, MATH 117 or higher, or
      consent of department. Students may not receive credit for both BIOL 220 and BIOL 222.
      Three hours lecture, two hours of discussion/recitation each week.
