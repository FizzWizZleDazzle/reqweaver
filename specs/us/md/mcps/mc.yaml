    hs_credit: { category: "World Languages: Spanish", synergy: "WLG5130, CE Adv World Language" }
    grad_tags: [world_language]
    exam_equivalent: [AP_SPANISH_LANG]
  - id: SPAN215
    name: "Advanced Spanish Conversation and Composition"
    description: >-
      (HUMD, GEIR, GEEL, GCP) Emphasis on fluency in speaking and writing Spanish. Readings in
      texts and assigned outside sources serve as basis for classroom discussion in Spanish as
      well as for advanced composition. Includes readings in Spanish and/or Latin-American
      literature. PREREQUISITE(S): SPAN 202 or appropriate placement on the placement test or
      consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[SPAN202]] }
    approved: true
    hs_credit: { category: "World Languages: Spanish", synergy: "WLG5130, CE Adv World Language" }
    grad_tags: [world_language]
    exam_equivalent: [AP_SPANISH_LIT]
  - id: SPAN216
    name: "Advanced Readings in Spanish: Introduction to Latin American Literature"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A survey of representative works in Latin American literature from
      pre-colonial times to the present. Students consider various genres as they analyze a
      variety of texts. The course provides an introduction to literary criticism and textual
      analysis and examines the key biographical, literary, social, cultural, and political
      influences on the works under consideration while developing students' proficiency in
      Spanish. The language of instruction is Spanish. PREREQUISITE(S): SPAN 202 or appropriate
      placement on the placement test or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[SPAN202]] }
    approved: true
