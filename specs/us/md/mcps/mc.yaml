    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  - id: BLDG172
    name: "HVACR Electricity"
    description: >-
      (R only) An introduction to the theory and applications of electricity as applied to
      heating, ventilation, and air conditioning systems. Topics include Ohm's Law, schematics,
      control and line voltage circuits, meters, motors, and troubleshooting. Three hours
      lecture, two hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
