      life, ecology, and behavior and applies quantitative skills to interpret biological
      processes. Biological Science majors are expected to take BIOL 150 first. PREREQUISITE(S):
      A grade of C or better in MATH 165. PRE- or COREQUISITE(S): CHEM 131. Assessment Level(s):
      ENGL 101/ENGL 011. Three hours lecture, three hours laboratory each week.
