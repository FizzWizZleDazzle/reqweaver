    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [GDES116, GDES210, GDES220] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5113, CE Adv Graphic Design" }
    grad_tags: [elective]
  - id: GDES212
    name: "Publication Design with InDesign"
    description: >-
      A practical application of design fundamentals for single and multipage publications.
      Students use industry standard page assembly software while creating well-designed layouts
      for publications of all kinds. In addition to the functions of the software, topics
      include typography, graphics, color, aesthetic page flow, and transition design.
      PREREQUISITE(S): GDES 116 or consent of department. Two hours lecture, four hours
      laboratory each week.
    credits: 4
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[GDES116]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5113, CE Adv Graphic Design" }
    grad_tags: [elective]
  - id: GDES214
    name: "Photoshop for Graphics and Photography"
    description: >-
      (Also offered as PHOT 214. Credit cannot be received for both GDES 214 and PHOT 214.) An
      in-depth study of digital editing as it applies to the needs of the graphics or
      photography student and professional. Students manipulate scanned images and digital
      photographs in preparation for publication layout and design, web output, use in other
      software packages, or immediate output. Topics include photo-restoration, composite
      imaging, masking, and the adjustment and correction of images used in graphic design and
      photography. PREREQUISITE(S): None, but previous computer experience is necessary. It is
      strongly recommended that photography majors take PHOT 161 prior to this course. Two hours
      lecture, four hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5113, CE Adv Graphic Design" }
    grad_tags: [elective]
  - id: GDES216
    name: "Illustrator for Vector Graphics"
    description: >-
      An in-depth study of vector graphics creation. Students design, create, and manipulate
      images for integration in publication layout and design, web output, use in other software
      packages, or immediate output. Topics include vector imaging tools, technical
      illustration, bitmap to vector conversion, typography, and output considerations.
      PREREQUISITE(S): None, but previous computer experience is necessary. Two hours lecture,
      four hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5113, CE Adv Graphic Design" }
    grad_tags: [elective]
  - id: GDES218
    name: "Graphic Design for the Web"
    description: >-
      An examination of principles of design and design considerations as applied to the
      creation of web pages and websites. Emphasis is on visual communication principles and
      visual presentation aspects of webpages, including page layout, typography, color theory,
      navigation, and image creation and editing. Students will apply principles of design in
      the creation of a website. PREREQUISITE(S): GDES 116 or GDES 214/PHOT 214 or consent of
