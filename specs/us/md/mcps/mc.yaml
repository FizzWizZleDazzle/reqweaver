  - id: HONR110
    name: "Fundamental Concepts of Inquiry in Culture and History"
    description: >-
      Selected themes and topics in culture and history will be used to help students develop a
      better understanding of the concepts, terminology, and methodology of the study of culture
      and history. Students may take this course twice to fulfill the requirements of the Honors
      Scholar Program, provided each time it is taken, a different topic is covered. Specific
      information will be published prior to the start of each registration and may be obtained
      from the campus honors coordinator. One hour lecture.
    credits: 1
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HONR114
    name: "Fundamental Concepts of Inquiry in the Behavioral and Social Sciences"
    description: >-
      Selected themes and topics in the behavioral and social sciences will be used to help
      students develop a better understanding of the concepts, terminology, and methodology of
      the study of behavioral and social sciences. Students may take this course twice to
      fulfill the requirements of the Honors Scholar Program, provided each time it is taken, a
      different topic is covered. Specific information about each section of this course will be
      published prior to the start of each registration and may be obtained from the campus
      honors coordinator.
    credits: 1
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HONR251
    name: "Independent Study-Tutorial in the Humanities"
    description: >-
      This tutorial emphasizes independent study in areas not listed among the credit courses in
      the humanities. Appropriate faculty tutor individual students in specific studies: e.g.,
      philosophy, the problem of knowledge; literature, a comparative study of literary utopias;
      art, a project in oil painting; and language, Schiller and Goethe. Students may repeat
      this course provided that each time it is taken, a different topic is covered.
    credits: 3
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HONR258
    name: "Tutorial in Science"
    description: >-
      This tutorial emphasizes independent study in areas not listed among the other credit
      courses in the natural sciences. Appropriate science faculty tutor individual students.
      This tutorial instruction provides background material for a number of research
      experiments. Students may repeat this course provided that each time it is taken, a
      different topic is covered. PREREQUISITE(S): Consent of instructor. One hour lecture.
    credits: 3
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HONR260
    name: "Independent Study-Tutorial in the Social Sciences"
    description: >-
      This tutorial emphasizes independent study in areas not listed among the other credit
      courses in the social sciences. Appropriate social sciences faculty tutor individual
      students in specific studies. Students may repeat this course provided that each time it
      is taken, a different topic is covered.
    credits: 3
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HONR265
    name: "Independent Study-Tutorial in Mathematics/Computer Science"
    description: >-
      This tutorial emphasizes independent studies in areas not listed among the credit courses
      in mathematics. Appropriate mathematics/computer science faculty tutor individual students
      in specific studies, e.g., in computer science, the study and comparison of modern
      programming languages; in mathematics, topology, complex analysis, abstract algebra, and
      logic. Students may repeat this course provided that each time it is taken, a different
      topic is covered. One hour lecture.
    credits: 3
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HONR270
    name: "Study-Travel Seminar"
    description: >-
      This travel-study experience offers academic, aesthetic, and cultural opportunities within
      the USA or abroad to honor students. The course includes pre- and post-trip advising,
      on-site orientation sessions, and directed readings. Grades are based on Montgomery
      College faculty evaluation of student portfolios, and Montgomery College credit is
      awarded. Transportation, tuition, room and board and other costs are in addition to
      Montgomery College tuition. PREREQUISITE(S): Completion of at least 12 college credits, a
      3.4 grade point average or higher, a grade of A or B in ENGL 101 or ENGL 101A, and consent
      of campus Honors coordinator or Honors program director.
    credits: 3
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ENGL101]] }
    approved: false
  - id: HONR275
    name: "Honors Internship"
    description: >-
      Available through the Honors Program in partnership with other programs, for example the
      Paul Peck Humanities Institute and the Women's and Gender Studies Program. Internships are
      offered at museums, archives, historic and cultural organizations as well as college based
      programs, such as the Potomac Review literary journal. PREREQUISITE(S): Permission of
      instructor.
    credits: 3
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HONR280
    name: "Capstone: Research in Disciplines"
    description: >-
      Encourages students to explore a theme in their chosen discipline. Through a variety of
      activities and assignments, this course helps to improve students' skills in textual
      analysis, critical thinking, research, discussion, presentation and academic writing.
      Enrolled students, from diverse disciplines, will undertake and complete a mentor-
      approved academic project that may also be explored in the context of an interdisciplinary
      discussion. PRE- or COREQUISITE(S): ENGL 102 or ENGL 103 and consent of campus honors
      coordinator or honors program director. Three hours each week.
    credits: 3
    level: college
    tags: [elective]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  # --- HORT ----------------------------------------------------------------
  - id: HORT100
    name: "Introduction to Plant Sciences"
    description: >-
      (NSLD, GEEL) This course explores the many facets of plant science and provides students
      with a strong foundation in the basics of botany and horticulture. Included topics are
      plant anatomy, morphology, physiology, classification, genetics, and the importance of
      plants to society. Students will apply learned fundamentals of plant propagation and
      nutrition during laboratory investigations. Field trips may be required. Assessment
      Level(s): ENGL 101/ENGL 011. Two hours lecture, two hours laboratory one hour
      discussion/recitation each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "AGB5118, CE Adv Landscape" }
    grad_tags: [elective]
  - id: HORT105
    name: "Introduction to Sustainable Landscaping"
    description: >-
      (G only) An overview of the basic aspects of the green industry, highlighting current
      environmental trends and sustainability issues. This course will introduce students to the
      theoretical and practical aspects of the industry, including techniques and approaches for
      maintaining and improving soil health and managing stormwater, as well as provide a basic
      understanding of growth and nutrition to ensure environmental sustainability. Students
      will learn about national, state, and local guidelines promoting sustainability in
      landscape design and management. Two hours each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT131
    name: "Sustainable Landscape Design"
    description: >-
      (G only) An introduction to a sustainable landscape design. This course will introduce
      students to a functional and thriving landscape design by strategically using plants,
      materials, and other features to create a more environmentally friendly and efficient
      outdoor space. Key principles include the use of native plants and the reduction of water
      consumption, soil erosion, and chemical inputs. Includes the ecology of the site, creating
      designs to benefit both people and the surrounding environment. Two hours lecture, two
      hours laboratory each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT135
    name: "Landscape Technologies for Stormwater Maintenance"
    description: >-
      (G only) Instruction in how to perform inspection, minor repairs and maintenance of plant
      materials surrounding bio-retention facilities and similar Low Impact Development (LID)
      techniques according to Montgomery County and Maryland State guidelines. Other topics
      include planning reading and developing a maintenance plan for bio-retention facilities.
      One half hour lecture, one hour laboratory each week.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT141
    name: "Beekeeping"
    description: >-
      (G only) Provides the knowledge to start and maintain a honeybee hive. Key topics include
      honeybee life cycle and functions, seasonal management, parasite and pathogen management,
      and products from the hive. Course gives students hands-on opportunity at an apiary. Two
      hours each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT145
    name: "Creating Gardens in a Digital Age"
    description: >-
      (G only) This course introduces students to historical garden designs as well as current
      ecologically influenced trends, such as sustainable landscaping and native planting
      designs. Through traditional and digital media, students will learn to apply these
      influences to create their own designs and to prepare graphic presentations, plant
      palettes, and price quotes. Three Saturday field trips will look at garden designs that
      will form the basis of the students' projects. Assessment Level(s): ELAR 980/IERW 002. One
      hour lecture, two hours laboratory each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT150
    name: "Introduction to Arboriculture"
    description: >-
      (G only) Hands-on course teaches the skills and techniques necessary to access the upper
      parts of large trees; safety when working in and around large trees; and proper selection,
      use, and maintenance of equipment used in the arboriculture profession. Other topics
      include selection and care of personal protective equipment. The course is physical in
      nature. This course has been endorsed by the Maryland Arborist Association. Assessment
      Level(s): ELAR 980/IERW 002. Two hours laboratory each week.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT161
    name: "Landscape Graphics"
    description: >-
      (G only) This course in landscape design is for beginning students who wish to develop the
      graphic skills necessary to prepare planting designs and construction drawings for
      presentations to clients and for construction implementation. Topics include site
      analysis, conceptual design, schematic design, working drawings, and construction details.
      Students will prepare colored site plans and basic three-dimensional drawings. Two hours
      lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT170
    name: "Medicinal Plants"
    description: >-
      Overview of the growth, culture, and science related to the production and use of
      medicinal plants. Emphasis on plant source, plant description, the active agent and its
      beneficial or detrimental physiological action and effects. Emphasis on herbal medicine;
      secondary chemistry of active compounds, oil extraction, and utilization of these plants.
      Field trips and classroom demonstrations are integrated into the course. One hour lecture,
      two hours laboratory each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT171
    name: "Fruit Production"
    description: >-
      An overview of fruit crops suitable for central Maryland including native fruits. Topics
      include proper site selection, soils, choice of varieties, pruning, cultivation,
      fertilization, control of common pests and diseases, and harvesting of fruit crops
      including native fruits, as well as economic considerations and future trends. Labs
      include practical hands-on experience in the classroom and the field. Four Saturday field
      trips required. One hour lecture, two hours laboratory each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT215
    name: "Integrated Pest Management and Entomology"
    description: >-
      (G only) This course focuses on the identification and management of insects, mites, and
      diseases affecting ornamental plants, turfgrass, and greenhouse crops. Topics include pest
      life cycles; diagnosis of plant-damaging insects, mites, and diseases; integrated pest
      management (IPM) strategies; pesticide uses and limitations; and pesticide safety,
      equipment, and application methods. The course prepares horticulture students for the
      pesticide applicator certification examination administered by the Maryland State
      Department of Agriculture. Assessment Level(s): ELAR 980/IERW 002. Two hours lecture, two
      hours laboratory each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT222
    name: "Sustainable Turfgrass Management"
    description: >-
      (G only) Management of turfgrass with respect to residential, commercial, and athletic
      field lawn care. Emphasis on the use of the newest and most adaptable turfgrass varieties
      for minimum insect and disease problems. Turfgrass establishment procedures, lawn
      maintenance schedules, renovation procedures, pest control methods, and weed control
      options will be covered. Laboratory assignments will include identification of grass
      species, weeds, and turf insects. Assessment Level(s): ELAR 980/IERW 002. Two hours
      lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT244
    name: "Herbaceous Plant Materials"
    description: >-
      (G only) This course, designed to help students make appropriate selections for
      landscaping situations, identifies and examines herbaceous plant material commonly used in
      residential and commercial landscaping, with an emphasis on annuals, perennials, and
      ornamental grasses. Assessment Level(s): ELAR 980/IERW 002. Two hours lecture, two hours
      laboratory each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT253
    name: "Plant Materials I"
    description: >-
      (G only) Identification and uses of deciduous plant material commonly used in the
      landscape in Maryland and surrounding states for residential and commercial plantings.
      Emphasis on native and non-native deciduous trees and shrubs. Plant heights, shapes,
      seasonal interest, flower time, colors, fruiting characteristics, and other landscape
      characteristics are covered. This course is intended to prepare the student to make
      appropriate selection of plant materials for particular landscape situations. Assessment
      Level(s): ELAR 980/IERW 002. Two hours lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT254
    name: "Plant Materials II"
    description: >-
      (G only) Identification and uses of evergreen plant material commonly used in the
      landscapes of Maryland and surrounding states. Evergreens with outstanding qualities that
      are not commonly used and that are recent plant introductions will also be covered. The
      course will emphasize native and non-native evergreen shrubs, trees, ground covers, and
      vines. Evergreen plant heights, shapes, colors, seed pod characteristics, and bark
      patterns will be covered. Assessment Level(s): ELAR 980/IERW 002. Two hours lecture, two
      hours laboratory each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT258
    name: "Sustainable Landscape Management"
    description: >-
      (G only) Landscape management skills in site preparation and modification for landscape
      planting. Handling of balled and burlapped plant stock and container nursery stock in the
      transplanting process. Evaluating the soils of planting sites. Study of fertility
      practices, drainage problems, use and limitations of soil amendments, methods for
      selecting healthy plant material, pruning techniques, mulch materials, and chemical and
      nonchemical methods of weed control. Understanding the job estimating process. Assessment
      Level(s): ELAR 980/IERW 002. Two hours lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT271
    name: "Plant Propagation and Production"
    description: >-
      (G only) Introduction to the principles, techniques, and facilities used to propagate and
      produce a broad range of ornamental plants, including native plants, annuals and
      perennials, small fruit and tree fruit. Topics include seed propagation, cutting,
      grafting, budding, division, layering, and tissue culture. Two hours lecture, two hours
      laboratory each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HORT280
    name: "Environmental Horticulture Internship"
    description: >-
      (G only) Students will design, with guidance from an instructor, an individual career work
      experience in the horticulture or green industry. The intent is to give students an
      appropriate work experience that will expand their knowledge and aid them in making career
      decisions. PREREQUISITE(S): Completion of 6 semester hours of environmental horticulture
      courses or consent of department. Six hours each week.
    credits: 6
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  # --- HSCI ----------------------------------------------------------------
  - id: HSCI101
    name: "Introduction to Health Sciences"
    description: >-
      Course is designed to give students interested in allied health careers the opportunity to
      explore the basic concepts surrounding professions related to this field. Instruction
      includes an introduction to: anatomy and physiology, medical terminology, medical ethics,
      communications, and application of professional practices to both hospital and
      pre-hospital environments. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  # --- IDES ----------------------------------------------------------------
  - id: IDES101
    name: "Interior Design I"
    description: >-
      (R only) An introduction to the relationship of people to their environment and the design
      process necessary to create functional aesthetic interior space. The study of design
      theory using conceptual problem-solving methods. Emphasis on the basic elements and
      principles of design and use of drafting instruments required to translate design concepts
      into completed projects. Two hours lecture, four hours studio each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: IDES107
    name: "Interiors: Design Principles"
    description: >-
      (R only) Introduces design elements, including color, space, texture, line, lighting,
      sound, and form in two- and three-dimensional spaces. Topics include principles and design
      theory, as related to environmental applications. Two-dimensional studies include
      applications in elevations and plans; three-dimensional studies include applications in
      interiors models. Two hours lecture/discussion, four hours studio each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: IDES110
    name: "Interiors: Technical Drawing and Drafting"
    description: >-
      (R only) Introduces basic drawing and drafting techniques, employed as the foundation for
      all graphic communications for interior designers. Three-dimensional and two-dimensional
      drawings, as well as freehand sketching, are incorporated in weekly projects and
      assignments. Two hours lecture/discussion, four hours studio each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: IDES111
    name: "Interior Design II"
    description: >-
      (R only) A continuation of IDES 107, with emphasis on creating design solutions for both
      residential and nonresidential spaces. Projects will be more complex. Students will
      utilize appropriate scale, color, materials, furniture, form, and light to define and
      solve major interior space problems and design objectives in an organized method.
      PREREQUISITE(S): IDES 101, IDES 107, IDES 110 or consent of interior design coordinator.
      Two hours lecture, four hours studio each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [IDES101, IDES107, IDES110] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: IDES118
    name: "Interior Design Visualization & Presentation"
    description: >-
      (R Only) Traditional and new methods and techniques for visualization, communication, and
      presentation. Perspective drawing, graphic design principles, sketching and rendering for
      design development and communication. Digital software, Sketchup, and 3-D models. Editing
      with Photoshop. PREREQUISITE(S): IDES 101 and IDES 110 or consent of the interior design
      coordinator. COREQUISITE(S): IDES 118L. Two hours lecture, four hours lab each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [IDES101, IDES110] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: IDES123
    name: "CAD Drafting for Interior Design"
    description: >-
      (R Only) An introduction to computer-aided drafting (CAD) in the interior design
      profession utilizing AutoCAD to create design and construction drawings for residential
      and commercial interior design projects. PREREQUISITE(S): IDES 101 and IDES 110 or ARCH
      103, or consent of the interior design coordinator. COREQUISITE(S): IDES 123L. Assessment
      Level(s): ENGL 101/ENGL 011, MATH 050. Two hours lecture, four hours studio each week. May
      not be taken concurrently with MATH 017, MATH 020, MATH 030, MATH 045 without appropriate
      Math assessment score.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [IDES101], any_of: [[IDES110, ARCH103]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: IDES221
    name: "Interior Design: Residential"
    description: >-
      (R only) To develop the student's concepts and ideas by designing the interior spaces of
      an apartment and house. Analysis of aesthetics of style, function, and space culminating
      in finished perspective rendering in color, floor plan, sample boards, and cost estimates.
      PREREQUISITE(S): IDES 111 and IDES 118, IDES 123 or ARCH 183. Two hours
      lecture/discussion, four hours studio each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [IDES111, IDES118], any_of: [[IDES123, ARCH183]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: IDES222
    name: "Interior Design: Commercial/Contract"
    description: >-
      (R only) The design and planning of public interiors and commercial spaces such as
      offices, stores and/or showrooms. Students learn to analyze and organize the elements of
      interior design and cost estimates, including the role of function and structure in space
      planning and lighting. Focus is on interiors systems, technical project presentations,
      codes, and teamwork. PREREQUISITE(S): (IDES 111 and IDES 118) and (ARCH 183 or IDES 123).
      Two hours lecture, four hours studio each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [IDES111, IDES118], any_of: [[ARCH183, IDES123]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: IDES234
    name: "Textiles"
    description: >-
      (R only) An introduction to textiles and materials used for interior applications and
      their historical development. Fibers, weaves, textures, piles, dyes, printing, finishes,
      codes, environmental issues, and scientific testing will be studied. Field trips required.
      Assessment Level(s): ENGL 101/ENGL 011. Three hours lecture, two hours laboratory/studio
      each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: IDES240
    name: "Textiles, Materials, and Finishes for Interior Design"
    description: >-
      (R only) Introduction to interior materials and finishes. Research, specification, and
      installation. Environmental impact and human health and well-being. History and role of
      decorative arts. Showroom visits and product representative demonstrations. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours lecture each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: IDES243
    name: "Kitchen Design"
    description: >-
      (R only) The design of kitchens using National Kitchen and Bath Association (NKBA)
      guidelines and graphic standards. Mechanical, electrical, and plumbing requirements are
      analyzed and incorporated into design. Students must demonstrate drafting skills and
      knowledge of space planning and design or meet prerequisites. PREREQUISITE(S): IDES 101
      and IDES 110 or consent of interior design coordinator. One hour lecture, one hour
      laboratory each week.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
