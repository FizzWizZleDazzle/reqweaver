  # --- CMGT ----------------------------------------------------------------
  - id: CMGT100
    name: "Construction Methods and Materials"
    description: >-
      (R only) Covers the characteristics, specifications, properties, terminology, and use of
      construction materials. The course emphasizes principles and methods for the selection and
      application or installation of materials and building components rather than development
      and production of materials. Laboratory experiences focus on the analysis, use,
      limitations, testing, and practical application of selected construction materials.
      Assessment Level(s): ELAW 980/ELAR 980. Three hours lecture/discussion, one hour
      laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  - id: CMGT110
    name: "Construction Plan Reading"
    description: >-
      (R only) Covers construction documents, with emphasis on interpreting contract drawings.
      Topics include terminology, symbols, and conventions used in both commercial and
      residential drawings; methods and procedures for reading basic architectural and
      structural drawings; and introduction to mechanical and electrical drawings. Assessment
      Level(s): ELAW 980/ELAR 980. Three hours lecture/discussion, one hour laboratory each
      week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  - id: CMGT135
    name: "Construction Field Operations"
    description: >-
      (R only) Introduces field management from the superintendent's standpoint. Topics include
      job site analysis and planning, utilization of equipment, labor and material coordination,
      records and documentation, field scheduling, safety methods and programs, production
      efficiency and improvement, leadership and motivation, communications, and human
      relations. Site visitations and laboratory experiences supplement class discussions.
      Assessment Level(s): ELAW 980/ELAR 980. Three hours lecture/discussion, one hour
      laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  - id: CMGT190
    name: "Computer Applications in Construction"
    description: >-
      (R only) Reviews software applications in construction project management, administration,
      estimating, scheduling, and cost control. Topics include an introduction to software
      packages used in subsequent courses, and Internet applications in construction. Assessment
      Level(s): ELAW 980/ELAR 980, MATH 050 Two hours lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  - id: CMGT210
    name: "Construction Management"
    description: >-
      (R only) Covers all phases of construction project management. The course introduces the
      procedures, responsibilities, methodology, and techniques utilized in the construction
      management process. Topics include an overview of the construction and design industries,
      company organization, construction contracts and project delivery methods, project
      chronology, bidding procedures, construction estimating, scheduling, cost control, field
      operations, safety standards and procedures, and project administration. The course
      includes a general overview of the use of computers in project management.
      PREREQUISITE(S): CMGT 135 or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[CMGT135]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  - id: CMGT250
    name: "Construction Surveying"
    description: >-
      (R only) Introduces typical surveying methods and layouts. The course emphasizes the
      physical requirements of construction operations as viewed from the project
      superintendent's standpoint in order to maintain control and proper work placement. Topics
      include mathematics and formulas required to perform layout functions; use of layout
      equipment; establishment and measurement of lines and elevations, measurement of angles,
      common building layout; basic grading layout; and coordination of layout and drawings.
      Laboratory focuses on fieldwork, implementation of class theory, and equipment use.
      PREREQUISITE(S): CMGT 100/CMGT 135, and MATH 098; or consent of department. Two hours
      lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [MATH098], any_of: [[CMGT100, CMGT135]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  - id: CMGT270
    name: "Construction Estimating"
    description: >-
      (R only) Introduces methods of construction estimating and estimates. The course covers
      the stages of preparing construction estimates and construction document analysis. Topics
      include an estimator's qualifications and role of the estimating team, the process,
      accuracy, consolidation and bid preparation, submittal, and cost analysis. The course
      emphasizes quantity take-offs of general conditions, sitework, concrete, masonry,
      structural steel, wood and plastics, thermal and moisture control, and finish materials,
      as well as the use of computer estimating. PREREQUISITE(S): CMGT 100, CMGT 110, and CMGT
      190, or consent of department. Assessment Level(s): MATH 050. Three hours lecture, one
      hour laboratory each week. May not be taken concurrently with MATH 017 or MATH 020 or MATH
      030 or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [CMGT100, CMGT110, CMGT190] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "CON5105, CE Adv Construction" }
    grad_tags: [elective]
  - id: CMGT275
    name: "Construction Planning and Scheduling"
    description: >-
      (R only) Reviews and analyzes requirements and preparation of construction planning and
      scheduling. Topics include scheduling techniques in resource leveling, equipment
      allocation, time-cost relationships, and monitoring/controlling work progress. The course
      incorporates the use of computers in the planning and scheduling process. PREREQUISITE(S):
      CMGT 100, CMGT 190, and CMGT 210, or consent of department. Two hours lecture, two hours
      laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [CMGT100, CMGT190, CMGT210] }
    approved: true
