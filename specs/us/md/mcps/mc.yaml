    grad_tags: [elective]
  - id: IDES275
    name: "Interiors: Professional Practicum/Internship"
    description: >-
      (R only) Provides work experience and field study on an actual project related to the
      student's curriculum. Each student drafts a comprehensive record of the work experience
      and discusses it with the interior design adviser. Each student submits a descriptive
      paper, documenting the learning outcomes and benefits of the work, as related to the
      career goals and program objectives. Participation supervised by the instructor and
      appropriate personnel at work. PREREQUISITE(S): Consent of interior design coordinator or
