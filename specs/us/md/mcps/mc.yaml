    name: "Interior Systems"
    description: >-
      (R only) An introduction to the selection and installation of interior kitchen and bath
      systems including plumbing, ventilation, and electrical. Projects are examined and options
      and solutions explored using National Kitchen and Bath Association (NKBA) guidelines.
      PREREQUISITE(S): IDES 111 or consent of interior design coordinator. One hour each week.
