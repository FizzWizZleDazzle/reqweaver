    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT266
    name: "Architectural History: 1400 to Present"
    description: >-
      A historical survey and critical study of the development of architecture and related arts
      from the 15th century to the present. Students in architectural programs are advised to
      take the history of architecture courses in sequence. Students may enroll in ARTT 266
