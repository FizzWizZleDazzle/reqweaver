  - id: TVRA140
    name: "Video Editing"
    description: >-
      An introduction to the equipment and workflow used to create dynamic and engaging videos
      using professional nonlinear editing software. Hands-on projects allow students to edit
      video, along with still images, animations and sounds into presentations suitable for
      visual arts, web, educational, and corporate use. Assessment Level(s): ENGL 101/ENGL 011.
      Two hours lecture, three hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
