    name: "Readings in French Literature II"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A survey of selected French literary works. It includes readings,
      textual analysis, and writing on a broad selection of text from different genres and
      periods. Close reading approach and introduction to literary vocabulary. Conversation and
      composition develop students' abilities in all four language skills: reading, writing,
