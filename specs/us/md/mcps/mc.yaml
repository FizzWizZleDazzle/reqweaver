    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5120, CE Adv Media" }
    grad_tags: [elective]
  - id: TVRA129
    name: "Concept and Story"
    description: >-
      Introduction to concept development and storytelling methods through a variety of writing
      assignments. This course emphasizes the creation of engaging narratives for engaging media
      content. PREREQUISITE(S): A grade of C or better in ENGL 101 or ENGL 101A. Three hours
      each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
