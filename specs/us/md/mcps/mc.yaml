    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: GEOG211
    name: "Political Geography"
    description: >-
      An extensive examination of the political-geographic factors involved in shaping the
      character of world, national, and local political communities. Special emphasis placed on
      the controversial concepts of geopolitics and geostrategy as well as selected contemporary
      problems affecting the viability of modern-day political units. Field tripsand special
