    name: "Constitutional Law"
    description: >-
      A topical study of the development of the U.S. Constitution through interpretation by the
      Supreme Court. Subjects include judicial review, federalism, congressional and
      presidential authority, the First Amendment, criminal rights, due process, and equal
      protection of the law. Assessment Level(s): ENGL 101/ENGL 011, or consent of department.
