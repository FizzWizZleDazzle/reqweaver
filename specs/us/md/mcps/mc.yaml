    credits: 4
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[GDES116, GDES214, PHOT214]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5113, CE Adv Graphic Design" }
    grad_tags: [elective]
  - id: GDES220
    name: "Typography I"
    description: >-
      Typography is introduced as both an art form and visual communication tool. Students will
      gain an understanding of the historical, technical, and practical aspects of typography,
      including a solid foundation in type classification and measurements systems. Students
      will produce compositions in a variety of formats emphasizing original solutions to
      problems concerning the organization of textual information. PREREQUISITE(S): ARTT 100 and
      ARTT 102, GDES 116, or consent of department. Assessment Level(s): ENGL 101/ENGL 011. Two
      hours lecture, three hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ARTT100, ARTT102, GDES116] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5113, CE Adv Graphic Design" }
    grad_tags: [elective]
