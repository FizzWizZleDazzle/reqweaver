  - id: TVRA210
    name: "Audio and Video Podcasting"
    description: >-
      (R only) The art of storytelling using research, professional audio techniques and in some
      cases video technology. Students in this course develop interviewing skills and advanced
      sound recording techniques to create a series of short-form podcasts for distribution on a
      podcast hosting site. Content creation includes qualitative methods of documenting an
      event or investigating an issue. PREREQUISITE(S): A grade of C or better in TVRA 125 or
      consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
