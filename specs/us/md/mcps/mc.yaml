    grad_tags: [elective]
  - id: BLDG160
    name: "Fundamentals of Plumbing"
    description: >-
      (R only) An introduction to plumbing and the plumbing trade. Topics include material
      identification and selection, tools, water supply and waste systems, pipes and fittings,
      fixtures, plumbing plans reading, and water heaters. Two hours lecture, four hours
      laboratory each week.
    credits: 4
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: BLDG170
    name: "Fundamentals of Refrigeration"
    description: >-
      (R only) An introduction to the theory, principles, and applications of heat transfer as
      applied to refrigeration processes and the compression refrigeration cycle. Topics include
      refrigerants, system performance, tools, tubing and fittings, soldering and brazing, and
      system charging and evacuation. Three hours lecture, two hours laboratory each week.
