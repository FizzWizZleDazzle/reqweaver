  # --- HINM ----------------------------------------------------------------
  - id: HINM115
    name: "Medical Terminology I"
    description: >-
      The basic structure of medical words, including prefixes, suffixes, roots, combining
      forms, and plurals. Pronunciation, spelling, and definition of medical terms. Emphasis on
      building a professional vocabulary required of the beginning medical professional.
      Assessment Level(s): ENGL 101/ENGL 011, MATH 050, or consent of program coordinator. Two
      hours each week. May not be taken concurrently with MATH 017 or MATH 020 or MATH 030 or
      MATH 045 without appropriate Math assessment score.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HINM116
    name: "Medical Terminology II"
    description: >-
      A continuation of HINM 115. Includes medical terminology related to body systems, cancer
      medicine, radiology and nuclear medicine, and pharmacology. PREREQUISITE(S): HINM 115. Two
      hours lecture/discussion each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [HINM115] }
    approved: false
  - id: HINM120
    name: "Concepts of Disease"
    description: >-
      A survey course designed specifically for students enrolled in health programs. General
      principles, classification, causes, and treatment of selected disease processes are
      presented. PREREQUISITE(S): BIOL 130 and BIOL 131 or HINM 115. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOL130], any_of: [[BIOL131, HINM115]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: HINM134
    name: "Healthcare Delivery Systems"
    description: >-
      Introduces the student to the contents of the health record in paper and electronic-based
      formats. The student will analyze, synthesize and evaluate the contents of the health
      record gaining a detailed understanding of documentation requirements, health care data
      sets, data monitoring and compliance reporting, data definitions, vocabularies,
      terminologies, nomenclatures, and dictionaries. The student will comprehend the difference
      between data and information, classification systems and nomenclatures, and primary and
      secondary data sources. This course also provides an introduction to the historical
      development of the health care field and organization of health institutions, the health
      information profession, and health information departments. PREREQUISITE(S): Admission to
      the Health Information Management or Coding Certificate Program. Assessment Level(s): ENGL
      101/ENGL 011, MATH 117. Three hours each week. May not be taken concurrently with MATH 017
      or MATH 020 or MATH 030 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: HINM144
    name: "Health Data Content, Structure and Standards"
    description: >-
      Introduces the student to health data structure, content, and standards including the
      collection and maintenance of health data; application of policies and procedure to ensure
      the accuracy of health data; verification of timeliness, completeness, accuracy, and
      appropriateness of data and data sources for patient care, management, billing reports,
      registries, and databases; collection, maintenance, and reporting of data for clinical
      indices, databases, and registries to meet organizational needs. PREREQUISITE(S):
      Admission to the Health Information Management or Coding Certificate Program. Assessment
      Level(s): ENGL 101/ENGL 011, MATH 117. Two hours lecture, one hour laboratory each week.
      May not be taken concurrently with MATH 017 or MATH 020 or MATH 030 without appropriate
      Math assessment score.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HINM150
    name: "Introduction to Pharmacology"
    description: >-
      Designed to give an overview of pharmacology to the student. Examines the prescription
      drug process (dosage calculation, administrations, and different drug forms) and reviews
      basic federal and state regulations. Focuses on specific disease states and how certain
      drugs work to alleviate and treat the conditions for which they are prescribed. Approaches
      the various drug classes, the actions on physiology, and their relationship to various
      disease states. PREREQUISITE(S): BIOL 130 and BIOL 131 and HINM 115. One hour each week.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOL130, BIOL131, HINM115] }
    approved: false
  - id: HINM154
    name: "Legal and Ethical Issues in Health Information Management"
    description: >-
      A course on the health record as a legal document. The student is introduced to the
      following: healthcare legal terminology, HIPAA (the Health Information Portability and
      Accountability Act), legal requirements for health record documentation, legal and ethical
      issues pertaining to the contents of the health record, privacy, confidentiality and
      security, accreditation/regulatory requirements, risk management, physician credentialing
      and professional ethics. PREREQUISITE(S): Admission to the Health Information Management
      (HIM) or Coding Certificate Program. Assessment Level(s): ENGL 101/ENGL 011. Two hours
      lecture, one hour laboratory each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HINM155
    name: "CPT Coding"
    description: >-
      An introduction to the principles and conventions of CPT/HCPCS clinical classification
      system used in outpatient and physician office settings. Related topics such as ethical
      coding standards, federal rules and regulations, and fraud and abuse definitions/issues
      are included. Students should have a basic knowledge of human anatomy and physiology in
      order to succeed in this coding course. PREREQUISITE(S): HINM 120, and either HINM 115 or
      BIOL 130 and BIOL 131, or consent of program coordinator. COREQUISITE(S): HINM 165. Two
      hours each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [HINM120, BIOL131], any_of: [[HINM115, BIOL130]] }
    approved: false
  - id: HINM165
    name: "ICD-10 Coding"
    description: >-
      An introduction to ICD-10-CM/PCS classification with considerable time spent coding
      diagnoses and procedures. This course will include exposure in abstracting and indexing
      diagnostic and procedure codes as well as retrieving medical information for research.
      PREREQUISITE(S): HINM 120, and either BIOL 130 and BIOL 131 or HINM 115, or consent of
      program coordinator. Three hours lecture, two hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [HINM120, BIOL130], any_of: [[BIOL131, HINM115]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: HINM180
    name: "Health Data Management"
    description: >-
      An introduction to the use of technology in the capture, delivery and analysis of health
      data. The course focuses on the use of electronic health records, data mining, statistical
      collection of health data, quality data management, report generation and health data
      project management. Students interact with simulations of key EHR and HIM tasks.
      PREREQUISITE(S): CMAP 120, HINM 134, HINM 144, HINM 154 with a minimum grade of C. Three
      hours lecture, two hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [CMAP120, HINM134, HINM144, HINM154] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: HINM190
    name: "Supervision of Health Information Services"
    description: >-
      An introduction to the principles of organization and supervision of human, financial and
      physical resources. Topics such as problem solving, conflict resolution, leadership,
      decision-making skills, budget creation and analysis, contract evaluation, team-building
      techniques, staffing and productivity management, information governance,
      regulatory/accreditation compliance, and quality management techniques are presented in
      this course. PREREQUISITE(S): CMAP 120, HINM 134, HINM 144, and HINM 154. Two hours
      lecture, one hour laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [CMAP120, HINM134, HINM144, HINM154] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: HINM200
    name: "Professional Practice Experience I"
    description: >-
      Supervised practice in a health information department. The student will perform functions
      related to the analysis and reporting requirements for health records, the storage and
      retrieval of health records, and the patient admission process. PREREQUISITE(S): Consent
      of program coordinator. Requires 60 hours of combined supervision on campus and/or in a
      clinical setting.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HINM220
    name: "Advanced Coding and Clinical Documentation Improvement"
    description: >-
      Emphasis on management principles and techniques of clinical classification and
      reimbursement systems in health care settings. The course covers coding competency skills,
      coding quality control and compliance issues, clinical documentation improvement
      strategies and federal government compliance institutions. Other topics include
      reimbursement software applications, data definitions, data security, data compliance and
      regulatory requirements. PREREQUISITE(S): HINM 155 and HINM 165, or consent of program
      coordinator. One hour lecture, four hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [HINM155, HINM165] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: HINM225
    name: "Ambulatory Coding"
    description: >-
      Designed to enhance the student's ability in ambulatory care classification and coding.
      Students apply CPT and ICD coding for outpatient records in a variety of ambulatory
      settings including physician office, emergency room, and outpatient surgery.
      PREREQUISITE(S): HINM 155 or consent of program coordinator. Two hours each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[HINM155]] }
    approved: false
  - id: HINM230
    name: "Revenue Cycle and Reimbursement Management"
    description: >-
      An introduction to electronic patient billing in ambulatory settings using various
      insurance and reimbursement systems. Students prepare health insurance claim forms for
      various types of insurance plans and use this information as a practice management and
      outcomes assessment tool. Additional topics include billing and claims management issues.
      PREREQUISITE(S): Admission to the health information management program or consent of
      program coordinator. Two hours each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HINM271
    name: "Professional Practice Experience II"
    description: >-
      Supervised practice in the following health record functions: release of information,
      supervision, vital records, coding of medical data, data abstracting, DRG coding and
      assignment, and cancer registry activities. PREREQUISITE(S): HINM 120, HINM 155, and HINM
      165, or consent of program coordinator. Requires 120 hours of combined supervision on
      campus and/or in a clinical setting.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [HINM120, HINM155, HINM165] }
    approved: false
  - id: HINM272
    name: "Professional Practice Experience III"
    description: >-
      Provides preparation for the Registered Health Information Technician (RHIT) examination,
      which is taken in the final semester of study. This course focuses on review of all
      competency categories known as domains as outlined by the American Health Information
      Management Association (AHIMA). Students will be required to sit for the AHIMA Registered
      Health Information Technician (RHIT) certification examination and take a mock RHIT
      Examination. PREREQUISITE(S): Consent of program coordinator. PRE- or COREQUISITE(S): HINM
      271 or consent of program coordinator. One lecture hour.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HINM280
    name: "Research in Health Information"
    description: >-
      This course is designed to enhance the student's ability in research methodologies. The
      student will use computerized databases and spreadsheets to prepare a project related to a
      health care topic. Basic computer literacy and keyboarding skills are necessary.
      PREREQUISITE(S): CMAP 120, MATH 117 or MATH 120, or consent of program coordinator. Two
      hours laboratory each week.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[CMAP120, MATH117, MATH120]] }
    approved: false
  - id: HINM285
    name: "Independent Study Health Information Management"
    description: >-
      Provides an opportunity to conduct research in cutting edge Health Information Management,
      professional advancements and/or case studies. For those students where intensive review
      to prepare for the Registered Health Information Technician Certification is required,
      students will be assigned to Health Information Management faculty for guidance and
      supervision. Letter designators in the schedule of classes will distinguish the 1, 2, 3,
      and 4-credit versions of HINM 285. COREQUISITE(S): Current enrollment in the Health
      Information Management program or consent of the program coordinator. Minimum 45 hours of
      work for each credit hour. Variable credit: 1-4 semester hours.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  # --- HIST ----------------------------------------------------------------
  - id: HIST112
    name: "Women in World History"
    description: >-
      (HUMD, GEIR, GEEL, GCP) The course deals with the history of women in Asia, the Middle
      East, Africa, and Latin America in the context of the history of these cultural regions.
      It also addresses some of the common issues facing women in the Third World. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST114
    name: "The World in the 20th Century"
    description: >-
      (HUMD, GEIR, GEEL, GCP) Focuses on global developments: the origins and aftermath of two
      world wars; the birth of mass movements and mass society; the crisis of democracy and the
      rise of communism and fascism; the emergence of the superpowers; modernization, conflicts,
      and revolutions in the non-Western world as well as autonomous processes in Africa, Asia,
      Latin America; North-South relations. Assessment Level(s): ENGL 101/ENGL 011. Three hours
      lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST116
    name: "World History: A Comparative Survey from the Ancient World to A.D. 1500"
    description: >-
      (HUMD, GEIR, GEEL, GCP) One of two related courses (with HIST 117), which may be taken in
      either order. These courses cover the world's great cultures, religious, and political
      systems. They offer the student an opportunity to understand contemporary life in terms of
      the accumulated cultural experiences of the world and to appreciate the growing
      interdependence of modern nations. HIST 116 is a comparative inquiry into the emergence
      and flowering of ancient Near Eastern and Mediterranean civilizations; the Christian
      Middle Ages and Renaissance in Europe; China and the development of Confucianism, Taoism,
      and Buddhism; Hinduism and Indian empires; Islam- its conquests and the rise of the
      Ottoman Empire; civilizations of the Americas, and African developments. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
    exam_equivalent: [AP_WORLD_HISTORY]
  - id: HIST117
    name: "World History: A Comparative Survey from A.D. 1500 to the Present"
    description: >-
      (HUMD, GEIR, GEEL, GCP) One of two related courses (with HIST 116), which may be taken in
      either order. These courses cover the world's great cultures, religious and political
      systems. They offer the student an opportunity to understand contemporary life in terms of
      the accumulated cultural experiences of the world and to appreciate the growing
      interdependence of modern nations. HIST 117 is a comparative course covering autonomous
      local developments in the various parts of the world as well as the settling of the New
      World; the scientific and industrial revolutions and their diffusion; Western dominance of
      the non-Western world and its decline; the rise of mass societies, Marxism, worldwide
      revolutions; the effects of two world wars; the struggles to modernize. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "World History", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
    exam_equivalent: [AP_WORLD_HISTORY]
  - id: HIST146
    name: "History of the Ancient World"
    description: >-
      (HUMD, GEIR, GEEL) A survey of the ancient Near Eastern and Greco-Roman societies and
      cultures in their unique setting, exploring the path that led to the organization of
      cities; written communication; forms of early science and technology; the artistic
      traditions in Mesopotamia and Egypt; a golden age of art, literature, and philosophy in
      Greece; and Roman accomplishments in politics, administration, law, and engineering.
      Assessment Level(s): ENGL 101/ENGL 011. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST147
    name: "History of Europe from the Fall of Rome to the 17th Century"
    description: >-
      (HUMD, GEIR, GEEL) One of two related courses (with HIST 148), which may be taken in
      either order. These courses trace the accumulated experience of Western civilization and
      its worldwide relationships and provide a contextual framework for integrating all areas
      of Western human activity and thought. HIST 147 is an inquiry into the foundations of
      Western civilization and its odyssey to the 17th century. Focuses on areas such as the
      background and the legacy of the ancient world, the distinctive medieval world view, the
      creation of new social and religious ideals during the Renaissance and Reformation,
      relationships between cultural and political institutions, the growth of absolutism and
      constitutionalism, artistic and literary creativity. Assessment Level(s): ENGL 101/ENGL
      011. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
    exam_equivalent: [AP_EUROPEAN_HISTORY]
  - id: HIST148
    name: "History of Europe from the 17th Century to the Present"
    description: >-
      (HUMD, GEIR, GEEL) One of two related courses (with HIST 147), which may be taken in
      either order. These courses trace the accumulated experience of Western civilization and
      its worldwide relationships and provide a contextual framework for integrating all areas
      of Western human activity and thought. HIST 148 spotlights the changes in thought, social,
      economic, and political structures from the Copernican revolution and the Enlightenment
      through the American and French revolutions, the traumas of economic depressions, world
      wars, and the upheavals of the contemporary world. Topics will be examined such as the
      tensions between individual liberty and traditional powers of state and society, the rise
      of ideologies, pressures of industrialism and national identity, the problems of the
      Darwinian hypothesis, the role of women in society, the rise of masses, the disenchantment
      with traditional liberalism and totalitarian alternatives, as well as the reflections of
      these human endeavors and anxieties in the arts and letters of these centuries. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
    exam_equivalent: [AP_EUROPEAN_HISTORY]
  - id: HIST190
    name: "History of Sport in America"
    description: >-
      History of organized sport; America at the Olympics; increased involvement in sports by
      women and minorities-mid-1900s; post-World War II sports, domestic and global; business
      involvement in sports-1960s; collegiate versus professional athletes from the 1970s to the
      present; the state of American sport today. Assessment Level(s): ENGL 101/ENGL 011.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST200
    name: "History of the United States, a Survey Course: from Colonial Times to 1865"
    description: >-
      (HUMD, GEIR, GEEL) One of two related courses (with HIST 201), which may be taken in
      either order. European exploration, settlement, and culture in the British North American
      colonies; movement for independence and constitutional government; foreign relations and
      foreign policy; efforts toward a more democratic and egalitarian society; social,
      cultural, and intellectual growth in the new republic; Western expansion and economic
      development; conflict over slavery and the nature of the union; the Civil War. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "U.S. History", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
    exam_equivalent: [AP_US_HISTORY]
  - id: HIST201
    name: "History of the United States, a Survey Course: from 1865 to the Present"
    description: >-
      (HUMD, GEIR, GEEL) One of two related courses (with HIST 200), which may be taken in
      either order. Post-Civil War Reconstruction; the industrial revolution and rise of the
      city; the new immigration; the social, cultural, and political responses to these changes;
      the emergence of the United States as a more active world power. American society in the
      1920s, the Great Depression, the Cold War, and the controversies over the American role in
      world affairs; new developments in modern American society and culture. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "U.S. History", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
    exam_equivalent: [AP_US_HISTORY]
  - id: HIST205
    name: "History of Technology"
    description: >-
      (HUMD, GEIR, GEEL) (R only) Provides a historical survey of technology and its role in
      human societies. While the course examines human history through the lens of technology,
      it also contextualizes technological developments within broader social, political, and
      cultural frameworks. The course explores themes such as the environment, energy, labor
      issues, public health, the distinction between science and technology, technological
      maintenance versus innovation, social responsibility, ethical values, and the
      contributions of women. Assessment Level(s): ENGL 101/ENGL 011. Three hours
      lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST209
    name: "History of Asian Americans"
    description: >-
      (R only) A historical survey of the diverse experience of Asian Americans in the United
      States. Topics include international context of Asian immigration; immigration and
      livelihood; hostility and conflict; social organization of Asian immigrant communities;
      resistance to oppression; women, families, and cultural dilemma; changing fortunes; new
      immigrants and refugees; the myth of a "model minority"; and other current issues.
      Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST211
    name: "History of Latinos in the United States"
    description: >-
      (HUMD, GEIR, GEEL, GCP) Addresses the historical, cultural, and contemporary experiences
      of six of the major Latino groups in the United States: Mexicans, Cubans, Puerto Ricans,
      Dominicans, Central Americans, and South Americans. Traces the Native American, Spanish,
      and African roots of Latinos and follows their economic, political, and cultural
      development in the United States up to the present. Highlights the similarities and
      differences in the Latino experience of migration and settlement. Assessment Level(s):
      ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST225
    name: "History of Maryland"
    description: >-
      A survey of Maryland political, economic, social, and cultural history from colonial times
      to the present. Special attention is focused on the people who came to Maryland and
      contributed their heritage to the rich social and cultural institutions taking shape in
      this state. Maryland is viewed both as a microcosm of American history and as a unique
      institution with its own special identity. Assessment Level(s): ENGL 101/ENGL 011. Three
      hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST228
    name: "Women in the Western World"
    description: >-
      (HUMD, GEIR, GEEL, GCP) (R only) Surveys the realities and myths of woman's role from the
      ancient world to modern American and European industrial society. It examines the position
      of women in the cultures and social structures at various stages in the development of
      Western history, explores the emergence and growth of the women's rights movement, and the
      modes of continuity and change when new opportunities emerge for women. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST233
    name: "Alternative Lifestyles: 19th Century American Utopias"
    description: >-
      (R only) An examination of various searches for utopian order through communitarian
      experiment in 19th century United States. Major emphasis on religious and secular
      communitarian experiments of the period, for example, Brook Farm, Oneida, and Amana. The
      class will create a constitution for its own model community to conform to the ideals,
      circumstances, and realities of those experiments. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST235
    name: "The History of African Americans to 1865"
    description: >-
      (HUMD, GEIR, GEEL, GCP) One of two related courses (with HIST 236), which may be taken in
      either order, that survey the history of African Americans in America. Topics include
      theories of the origins of human life and civilization in Africa; slavery in the ancient
      and modern worlds; the Atlantic slave trade; slavery in the Americas; the transformation
      of Africans to African Americans; the development of African American culture; the
      antislavery movement; and the attempt of African Americans to make the Civil War a war for
      emancipation. This course does not substitute for HIST 236. Assessment Level(s): ENGL
      101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST236
    name: "The History of African Americans Since 1865"
    description: >-
      (HUMD, GEIR, GEEL, GCP) One of two related courses (with HIST 235), which may be taken in
      either order, that survey the history of African Americans from their beginnings in Africa
      to the present. Topics include the Washington-Du Bois debate, African American
      contributions to the world wars, the Harlem Renaissance, the struggle for equality, and
      strategies for continued economic, political, and social progress. This course does not
      substitute for HIST 235. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST240
    name: "Civil Rights in America"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A survey of the civil rights movement in America from
      post-Reconstruction to the present. Designed to show how the civil rights movement
      transformed America and how the struggle for rights in America has become a struggle of
      communities and individuals trying to weave civil rights into a tapestry of social and
      economic reality. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST242
    name: "Open Topics in History, Including Foreign Travel"
    description: >-
      This course outlines briefly the geographic, economic, political, and cultural background
      of the region in which travel will take place. It focuses on the particular country of the
      journey's destination and examines the scope of its history, culture, and special
      achievements from early times to the present. Special lectures by local professors on
      selected topics at universities, the country's parliament, or other institutions of
      interest are scheduled in addition to visits to museums and the country's most outstanding
      sites.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST245
    name: "Latin American History"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A brief historical survey from Cortes to Castro: Latin America's
      triple origin in Iberia, Africa, and Indian civilization; the conquest and three centuries
      of colonial existence as determinants of nationality and culture; the political break with
      Europe and the development of independent national life. Emphasis on economic development,
      agrarian reform, and 20th century movements for political and social change in the major
      states and upon relations with the United States. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST247
    name: "East Asian Civilization"
    description: >-
      (HUMD, GEIR, GEEL, GCP) An interdisciplinary survey of the development of civilization in
      China, Japan, and Korea from prehistory to early seventeenth century. Topics for
      discussion include society, economy, politics, religion, philosophy, literature, art,
      science, and technology. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST250
    name: "Modern Asia"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A survey of the political, economic, and social changes of Asian
      societies, mainly from the 16th century to the present. The course emphasizes the creation
      of modern Asia by the West and the response of Asian societies to Western impact.
      Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST252
    name: "The United States and 20th Century World Affairs"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A study of the emergence of the United States as a more active and
      involved world power from the presidency of Theodore Roosevelt to the present. More than a
      study of diplomatic history, this course gives much attention to the internal debates and
      struggles over foreign policy-neutrality, internationalism, the peace movements,
      isolationism, and interventionism. Aspects of social, political, and economic history are
      examined in terms of their relationship to and impact upon the nation's foreign relations.
      Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST255
    name: "Modern Middle East"
    description: >-
      (HUMD, GEIR, GEEL, GCP) Surveys key historical moments, from the decline of the Ottoman
      Empire and the impact of imperialism to the rise of nationalism and state formation
      through the present. This course examines major political, social, cultural, and
      intellectual developments. While political narratives often dominate discussions of the
      region, HIST 255 takes a broader approach, exploring Middle Eastern history not only
      through a sociopolitical lens but also through science, technology, gender dynamics,
      ethnolinguistic diversity, art, sports, and cinema. Through this course, students gain a
      deeper understanding of the Middle East's complexities and diversity while engaging with
      multiple perspectives and challenging monolithic portrayals. Assessment Level(s): ENGL
      101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST257
    name: "Modern Military History 1494-1815"
    description: >-
      Surveys European military history within a broad framework through which the student may
      view many aspects of historical events and human behavior. The course includes an
      examination of theoretical concepts and debates over the analysis of warfare in history.
      Topics include: the dynastic wars of the 15th to the 18th centuries, the Thirty Years War,
      colonialism, the American and French Revolutions, and the Napoleonic Wars. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST258
    name: "Modern Military History 1815-Present"
    description: >-
      Surveys European military history within a broad framework through which the student may
      view many aspects of historical events and human behavior. The course includes an
      examination of theoretical concepts and debates over the analysis of warfare in history.
      Topics include: the financial, strategic, tactical, and technological developments of
      warfare; new imperialism; total war; race and gender; terrorism; and torture. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST260
    name: "The United States since 1945"
    description: >-
      An intensive examination of the American experience since World War II. The course will
      highlight America's emergence as a "superpower" and its expanding role in the world; the
      movements of the 1950s and 1960s to expand the civil rights of women and minorities in our
      society; the growth of the federal government in the postwar era and critiques of that
      expansion; and the cultural experience of the United States since World War II, with
      particular emphasis on the shocks of the 1950s and 1960s. Assessment Level(s): ENGL
      101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST262
    name: "The History of England from 55 B.C. to 1688"
    description: >-
      (HUMD, GEIR, GEEL) One of two related courses (with HIST 263), which may be taken in
      either order. These courses survey the history of England from Roman Britain to the
      present. Emphasis is on the development of uniquely English institutions as well as
      political, legal, social, intellectual, imperial, and economic history. They offer the
      student the opportunity to understand the history of a country that has had a unique and
      lasting impact on American history and culture. HIST 262 is an inquiry into the history of
      England from Roman Britain until the advent of the Glorious Revolution in 1688. Several
      themes will be highlighted, including the formation of the English nation, conversion to
      Christianity, the development of the Church as a distinctive national institution,
      feudalism, political centralization, the effects of the Renaissance and Reformation,
      overseas expansion, and the achievement by 1689 of responsible parliamentary government.
      Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST263
    name: "The History of England from 1688 to the Present"
    description: >-
      (HUMD, GEIR, GEEL, GCP) One of two related courses (with HIST 262), which may be taken in
      either order. These courses survey the history of England from Roman Britain to the
      present. Emphasis is on the development of uniquely English institutions, as well as
      political, legal, social, intellectual, imperial, and economic history. It offers the
      student the opportunity to understand the history of a country that has had a unique and
      lasting impact on American history and culture. HIST 263 is a survey of the history to
      Great Britain from the Glorious Revolution through the early 1980s. The course will trace
      several themes, including the change from a pre-modern to a modern society, the rise and
      fall of the British Empire, the development of cabinet government and limitations upon the
      power of the monarchy, the emergence of an identifiable working class as well as the
      industrial revolution, mass culture, the Irish Question, and the question of Britain's
      decline overall in the 20th century. Assessment Level(s): ENGL 101/ENGL 011. Three hours
      each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST265
    name: "African History to 1800"
    description: >-
      (HUMD, GEIR, GEEL, GCP) One of two related courses (with HIST 266), which may be taken in
      either order. This course examines African history from early times until the end of the
      Atlantic slave trade with special attention paid to the political, social, and economic
      sectors of pre-colonial Africa. Topics for discussion include the origin of humankind; the
      development and expansion of early large states across Africa; and the establishment of
      early trade networks among Africa, Europe, and the Arab world. Assessment Level(s): ENGL
      101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: HIST266
    name: "African History from 1800"
    description: >-
      (HUMD, GEIR, GEEL, GCP) One of two related courses (with HIST 265), which may be taken in
      either order. This course examines African history from 1800 to the present. It also
      includes studies of African societies in the first half of the 19th century; the impact of
      "New Imperialism" and the scramble for Africa by Europeans at the end of the century;
      colonial states and societies; African nationalist and independent movements; the impact
      of decolonization; and Africa in the modern world. Additional case studies focus on
      individual areas such as South Africa and Nigeria. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  # --- HLTH ----------------------------------------------------------------
  - id: HLTH100
    name: "Principles of Healthier Living"
    description: >-
      A study of current health issues focused on information for making prudent personal health
      decisions. Course explores lifestyle wellness and preventive medicine concepts and
      practices. Includes mental, social, sexual, physical, and environmental health topics.
      Assessment Level(s): ENGL 101/ENGL 011. One hour each week.
    credits: 1
    level: college
    tags: [health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HLTH105
    name: "Personal and Community Health"
    description: >-
      (GEIR, GEEL) Examines the meaning and significance of physical, mental, and social health
      as related to the individual, society, and the influence they have on each other's
      behavior and function. The student will use a variety of methods to collect, analyze,
      interpret, and apply data and information as it relates to health behaviors and the
      outcomes of these behaviors have on college students, young people, and the local and
      global communities. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "Health (1.0 MCPS Credit: Health A/B)", synergy: "HPE5114, CE Adv Health" }
    grad_tags: [elective]
  - id: HLTH113
    name: "First Aid and CPR"
    description: >-
      Theory and practical application of standard and advanced techniques of first aid and
      cardiopulmonary resuscitation (CPR). Students will learn how to recognize the signs and
      symptoms of injuries and sudden illness, how to recognize a life-threatening emergency,
      how to provide basic life support, and what to do in the case of an airway obstruction or
      choking. Students will gain the necessary skills for the administration of CPR to adults,
      children and infants, and learn how to use an automated external defibrillator (AED).
      Information on how to deal with emergencies like shock, burns, strokes, seizures, and
      other medical emergencies will be covered. Course consists of lecture, discussions,
      demonstrations, safety education, and practical work as suggested by OSHA, the American
      Red Cross, National Safety Council, American Academy of Orthopedic Surgeons, and/or
      American Heart Association. Upon successful completion of the course, students will
      receive nationally recognized First Aid and CPR course completion cards. Assessment
      Level(s): ENGL 101/ENGL 011. Two hours each week.
    credits: 2
    level: college
    tags: [health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HLTH121
    name: "Nutrition for Fitness and Wellness"
    description: >-
      (GEIR, GEEL) An overview of the scientific principles of nutrition and weight management
      with particular application to fitness and sport. The focus is on optimal wellness and
      disease prevention. Nutritional and body composition guidelines will be critically
      examined in order to personalize them for the individual as well as for high-level
      participants in a variety of fitness activities. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: HLTH125
    name: "Personalized Health Fitness"
    description: >-
      (GEIR, GEEL) An introduction to basic nutrition, exercise science and wellness principles
      which contribute to a healthy lifestyle. Students will demonstrate and understanding of
      how these scientific principles contribute to the prevention and management of disease.
      Through this course, students will learn the basic anatomy and applied physiology
      necessary to develop and implement an individualized fitness and wellness plan to achieve
      a healthier lifestyle. Assessment and class activities will allow students to collect and
      analyze data, evaluate results and apply skills in a practical setting. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [pe, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "Physical Education", synergy: "HPE5122, CE Adv Physical Education" }
    grad_tags: [pe]
  - id: HLTH131
    name: "Drugs and Lifestyle Wellness"
    description: >-
      (BSSD, GEIR, GEEL) An overview of the cultural drug phenomenon, its impact on society as
      well as the individual's quality of life. Course content includes physiological and
      psychological effects of the use and abuse of street, over-the-counter, prescription, and
      other drug substances. Additionally, wellness lifestyle strategies will be examined as
      methods to avoid all types of chemical dependency. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: HLTH150
    name: "Fitness and Nutrition for Weight Management"
    description: >-
      (GEIR, GEEL) Focus on strategies for a healthier lifestyle; the physiological,
      sociological, psychological aspects of weight management including an understanding of
      health behaviors. Topics include an explanation of nutritional behaviors and fundamentals,
      the impact of lifestyle behaviors on weight management and an understanding of the impact
      of physical and social environments on a healthy lifestyle. Learn to assess and evaluate
      various weight loss programs and critique information coming from the media. Students will
      complete assessments, lifestyle evaluation and develop behavior change programs to address
      all aspects of weight management including impact on self, family, and society. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: HLTH160
    name: "The Science and Theory of Health"
    description: >-
      (BSSD, GEIR, GEEL) (R only) Introduces students to approaches for improving the health of
      individuals and communities locally and around the world through health education, health
      promotion, and public health practice. Students examine risk factors for disease and
      disability in various populations, the impact society, culture, and behavior have on a
      population's health status, and strategies to reduce the risk for disease and hence
      improve the health of individuals and communities. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: HLTH170
    name: "Introduction to Aging"
    description: >-
      (BSSD, GEIR, GEEL, GCP) (R only) An introduction to the study of the aging process.
      Personal and societal myths about older adults and the process of aging will be confronted
      via examination of demographic data, sociological trends, anatomical/physiological
      changes, and psychological issues such as memory, cognition, and personality. The
      influence of factors such as race, economics, globalization, living environment, long-term
      care, and health policy, as they impact quality of life will also be addressed. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: HLTH200
    name: "Health Issues in Human Sexuality"
    description: >-
      (GEIR, GEEL, GCP) An introduction to the health issues of human sexuality, including, but
      not limited to, reproduction and contraception, sexually transmitted diseases, health
      issues for special populations, and sexual health through the life span. In this course,
      we will provide students with information that will empower them to make responsible and
      appropriate decisions regarding their sexual behavior. This course will focus on the
      health aspects of sexual behavior. Sexuality is a multifaceted and interdisciplinary
      topic; however, emphasis in this course is on health issues from a healthy lifestyle
      perspective. Students interested in exploring the psychological nature of sexuality are
      encouraged to enroll in PSYC 206, Psychology of Human Sexuality. Assessment Level(s): ENGL
      101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: HLTH212
    name: "Controlling Stress and Tension"
    description: >-
      (BSSD, GEIR, GEEL) A basic understanding of the physiology and psychology of the stress
      response and how stress affects individuals will be the focus of this course. Course
      topics include physiology of the stress response and its effect on wellness especially
      physical and mental health; current theoretical models concerning sources of stress,
      coping and adapting; and strategies for the prevention and management of stress. Students
      will have opportunities for self-assessment and development of personalized coping
      strategies. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: HLTH215
    name: "Women's Health"
    description: >-
      (GEIR, GEEL, GCP) An introduction to the study of the diverse yet interconnected factors
      which affect the health of women. Women's health includes the study of female biology and
      reproductive health but it also incorporates the psychological and social issues which
      impact the quality of life for women around the world. Assessment Level(s): ENGL 101/ENGL
      011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: HLTH220
    name: "Emergency Medical Responder"
    description: >-
      Provides a comprehensive study of emergency care principles and procedures. Course
      includes basic human anatomy, disease pathophysiology, mechanisms of trauma, drug actions;
      CPR and Automated External Defibrillator; management of bleeding and injuries; and care of
      special patients including obstetric, pediatric, and elderly. Students must pass all
      competency exams with a score of 70% or better and achieve an overall course grade of "C"
      or better to receive Emergency Medical Responder and Health Care Provider CPR
      certifications. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: HLTH225
    name: "Introduction to Health Behaviors"
    description: >-
      (BSSD, GEIR, GEEL) (R only) An intersection of psychology, biology and health. It is the
      study of the mind-body connection. This course explores health risk behaviors, health
      protective behaviors and the underlying processes and mechanisms by which health related
      decisions are made. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: HLTH250
    name: "Emergency Medical Responder Refresher"
    description: >-
      (R and TP/SS only) Refresher course for those who possess current Emergency Medical
      Responder and Healthcare Provider or Professional Rescuer CPR certifications. Students
      must pass competency exams with a score of 70% or better to receive Emergency Medical
      Responder and Healthcare Provider CPR certifications. PREREQUISITE(S): Current Emergency
      Medical Responder and Healthcare Provider or Professional Rescuer CPR certifications and
      consent of department. Assessment Level(s): ENGL 101/ENGL 011. One hour each week.
    credits: 1
    level: college
    tags: [health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HLTH297
    name: "Community Health Worker (CHW) Practicum"
    description: >-
      In-service training and practical experience, totaling a minimum of 45 hours. The 40-hour
      practicum experience will take place in an approved health or clinical education setting.
      Students will spend five additional hours meeting with a full-time faculty member to
      develop goals and objectives for their practicum experiences and spend time in training
      and preparation for the onsite clinical practicum. Students will keep a journal of their
      accomplishments and will submit a final reflection analyzing their overall experiences.
      PREREQUISITE(S): HLTH 105. PRE- or COREQUISITE(S): HLTH 160, HLTH 225, HLTH 298. 40 hours
      in-service, 5 hours on-campus for clinical training. Five hours lecture, 40 hours
      practicum.
    credits: 1
    level: college
    tags: [health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [HLTH105] }
    approved: false
  - id: HLTH298
    name: "Global Health Capstone"
    description: >-
      Expand knowledge of public health into a broader perspective of globalization. Embedded
      within the course will be what the public health model is and how it applies personally,
      professionally and globally. Lectures structured around the sustainable health goals built
      on the success of the Millennium health goals to help transform our world. The course will
      expand concepts of socioeconomic status, inequalities, and the impact on health among low,
      moderate, and high-income countries. Student will have the opportunity to analyze the
      sustainable health goals as they relate to one's own choices, education, and background.
      This course will give the students a broad perspective to evaluate future decisions of
      occupation in the public health field. PREREQUISITE(S): HLTH 160 and HLTH 225. Three hours
      each week.
    credits: 3
    level: college
    tags: [elective, health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [HLTH160, HLTH225] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: HLTH299
    name: "Capstone in Public Health Sciences"
    description: >-
      This capstone course provides students with an opportunity to further explore the
      dimensions of health and wellness and how they relate to the individual and society. This
      course will examine current national and local health issues, and strategies for tackling
      these problems at the community and national level. As part of the course, students will
      complete a capstone project that will allow them to assess the risk factors for a disease,
      its impact on the quality of life of a person with the disease, as well as construct
      intervention strategies to enhance the person's quality of life. This course must be taken
      in the last semester prior to completion of the degree program. PREREQUISITE(S): HLTH 160,
      and HLTH 225, and consent of department. One hour each week.
    credits: 1
    level: college
    tags: [health]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [HLTH160, HLTH225] }
    approved: false
  # --- HMGT ----------------------------------------------------------------
  - id: HMGT100
    name: "Customer Service in the Hospitality Industry"
    description: >-
      An examination of the role of customer service for lodging and food service operations,
      large and small. Course stresses understanding customer wants and needs, interaction with
      customers, customer service support, handling difficult situations, and building long-term
      relationships with customers. Assessment Level(s): ENGL 101/ENGL 011. One hour each week.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HMGT101
    name: "Introduction to the Hospitality Industry"
    description: >-
      (R only) Introduction to the hospitality field including the historical development,
      opportunities and challenges, current trends, and regulations governing the industry.
      Analysis of functions performed at the three levels of organization within the
      hotel-institutional organization and the role of domestic and international chains.
      Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CHT5115, CE Adv Hospitality Mngt" }
    grad_tags: [elective]
  - id: HMGT105
    name: "Food Service Sanitation"
    description: >-
      (R only) This course meets the 15 clock hours plus test required by the Maryland State
      Department of Health and Mental Hygiene. Topics include foodborne diseases, importance of
      employee personal hygiene and habits, and approved procedures for handling utensils and
      equipment. One hour each week.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HMGT107
    name: "Food and Beverage Management"
    description: >-
      Study of volume of food and beverage setup and service management. Analysis of quantity
      food operations, menu construction, raw material estimates, food storage facilities, and
      related use of institutional food and beverage service equipment. Emphasis on various
      types of table setup and service as required for different functions. Assessment Level(s):
      ELAW 970/ELAR 970, ELAR 980/IERW 002. Two hours lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CHT5115, CE Adv Hospitality Mngt" }
    grad_tags: [elective]
  - id: HMGT110
    name: "Principles of Food Production- Lecture"
    description: >-
      (R only) The study of basic principles of cookery, standardization of recipes, and
      production techniques. COREQUISITE(S): HMGT 111. Two hours each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HMGT111
    name: "Principles of Food Production- Laboratory"
    description: >-
      (R only) Production, presentation, and evaluation of foods as related to commercial
      kitchens. COREQUISITE(S): HMGT 110. Four hours laboratory each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: HMGT143
    name: "Management of Front Office Operations"
    description: >-
      A study of methods and procedures used by managers of front office operations. Review and
      analysis of the guest cycle, maintaining proper guest records, including registration,
      cashiering, reservations, credit accounting, and auditing. Review of personnel
      requirements, including job duties and responsibilities of staff and managers. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CHT5115, CE Adv Hospitality Mngt" }
    grad_tags: [elective]
  - id: HMGT201
    name: "Lodging and Food Service Law"
    description: >-
      History of laws governing innkeeping from early times to present; host responsibilities to
      guest and guest to innkeeper; protection of guest's health, life, and safety; theories of
      innkeeper's liability for negligence, evictions, crimes, dangers, and accidents; lien
      rights; equitable charges; house rules and regulations. Assessment Level(s): ENGL 101/ENGL
      011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CHT5115, CE Adv Hospitality Mngt" }
    grad_tags: [elective]
  - id: HMGT204
    name: "Catering and Banquets"
    description: >-
      (R only) Study of the planning and operation of catering facilities in hotels and as an
      independent business. Includes preparation, presentation, and service of food for catered
      events. PREREQUISITE(S): HMGT 110 and HMGT 111 or consent of department. Two hours
      lecture, three hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [HMGT110, HMGT111] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "CHT5115, CE Adv Hospitality Mngt" }
    grad_tags: [elective]
  - id: HMGT207
    name: "Legal Issues in Labor Management"
    description: >-
      Introduction to the legal implications of employer/employee relations. Topics include a
      brief history of the labor movement in the United States, the major acts establishing the
      framework for labor/management relations, union negotiations, procedures and contracts,
      and the economic impact of unionization. Discrimination in employment, Title VII and its
      implications in hiring, firing, and working conditions, as well as other statutes and
      regulations affecting employment relations. PREREQUISITE(S): HMGT 211 or consent of
      department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[HMGT211]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "CHT5115, CE Adv Hospitality Mngt" }
    grad_tags: [elective]
  - id: HMGT208
    name: "Food and Beverage Cost Controls"
    description: >-
      (R only) Emphasis on additional food and beverage service dealing with problem areas
      stressing personnel aspects. On-the-job personnel placement, control, supervision, and
      training. Analysis of cost control elements and budgeting implications. PREREQUISITE(S):
      HMGT 107 or consent of department. Two hours lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[HMGT107]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "CHT5115, CE Adv Hospitality Mngt" }
    grad_tags: [elective]
  - id: HMGT211
    name: "Supervision and Leadership in the Hospitality Industry"
    description: >-
      An examination of the management/supervision/leadership responsibilities in the typical
      lodging and/or food service establishment. Course stresses leadership, communication,
      morale, motivation, training, team building, and employee development and retention unique
      to lodging and food service operations. Assessment Level(s): ENGL 101/ENGL 011. Three
      hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CHT5115, CE Adv Hospitality Mngt" }
    grad_tags: [elective]
  - id: HMGT212
    name: "Managing Hospitality Human Resources"
    description: >-
      (R only) An examination of the managerial human resources function of the typical lodging
      and/or food service operation. Topics include job analysis and job design, planning,
      recruiting, hiring, orientation, training, and evaluating personnel. Staff turnover,
      discipline, exit interviews, compensation and benefit plans will also be discussed.
      PREREQUISITE(S): HMGT 211 or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[HMGT211]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "CHT5115, CE Adv Hospitality Mngt" }
    grad_tags: [elective]
  - id: HMGT220
    name: "Hotel Operations"
    description: >-
      An examination of hotel ownership and management structures within different types of
      hotel and lodging operations. Students will learn about the various roles and
      responsibilities of managers within hotel operations. Students will learn how each of the
      operating departments of a typical hotel work and how the departments interrelate and work
      with one another to deliver exceptional guest service and experience. Students will learn
      about the major operating departments in a hotel that include housekeeping, front office,
      guest services, reservations, food and beverage, sales and marketing, conference and
      banquets, spa and fitness facilities, accounting, human resources, purchasing, information
      systems and technology, maintenance and engineering, security, revenue management, as well
      as the executive and administrative offices. Assessment Level(s): ENGL 101/ENGL 011. Three
      hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CHT5115, CE Adv Hospitality Mngt" }
    grad_tags: [elective]
  - id: HMGT240
    name: "Lodging and Food Service Sales and Advertising"
    description: >-
      (R only) Concepts of publicity, communications, public recognition, and goodwill. Stresses
      methods of developing advertising, merchandising, and profitable use of the media.
      Attention to the use of convention and group sales, catering, and banquet sales and the
      importance of promotion in general to build an attractive public image. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CHT5115, CE Adv Hospitality Mngt" }
    grad_tags: [elective]
  - id: HMGT250
    name: "Meeting, Conference, and Event Planning"
    description: >-
      The growing field of meeting and event planning is discussed in detail. Starting with an
      overview of the nature of meetings and why people meet, the course will look at a variety
      of topics, including site selection, contract negotiating, program planning, budgeting and
      financial management, food and beverage arrangements, and contracted services. A review of
      the meeting and event planner's job description is also provided. Assessment Level(s):
      ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CHT5115, CE Adv Hospitality Mngt" }
    grad_tags: [elective]
  - id: HMGT290
    name: "Hospitality Practicum"
    description: >-
      (R only) In-service training and practical experience, totaling a minimum of 120 hours in
      an approved hospitality operation, lodging, commercial food service, institutional food
      service, meeting planning, or the related travel and tourism field. Requires a minimum of
      10 hours of seminars with case study analysis. PREREQUISITE(S): Consent of department.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "CHT5115, CE Adv Hospitality Mngt" }
    grad_tags: [elective]
  - id: HMGT299
    name: "Special Topics in Hospitality Management"
    description: >-
      These courses focus on varied topics within the hospitality industry. The topics are
      presented as a result of industry driven demands, trends, or technology advancement or
      student interest, that include a variety of hospitality industry required skills or
      intensive study in a specific area of the hospitality industry and all that it
      encompasses. Topics are announced each semester in the class schedule. Course may be
      repeated for different topics. Minimum of 15 hours of instruction for each credit hour.
      PREREQUISITE(S): Consent of department. One to three hours each week. Variable credit: 1-3
      semester hours.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  # --- HMLS ----------------------------------------------------------------
  - id: HMLS201
    name: "Introduction to Homeland Security"
    description: >-
      Provides insight into the complex nature of homeland security through an interdisciplinary
      approach. Threats to homeland security, including natural and technological disasters, as
      well as intentional threats of domestic and international terrorism, including weapons of
      mass destruction, are examined. Assessment Level(s): ENGL 101/ENGL 011. Three hours each
      week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: HMLS202
    name: "Introduction to Terrorism"
    description: >-
      Introduces terrorism, ranging from low-level acts of threats and acts of violence that may
      represent significant risk to human life and property to large-scale acts of violence
      using "weapons of mass destruction" that may have devastating, long-term effects.
      Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: HMLS210
    name: "Critical Infrastructure Protection"
    description: >-
      This course provides an introduction to the policy, strategy, and practical application of
      critical infrastructure protection from an all-hazards perspective. The focus of this
      course is the predominant infrastructure sectors such as water, energy, power,
      telecommunications, Internet and cyber infrastructure. PRE- or COREQUISITE(S): HMLS 201.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: HMLS211
    name: "Introduction to Intelligence Studies"
    description: >-
      Provides a comprehensive overview of intelligence and security issues confronting the
      United States today. The course will focus on intelligence and security issues, the
      functions of the intelligence world - intelligence collection, counterintelligence,
      information management, critical thinking, and decision-making. It also covers such vital
      issues as laws and ethics and the emerging threats and challenges that intelligence
      professionals will face in the future. PRE- or COREQUISITE(S): HMLS 201. Three hours each
      week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
  - id: HMLS212
    name: "Current Issues in Homeland Security"
    description: >-
      Covers timely issues such as Human Trafficking, Cybersecurity and Cyber Crime, Border and
      Port Security, terrorist movements and other relevant topics. Students will reference
      recent publications and other resources for topics covered. PRE- or COREQUISITE(S): HMLS
      201. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
    grad_tags: [elective]
