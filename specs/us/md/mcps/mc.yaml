      of 2-D animation, use of storyboards, 2-D animation techniques, and the employment market
      and business practices. PREREQUISITE(S): None. Digital Animation majors should take GDES
      134 concurrently, or prior to taking this course. Two hours lecture, four hours laboratory
      each week.
