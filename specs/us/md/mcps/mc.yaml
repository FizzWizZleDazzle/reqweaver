  - id: TVRA234
    name: "Television Directing"
    description: >-
      (R only) An Introduction to television directing with an emphasis on planning, rehearsing,
      set design, lighting, and directing a variety of complex production situations. The
      objective is to accumulate techniques and best practices, as applied to the media
      production industry, social media, and the Internet. PREREQUISITE(S): A grade of C or
