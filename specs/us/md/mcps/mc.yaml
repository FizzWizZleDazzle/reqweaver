  - id: TECH276
    name: "JavaScript Fundamentals"
    description: >-
      A study of JavaScript language used to create dynamic and interactive web content. In this
      introductory course, students will learn the fundamentals of working with the behavior
      layer of web development using JavaScript. Students will learn scripting basics. the
      principles of unobtrusive and cross browser scripting, how to navigate and manipulate the
      Document Object Model (DOM), and how to use JavaScript libraries to improve web
