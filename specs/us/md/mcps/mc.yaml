  - id: PHED166
    name: "Personal Fitness I"
    description: >-
      An individualized self-paced fitness course with emphasis on improving the health-related
      components of physical fitness. Principles of conditioning will be applied to develop a
      personalized training program to enhance cardiovascular conditioning, strength and
      muscular endurance, flexibility, and body composition. Assessment Level(s): ELAI 990/ELAW
      980/ELAR 980, IERW 002. May not be taken in the same semester as PHED 170 or PHED 171. Two
      hours each week.
    credits: 1
    level: college
    tags: [pe]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: PHED167
    name: "Personal Fitness II"
    description: >-
      An individualized exercise program will be utilized to continue the maintenance and
      improvement of the health-related components of physical fitness. Includes concepts and
      methods associated with sustaining motivation and developing a lifestyle adherence to
      exercise. PREREQUISITE(S): PHED 166. Two hours each week.
