    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT274
    name: "Indigenous Art of the Americas"
    description: >-
      (ARTD, GEIR, GEEL) An introduction to visual art and culture created by indigenous peoples
      of the Western Hemisphere. The course explores the diverse artistic production, histories,
      and cultural contexts of indigenous art from North, Central and South America and the
      Caribbean. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: ARTT275
    name: "Art of the Renaissance World"
    description: >-
      (ARTD, GEIR, GEEL, GCP) A survey of Renaissance art and its global impacts during the 15th
      and 16th centuries. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT277
    name: "African American Art"
    description: >-
      A survey of art produced by people of African descent in the United States, South America,
      and the Caribbean from the 16th century to the present. The course explores the art of the
      African diaspora in the Western Hemisphere with a focus on the social, political, and
      aesthetic contexts of its production. Assessment Level(s): ENGL 101/ENGL 011. Three hours
      lecture each week.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: ARTT278
    name: "Art of the United States"
    description: >-
      (ARTD, GEIR, GEEL, GCP) A survey of art produced in the United States and its territories
      from the colonial period to the present. Considers the central role of artistic production
      in the construction and dissemination of American identities and culture. Explores the art
      of the United States in its global, regional, and multicultural contexts. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT280
    name: "Global Modernisms: Art of the 20th Century"
    description: >-
      (ARTD, GEIR, GEEL) A global survey of Modern art and artists from the late 19th and 20th
      centuries considered in social and historical contexts. Assessment Level(s): ENGL 101/ENGL
      011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
