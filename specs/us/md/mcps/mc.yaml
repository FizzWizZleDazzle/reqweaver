    name: "Preserving Our Natural Heritage: The Geography of Conservation and Natural Resources"
    description: >-
      This course will explore issues in conservation responsibilities and concepts relating to
      environmental and natural resources including soils, minerals, water, forests, pollution,
      wildlife, natural hazards, aesthetics, and human interaction. Fieldwork required.
      Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Three hours each week. May not be taken
