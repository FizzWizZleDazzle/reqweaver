  - id: ENGL228
    name: "Survey of Latina/o/x Literature in the US"
    description: >-
      (HUMD, GEIR, GEEL, GCP) Through key drama, fiction, and poetry, this course offers a
      survey of Latina/o/x literature from its origins in the Spanish colonization of North
      America to the present, with an emphasis on the major themes and trends of creative
      writing sparked by the migration of Cubans, Dominicans, and Central Americans necessitated
      by political turmoil in the twentieth century and the Chicano and Nuyorican Movements in
      the 1960s and 1970s. Students read, analyze, and respond critically to texts by Puerto
      Rican, Cuban-, Dominican-, Mexican-, and Salvadoran-Americans in class discussions,
      examinations, and essays. Readings showcase the unique and diverse voices of Latina/o/x
      writers exploring the construction and complexity of identity; bilingualism and
      code-switching; the experiences of the colonial subject, the immigrant, the refugee, and
      the exile; borders literal and figurative; and the relationship between the writer's
      ancestral homeland and the United States. PREREQUISITE(S): A grade of C or better in ENGL
      101/ENGL 011 or ENGL 101 or consent of the department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, english]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ENGL101, ENGL101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "NSS5112, CE Adv General Course" }
