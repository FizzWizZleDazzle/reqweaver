    grad_tags: [elective]
  - id: BSAN250
    name: "Business Analytics Capstone"
    description: >-
      A comprehensive, project-based course where students gain hands-on experience working with
      real-world data. Montgomery College partners in business and industry work alongside
      faculty and students providing expertise, guidance, and real data. The course includes
