  - id: MUSC110
    name: "Listening to Music"
    description: >-
      (ARTD, GEIR, GEEL) For non-music majors or by consent of the department. Directed
      listening with emphasis on how to listen to music such as symphony, opera, ballet, chamber
      music, art song, and contemporary music. Students are required to devote time to listening
      outside of class. Assessment Level(s): ENGL 101/ENGL 011. Attendance at one concert
      required. Three hours each week.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
