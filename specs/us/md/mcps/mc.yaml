  # --- SCIR ----------------------------------------------------------------
  - id: SCIR297
    name: "Fundamentals of Scientific Research I"
    description: >-
      Designed for the promising science, engineering, or mathematics (SEM) student who would
      like to build upon general SEM skills learned from general courses in order to generate
      competency in scientific critical thinking and research. This course enables SEM students
      to pursue research topics of their own choosing with the guidance and supervision of an
      assigned faculty member. Students should have a strong interest in SEM and be committed
      toward completion of a multi-semester and interdisciplinary-spanning research project.
      Projects will not duplicate curriculum content, but will expand on that content.
      PREREQUISITE(S): A minimum GPA of 3.0; BIOL 150, CHEM 131, MATH 165, and approval of
      instructor. May be repeated for a maximum of six credits with consent of department. One
      hour discussion, three hours laboratory each week.
    credits: 2
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOL150, CHEM131, MATH165] }
    approved: false
  # --- SOCY ----------------------------------------------------------------
  - id: SOCY100
    name: "Introduction to Sociology"
    description: >-
      (BSSD, GEEL, GCP) An exploration of fundamental sociological concepts, methods, and
      theories used to interpret the patterns of human society. Emphasis is placed on the
      connection between theory and practice in examining social interaction, cultural
      diversity, social structure, and global issues. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: SOCY105
    name: "Social Problems and Issues"
    description: >-
      (BSSD, GEEL, GCP) An analysis of social problems such as social inequality, urbanization,
      crime, demographic change, terrorism, and environmental issues. Sociological theory and
      research are used to examine the impact of globalization, culture, institutions, ideology,
      social policy, and social movements on various societal issues. Assessment Level(s): ENGL
      101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: SOCY208
    name: "Sociology of Gender"
    description: >-
      (BSSD, GEEL, GCP) Examines the social production and reproduction of gender relations in
      social institutions such as family, education, law, work, and media using comparisons with
      other cultures. The intersectionality of gender, race, social class, and global inequality
      will be critically analyzed. Assessment Level(s): ENGL 101/ENGL 011. Three hours each
      week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: SOCY214
    name: "Sociology of the Family"
    description: >-
      Examines patterns and trends in family structures and family dynamics. Partner selection,
      marital/partner roles, family interaction, and parenting patterns will be identified.
      Social and cultural variables that diversify families, as well as societal and global
      forces which impact families, will be analyzed. PREREQUISITE(S): ANTH 201, SOCY 100 or
      consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ANTH201, SOCY100] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: SOCY230
    name: "Sociology of Personality"
    description: >-
      A social psychological study of the development of human nature and personality, mind, and
      self as products of social interaction. The role of language as fundamental in the
      symbolic process is stressed as this relates to personality development and behavior
      motivation. PREREQUISITE(S): PSYC 100, SOCY 100, or consent of department. Three hours
      each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [PSYC100, SOCY100] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: SOCY233
    name: "Race and Ethnic Relations"
    description: >-
      An analysis of patterns of intergroup relations in contemporary society. Critically
      examines theories and concepts of racial and ethnic hierarchies, as well as the
      intersection of race/ethnicity with class and gender and the role of race/ethnicity within
      global systems of stratification. PREREQUISITE(S): ANTH 201, SOCY 100 or consent of
      department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ANTH201, SOCY100] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: SOCY240
    name: "Sociology of Age and Aging"
    description: >-
      (BSSD, GEEL, GCP) An introduction of aging studies focused on social aspects. Demographic,
      social, and economic changes with the aging population will be examined using comparisons
      with different societies. Theories of aging and their applications are introduced.
      Relevant social policies on aging will be critically evaluated. Assessment Level(s): ENGL
      101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: SOCY243
    name: "The Sociology of Sport"
    description: >-
      (BSSD, GEEL, GCP) (R only) The application of basic sociological concepts, theories, and
      research to the analysis of contemporary sport. Emphasis will be placed on how sport
      influences and is influenced by social groups, culture, institutions, social inequalities,
      and global expansion. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: SOCY246
    name: "Sociology of Religion"
    description: >-
      An analysis of structures and functions of world religions in societal and global
      settings. This course examines religion in relationship to fundamentalism, globalization,
      nationalism, multiculturalism and religiously grounded violence. It considers the impact
      of religious trends on individuals, groups and societies. PREREQUISITE(S): ANTH 201 or
      SOCY 100 or consent of instructor. Three hours each week.
    credits: 3
    level: college
    tags: [social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ANTH201, SOCY100]] }
    approved: false
  - id: SOCY250
    name: "Globalization Issues"
    description: >-
      An exploration of social forces contributing to global inequalities and the dynamics of
      global patterns (immigration, refugees, displaced persons, social conflict,
      health/environmental issues, and social movements). Students examine consequences of
      global forces and their effects on institutions and individuals. PREREQUISITE(S): ANTH 201
      or SOCY 100 or consent of department. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ANTH201, SOCY100]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  # --- SONO ----------------------------------------------------------------
  - id: SONO101
    name: "Orientation to Diagnostic Medical Sonography"
    description: >-
      (TP/SS only) An orientation to the field of diagnostic medical sonography followed by
      techniques for assisting and monitoring patients. Professional ethics, legal issues, and
      patient care procedures pertinent to sonography will be covered. Chart reading and
      recordkeeping relative to ultrasound will be presented. PREREQUISITE(S): Admission to the
      diagnostic medical sonography program or consent of program coordinator; CPR
      Certification-Class C. Assessment Level(s): MATH 117 or higher. Laboratory experience
      required on and off campus. Two hours lecture, two hours laboratory each week. May not be
      taken concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without appropriate
      Math assessment score.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: SONO105
    name: "Acoustical Physics I"
    description: >-
      Fundamental principles of acoustical physics including wave propagation, biological
      effects, acoustical impedance properties, and transducer characteristics will be
      presented. Basic types of equipment, instrumentation, quality control, and safety are
      discussed. Laboratory experience required on and off campus. PREREQUISITE(S): Mathematics
      foundation and PHYS 103 or higher and admission to the diagnostic medical sonography
      program or consent of program coordinator. COREQUISITE(S): SONO 204 and SONO 261, or
      consent of program coordinator. One-and-a-half hours lecture, one hour laboratory each
      week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[PHYS103]] }
    approved: false
  - id: SONO112
    name: "Abdominal Sonography I"
    description: >-
      (TP/SS only) A study of the fundamentals of abdominal sonography, including the case study
      reviews of normal anatomy, physiology, and pathological conditions of the abdominal and
      superficial structures. PREREQUISITE(S): BIOL 212, BIOL 213 and SONO 204 or consent of
      program coordinator. COREQUISITE(S): SONO 262 or consent of program coordinator. Two hours
      lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOL212, BIOL213, SONO204] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: SONO123
    name: "Obstetric/Gynecology Sonography I"
    description: >-
      (TP/SS only) A study of fundamentals of obstetrics/gynecology scans of normal and abnormal
      anatomy. Fetal development, including abnormal etiology and diagnostic techniques, is
      presented. The detection of abnormalities, pathologies, and deviation from normal is
      stressed. Body planes, which must be scanned for an accurate diagnosis, are emphasized.
      PREREQUISITE(S): SONO 204 or consent of program coordinator. COREQUISITE(S): SONO 262. Two
      hours lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[SONO204]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: SONO200
    name: "Independent Study in Diagnostic Medical Sonography"
    description: >-
      (TP/SS only) Through independent study, sonography students will conduct research in
      cutting-edge diagnostic medical sonography technology, professional advancements and/or
      case studies. Students will be assigned to diagnostic medical sonography faculty for
      guidance and supervision. Letter designators in the schedule of classes will distinguish
      the 1-, 2,- 3-, and 4-credit versions of SONO 200. PREREQUISITE(S): Admission to the
      diagnostic medical sonography program or consent of program coordinator. Minimum 45 hours
      of work for each credit hour. Variable credit: 1-4 semester hours.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: SONO204
    name: "Introduction to Sectional Anatomy"
    description: >-
      (TP/SS only) An introduction to ultrasound sectional anatomy. Anatomy will be presented in
      the transverse, sagittal, and coronal planes. Laboratory experience required on and off
      campus. PREREQUISITE(S): BIOL 212 or consent of program coordinator. PRE- or
      COREQUISITE(S): BIOL 213. COREQUISITE(S): SONO 105 and SONO 261. Two hours lecture, two
      hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[BIOL212]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: SONO205
    name: "Acoustical Physics and Instrumentation II"
    description: >-
      (TP/SS only) A continuation of SONO 105. Fundamental principles of acoustical physics,
      including speed of sound, reflection, refraction, and attenuation through soft tissue;
      principles of pulse echo imaging and scanning speed limitation. PREREQUISITE(S): SONO 105.
      COREQUISITE(S): SONO 262. One-and-a-half hours lecture, one hour laboratory each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [SONO105] }
    approved: false
  - id: SONO210
    name: "Breast Sonography"
    description: >-
      (TP/SS only) A study of the fundamentals of breast sonography, including the case study
      review of normal anatomy, physiology, and pathological conditions of the breast tissue and
      its visualization with real-time 2-D and 3-D imaging, and Doppler. PREREQUISITE(S): SONO
      204 or consent of program coordinator. COREQUISITE(S): SONO 266 or consent of program
      coordinator. One hour lecture, one hour laboratory each week..
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[SONO204]] }
    approved: false
  - id: SONO224
    name: "Seminar-Diagnostic Medical Sonography"
    description: >-
      (TP/SS only) On-campus seminar addresses issues that will facilitate the graduates' entry
      into the career of sonography. Topics include registry examination preparation, resume
      writing, and test-taking strategies. Students are required to register for the National
      Board Examination. PREREQUISITE(S): Admission to the diagnostic medical sonography program
      or consent of program coordinator. One hour each week.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: SONO229
    name: "Pediatric Echocardiography"
    description: >-
      (TP/SS only) A study of the fundamentals of pediatric echocardiography, including the case
      study review of normal anatomy, physiology, and pathological conditions of the pediatric
      heart and its visualization with real-time 2-D and 3-D imaging, Doppler, and M-mode
      echocardiography. PREREQUISITE(S): SONO 204 or consent of program coordinator.
      COREQUISITE(S): SONO 266 or consent of program coordinator. Two hours lecture, two hours
      laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[SONO204]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: SONO232
    name: "Abdominal Sonography II"
    description: >-
      (TP/SS only) A continuation of the study of abdominal sonography including interpretation
      of clinical tests, related clinical signs and symptoms, and normal and abnormal
      sonographic patterns. This course includes laboratory experience on basic scanning
      techniques and protocol relative to the abdominal structures and physiology.
      PREREQUISITE(S): SONO 112 or consent of program coordinator. COREQUISITE(S): SONO 264. Two
      hours lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[SONO112]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: SONO243
    name: "Obstetric/Gynecology Sonography II"
    description: >-
      (TP/SS only) A continuation of obstetrics/gynecology scanning of normal and abnormal
      anatomy. Fetal development, including abnormal etiology and diagnostic techniques, is
      presented. The detection of abnormalities, pathologies, and deviation from normal is
      stressed. Body planes that must be scanned for an accurate diagnosis will be emphasized.
      PREREQUISITE(S): SONO 123 or consent of program coordinator. COREQUISITE(S): SONO 264. Two
      hours lecture, two hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[SONO123]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: SONO245
    name: "Adult Echocardiography I"
    description: >-
      (TP/SS only) A study of the fundamentals of adult echocardiography, including the case
      study review of normal anatomy, physiology, and pathological conditions of the adult heart
      and its visualization with real-time 2-D imaging, 3-D and 4-D imaging, Doppler, and M-mode
      echocardiography. PREREQUISITE(S): SONO 204 or consent of program coordinator.
      COREQUISITE(S): SONO 262 or consent of program coordinator. Two hours lecture, two hours
      laboratory each week.
    credits: 3
    level: college
