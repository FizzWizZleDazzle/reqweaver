    name: "Foundations of Algebra Support"
    description: >-
      A corequisite course intended to equip students with the skills needed to be successful in
      MATH 050 by providing support in fundamental mathematics. Topics include operations on
      real numbers, evaluation of algebraic expressions, solving equations, and operations on
      polynomials. PREREQUISITE(S): Appropriate score on the mathematics assessment test or
