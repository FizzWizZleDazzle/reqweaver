  # --- PSYC ----------------------------------------------------------------
  - id: PSYC100
    name: "General Psychology"
    description: >-
      (BSSD, GEEL) Introduction to the fields and research methods of psychology, including such
      topics as biological bases of behavior, human development, perception, learning, mental
      disorder, and social behavior. Assessment Level(s): ENGL 101/ENGL 011. Three hours each
      week.
