      only) PREREQUISITE(S): Consent of department and successful completion of ARTT 100 and
      ARTT 205 for drawing; ARTT 211 and ARTT 212 for painting; ARTT 228 or ARTT 230 for
      printmaking; ARTT 120 and ARTT 220 for ceramics; ARTT 221 and ARTT 222 for sculpture; ARTT
      245 for jewelry. Course may be repeated for audit without limit. Students are limited to
      three hours of credit in each studio area of ARTT 255 and three hours of credit in each
      studio area of ARTT 256. Two hours lecture, four hours studio each week.
