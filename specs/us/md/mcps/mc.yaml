    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: THET201
    name: "Intermediate Acting"
    description: >-
      (R and TP/SS only) Practice in textual analysis, scene study, and the process of
      developing characterization for performance in the theatre. PREREQUISITE(S): THET 110 or
      consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[THET110]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5127, CE Adv Theater" }
    grad_tags: [elective]
