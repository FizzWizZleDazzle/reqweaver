    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5103, CE Adv Computer Apps" }
    grad_tags: [elective]
  - id: TECH273
    name: "Advanced Website Development"
    description: >-
      Explores latest advanced Web technologies and development skills with HTML, Cascading
      Style Sheets, Web standards, basic server-side programming, usability and accessibility,
      JavaScript, and Integrated Development Environment (IDE). Students make web-sites
      attractive, dynamic, accessible, and easy to maintain. PREREQUISITE(S): TECH 272,
