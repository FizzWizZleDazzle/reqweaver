    name: "Media Appreciation"
    description: >-
      (ARTD, GEIR, GEEL) A survey course designed to introduce and discuss various strategic
      communication forms both aesthetically and economically and to analyze examples of the
      messaging delivered by major mass media outlets. Present day digital programming methods
      are analyzed to offer students the perspective of a media professional. Students discover
      how media is used as a powerful tool for information and social impact. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
