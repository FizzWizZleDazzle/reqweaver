  # --- BSAD ----------------------------------------------------------------
  - id: BSAD101
    name: "Introduction to Business"
    description: >-
      An introductory course designed to survey the field of business and its environment in
      order to give the student a broad overview of the principles, practices, institutions, and
      functions of business. PRE- or COREQUISITE(S): A minimum grade of C or better in ELAI 990
      or appropriate score on the English assessment test. Assessment Level(s): ENGL 101/ENGL
      011, MATH 050. Three hours each week. May not be taken concurrently with MATH 017 or MATH
      020 or MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5102, CE Adv Business" }
    grad_tags: [elective]
  - id: BSAD111
    name: "Personal Finance"
    description: >-
      An introduction to some proven techniques of financial management for the individual.
      Emphasis on the development of a program of financial management, including budgeting,
      consumer credit, consumer spending, insurance, investments in real estate, securities,
      commodities, income tax planning, retirement planning, and other financial problems of the
      individual. Assessment Level(s): ELAR 980/IERW 002. Three hours lecture/discussion each
      week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5102, CE Adv Business" }
    grad_tags: [elective]
  - id: BSAD210
    name: "Statistics for Business and Economics"
    description: >-
      An introductory course in the business and economic application of descriptive and
      inferential statistics. The meaning and role of statistics in business and economics,
      frequency distributions, graphical presentations, measures of central tendency and
      dispersion, probability, discrete and continuous probability distributions, inferences
      pertaining to means and proportions, regression and correlation, time series analysis, and
      decision theory will be discussed. PREREQUISITE(S): Appropriate score on mathematics
      assessment test, or a grade of C or better in MATH 050 or MATH 092 or a Math foundation
      course, or consent of department. Assessment Level(s): ENGL 101/ENGL 011. Three hours each
      week. May not be taken concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045
      without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [math, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[MATH050, MATH092]] }
    approved: true
    hs_credit: { category: "Math", synergy: "MAT5119, CE Adv Mathematics" }
    grad_tags: [math]
  - id: BSAD268
    name: "Macklin Business Institute Freshmen Internship"
    description: >-
      (R only) Provides students in the Macklin Business Institute honors program the
      opportunity for further experiential learning by combining business academics with a
      hands-on learning experience. To qualify for this course, a student must be an MBI honors
      student. To earn course credit, students must work a minimum of 45 hours in a clearly
      defined employment role for the MBI Cafe. The MBI Cafe role requires active involvement in
      some aspect of business management and not just routine assignment. It is expected that
      the student will be involved with the operational and/or administrative aspects of the MBI
      Cafe, which students will regularly meet on and report on in regularly scheduled MBI Cafe
      Board meetings. PREREQUISITE(S): Consent of the department. May be repeated for a maximum
      of two credits. One to two hours each week. To register for this course, students must be
      admitted and active members of the Macklin Business Institute program. Variable credit:
      1-2 semester hours.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: BSAD269
    name: "Macklin Business Institute Sophomore Internship"
    description: >-
      (R only) Provides students in the Macklin Business Institute honors program the
      opportunity for further experiential learning by combining business academics with a
      hands-on learning experience. To qualify for this course, a student must be an MBI honors
      student completing at least one semester of BSAD 268. To earn course credit, students must
      work a minimum of 45 hours in a clearly defined employment role for the MBI Cafe. The MBI
      Cafe role requires active involvement in some aspect of business management and not just
      routine assignment. It is expected that the student will be involved with the operational
      and/or administrative aspects of the MBI Cafe, which students will regularly meet on and
      report on in regularly scheduled MBI Cafe Board meetings. Students in BSAD 269 will be
      required to take on a leadership role as part of this course. PREREQUISITE(S): BSAD 268
      and consent of the department. May be repeated for a maximum of two credits. One to two
      hours each week. To register for this course, students must be admitted and active members
      of the Macklin Business Institute program. Variable credit: 1-2 semester hours.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BSAD268] }
    approved: false
