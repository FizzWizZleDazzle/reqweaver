    name: "Global Contemporary Art"
    description: >-
      An exploration of Global Contemporary art and theory from the late 20th century to the
      present with an emphasis on the historical and cultural contexts of the creation and
      reception of art. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
