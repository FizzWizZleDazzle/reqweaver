  # --- MGMT ----------------------------------------------------------------
  - id: MGMT101
    name: "Principles of Management"
    description: >-
      Overview of the management movement, including development of management theory; survey of
      the organizational structure and basic managerial functions within organizations; the
      integration of the functions of management and application of decision making and
      leadership to general managerial situations. Includes the relationship of the internal and
      external environment to the organization. Assessment Level(s): ENGL 101/ENGL 011. Three
      hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5102, CE Adv Business" }
    grad_tags: [elective]
  - id: MGMT110
    name: "Small Business Management"
    description: >-
      Designed for those students desiring to start a business venture. Emphasis will be on
      capital acquisition, start-up issues, marketing functions, management, and commercial
      issues that the small business person faces today. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5102, CE Adv Business" }
    grad_tags: [elective]
  - id: MGMT140
    name: "Foundations of Entrepreneurship"
    description: >-
      Multi-disciplinary study designed to introduce students to the basic business, strategy,
      and leadership skills needed to launch and manage new ventures. Topics include learning
      how to assess the feasibility of a new venture, as well as how to apply best practices for
      planning, launching, and managing new companies. Students discuss a wide range of issues
      of importance and concern to entrepreneurs and learn to recognize opportunities, assess
      the skills and talents of successful entrepreneurs, and learn models and "rules of thumb"
      that help them navigate uncertainly. The opportunities and challenges of entrepreneurship
      are explored, as is the ability to use entrepreneurial skill sets in a corporate
      environment. Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Three hours each week. May
      not be taken concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without
      appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5102, CE Adv Business" }
    grad_tags: [elective]
  - id: MGMT201
    name: "Business Law"
    description: >-
      Examination of the foundations of the U.S. legal system, focusing on those aspects of
      legal liability that might impose the greatest monetary penalties and damages on the
      commercial enterprise. Topics covered include the law of torts, product liability,
      accountants' liability, business crimes, contracts, agency, and public policy issues
      dealing with ethics and international law. PREREQUISITE(S): ENGL 101/ENGL 011 or consent
      of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ENGL101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5102, CE Adv Business" }
    grad_tags: [elective]
  - id: MGMT210
    name: "Entrepreneurial Opportunity Analysis and Decision-Making in Technology Ventures"
    description: >-
      Interdisciplinary studies in the principles of entrepreneurial opportunity analysis and
      decision-making in an increasingly dynamic and technically-inclines society. Emphasis is
      placed on how aspiring technology entrepreneurs can develop their entrepreneurial mindset
      and opportunity recognition capabilities to develop winning entrepreneurial plans for
      future ventures. Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Three hours each week.
      May not be taken concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without
      appropriate Math assessment score.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: MGMT211
    name: "Introduction to Marketing"
    description: >-
      A survey of the global marketing environment in terms of both business and consumer goods
      and services. Buying behavior and targeting markets are emphasized. The marketing mix,
      including product, promotion, price, and distribution, is featured through the use of
      experiential marketing applications. Assessment Level(s): ENGL 101/ENGL 011. Three hours
      each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5102, CE Adv Business" }
    grad_tags: [elective]
  - id: MGMT214
    name: "Human Resources Management"
    description: >-
      Discusses the functions and trends in human resources management that include staffing,
      the legal environment, compensation and benefits, safety and health, employee and union
      relations, training and career development, performance appraisal, and the global
      environment. PREREQUISITE(S): MGMT 101. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [MGMT101] }
    approved: false
