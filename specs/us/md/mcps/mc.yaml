  # --- SPAN ----------------------------------------------------------------
  - id: SPAN101
    name: "Elementary Spanish I"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A beginning language course focusing on the study of Spanish
      language and culture. Students begin to develop the ability to communicate in Spanish
      through the consideration of cultural themes, language functions, and authentic situations
      as they acquire the structures and lexicon to work with written language, conversation,
      and composition. No prior knowledge of Spanish is required. In-class work is supplemented
      by 20 hours of online homework. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "World Languages: Spanish", synergy: "WLG5130, CE Adv World Language" }
    grad_tags: [world_language]
  - id: SPAN102
    name: "Elementary Spanish II"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A continuation of SPAN 101. Students continue their study of
      written language, conversation, and composition as they consider cultural themes, language
      functions, and authentic situations. In-class work is supplemented by 20 hours of online
      homework. PREREQUISITE(S): SPAN 101 or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[SPAN101]] }
    approved: true
    hs_credit: { category: "World Languages: Spanish", synergy: "WLG5130, CE Adv World Language" }
    grad_tags: [world_language]
  - id: SPAN103
    name: "Intensive Elementary Spanish"
    description: >-
      (HUMD, GEIR, GEEL, GCP) An intensive language course comparable to SPAN 101 and SPAN 102
      designed for students who have previously studied Spanish but do not place at the level of
      SPAN 102 and SPAN 201. The class is communicatively based, focusing on the further
      development of reading, writing, speaking, and listening skills through the consideration
      of cultural themes, language functions, and authentic situations. Students should expect
      the language of the classroom to be Spanish. As part of the curriculum, students explore
      the many cultures that make up the Spanish-speaking world and present a cultural project.
      Students who have successfully completed SPAN 102 are not eligible to take SPAN 103 for
      credit. Not open to native speakers of Spanish. In-class work is supplemented by 20 hours
      of online homework. PREREQUISITE(S): Appropriate placement on the Spanish placement test,
      a minimum of two years of high school Spanish or equivalent, or consent of department.
      First day in-class placement assessments will be made. Four hours each week.
    credits: 4
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "World Languages: Spanish", synergy: "WLG5130, CE Adv World Language" }
    grad_tags: [world_language]
  - id: SPAN106
    name: "Spanish for Heritage Speakers"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A course designed for heritage Spanish or native speakers who can
      express themselves orally and in writing in Spanish, but have not received formal
      education in the language. Emphasis on orthographic and grammatical concepts geared to
      improve spelling, writing and oral abilities, focusing on the exploration of
      contextualized cultural and social topics addressing Hispanic/Latino communities inside
      and outside of the United States. Students may not receive credit for both SPAN 106 and
      SPAN 101/SPAN 102. In-class work is supplemented by 10 hours of online homework. Four
      hours each week.
    credits: 4
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "World Languages: Spanish", synergy: "WLG5130, CE Adv World Language" }
    grad_tags: [world_language]
  - id: SPAN201
    name: "Intermediate Spanish I"
    description: >-
      (HUMD, GEIR, GEEL, GCP) Focuses on the study of Spanish language and culture at the
      intermediate level. Students further their ability to communicate in Spanish through an
      advanced consideration of cultural themes and a thorough review of Spanish grammar to
      support increased focus on reading and composition. In-class work is supplemented by 10
      hours of online homework. PREREQUISITE(S): SPAN 102, SPAN 103, SPAN 106 or consent of
      department. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[SPAN102, SPAN103, SPAN106]] }
    approved: true
    hs_credit: { category: "World Languages: Spanish", synergy: "WLG5130, CE Adv World Language" }
    grad_tags: [world_language]
    exam_equivalent: [AP_SPANISH_LANG]
  - id: SPAN202
    name: "Intermediate Spanish II"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A continuation of SPAN 201. Students further their ability to
      communicate in Spanish through an advanced consideration of cultural themes and a review
      of Spanish grammar to support an increased focus on reading and composition. In-class work
      is supplemented by 10 hours of online homework. PREREQUISITE(S): SPAN 201 or consent of
      department. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[SPAN201]] }
