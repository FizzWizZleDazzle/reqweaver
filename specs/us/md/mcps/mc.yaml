    description: >-
      Examine and practice computing and information technology concepts and skills fundamental
      to digital devices, digital technologies, digital defense, digital production, and digital
      socialization. Learn about the computer hardware and peripherals, computer networks,
      information security, data and file management, operating systems, emerging technologies,
      and the Internet. Assessment Level(s): ELAW 980/ELAR 980, IERW 002. Three hours each week.
    credits: 3
