    name: "Introduction to Modern Drama"
    description: >-
      (HUMD, GEIR, GEEL, GCP) An introduction to modern drama from the late 19th century to the
      present, including representative works in realism, naturalism, expressionism, the absurd,
      and post-modern and post-colonial forms. Students read, analyze, and respond critically to
      plays in class discussions, examinations, and essays. PREREQUISITE(S): A grade of C or
