  - id: GEOG260
    name: "Introduction to Geographic Information Systems"
    description: >-
      (R only) Geographic information systems (GIS) integrates the application of spatial data
      handling procedures with the study of geographic problems. The course utilizes computer
      software designed for the study of environmental problems based upon data compiled from
      maps and remote sensing imagery. This course will serve as a basic introduction to the
      concepts and techniques of GIS. The problems used for study in this course are selected to
