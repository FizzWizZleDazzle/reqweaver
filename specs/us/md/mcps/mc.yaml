  # --- GEOL ----------------------------------------------------------------
  - id: GEOL101
    name: "Physical Geology"
    description: >-
      (NSLD, GEEL) A study of the physical aspects of the earth. Topics explored in this course
      include minerals, rocks, soils, structures, landforms, plate tectonics, volcanoes,
      earthquakes, streams, erosion, and weathering. Assessment Level(s): ENGL 101/ENGL 011,
      MATH 050. Three hours lecture, three hours laboratory each week; field trips. May not be
      taken concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without appropriate
      Math assessment score.
    credits: 4
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: GEOL102
    name: "Historical Geology"
    description: >-
      (NSLD, GEEL) This course covers the application of geologic concepts to the interpretation
      of the evolution of the earth. Topics include the use of sedimentary rocks as tools for
      unraveling earth history, the historical development of geologic principles, the nature
      and utility of fossils, the importance of plate tectonics, and a survey of the evolution
      of earth systems and organisms. Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Three
      hours lecture, three hours laboratory each week; field trips. May not be taken
      concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without appropriate Math
      assessment score.
    credits: 4
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
