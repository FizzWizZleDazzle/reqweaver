  # --- GEOG ----------------------------------------------------------------
  - id: GEOG101
    name: "Introduction to Geography"
    description: >-
      (BSSD, GEEL) Introduction to geography as a field of study. The course consists of an
      extensive examination of physical and cultural factors that contribute to and produce the
      variable character of the Earth's surface and a discussion of the significance of
      geographic concepts and factors to world affairs. Assessment Level(s): ENGL 101/ENGL 011,
      MATH 050. Three hours each week. May not be taken concurrently with MATH 017 or MATH 020
      or MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: GEOG105
    name: "Cultural Geography"
    description: >-
      (BSSD, GEEL, GCP) Examination of the basic concepts of human geography and the forces and
      factors shaping the cultural character of the surface of the earth viewed as the home of
      the human race. Topical studies include population, settlement patterns, and other
      political, economic, and cultural phenomena. Assessment Level(s): ENGL 101/ENGL 011, MATH
      050. Three hours each week. May not be taken concurrently with MATH 017 or MATH 020 or
      MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
    exam_equivalent: [AP_HUMAN_GEOGRAPHY]
  - id: GEOG113
    name: "Economic Geography"
    description: >-
      (BSSD, GEEL) Introduction to the principles of economic geography. Lecture and
      studio/laboratory study of modern concepts and techniques underlying the whys of
      locational analysis, spatial and functional organization of economic areas and regions.
      Special emphasis placed on the relationship of culture, resources, technology, and the
      physical biotic landscape to the world geographic patterns of economic activity. Projects
      and field assignments. Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Two hours
      lecture, two hours studio/laboratory each week. May not be taken concurrently with MATH
      017 or MATH 020 or MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: GEOG124
    name: "Physical Geography"
    description: >-
      (NSLD, GEEL) (R only) Fundamentals of physical geography as a foundation for human
      activities. Lecture and studio/laboratory study of the role and patterns of climate, soil,
      landforms, drainage, vegetation, and other geographic phenomena. Special analysis of the
      physical biotic character of the surface of the Earth as determined by natural and
      cultural processes with emphasis on the physical geography of urban places. Projects and
      field assignments. Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Three hours lecture,
      two hours studio/laboratory each week. May not be taken concurrently with MATH 017 or MATH
      020 or MATH 030 or MATH 045 without appropriate Math assessment score.
