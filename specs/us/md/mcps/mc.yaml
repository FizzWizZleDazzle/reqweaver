    description: >-
      (ARTD, GEIR, GEEL, GCP) This is an entry-level course which offers a broad overview of the
      theatre arts for the theatre major or nonmajor. The work of the various artists who create
      the theatre arts will be investigated and analyzed along with the analysis of script
      structure and form through historical and modern perspectives. Assessment Level(s): ENGL
      101/ENGL 011. Three hours each week.
