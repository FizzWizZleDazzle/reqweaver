    exam_equivalent: [AP_MUSIC_LIT]
  - id: MUSC117
    name: "World Music"
    description: >-
      (ARTD, GEIR, GEEL, GCP) This course presents a survey of cross-cultural popular music and
      the traditional music that influenced it. The class will address social and cultural roles
      of the music and factors influencing its development and dissemination. Students will
      learn by participating in music-making, listening to live and recorded music, reading,
      writing, and discussing. Three hours each week.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "Fine Art", synergy: "SOC5121, CE Adv Music" }
    grad_tags: [fine_arts]
  - id: MUSC125
    name: "History of Jazz"
    description: >-
      (ARTD, GEIR, GEEL, GCP) (R and TP/SS only) A survey of jazz in the United States from the
      turn of the century to the present. Several major African American figures will be studied
      in depth. The art of listening to jazz music will be emphasized; outside listening will be
      required. Open to all students. Three hours each week.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "Fine Art", synergy: "SOC5121, CE Adv Music" }
