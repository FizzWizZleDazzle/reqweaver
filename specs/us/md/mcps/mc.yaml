    description: >-
      (HUMD, GEIR, GEEL, GCP) A survey of African American literature from the Harlem
      Renaissance to the present, including poetry, speeches, blues, jazz, hip-hop, fiction,
      non-fiction, and drama. This course emphasizes the trends, patterns, and historical
