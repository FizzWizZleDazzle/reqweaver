  # --- CHEM ----------------------------------------------------------------
  - id: CHEM031
    name: "Principles of Chemistry I Exploration"
    description: >-
      Co-requisite course designed to equip students with the skills needed to be successful in
      CHEM 131 by providing support in fundamental chemistry and related mathematical
      principles. Focus is on problem-solving strategies and practice, the development of
      quantitative reasoning skills, and the application of relevant mathematical operations to
      define and solve chemical problems. Topics include the scientific method, chemical
      measurements and unit conversions, properties of matter, foundations of atomic theory and
      structure, and stoichiometric mole relationships and calculations. COREQUISITE(S): CHEM
      131. Assessment Level(s): ELAI 990/ENGL 101/ENGL 011; MATH 117 or higher. Two hours of
      classroom instruction each week. TWO EQUIVALENT CREDIT HOURS. NOT APPLICABLE TO A DEGREE
      OR CERTIFICATE. MAY NOT BE USED TO SATISFY DEGREE REQUIREMENTS. NOT INCLUDED IN GPA
      CALCULATION.
    credits: 2
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: CHEM099
    name: "Introductory Chemistry"
    description: >-
      A treatment of fundamental chemical mathematics, computational methods, metric system,
      matter, energy, chemical and physical properties, law of conservation of mass-energy,
      foundations of atomic theories, elements, compounds, formulas, and stoichiometry. Other
      topics may be covered at the discretion of the instructor. Assessment Level(s): ELAI
      990/ENGL 101/ENGL 011, MATH 050. Three hours each week. May not be taken concurrently with
      MATH 017 or MATH 020 or MATH 030 or MATH 030 or MATH 045 without appropriate Math
      assessment score. THREE EQUIVALENT CREDIT HOURS. NOT APPLICABLE TO A DEGREE OR
      CERTIFICATE. MAY NOT BE USED TO SATISFY DEGREE REQUIREMENTS. NOT INCLUDED IN GPA
      CALCULATION.
    credits: 3
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: CHEM105
    name: "Chemistry and Society"
    description: >-
      (NSND, GEEL, GCP) Designed for non-science majors and emphasizing the significance of
      chemistry in everyday lives and society. Topics may include the connection of chemistry to
      environmental resources, global climate change, consumer products or industrial
      applications. CHEM 105 will satisfy the NSND General Education requirement. When CHEM 106
      is taken concurrently or in any later term, the combination of CHEM 105 and CHEM 106 will
      instead satisfy the NSLD General Education requirement. Assessment Level(s): ELAI 990/ENGL
      101/ENGL 011, MATH 050. Three hours each week. May not be taken concurrently with MATH 017
      or MATH 020 or MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: CHEM106
    name: "Chemistry and Society Laboratory"
    description: >-
      (NSLD, GEEL) Laboratory work deals with experiments that illustrate the significance of
      chemistry in our society and reinforces the principles discussed in CHEM 105. A
      combination of CHEM 105 and CHEM 106 must be taken to satisfy the NSLD General Education
      requirement. PREREQUISITE(S): MATH 050. PRE- or COREQUISITE(S): CHEM 105. Assessment
      Level(s): ELAI 990/ENGL 101/ENGL 011, MATH 050. Three hours laboratory each week.
    credits: 1
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [MATH050] }
    approved: false
  - id: CHEM131
    name: "Principles of Chemistry I"
    description: >-
      (NSLD, GEEL) First of two related courses (with CHEM 132). Includes concepts of atomic
      structure, periodic system, chemical bonding, nomenclature, stoichiometry, weight
      relationships, kinetic molecular theory, gases, liquids and solids, solutions, chemical
      reactions, and thermochemistry. PREREQUISITE(S): Either guided placement eligibility or
      concurrent enrollment in CHEM 031, a grade of C or better in CHEM 099, completion of
      department-approved preparation module, or consent of the department. Assessment Level(s):
      Assessment levels ELAI 990/ENGL 101/ENGL 011, MATH 117 or higher. Three hours lecture, one
      hour discussion, three hours laboratory each week. May not be taken concurrently with MATH
      017 or MATH 020 or MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 4
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[CHEM099]] }
    approved: true
    hs_credit: { category: "NGSS Physical Science", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [science]
    exam_equivalent: [AP_CHEMISTRY]
  - id: CHEM132
    name: "Principles of Chemistry II"
    description: >-
      (NSLD, GEEL) A continuation of CHEM 131. Topics include solutions, chemical reactions,
      acid-base theories, electrochemistry, equilibrium, kinetics, nuclear chemistry, and
      thermodynamics. PREREQUISITE(S): A grade of C or better in CHEM 131 or consent of
      department. Three hours lecture, one hour discussion, three hours laboratory each week.
    credits: 4
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[CHEM131]] }
    approved: true
    hs_credit: { category: "NGSS Physical Science", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [science]
    exam_equivalent: [AP_CHEMISTRY]
  - id: CHEM135
    name: "General Chemistry for Engineers"
    description: >-
      Covers the nature and composition of matter, solutions, chemical reactions, equilibria,
      kinetics, thermodynamics, and electrochemistry with engineering applications. A
      one-semester general chemistry course designed for students majoring in engineering,
      except for biological resources engineering, chemical engineering, or general engineering
      majors. Not open to students who have completed CHEM 131 and CHEM 132. PREREQUISITE(S):
      MATH 165 or appropriate score on the Mathematics placement test. Assessment Level(s): ENGL
      101/ENGL 011. Three hours lecture, one hour discussion, three hours laboratory each week.
    credits: 4
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[MATH165]] }
    approved: true
    hs_credit: { category: "NGSS Physical Science", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [science]
  - id: CHEM150
    name: "Essentials of Organic and Biochemistry"
    description: >-
      (NSLD, GEEL) An overview of organic chemistry with an introduction to biomolecules.
      Includes concepts of organic structures, functional groups, naming and reactivity, with an
      emphasis on biological applications. Biochemical structure-related topics include
      carbohydrates, lipids, enzyme activity, peptides/proteins, and nucleic acids. Course
      designed for students needing a one-semester introductory organic chemistry survey course
      and an introduction to structural biochemistry. PREREQUISITE(S): CHEM 131 with a grade of
      C or better or consent of department. Three hours lecture, one hour discussion, three
      hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [CHEM131] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: CHEM203
    name: "Organic Chemistry I"
    description: >-
      Focuses on fundamental concepts of organic chemistry with emphasis on aliphatic
      hydrocarbons, alkyl halides, and alcohols. This course covers bonding theories,
      structures, nomenclature, physical properties, synthesis, and mechanisms of reactions.
      Laboratory work involves the preparation, analysis, and purification of organic compounds
      including spectroscopic techniques. PREREQUISITE(S): A grade of C or better in CHEM 132
      within the last five years, or consent of department chair, course coordinator, or
      designated member of Chemistry faculty. Three hours lecture, one hour discussion, four
      hours laboratory each week.
    credits: 5
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[CHEM132]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: CHEM204
    name: "Organic Chemistry II"
    description: >-
      Continuation of CHEM 203 Organic Chemistry I with emphasis on aromatic compounds,
      alcohols, ethers, amines, and carbonyl compounds. Laboratory work reinforces organic
      synthesis techniques including isolation, purification, and structure determination using
      analytical methods. PREREQUISITE(S): A grade of C or better in CHEM 203 within the last
      five years, or consent of department chair, course coordinator, or designated member of
      Chemistry faculty. Three hours lecture, one hour discussion, four hours laboratory each
      week.
    credits: 5
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[CHEM203]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: CHEM272
    name: "Bioanalytical Laboratory"
    description: >-
      Develop and practice analytical laboratory techniques used in advanced chemistry and
      biochemistry. Experiments will include statistics and error analysis, UV/vis spectroscopy,
      protein/DNA quantitation, chemical and biochemical kinetics, equilibrium,
      acids/bases/buffers, and oxidation/reduction. The course will also focus on computerized
      data processing techniques, data interpretation and critical analysis, technical writing,
      and formal presentations. PRE- or COREQUISITE(S): A grade of C or better in CHEM 204 or
      consent of department. Four hours laboratory each week.
    credits: 1
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  # --- CHIN ----------------------------------------------------------------
