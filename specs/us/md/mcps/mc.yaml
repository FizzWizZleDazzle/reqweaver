    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: BIOL230
    name: "Molecular Cell Biology"
    description: >-
      A detailed study of the molecular structure and function of the eukaryotic cell including
      cell ultrastructure, molecular genetic mechanisms and techniques, structure of chromosomes
      and genes and transcriptional as well as posttranscriptional control of gene expression,
      structure of biomembranes and movement of molecules into and through cellular membranes,
      cell signaling mechanisms, cytoskeletal systems and cellular movement, interactions,
      division, lineage and death of cells, molecular cell biology of development, of nerve
      cells, of immunology and of cancer. PRE- or COREQUISITE(S): BIOL 222. Three hours lecture,
      three hours laboratory each week.
    credits: 4
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: BIOL252
    name: "Principles of Biology III"
    description: >-
      Synthesizes physical, chemical, and biological principles to understand the evolution of
      organismal form and function over the history of life on Earth. PREREQUISITE(S): A grade
      of C or better in BIOL 150 and BIOL 151. PRE- or COREQUISITE(S): CHEM 131. Assessment
      Level(s): MATH 181 or a C or better in MATH 165. Three hours lecture, one hour discussion
      each week.
    credits: 4
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
