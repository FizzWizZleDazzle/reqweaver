  - id: BIOL226
    name: "Nutrition"
    description: >-
      A course in basic nutritional requirements and considerations of the abnormalities caused
      by excesses or deficiencies of these requirements. Dietary habits and needs of various age
      groups and conditions will be studied. PREREQUISITE(S): BIOL 150 with a grade of C or
      better. Three hours each week.
