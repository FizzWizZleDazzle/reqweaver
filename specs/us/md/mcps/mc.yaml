  # --- ITAL ----------------------------------------------------------------
  - id: ITAL101
    name: "Elementary Italian I"
    description: >-
      (HUMD, GEIR, GEEL, GCP) A beginning language course focusing on the study of Italian
      language and culture. Students begin to develop the ability to communicate in Italian
      through the consideration of cultural themes, language functions, and authentic situations
      as they acquire the structures and lexicon to work with written language, conversation,
      and composition. No prior knowledge of Italian is required. In-class work is supplemented
      by 20 hours of online homework. Three hours each week.
    credits: 3
    level: college
    tags: [world_language]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "World Languages: Italian", synergy: "WLG5130, CE Adv World Language" }
    grad_tags: [world_language]
