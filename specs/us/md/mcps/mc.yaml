    offered_terms: [fall, spring]
    prereqs: { all_of: [ARTT102, GDES116] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5113, CE Adv Graphic Design" }
    grad_tags: [elective]
  - id: GDES211
    name: "Graphic Design II"
    description: >-
      A continuation of GDES 210, concentrating on developing a more personal approach to design
      solutions, conceptual skills, invention, discovery, and perceptual abilities within a
      communications context. Using both traditional hand and computer technologies, students do
      a thorough research process on more advanced projects that explore both static and moving
