  - id: MATH170
    name: "Calculus for Life Sciences I"
    description: >-
      (MATF, GEEL) Intended primarily for students of the life sciences. An introduction to the
      major ideas of single variable calculus including limits, derivatives, and integrals of
      algebraic and transcendental functions; applications to the life sciences. Credit may not
      be earned in both MATH 170 and MATH 181. Not intended for students of the physical
      sciences, engineering, or mathematics. PREREQUISITE(S): A grade of C or better in MATH
      165, appropriate score on mathematics assessment test, or consent of department.
      Assessment Level(s): ENGL 101/ENGL 011 or ELAI 990. For computation of tuition, this
      course is equivalent to five semester hours. Five hours each week. This course appears on
      the MCPS approved list but is no longer in the current MC catalog; the description is from
      the 2025-2026 catalog.
