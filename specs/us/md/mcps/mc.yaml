  # --- NURS ----------------------------------------------------------------
  - id: NURS100
    name: "Foundational Principles of Practical Nursing"
    description: >-
      (ECEC and TP/SS only) First course in the series of practical nursing training. Topics
      include introduction to the nursing profession, core concepts of nursing, assessment of
      patients, overview of relevant anatomy and physiology, and basic nursing care.
      PREREQUISITE(S): BIOL 130, BIOL 131 with a grade of C or better. COREQUISITE(S): NURS 101.
      Three hours lecture each week. Requires admission to the Practical Nursing program
      (permission of department, mandatory orientation).
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOL130, BIOL131] }
    approved: false
  - id: NURS101
    name: "Foundational Principles of Practical Nursing Lab/Clinical"
    description: >-
      (ECEC and TP/SS only) Illustrates and reinforces the concepts discussed in NURS 100.
      Skills learning focuses on assessment, basic nursing interventions, client safety, and
      concerns of the long-term care patient. The course consists of 100 laboratory and clinical
      hours. Clinical/Health requirements of hosting facilities include American Heart
      Association BLS CPR, physical exam, background check, drug/ alcohol screening, and
      immunizations. PREREQUISITE(S): BIOL 130, BIOL 131 with a grade of C or better.
      COREQUISITE(S): NURS 100. Three hours lab and four hours clinical each week. Requires
      admission to the Practical Nursing program (permission of department, mandatory
      orientation).
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOL130, BIOL131] }
    approved: false
  - id: NURS102
    name: "Sub-Acute Practical Nursing"
    description: >-
      (ECEC and TP/SS only) Second course in the series of practical nursing training. Topics
      include health promotion and safety, common health problems in restorative facilities, and
      end-of-life care. Application of pathophysiology, nutrition, and pharmacology to common
      diseases within each topic area. PREREQUISITE(S): NURS 100, NURS 101. COREQUISITE(S): NURS
      103. Three hours lecture each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [NURS100, NURS101] }
    approved: false
  - id: NURS103
    name: "Sub-Acute Practical Nursing Lab/Clinical"
    description: >-
      (ECEC and TP/SS only) Illustrates and reinforces the concepts discussed in NURS 102.
      Skills learning focuses on nursing needs in the sub-acute environment (e.g.,
      rehabilitation) and ongoing focused assessment of patients in restorative care. The course
      consists of 100 laboratory and clinical hours. Clinical/Health requirements of hosting
      facilities include American Heart Association BLS CPR, physical exam, background check,
      drug/ alcohol screening, and immunizations. PREREQUISITE(S): NURS 100, NURS 101.
      COREQUISITE(S): NURS 102. Three hours lab and four hours clinical each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [NURS100, NURS101] }
    approved: false
