      Introduces the conceptual and methodological skills necessary for success in the
      Psychology major, including an understanding of the scientific basis of the discipline,
      critical reasoning skills, information literacy, quantitative reasoning, ethical and
      social awareness, and basic writing skills in the discipline. In addition, PSYC 202
      enhances students' understanding of careers in psychology and awareness of opportunities
      for research experience, service learning, and internship training. PREREQUISITE(S): A
      grade of C or better in PSYC 100, or consent of the department. Three hours each week.
