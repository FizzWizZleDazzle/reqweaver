  # --- GNDS ----------------------------------------------------------------
  - id: GNDS101
    name: "Introduction to Gender Studies"
    description: >-
      (BSSD, GEEL, GCP) A multicultural, interdisciplinary introduction to the study of gender
      in contemporary society. Readings, films, and discussions explore how gender matters in a
      person's daily life; how that impact is socially constructed both historically and
      cross-culturally; and how gender permeates institutions in societies, operating as a
      system of power and reinforcing distinctions that contribute to inequality. This course
      investigates gender as it intersects with race-ethnicity, nationality, sexuality, class,
      age, and ability to shape diverse femininities and masculinities. In learning how gender
      is not something innate or static-that it is created and that it has changed and it can
      change (gender is both a process and a performance)-and by reflecting on their unique
      location within power structures, students will be encouraged to believe that change for
      equality is possible and to assume more engaged forms of citizenship. PRE- or
      COREQUISITE(S): ENGL 101/ENGL 101A or consent of Women's and Gender Studies Program
      Coordinator. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
  - id: GNDS102
    name: "Understanding LGBT Identities"
    description: >-
      (BSSD, GEEL, GCP) An inter-disciplinary, cross-cultural examination of lesbian, gay,
      bisexual and transgender (LGBT) identities in contemporary United States society that
      draws from history, literature, sociology, philosophy, psychology and communications
      studies to understand the diversity of gender expressions and sexual orientations. This
      course surveys who LGBT people are and how academic study of these identities has
      developed. It explores the connection between women's studies and gender studies, and the
      ways women's studies has grown to include analysis of how gender and sexual orientation
      interact and intersect, and how heterosexism and homophobia function in various contexts
      and affect everyone in society. This course requires students to engage both written and
      visual texts, to apply and connect material from the course to life outside the classroom,
      and to investigate sexual minority identities in terms of communities, cultures and
      political movements. Assessment Level(s): ENGL 101/ENGL 011, or consent of program
      coordinator. Three hours each week.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "SOC5124, CE Adv Social Studies" }
    grad_tags: [elective]
