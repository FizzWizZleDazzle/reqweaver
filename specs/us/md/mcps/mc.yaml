      USED TO SATISFY DEGREE REQUIREMENTS. NOT INCLUDED IN GPA CALCULATION.
    credits: 3
    level: college
    tags: [math]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: MATH098
    name: "Introduction to Trigonometry"
    description: >-
      An examination of right triangle trigonometry and applications. Topics include graphs and
      equations involving sine, cosine, tangent, and related basic concepts. Usually scheduled
      to meet 5-7 weeks in the first half or second half of a semester. PREREQUISITE(S): A grade
      of C or better in MATH 050, appropriate score on mathematics assessment test, or consent
      of department. ONE EQUIVALENT CREDIT HOUR. NOT APPLICABLE TO A DEGREE OR CERTIFICATE. MAY
      NOT BE USED TO SATISFY DEGREE REQUIREMENTS. NOT INCLUDED IN GPA CALCULATION.
    credits: 1
    level: college
    tags: [math]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[MATH050]] }
    approved: false
  - id: MATH117
    name: "Elements of Statistics"
    description: >-
      (MATF, GEEL) An introductory noncalculus statistics course to serve a variety of students
      who need a working knowledge of statistics. Descriptive analysis and treatment of data,
      probability and probability distributions, statistical inferences, linear regression and
      correlations, chi-square, and some nonparametric statistics. Preexisting statistical
      computer programs may be used for some applications. PRE- or COREQUISITE(S): Appropriate
      score on mathematics assessment test, a grade of C or better in MATH 050 or MATH 092, or
      concurrent enrollment in MATH 017, or consent of department. Assessment Level(s): ENGL
      101/ENGL 011 or ELAI 990. Three hours each week.
    credits: 3
    level: college
    tags: [math]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "Math", synergy: "MAT5119, CE Adv Mathematics" }
    grad_tags: [math]
    exam_equivalent: [AP_STATISTICS]
  - id: MATH120
    name: "Survey of College Mathematics"
    description: >-
      (MATF, GEEL) A general college mathematics course whose topics include linear equations,
      matrix algebra, linear programming, probability, and mathematical finance. The
      applications are primarily from business, economics, and the life sciences. Emphasis is on
      developing, analyzing, and interpreting mathematical models. PRE- or COREQUISITE(S):
      Appropriate score on mathematics assessment test; a grade of C or better in MATH 050 or
      MATH 092; or concurrent enrollment in MATH 020; or consent of department. Assessment
      Level(s): ENGL 101/ENGL 011 or ELAI 990. Three hours each week.
    credits: 3
    level: college
    tags: [math]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "Math", synergy: "MAT5119, CE Adv Mathematics" }
    grad_tags: [math]
    exam_equivalent: [AP_PRECALCULUS]
  - id: MATH130
    name: "Mathematical Reasoning and Number Systems"
    description: >-
      (MATF, GEEL) Intended for early childhood and elementary education majors, this course
      requires students to examine and explain concepts and processes involving numeration
      systems, number theory, problem solving, whole numbers, integers, and rational numbers.
      PRE- or COREQUISITE(S): Appropriate score on mathematics assessment test, a grade of C or
      better in MATH 050, or concurrent enrollment in MATH 030, or consent of department.
      Assessment Level(s): ENGL 101/ENGL 011 or ELAI 990. Four hours each week.
    credits: 4
    level: college
    tags: [math]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "Math", synergy: "MAT5119, CE Adv Mathematics" }
    grad_tags: [math]
  - id: MATH131
    name: "Geometry and Algebra"
    description: >-
      Intended for early childhood and elementary education majors, this course covers
      proportions, percents, and real numbers; basic geometry that includes congruence,
      similarity, symmetry, and transformations; measurement and coordinate geometry; and
      algebra emphasizing multiple representations. PREREQUISITE(S): A grade of C or better in
      MATH 130 or consent of department. Four hours each week. May not be taken concurrently
      with MATH 132 without consent of department.
    credits: 4
    level: college
    tags: [math]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[MATH130]] }
    approved: true
    hs_credit: { category: "Geometry/Math", synergy: "MAT5119, CE Adv Mathematics" }
