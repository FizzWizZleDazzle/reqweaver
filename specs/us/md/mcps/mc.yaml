  - id: MATH017
    name: "Elements of Statistics Support"
    description: >-
      A corequisite course designed to equip students with the skills needed to be successful in
      MATH 117 by providing support in fundamental mathematics. Topics include operations on
      real numbers, evaluation of algebraic expressions, finding the mean and median of sets of
      data, analyzing and interpreting graphs of data sets, and basic probability.
      PREREQUISITE(S): Appropriate score on the mathematics assessment test or consent of the
      department. COREQUISITE(S): MATH 117. Assessment Level(s): ENGL 101/ENGL 011 or ELAI 990.
      Two hours each week. TWO EQUIVALENT CREDIT HOURS. NOT APPLICABLE TO A DEGREE OR
      CERTIFICATE. MAY NOT BE USED TO SATISFY DEGREE REQUIREMENTS. NOT INCLUDED IN GPA
      CALCULATION.
