      department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[THET100]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5127, CE Adv Theater" }
    grad_tags: [elective]
  - id: THET295
    name: "Theatre Internship"
    description: >-
      (R and TP/SS only) Students work for College credit in a theatre or other professional
      performing arts organization or venue. Students may propose an internship for one of the
      limited number available in theatre each year. Typically, the internships are awarded
      during the last year of study at Montgomery College. PREREQUISITE(S): Open to theatre
      majors who have completed 24 theatre-related credits. A 3.2 GPA and consent of
      departmental theatre internship coordinator and the Arts Institute internship coordinator
      are required. Fifteen hours each week per semester.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
