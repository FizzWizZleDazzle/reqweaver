  # --- DANC ----------------------------------------------------------------
  - id: DANC100
    name: "Introduction to Dance"
    description: >-
      (ARTD, GEIR, GEEL, GCP) (R and TP/SS only) An examination of dance as an art form and
      means of multicultural expression, ritual, and tradition. This course familiarizes the
      student with practices, philosophies, terminologies, styles of dance and careers in dance.
      The role of dance in world societies and how it relates to different cultures is explored
      through lectures, assigned readings, films, recordings, and experiential dance activities.
      Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "Fine Art", synergy: "ART5117, CE Adv Integrated Arts" }
    grad_tags: [fine_arts]
  - id: DANC101
    name: "Ballet I"
    description: >-
      (R and TP/SS only) An introduction to fundamental exercises, techniques, and steps of
      classical ballet. Basic ballet terminology, correct body alignment, and simple adagio and
      allegro combinations are introduced in barre and center work. One hour lecture, two hours
      laboratory each week.
    credits: 2
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: DANC102
    name: "Ballet II"
    description: >-
      (R only) Further study of classical ballet as offered in DANC 101. Emphasis on developing
      an aesthetic awareness of the art, understanding ballet theory, and perfecting technique.
      Review of basic exercises and terminology. Pirouettes and petite batterie are introduced.
      PREREQUISITE(S): DANC 101 or consent of department. May be repeated for a maximum of six
      credits with consent of department. One hour lecture, four hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[DANC101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5107, CE Adv Dance" }
    grad_tags: [elective]
  - id: DANC103
    name: "Modern Dance I"
    description: >-
      (R and TP/SS only) An introduction to fundamental exercises, techniques, and movement
      phrases of modern dance. Basic modern dance principles are introduced in axial and
      locomotor exercises and basic improvisation skills. Modern dance innovators and their
      styles are discussed. One hour lecture, two hours laboratory each week.
    credits: 2
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: DANC104
    name: "Modern Dance II"
    description: >-
      (R only) Further study of modern dance as offered in DANC 103. Includes an understanding
      of contemporary dance as a creative art form, perfecting technique, developing
      improvisational skills, experimenting with creative movement studies, and analyzing
      rhythmic patterns. Review of basic exercises and terminology. PREREQUISITE(S): DANC 103 or
      consent of department. May be repeated for a maximum of six credits with consent of
      department. One hour lecture, four hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[DANC103]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5107, CE Adv Dance" }
    grad_tags: [elective]
  - id: DANC105
    name: "Jazz Dance I"
    description: >-
      (R and TP/SS only) An introduction to fundamental jazz exercises, techniques, and styles.
      Basic jazz dance principles are introduced, including body isolations, flexibility
      exercises, and movement phrases. One hour lecture, two hours laboratory each week.
    credits: 2
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: DANC106
    name: "Jazz Dance II"
    description: >-
      (R only) Further study of jazz dance as offered in DANC 105. Emphasis on perfecting
      technique, creating advanced-beginning jazz compositions, and developing a more in-depth
      understanding of the essence and components of jazz dance. Emphasis is placed on
      advanced-beginning steps and terminology, including double turns, body isolations, and
      elevation steps. PREREQUISITE(S): DANC 105 or consent of dance program coordinator. One
      hour lecture, four hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[DANC105]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5107, CE Adv Dance" }
    grad_tags: [elective]
  - id: DANC107
    name: "Tap Dance I"
    description: >-
      (R and TP/SS only) An introduction to basic tap techniques, exercises, movements, and
      improvisational skills. A variety of rhythmic patterns and fundamental steps such as
      shuffles, ball changes, heel drops, time steps, flaps, and beginning turns are introduced.
      Tap dance history and styles will be discussed. One hour lecture, two hours laboratory
      each week.
    credits: 2
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: DANC200
    name: "Introduction to Dance Composition"
    description: >-
      Introduction to Dance Composition. This course is on the MCPS approved dual-enrollment
      list but has no page in the current MC catalog; name is from the approved list and the
      credit value is a placeholder.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5107, CE Adv Dance" }
    grad_tags: [elective]
  - id: DANC201
    name: "Ballet III"
    description: >-
      (R only) The development and execution of classical ballet technique on an intermediate
      level. Concentration is on body alignment, technical accuracy, increased movement
      vocabulary, and performance quality. Pirouettes, petite batterie, and petit and grand
      allegro are stressed. PREREQUISITE(S): DANC 102 or consent of department. May be repeated
      for a maximum of six credits with consent of department. One hour lecture, four hours
      laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[DANC102]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5107, CE Adv Dance" }
    grad_tags: [elective]
  - id: DANC203
    name: "Modern Dance III"
    description: >-
      (R only) The study of contemporary modern dance on an intermediate level. Correct body
      alignment, development of technique, and efficient use of the body through movement are
      stressed. Various falls, turns, and contractions are studied. Elements of time, flow,
      weight, space, and varied rhythmic structures are incorporated into movement phrases.
      Improvisational skills are employed. PREREQUISITE(S): DANC 104 or consent of department.
      May be repeated for a maximum of six credits with consent of department. One hour lecture,
      four hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[DANC104]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5107, CE Adv Dance" }
    grad_tags: [elective]
  - id: DANC204
    name: "Modern Dance IV"
    description: >-
      (R only) A progression of contemporary dance as presented in DANC 203. Emphasis is on more
      complex movement phrases. Individual expression, musicality, style, and performance are
      stressed. Improvisational skills are employed. PREREQUISITE(S): DANC 203 or consent of
      department. May be repeated for a maximum of six credits with consent of department. One
      hour lecture, four hours laboratory each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[DANC203]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5107, CE Adv Dance" }
    grad_tags: [elective]
  - id: DANC205
    name: "Jazz Dance III"
    description: >-
      (R only) The study of jazz dance on an intermediate level. Proficient technique, correct
      body alignment, and performance are stressed. Jazz isolations, triple turns, rhythmic
      sequences, and slides are studied in addition to high elevation steps. PREREQUISITE(S):
      DANC 106 or consent of dance program coordinator. One hour lecture, four hours laboratory
      each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[DANC106]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5107, CE Adv Dance" }
    grad_tags: [elective]
  - id: DANC270
    name: "Special Topics in Dance"
    description: >-
      (R only) Topics in dance presented as a result of community or student interest, to
      include a variety of dance-related skills or intensive study in a specific area. Topics to
      be announced each semester in the class schedule. PREREQUISITE(S): Consent of dance
      program coordinator and/or department chair. Assessment Level(s): ENGL 101/ENGL 011. One
      hour lecture, four hours laboratory each week.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: DANC280
    name: "Special Dance Practicum"
    description: >-
      (R only) Offered on an individual basis to dance majors with advanced standing. Students
      may extend their studies by exploration of a particular specialization within the
      curriculum. PREREQUISITE(S): Consent of department. Assessment Level(s): ENGL 101/ENGL
      011, or consent of department. May be repeated for a maximum of six credits with consent
      of department. One hour lecture, four hours laboratory each week.
    credits: 3
    level: college
    tags: [fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  # --- DATA ----------------------------------------------------------------
  - id: DATA101
    name: "Introduction to Data Science"
    description: >-
      Fundamental coursework on the standards and practices for collecting, organizing,
      managing, exploring, and statistically analyzing data. Topics include preparation,
      analysis, and modeling of data, the basics of machine learning, and creating analysis
      tools for larger data sets. PREREQUISITE(S): A grade of C or better in MATH 117, MATH 217,
      BSAD 210 or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[MATH117, MATH217, BSAD210]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: DATA110
    name: "Data Visualization and Communication"
    description: >-
      Emphasis on data visualization and communication skills for professional situations
      including effective quantitative summary and public speaking. Preparing and producing data
      visualizations, presentations, and technical documents for specific audiences and analyses
      for general audiences. PREREQUISITE(S): A grade of C or better in MATH 117/MATH 117A, MATH
      217, BSAD 210 or consent of department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[MATH117, MATH217, BSAD210]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: DATA201
    name: "Statistical Methods in Data Science"
    description: >-
      Statistical concepts and applications related to data science including advanced
      exploratory data analysis, nonparametric inference and simulation for larger datasets,
      logistic regression modeling, statistical programming, and advanced machine learning.
      Topics include fundamentals of supervised and unsupervised learning, resampling methods,
      model selection and regularization, time series or sequence data, tree-based methods, and
      unstructured data. PREREQUISITE(S): A grade of C or better in DATA 101 or consent of
      department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[DATA101]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: DATA205
    name: "Capstone Experience in Data Science"
    description: >-
      A comprehensive, project-based course where Montgomery College and its partners in
      industry, science, and government work alongside faculty and students providing expertise,
      guidance, and real data. Course includes topics in advanced data mining, data ethics, and
      reproducible research. PREREQUISITE(S): A grade of C or better in DATA 110 or consent of
      department. PRE- or COREQUISITE(S): DATA 201. Four hours each week.
    credits: 4
    level: college
    tags: [elective, computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[DATA110]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ITC5104, CE Adv Computer Science" }
    grad_tags: [elective]
  - id: DATA269
    name: "Data Science and Technologies Internship"
    description: >-
      College credit for working in a professional environment related to the data science
      field. The intent is to give an appropriate work experience that will expand students'
      knowledge and aid in making career decisions. A limited number of internships are
      available through the program each semester, or the student may propose an internship. A
      comprehensive record of the work experience is kept by the student and discussed in
      seminar meetings. To qualify for this course, a student must have completed DATA 205 and
      must provide a letter of recommendation from one of their program professors.
      PREREQUISITE(S): Consent of internship coordinator and a minimum of 12 semester hours in
      DATA, MATH, or CMSC courses required in the program. Three hours lecture and eight to ten
      hours of work experience each week.
    credits: 12
    level: college
    tags: [computer_science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  # --- ECON ----------------------------------------------------------------
  - id: ECON105
    name: "Basic Economics"
    description: >-
      (BSSD, GEEL, GCP) Economics is the study of how individuals and societies use limited
      resources to achieve their goals. Economics can help students understand human behavior
      and make better decisions throughout their lives. This course is a one-semester
      introduction to macroeconomics and microeconomics for non-business and non-economics
      majors. A broad range of basic economic concepts will be covered. Assessment Level(s):
      ENGL 101/ENGL 011, MATH 050. Three hours each week. May not be taken concurrently with
      MATH 017 or MATH 020 or MATH 030 or MATH 045 without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5108, CE Adv Economics" }
    grad_tags: [elective]
  - id: ECON201
    name: "Principles of Economics I"
    description: >-
      (BSSD, GEEL, GCP) Covers macroeconomics - the study of the economy as a whole.
      Macroeconomics can help students make personal and business decisions and assess public
      policy issues throughout their lives. Topics include: supply and demand, national income
      and product, unemployment, inflation, aggregate supply and demand, economic growth and
      development, money and banking, monetary and fiscal policy, international trade, and
      economic systems. PREREQUISITE(S): High school algebra or its equivalent or consent of
      department. Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Three hours each week. May
      not be taken concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without
      appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5108, CE Adv Economics" }
    grad_tags: [elective]
    exam_equivalent: [AP_MACROECONOMICS]
  - id: ECON202
    name: "Principles of Economics II"
    description: >-
      (BSSD, GEEL) Covers microeconomics- the study of how individuals, businesses, and
      governments make choices about limited resources to achieve their goals. Microeconomics
      can help students make personal and business decisions and assess public policy issues
      throughout their lives. Topics include supply and demand, elasticity, government controls,
      market failure, production, business costs, profit maximization, and market structures.
      PREREQUISITE(S): High school algebra or its equivalent or consent of department.
      Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Three hours each week. May not be taken
      concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045 without appropriate Math
      assessment score.
    credits: 3
    level: college
    tags: [elective, social_studies]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BMF5108, CE Adv Economics" }
    grad_tags: [elective]
    exam_equivalent: [AP_MICROECONOMICS]
  # --- EDUC ----------------------------------------------------------------
  - id: EDUC101
    name: "Foundations of Education"
    description: >-
      An introductory course exploring the historical, legal, philosophical, social, and
      practical aspects of American education. Students evaluate current educational trends,
      issues, and practices. They also explore teaching as a career and other career
      opportunities in contemporary education. PRE- or COREQUISITE(S): ENGL 101/ENGL 101A. Three
      hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC102
    name: "Field Experience in Education"
    description: >-
      Provides a structured field-based experience for students to observe teachers and students
      in local public schools. Applying concepts learned in EDUC 101 or PHED 201, students
      reflect on the teaching and learning process. Experiences in small group and individual
      instruction provide a transition from theory to practice. Attendance at on-campus and
      school site orientations required before beginning observations. PRE- or COREQUISITE(S):
      EDUC 101 or PHED 201. Five hours lecture and thirty hours practicum each semester.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: EDUC105
    name: "Step 1: Inquiry Approaches to STEM Teaching"
    description: >-
      A first exploration into mathematics and science teaching as a career. Following an
      introduction to the theory and practice behind excellent inquiry-based science and
      mathematics instruction, students observe master teachers leading a science or mathematics
      lesson in local elementary classrooms and then obtain firsthand experience with planning
      and implementing their own inquiry-based lesson. This course does not fulfill any
      requirements for the AAT degrees. Assessment Level(s): ENGL 101/ENGL 011 or ELAI 990, ELAR
      980, MATH 165 or higher or consent of department. A minimum of 30 hours, of 50 minutes
      each of supervised laboratory.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: EDUC115
    name: "Child Health, Safety, and Nutrition"
    description: >-
      Examines the health, safety, and nutritional needs of young children. Emphasizes common
      childhood illnesses and chronic conditions, health assessment tools and effective control
      measures; emergency care and first aid, safety management and practices; nutritional
      guidelines and activities. Offers opportunities for students to develop a curriculum that
      enhances children's education on health, safety, and nutrition. Assessment Level(s): ENGL
      101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC119
    name: "Introduction to Early Childhood Education"
    description: >-
      Covers curriculum modes, a teacher's roles, and family relationships. Topics include
      historical development, significant issues, current trends, ethics, and national standards
      in early childhood education. Assessment Level(s): ENGL 101/ENGL 011. Three hours each
      week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC135
    name: "Child Growth and Development"
    description: >-
      Provides students with the principles of child growth and development necessary to work in
      programs serving children from infancy through age eight. It emphasizes the physical,
      intellectual, emotional, and social development of children and their implications for
      developmentally appropriate teaching practices in educational settings. Attention is given
      to observation methods and their application in the completion of a case study of one
      child in a classroom environment. Students who pass the course with the final grade of "C"
      or better will receive 45 of the 90 classroom hours needed to become senior staff in
      programs licensed by the Office of Child Care Licensing and Regulations. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC136
    name: "Curriculum Planning in Early Childhood Education"
    description: >-
      Provides the student with an overview of the principles of developmentally appropriate
      curriculum planning for programs serving children from infancy and pre-K through age five.
      Specifically, this course emphasizes activity planning, teaching methods, material
      selection, assessment techniques, and classroom management appropriate for use in early
      childhood programs. Attention is also given to staff and parent communication and
      community resources. Students who pass the course with the final grade of "C" or better
      will receive 45 of the 90 classroom hours needed to become senior staff in programs
      licensed by the Office of Child Care Licensing and Regulation. 15 hours of documented
      field experience in a birth-through five or pre-K program are required. PREREQUISITE(S):
      EDUC 135 or consent of department. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[EDUC135]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC153
    name: "Infant and Toddler Development and Curriculum Planning"
    description: >-
      Introduces the theory and practice of caring for infants and toddlers in a group setting.
      Topics include the significance of the early years; learning and development of infants
      and toddlers; socio-physical environment of group care setting; appropriate activities and
      interactions; and health, safety, and nutritional needs of infants and toddlers. Upon
      completion of this course, the student meets the coursework requirement for the position
      of infant/toddler senior staff in a child care center. Assessment Level(s): ENGL 101/ENGL
      011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC154
    name: "School-Age Child Care"
    description: >-
      Covers necessary elements for providing before-and-after-school programs serving children
      ages five to 13; quality, standards, and care issues; the growth and development of five-
      through 13- yearolds; teachers' roles and qualifications; working with families and
      communities. Topics also include activity planning, environment designing, scheduling,
      building relationships with children, guiding children's behavior, and caring for children
      with special needs. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC170
    name: "First Start: Care of Infants and Toddlers with Disabilities"
    description: >-
      Provides an overview of a variety of disabling conditions and chronic illnesses that can
      afflict infants and toddlers. Students will learn about the care needs of these children,
      legal issues, parental issues, and child and family advocacy. This course will include
      sessions with health and education professionals from the community who specialize in
      specific disabling conditions. Assessment Level(s): ENGL 101/ENGL 011. Three hours
      lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC180
    name: "Children's Literature"
    description: >-
      A survey of a variety of significant and exemplary children's literature for preschool
      through elementary school, with the emphasis on the evaluation and presentation of
      children's literature. The course offers opportunities for the student to develop activity
      plans that enhance children's language development and early literacy. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC201
    name: "Introduction to Special Education"
    description: >-
      Covers psychological, sociological, and medical characteristics of the exceptional
      learner: mental retardation, learning disabilities, emotional or behavioral disorders,
      communication disorders, hearing impairments, visual impairment, physical disabilities,
      and giftedness. Topics also include classroom practices, current issues and trends,
      history and legal aspects, multicultural and bilingual implications. PREREQUISITE(S): EDUC
      101/EDUC 102, EDUC 135, or PSYC 215. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[EDUC101, EDUC102, EDUC135, PSYC215]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC202
    name: "Field Experience in Special Education"
    description: >-
      Provides a structured field-based experience for students to observe teachers and students
      in special education setting in local public schools. Applying concepts learned in EDUC
      201, students reflect on teaching and learning with diverse student populations.
      Experiences in a small group and individual instruction provide a transition from theory
      to practice. Attendance at on-campus and school site orientations required before
      beginning observations. PRE- or COREQUISITE(S): EDUC 201. Five hours lecture and thirty
      hours practicum each semester.
    credits: 1
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: EDUC208
    name: "Observation and Assessment of Young Children"
    description: >-
      Provides students with a broad set of observation and assessment tools and approaches.
      Covers guidelines and procedures of observation, documentation, and assessment. Emphasis
      is on analyzing and interpreting assessment results to enhance children's learning
      outcomes. Establishing partnerships with families and other professionals will be
      discussed. Students are required to do 15 hours of field experience. PRE- or
      COREQUISITE(S): EDUC 136. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC210
    name: "Curriculum Seminar-Science and Mathematics for Young Children"
    description: >-
      Science and mathematics concepts appropriate to the developmental levels of young children
      will be presented and analyzed. The student will develop curriculum activities and test
      these activities with young children to determine their usefulness in promoting logical
      thinking through interaction with concrete materials. PREREQUISITE(S): EDUC 136. Two hours
      each week.
    credits: 2
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [EDUC136] }
    approved: false
  - id: EDUC224
    name: "Social-Emotional Development in Young Children"
    description: >-
      Enables the student to comprehend the process by which children develop social and
      emotional competence. The focus will be on the principles and techniques of a
      developmentally appropriate guidance approach, the role of adults and community in a
      child's social and emotional development, activity planning, and the ethical standards of
      the National Association for the Education of Young Children (NAEYC). PREREQUISITE(S):
      EDUC 136. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [EDUC136] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC227
    name: "Administering Early Childhood Programs"
    description: >-
      Designed to provide students with management skills necessary to operate an early
      childhood center or school that serves children from infancy through age eight. Topics
      include program policies and procedures, government regulations, finance and budget,
      facility operation, personnel management, health and safety, accreditation systems, and
      program evaluation and improvement. PREREQUISITE(S): EDUC 136 or its equivalent. Three
      hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[EDUC136]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC233
    name: "Practicum in Early Childhood Education"
    description: >-
      Experience in working with young children in a naturalistic setting; learning to identify
      children's learning interests and to adapt curriculum to children's needs; planning and
      implementing large and small group activities; practicing effective communication skills
      and class management skills; and evaluating a quality child care program. PREREQUISITE(S):
      EDUC 136. Fifteen hours lecture and 90 hours practicum.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [EDUC136] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC243
    name: "Processes and Acquisition of Literacy"
    description: >-
      Designed to provide teacher candidates and in-service teachers with the foundations
      related to literacy processes and acquisition. Effective literacy teaching begins with a
      deep understanding of the component processes associated with reading and writing and the
      ways that students develop into skilled and motivated readers and writers. The course is
      organized along five major themes: the component processes involved in reading and
      writing; the nature and structure of the English language; the ways that native English
      speakers and English learners differ in the ways they read and write; the developmental
      phases associated with learning to read and write for native English speakers and English
      learners, and the many factors that influence literacy development. Where appropriate,
      students in this course will also explore how to assess literacy processes and
      acquisition. PREREQUISITE(S): A grade of C or better in EDUC 201, or consent of
      department. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[EDUC201]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC244
    name: "Instruction in Literacy"
    description: >-
      Designed to prepare teacher candidates and in-service teachers with the knowledge and
      skills to design and deliver effective literacy instruction for a diverse community of
      learners. Content will focus on the core components of reading that lead to proficient and
      motivated reading behavior for all students, provide instruction focused on the core
      components of writing that lead to proficient and motivated writing behavior for all
      students, and manage speaking and listening opportunities that lead to more active,
      equitable and academically oriented conversations for all students. In addition,
      participants will understand the role of classroom literacy instruction in a multi-tiered
      system of support and learn how to work with a myriad of stakeholders to provide
      evidence-based interventions for students who struggle as readers and writers.
      PREREQUISITE(S): EDUC 243 or consent of department. Three hours lecture/discussion each
      week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[EDUC243]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC245
    name: "Materials for Teaching Literacy"
    description: >-
      Designed to assist teacher candidates and in-service teachers in selecting, developing,
      and evaluating materials for teaching reading, writing and related skills. Learners will
      explore characteristics of effective literacy programming and instruction, use
      scientifically valid frameworks and evidenced-based criteria to select and organize print
      and multimedia resources for teaching reading and writing to all children, learn how to
      use a variety of print and multimedia/ multimodal resources to engage students as readers
      and writers, and examine how best to provide culturally responsive literacy instruction
      that promotes all students' cultural competence through inclusive and equitable literacy
      learning opportunities. PREREQUISITE(S): EDUC 243 or consent of department. Three hours
      lecture/discussion each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[EDUC243]] }
    approved: false
  - id: EDUC246
    name: "Assessment of Literacy"
    description: >-
      Designed to assist teacher candidates and in-service teachers in becoming proficient
      consumers and users of classroom-based assessment and assessment data. Participants will
      explore the purposes of assessments and types of assessment tools, learn how to administer
      and use valid and reliable, formal and informal assessments of literacy and related
      skills, examine how to effectively interpret the results of assessments, and learn how to
      communicate assessment results in a variety of contexts. Additionally, students will
      engage in comprehending the utility of qualitative and quantitative data in a myriad of
      contexts to inform instructional decisions and designs. PREREQUISITE(S): EDUC 243 or
      consent of department. Three hours lecture/discussion each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[EDUC243]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC256
    name: "Principles of Educational Assessment"
    description: >-
      This course is an introduction to tests and measurement in an educational setting.
      Students develop, use, and interpret classroom assessments, including tests, performance
      assessments, rating scales, portfolios, and observations. Basic standard setting, grading,
      testing ethics, locating and evaluating measurements, program evaluation, and classroom
      research are also presented. This course meets the Maryland State Department of Education
      (MSDE) Assessment for Students requirement for an initial certificate in Early Childhood
      Education, Elementary Education, and Secondary Education. This course also meets the MSDE
      Assessment, Diagnosis, and Prescriptive Techniques required for the initial certificate in
      Generic Special Education (Infant/ Primary), Generic Special Education
      (Elementary/Middle), and Generic Special Education (Secondary/ Adult). Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC260
    name: "Methods of Teaching for Elementary Education"
    description: >-
      Provides an overview of teaching methodology for effective instruction in elementary
      classrooms. Opportunities will be provided for planning and practicing instruction based
      on a knowledge of the theory and research supporting the strategies and models used.
      Emphasis will be on developing the habit of reflective practice and fostering
      collaborative problem solving. This course meets the Maryland State Department of
      Education Teaching Methodology requirement for an initial certificate in Elementary
      Education. This course does not fulfill any requirements for the A.A.T. Assessment
      Level(s): ENGL 101/ENGL 011. Three hours each week.
    credits: 3
    level: college
    tags: [elective, cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "EDU5109, CE Adv Education" }
    grad_tags: [elective]
  - id: EDUC265
    name: "Methods of Teaching Secondary Students"
    description: >-
      This course provides an overview of teaching methodology for effective instruction for
      prospective and noncertified secondary teachers. Students plan, design, and conduct
      instruction. Topics include theory and practices, research-based instructional models,
      multiculturalism, classroom management, and inclusion of students with special needs. This
      course meets the Maryland State Department of Education Teaching Methodology requirement
      for an initial certificate in Secondary Education. Assessment Level(s): ENGL 101/ENGL 011.
      Three hours each week.
    credits: 3
    level: college
    tags: [cte]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  # --- ELAI ----------------------------------------------------------------
  - id: ELAI990
    name: "English Language Advanced Integrated Skills"
    description: >-
      An advanced integrated skills course in Academic American English for non- native speakers
      of English. Emphasis on reading and aural comprehension of academic input and appropriate
      use of academic English in writing expository essays and short responses to readings and
      lectures. PREREQUISITE(S): ELAW 980, ELAR 980, and ELAS 980 with a grade of C or better or
      AELW 930 with a grade of C or better and AELR 930 and AELS 920 with a grade of D or better
      or placement by testing required by the college for non-native speakers of English. Six
      hours each week. SIX EQUIVALENT CREDIT HOURS. NOT APPLICABLE TO A DEGREE OR CERTIFICATE.
      MAY NOT BE USED TO SATISFY DEGREE REQUIREMENTS. NOT INCLUDED IN GPA CALCULATION.
    credits: 6
    level: college
    tags: [eml]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [ELAW980, ELAR980, ELAS980] }
    approved: false
  # --- ELAR ----------------------------------------------------------------
  - id: ELAR970
    name: "English Language Academic Reading I"
    description: >-
      The first required course in a sequence of two courses designed to teach academic reading
      of American English. Emphasis on intermediate college skills required for success in
      content courses, including vocabulary development, critical thinking, paragraph and essay
      comprehension, textbook and media analysis, test- and note-taking, and dictionary use.
      Additional laboratory required. PREREQUISITE(S): AELR 910 with a grade of C or better or
      placement by testing required by the College of non-native speakers of English. Five hours
      each week. FIVE EQUIVALENT CREDIT HOURS. NOT APPLICABLE TO A DEGREE OR CERTIFICATE. MAY
      NOT BE USED TO SATISFY DEGREE REQUIREMENTS. NOT INCLUDED IN GPA CALCULATION.
    credits: 5
    level: college
    tags: [eml]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: ELAR980
    name: "English Language Academic Reading II"
    description: >-
      The second required course in academic reading for non-native speakers of students
      continues the teaching of academic reading of American English presented in the preceding
      course. Emphasis on the advanced college skills required for success in content courses,
      including college-level paragraph and essay comprehension, critical reading, textbook and
      media analysis, and rhetorical patterns. Additional laboratory required. PREREQUISITE(S):
      ELAR 970 or AELR 920 with a grade of C or better or placement by testing required by the
      College of non-native speakers of English. Five hours each week. FIVE EQUIVALENT CREDIT
      HOURS. NOT APPLICABLE TO A DEGREE OR CERTIFICATE. MAY NOT BE USED TO SATISFY DEGREE
      REQUIREMENTS. NOT INCLUDED IN GPA CALCULATION.
    credits: 5
    level: college
    tags: [eml]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ELAR970]] }
    approved: false
  # --- ELAS ----------------------------------------------------------------
  - id: ELAS970
    name: "English Language Academic Speaking/Listening I"
    description: >-
      An introductory course designed to enhance the speaking and listening skills of non-native
      English speakers. Emphasis is on pronunciation, stress, rhythm, and intonation patterns of
      American English. Oral communication, listening comprehension, and vocabulary development
      are stressed. Students build their skills through instruction and intensive practice.
      Additional laboratory required. PREREQUISITE(S): Placement by testing required by the
      College for non-native speakers of English. Five hours each week. FIVE EQUIVALENT CREDIT
      HOURS. NOT APPLICABLE TO A DEGREE OR CERTIFICATE. MAY NOT BE USED TO SATISFY DEGREE
      REQUIREMENTS. NOT INCLUDED IN GPA CALCULATION.
    credits: 5
    level: college
    tags: [eml]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: ELAS980
    name: "English Language Academic Speaking/Listening II"
    description: >-
      Emphasizes the development and use of language skills necessary for understanding others
      and expressing oneself orally in American English in academic, professional, and social
      contexts. The course includes vocabulary development, practice with appropriate language
      structures, and discussion of important aspects of cross-cultural communication.
      Additional laboratory required. PREREQUISITE(S): ELAS 970 or AELS 910 with a grade of C or
      better or placement by testing required by the College of non-native speakers of English.
      PRE- or COREQUISITE(S): ELAR 970, ELAW 970, or placement by testing required by the
      College for non-native speakers of English. Five hours each week. FIVE EQUIVALENT CREDIT
      HOURS. NOT APPLICABLE TO A DEGREE OR CERTIFICATE. MAY NOT BE USED TO SATISFY DEGREE
      REQUIREMENTS. NOT INCLUDED IN GPA CALCULATION.
    credits: 5
    level: college
    tags: [eml]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ELAS970]] }
    approved: false
  # --- ELAW ----------------------------------------------------------------
  - id: ELAW970
    name: "English Language Academic Writing I"
    description: >-
      The first course for ELAP students in a sequence of two courses designed to teach academic
      writing of American English. Emphasis on appropriate use of a variety of sentence
      structures, complex verb forms, modifiers, and punctuation, and to produce content based
      paragraphs in and out of class. Additional laboratory required. PREREQUISITE(S): AELW 910
      with a grade of C or better or placement by testing required by the College of non-native
      speakers of English. Five hours each week. FIVE EQUIVALENT CREDIT HOURS. NOT APPLICABLE TO
      A DEGREE OR CERTIFICATE. MAY NOT BE USED TO SATISFY DEGREE REQUIREMENTS. NOT INCLUDED IN
      GPA CALCULATION.
    credits: 5
    level: college
    tags: [eml]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: ELAW980
    name: "English Language Academic Writing II"
    description: >-
      The second course in a sequence of two courses designed to teach academic writing of
      American English to non- native speakers of English. Emphasis on appropriate use of a
      variety of sentence structures, complex verb forms, modifiers, and punctuation, and
      ability to produce content based and expository multi-paragraph compositions in and out of
      class and short responses to academic readings. Additional laboratory required.
      PREREQUISITE(S): ELAW 970 or AELW 970 with a grade of C or better or placement by testing
      required by the College of non-native speakers of English. Five hours each week. FIVE
      EQUIVALENT CREDIT HOURS. NOT APPLICABLE TO A DEGREE OR CERTIFICATE. MAY NOT BE USED TO
      SATISFY DEGREE REQUIREMENTS. NOT INCLUDED IN GPA CALCULATION.
