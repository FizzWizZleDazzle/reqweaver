    description: >-
      An introduction to the field of communication. Definitions, models, and contexts of
      communication are examined. Students are introduced to the research process in the field
      of communication and learn how the process relates to the development of communication
      theory. Assessment Level(s): ENGL 101/ENGL 011. Three hours each week.
