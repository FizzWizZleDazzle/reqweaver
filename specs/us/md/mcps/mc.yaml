    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "AMC5113, CE Adv Graphic Design" }
    grad_tags: [elective]
  - id: GDES210
    name: "Graphic Design I"
    description: >-
      An introduction to visual thinking with an exploration of graphic design history,
      principles, and practices, including image creation, signs and symbols, concept
      development, typography, composition, grid systems, process, and vocabulary. Students
      develop problem-solving skills through analysis and reflection while employing
