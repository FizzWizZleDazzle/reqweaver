    name: "Literature of the Holocaust"
    description: >-
      Examines the experience of the Holocaust through poetry, drama, the novel, and the diary.
      Emphasis on the literary responses of individual survivors and of witnesses, and the
      literature of atrocity the Holocaust evoked. Historical background helpful, but not
      required. PREREQUISITE(S): A grade of C or better in ENGL 101 or ENGL 101A or consent of
