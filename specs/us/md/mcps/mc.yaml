    name: "Readings in French Literature"
    description: >-
      (HUMD, GEIR, GEEL, GCP) An introduction to French literature through the reading of
      representative genres. Includes advanced composition, conversation, and an introduction to
      literary criticism through frequent themes, explications de texte, and class discussion.
