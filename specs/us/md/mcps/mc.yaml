  # --- BIOT ----------------------------------------------------------------
  - id: BIOT110
    name: "Introduction to Biotechnology"
    description: >-
      Designed to introduce students to multiple aspects of the biotechnology industry. The
      biology behind biotechnology including an introduction to DNA, proteins, cells and cell
      function, and genetic engineering is the introductory unit. Another unit describes various
      sectors of the biotechnology industry including diagnostics, therapeutics, agriculture,
      and bioremediation. Product development in the context of a regulated environment (GLP,
      GCP, cGMP) and company structure is also described. A third area covers job search,
      employer expectations, and ethics at the workplace. Also discussed is an introduction to
      basic laboratory math, lab safety, equipment and reagents, and introduction to
      experimental design. Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Three hours each
      week. May not be taken concurrently with MATH 017 or MATH 020 or MATH 030 or MATH 045
      without appropriate Math assessment score.
    credits: 3
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: BIOT120
    name: "Introduction to Cell Culture"
    description: >-
      An introduction to the basic principles of cell culture. Classification and origin of
      cells in culture, growth curves and associated calculations, cell culture laboratory
      equipment, causes of contamination, detection of contamination, environmental monitoring,
      prevention of contamination, cell line authentication. Cell culture growth environment
      incubators, atmosphere, buffers, media and media supplements. Experimental design with an
      emphasis on root cause analysis. Assessment Level(s): ENGL 101/ENGL 011, MATH 050. Two
      hours lecture. May not be taken concurrently with MATH 017 or MATH 020 or MATH 030 or MATH
      045 without appropriate Math assessment score.
    credits: 2
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: BIOT121
    name: "Aseptic Technique and Cell Culture Skills"
    description: >-
      (G only) An introduction to fundamental laboratory methods required for the successful
      growth of both anchorage dependent and suspension animal cells in culture. The emphasis is
      on Good Laboratory Practice (GLP) as applied to animal cell culture. How to read and use
      SOPs including traceability. Proper gowning. Proper aseptic technique and use of the
      biological safety cabinet. Preparation of media, feeding and passaging of cells, and
      initial scale-up. Cell counting, including viability determination both manually and
      semi-automated and seeding at a specific concentration. Environmental monitoring and
      contamination testing. PRE- or COREQUISITE(S): BIOT 120. Three hours laboratory each week.
    credits: 1
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: BIOT200
    name: "Protein Biotechnology"
    description: >-
      An introduction to protein structure and function. Primary, secondary, tertiary, and
      quaternary structure are discussed in relation to protein function and stability. Causes
      of protein denaturation and its prevention by formulations for biologics. Functional
      assays for proteins such as enzymes and receptors are described in terms of experimental
      design, data collection, and data analysis. Strategies and methods of protein purification
      and quality determination such as chromatographic, electrophoretic and spectrophotometric
      techniques, peptide mapping and sequencing are presented. Relevant calculations such as
      buffer and solution preparation, standard curves, and kinetic assays will be discussed.
      PREREQUISITE(S): BIOL 150 or CHEM 131 or consent of the department. Three hours lecture.
    credits: 3
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[BIOL150, CHEM131]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: BIOT201
    name: "Protein Biotechnology Skills"
    description: >-
      (G only) Provides an introduction to the skills needed to assess protein structure and
      function, such as protein quantitation assays and standard curves. Solution and buffer
      preparation, micropipetting, and use of standard equipment such as centrifuges and
      spectrophotometers. SDS-PAGE, staining, and documentation of gels. Strategies and methods
      of protein purification are considered along with emphasis on chromatographic and
      electrophoretic techniques. An emphasis on peptide mapping and sequencing is included.
      PRE- or COREQUISITE(S): BIOT 200 or consent of department. Three hours laboratory each
      week.
    credits: 1
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: false
  - id: BIOT230
    name: "Applied Immunology"
    description: >-
      Brief survey of the critical, biotechnology relevant components of the innate and specific
      immune system including immune cells, cytokines, and antibodies. A survey of the related
      signal transduction systems such as JAK STAT and NfB pathways. A brief description of
      immunotherapies such as Dendritic cell vaccines, CAR-T, immune checkpoint therapies
      monoclonal antibodies, and alternate antibody formats such as BiTEs and DARTs. Antigen
      antibody interactions, epitope mapping, and measurement of binding affinity. Principles of
      immunoassays with an emphasis on Western Blotting, ELISAs and Immunohistochemistry.
      Practical aspects such antibody labeling, antibody handling, storage and dilution,
      analysis of immunoassay data. PREREQUISITE(S): BIOT 200 or consent of department. Three
      hours lecture.
    credits: 3
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[BIOT200]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: BIOT231
    name: "Immunological Methods"
    description: >-
      (G only) Brief survey of the most common immunoassay techniques used to detect biomarkers
      qualitatively and quantitatively. Sample preparation and buffers for immunoassays.
      Handling of antibodies such as reconstitution and dilution of primary and secondary
      antibodies. Determination of antibody specificity. Use of multichannel pipettes, multiwell
      plates and plate readers. Western blotting, ELISA and immunohistochemistry. Bench top
      purification of polyclonal or monoclonal antibodies using protein A chromatography.
      Preparation of an alum absorbed immunogen. PREREQUISITE(S): BIOT 201. PRE- or
      COREQUISITE(S): BIOT 230 or consent of department. Three hours laboratory each week.
    credits: 1
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOT201] }
    approved: false
  - id: BIOT240
    name: "Principles of Nucleic Acid Methods"
    description: >-
      An introduction to the theory of common molecular biology methods used in the study of
      nucleic acids. Topics include the structure of DNA and RNA, DNA isolation and sequencing,
      an introduction to genomics and bioinformatics, probe design and hybridization, PCR,
      microarrays, RNA isolation, enzymes used in molecular biology, principles of cloning
      including the use of vectors for sequencing and expression. PREREQUISITE(S): BIOL 150,
      CHEM 131 and BIOT 200 or consent of department. Three hours lecture.
    credits: 3
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOL150, CHEM131, BIOT200] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: BIOT241
    name: "Nucleic Acid Methods"
    description: >-
      (G only) Introduction to molecular techniques used in the study of nucleic acids. Topics
      include DNA and RNA isolation, an introduction to bioinformatic methods, agarose gel
      electrophoresis, qPCR or RT-qPCR, and PCR. PREREQUISITE(S): BIOT 201. PRE- or
      COREQUISITE(S): BIOT 240 or consent of department. Three hours laboratory each week.
    credits: 1
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOT201] }
    approved: false
  - id: BIOT250
    name: "Principles of Biomanufacturing"
    description: >-
      An overview of the processes and instrumentation required to produce a therapeutic protein
      or vaccine using cells as the manufacturing platform. Desirable host cell properties and
      methods of plasmid based selection. Survey of quality systems and cGMP in biomanufacturing
      including lean six sigma, RCA, CMCs, batch audits, specifications, and the role of QC and
      QA. Upstream processing focusing on bioreactors and process control, harvest and
      clarification. Downstream processing focusing on filtration and chromatography. A brief
      discussion of fill and finish. PREREQUISITE(S): BIOT 120 and BIOT 200 or consent of
      department. Three hours lecture.
    credits: 3
    level: college
    tags: [elective, science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOT120, BIOT200] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "BHP5123, CE Adv Science" }
    grad_tags: [elective]
  - id: BIOT251
    name: "Techniques of Biomanufacturing"
    description: >-
      (G only) Introduction to the process of producing a biological product using a cell line.
      The course will be organized as a production campaign in a simulated cGMP environment.
      Students will complete a batch record as they produce a biological product. Emphasis will
      be on upstream and downstream processes. Preparation of media and buffers. The upstream
      component begins with a vial thaw and flask seeding. Closed system scale-up from a shake
      flask to a 3-liter closed system single use bioreactor. Probe assembly and calibration.
      TFF separation of proteins. Use of FPLC protein purification systems including associated
      software. SDS-PAGE analysis of the purified protein. PREREQUISITE(S): BIOT 121 and BIOT
      201. PRE- or COREQUISITE(S): BIOT 250 or consent of department. Three hours laboratory
      each week.
    credits: 1
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOT121, BIOT201] }
    approved: false
  - id: BIOT260
    name: "Introduction to the Principles of Cell and Gene Therapy"
    description: >-
      (G only) Introduction to the basic concepts of cell and gene therapies. Viral and
      non-viral vectors will be described in detail with respect to vector characteristics and
      selection, production, and purification. Cell therapies will focus on cell collection,
      engineering, and scale out for cells commonly used in therapies (CAR-T, MSC, iPSC). The
      importance of cGMP and critical quality attributes for each will be included.
      PREREQUISITE(S): BIOT 120, BIOT 200, and BIOT 240. Three hours lecture each week.
    credits: 3
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOT120, BIOT200, BIOT240] }
    approved: false
  - id: BIOT261
    name: "Laboratory Fundamentals for Cell and Gene Therapy Production"
    description: >-
      (G only) Hands-on introduction to the essential methods used in the production of gene and
      cell therapies. Understanding of BSL levels and safety considerations. Basic cGMP with an
      emphasis on aseptic technique and GDP. Plasmid and vector production (bioreactor) in
      producer cells, plasmid and vector purification, characterization of vectors. Scale up and
      scale out of cells in bioreactors. Quality control assays including qPCR, ELISA, and rapid
      sterility testing. Lab math is associated with cell and gene therapy such as the
      determination of multiplicity of infection, cell concentration at infection, and vector
      genomes. PREREQUISITE(S): BIOT 121, BIOT 201, BIOT 241. PRE- or COREQUISITE(S): BIOT 260.
      Three hours laboratory each week.
    credits: 1
    level: college
    tags: [science]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [BIOT121, BIOT201, BIOT241] }
    approved: false
