    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    prereqs: { all_of: [], any_of: [[ARTT221]] }
    approved: true
    hs_credit: { category: "General Elective", synergy: "ART5128, CE Adv Visual Art" }
    grad_tags: [elective]
  - id: ARTT225
    name: "Woodcut: Global Printmaking"
    description: >-
      (ARTD, GEIR, GEEL, GCP) Basic woodcut and relief printing techniques and study of
      influences in imagery, concepts, and the use of materials from a Global Perspective.
      Students will develop a body of original work that represents their individual, creative
      expression through the medium of woodcut. Black-and-white and color work will be assigned,
      progressing from simple to more complex methods of printing. Among the techniques
      introduced will be Western and Japanese inspired approaches to woodcut. Students cannot
      also receive credit for ARTT 228. Two hours lecture, four hours studio each week.
    credits: 3
    level: college
    tags: [elective, fine_arts]
    grade_levels: [11, 12]
    offered_terms: [fall, spring]
    approved: true
