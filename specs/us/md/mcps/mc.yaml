    name: "Interior Materials and Finishes"
    description: >-
      (R only) An examination of the characteristics, use, specification, and installation of
      current materials and finishes applied to interior walls, floors, furniture, and
      cabinetry. Materials and finishes explored will include woods, metals, plastics, ceramics,
      and natural products. Product manufacturer's representatives will provide in-class product
