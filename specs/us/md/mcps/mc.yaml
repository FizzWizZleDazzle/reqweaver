    description: >-
      Familiarize students with the basic concepts and principles of public relations. Designed
      to give students hands-on experience in public relations on campus, with external
      organizations, and with social media. This class is a supplemental course for students
      majoring in communication. PREREQUISITE(S): COMM 108 or COMM 112. Three hours each week.
