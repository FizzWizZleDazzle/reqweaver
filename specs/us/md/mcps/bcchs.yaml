  - id: ART2023A
    name: Fashion Production 1A
    description: >-
      In this multimedia course, students will explore the artistic process, starting with ideation, sketching, and basic patterns and finishing with a wearable garment. They will use art elements and design principles to communicate a personal narrative in original designs. Students will gain valuable insights into the industry by interpreting the work of established designers throughout the history of fashion and costume design. Writing, academic language, and critical-thinking skills are developed through artist statements, critiques, and the close reading of artworks as text.
