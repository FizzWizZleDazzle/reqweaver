  # --- Health and Physical Education -----------------------------------------
  - id: HPE2047A
    name: Hon Health Education A
    description: >-
      Provides students with the instruction on knowledge and skills necessary to help them make healthful decisions-both now and in the future. Through the implementation of an effective, standards-based health education instructional program, students develop and practice life skills to enhance academic success, and positive behaviors that will equip them to meet the challenges and demands of their lives. The Health promotion and disease prevention concepts presented in this course: Mental and Emotional Health; Substance Abuse Prevention; Family Life and Human Sexuality; Safety and Violence Prevention; Healthy Eating; and Disease Prevention and Control. Health Education aligns with Be Well 365 by emphasizing lifelong positive health-related attitudes and behaviors that promote self-reliance and self-regulation for all students.
    credits: 0.5
    tags: [health]
    level: honors
    offered_terms: [fall]
    grade_levels: [10]
    prereqs:
      all_of: []
      any_of: []

  - id: HPE2047B
    name: Hon Health Education B
    description: >-
      Builds on the prerequisite course Honors Health Education A. In this course, students engage further with health promotion concepts. The goal of this course is to engage more through health literacy skill development to promote and support health-enhancing behaviors. The health literacy skills include analyzing influences of family, peers, culture, media, technology, and other factors on health behaviors; accessing valid information; using interpersonal communication skills; demonstrating ability to use decision-making and goal setting skills; practicing health-enhancing behaviors and avoid or reduce health risks; and advocating for personal, family, and community health. Health Education aligns with Be Well 365 by emphasizing lifelong positive health-related attitudes and behaviors that promote self-reliance and self-regulation for all students.
    credits: 0.5
    tags: [health]
    level: honors
    offered_terms: [spring]
    grade_levels: [10]
    prereqs:
      all_of: [HPE2047A]
      any_of: []

  - id: HPE2029
    name: Family Life and Human Development
    description: >-
      Students develop a greater understanding of how family relationships and human sexuality have an impact on individual health and society. Topics include interpersonal relationships, economics of family life, responsibilities of marriage and parenting, pregnancy prevention; pregnancy and childbirth, and sexually transmitted infections. Due to the nature of this course, parental permission is required for students under 18. This course does not meet the Health Education graduation requirement.
    credits: 0.5
    tags: [health]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [9, 10, 11, 12]
    prereqs:
      all_of: [HPE2047B]
      any_of: []

  - id: HPE2030
    name: Human Behavior
    description: >-
      Students explore human behavior through four major concepts - human needs, perception, self-image and coping, and behavior/decision making. What influences the decisions we make, how we make decisions, how those decisions affect us and others, group dynamics, and communications skills are the focus of this course. This course does not satisfy the Health Education graduation requirement.
    credits: 0.5
    tags: [health]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [9, 10, 11, 12]
    prereqs:
      all_of: [HPE2047B]
      any_of: []

  - id: HPE2034
    name: First Aid
    description: >-
      Students learn to recognize emergencies and make appropriate decisions for first aid care. They acquire American Red Cross certification. Students learn first aid skills the citizen responder needs in order to act as the first link in the Emergency Medical Services (EMS) system. Emphasis is placed on the prevention of injuries and illness and personal safety and health. This course does not meet the Health Education graduation requirement.
    credits: 0.5
    tags: [health]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [9, 10, 11, 12]
    prereqs:
      all_of: [HPE2047B]
      any_of: []

