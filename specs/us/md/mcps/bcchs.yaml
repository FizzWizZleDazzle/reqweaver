specsheet: school
schema_version: 1
catalog_year: 2026
id: us/md/mcps/bcchs
kind: high_school
name: Bethesda-Chevy Chase High School (MCPS 2026-27 catalog)
credit_unit: carnegie
terms_per_year:
  - { id: fall,   sequence: 1 }
  - { id: spring, sequence: 2 }
  # Summer school offers select original-credit courses only. This list
  # is the typical MCPS offering (health, PE, NSL Government, Algebra 1,
  # Geometry); verify against the yearly summer catalog.
  - id: summer
    sequence: 3
    optional: true
    max_courses: 2   # 2 slots; an A/B pair taken together fills one
    sequential: true # sessions run consecutively, so B may follow A
    max_credits: 1.0 # one credit per summer, the current MCPS policy
    offerings: [HPE2047A, HPE2047B, HPE2011, HPE2016, SOC2004A, SOC2004B,
                MAT2000A, MAT2000B, MAT2003A, MAT2003B]
grade_levels: [9, 10, 11, 12]
# Tags whose courses are placement-restricted: they satisfy the same
# requirements but only join plans for students actually in the
# program (inferred from course history, or set in the profile).
placement_groups: [eml]
max_courses_per_term: 7
pre_hs_credit:
  satisfies_prereqs: true
  counts_toward_grad: true

notes:
  - >-
    Source caveat - this sheet is built from the MCPS 2026-27 districtwide High School Course Catalog (publication 0468.26), not from a Bethesda-Chevy Chase school bulletin, because the provided source document is the districtwide catalog. It lists the departmental course offerings available to MCPS comprehensive high schools, filtered by the catalog's "Offered at" restrictions (the IB sections name B-CC; the AP Capstone, Blair/Poolesville magnet, Visual Art Center, and school-restricted career sections do not, and are excluded), plus the career programs whose Offered-at list names B-CC (Child Development Associate, PLTW Engineering) or all high schools (Computer Science/Code.org, internships). It therefore likely overstates what B-CC actually schedules; rebuild from the school's own bulletin when one is available.
  - >-
    Course ids come from the catalog's course tables. Where an id also appears in the Churchill sheet (specs/us/md/mcps/wchs.yaml) or the Northwood sheet (specs/us/md/mcps/nhs.yaml), the description, tags, level, exam, content group, excludes and periods are taken from there unchanged, because all the sheets draw on the same district course bulletin. Descriptions for the remaining courses come from the MCPS online course catalog at coursecatalog.montgomeryschoolsmd.org, and a few from the district boilerplate shared with the Clarksburg bulletin. Courses with no entry in the online catalog carry a note and no description rather than an invented one.
  - >-
    The exam registry has no International Baccalaureate exam ids, so the IB courses carry the ib level (exam-bearing) but no exam field. AP Physics C (MEM), the combined mechanics and electricity-and-magnetism year, has no single registry exam id either.
  - >-
    Mathematics - of the four required credits, one must be an algebra credit and one must be a geometry credit, and students must be enrolled in a math course in each year of high school. Neither rule is expressible as a credit total, so both are recorded here rather than in grad_requirements.
  - >-
    Science - of the three required NGSS-aligned credits, one must be a life science credit, one a physical science credit, and one an Earth/space science credit or a course with the topics integrated. The catalog marks the NGSS-approved courses; the subject tag vocabulary cannot single out that subset, so the rule is recorded here.
  - >-
    Technology - MSDE requires a state-approved technology course. The catalog's TE courses are Foundations of Technology, Foundations of Computer Science, Foundations of Engineering and Technology, Introduction to Engineering Design, AP Computer Science Principles TE, IB Computer Science 1, and Making for Engineers e4usa. This is not recorded in grad_requirements because the subject tag vocabulary cannot single out the TE-designated subset.
  - >-
    Social studies - U.S. History, NSL Government, and World History are each required for graduation; the catalog's table accepts the AP variants and IB History 1 for the respective slots.
  - >-
    Summer offerings vary from year to year, so no course lists summer in offered_terms.
  - >-
    Content groups mark courses that teach the same material at different rigor tiers, or the same course offered in single- and multi-period forms, so a student takes one form but not both. Groups are formed per semester half; families connected by a prerequisite path stay ungrouped. AP BC Calculus keeps its excludes pair with AP AB Calculus and stays ungrouped because AP AB Calculus is an accepted prerequisite; AP Statistics and Honors Statistics stay ungrouped for the same reason. 2YR Algebra 2 A/B stays out of the algebra2 groups as the first year of the two-year stretch; the second year (MAT2016C/D) is grouped with Algebra 2 and Honors Algebra 2.
  - >-
    Same-course scheduling forms grouped: AP Biology (SCI2040 with SCI2041 DP), AP Chemistry (SCI2057 with SCI2059 DP), AP Photography (ART2040 with ART2041 DP), Cybersecurity Capstone (ITC2060 DP with ITC2006 TP), Science Internship (SCI2008 with SCI2009 DP), and the wchs internship group (WBL2014/15/16). Honors Biology DP (SCI2108) and Honors Chemistry DP (SCI2107) carry one id across both semesters, so they cannot join the per-half groups and carry notes instead, like the double-period AP art courses ART2065 and ART2067.
  - >-
    IB rigor tiers grouped per year: the SL and HL first- and second-year halves of IB math Analysis, IB math Applications, IB Biology, IB Chemistry, and IB Physics. First-year IB English carries the english11 content groups and second-year IB English the english12 groups (a course carries one content id, and the graduation slot takes precedence over an IB-only group); IB History 1 carries modern_world_history for the same reason. Latin 3 and Latin 4 each pair a regular and an honors tier. The IB world-language track and the MCPS level track are program placement rather than same-material tiers and stay ungrouped.
  - >-
    The IB Diploma and Career Programme candidate gates (Theory of Knowledge, Personal and Professional Skills) and the SLIFE-only gates (ESL2073/74, MAT2086, MAT2026) are placement restrictions; the SLIFE courses carry the eml tag so the placement gate applies, and the IB programme gates are recorded as notes.
  - >-
    IB Theory of Knowledge 1 and 2 (SOC2015, SOC2016) and IB Film Studies 1 and 2 (ART2110, ART2111) are full-year A/B courses carrying one id in both semesters, modeled like the single-id double-period AP art courses.
  - >-
    Dual-enrollment pointers in the career tables (ITC5104, EDU5110) are Montgomery College concurrent-enrollment courses, not school courses, and are not listed here; see dual_enrollment.

grad_requirements:
  - id: math
    label: Mathematics
    credits: 4.0
    satisfied_by: { tag: math }
  - id: science
    label: Science
    credits: 3.0
    satisfied_by: { tag: science }
  - id: pe
    label: Physical Education
    credits: 1.0
    satisfied_by: { tag: pe }
  - id: fine-arts
    label: Fine Arts
    credits: 1.0
    satisfied_by: { tag: fine_arts }
  - id: english9
    label: English 9
    credits: 1.0
    satisfied_by: { content: [english9_a, english9_b] }
    notes: >-
      MCPS requires the English 9-12 sequence, not any four English credits; the content groups let honors, AP, IB, and EML placement tiers satisfy each slot.
  - id: english10
    label: English 10
    credits: 1.0
    satisfied_by: { content: [english10_a, english10_b] }
  - id: english11
    label: English 11
    credits: 1.0
    satisfied_by: { content: [english11_a, english11_b] }
  - id: english12
    label: English 12
    credits: 1.0
    satisfied_by:
      any:
        - { content: [english12_a, english12_b] }
        - { courses: [ENGL101, ENGL102, ENGL103, ENGL190, ENGL264, ENGL265] }
    notes: >-
      An approved Montgomery College English course through dual enrollment stands in for senior English; the counselor schedules it as ENG5111, CE Adv English. Taking it in an MC summer session is the known path to finishing the English sequence early.
  - id: us-history
    label: U.S. History
    credits: 1.0
    satisfied_by: { content: [us_history_a, us_history_b] }
    notes: >-
      The catalog requires U.S. History, NSL Government, and World History specifically; the content groups let the honors and AP variants satisfy each slot.
  - id: nsl-government
    label: NSL Government
    credits: 1.0
    satisfied_by: { content: [nsl_government_a, nsl_government_b] }
  - id: modern-world-history
    label: Modern World History
    credits: 1.0
    satisfied_by: { content: [modern_world_history_a, modern_world_history_b] }
    notes: >-
      The catalog accepts Modern World History, AP World History, or IB History 1 for the World History requirement.
  - id: health
    label: Health
    credits: 1.0
    satisfied_by: { tag: health }
    notes: >-
      The catalog states one credit of health education (HPE2047A/B satisfies it), the MCPS policy above the 0.5-credit MSDE floor.

  - id: program
    label: World Language or CTE Program
    credits: 2.0
    satisfied_by:
      any:
        - { tag: world_language }
        - { tag: cte }
    notes: >-
      The MSDE program requirement: 2.0 credits of one world language or of career and technical education. The 4-credit career-pathway alternative is not modeled separately; two CTE credits satisfy this entry.

