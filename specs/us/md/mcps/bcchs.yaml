  - id: ENG2037A
    name: IB English Literature SL 2 A
    description: >-
      This course completes the requirements for the higher-level IB English exam. The study of works in translation introduces students, through literature, to other cultural perspectives. The response to the study of literature is through oral and written communication, thus enabling them to develop and refine their command of language. Skills for essay responses to detailed questions and oral analysis of selected literature are polished. External assessment of a literary commentary on a previously unseen passage is completed.
