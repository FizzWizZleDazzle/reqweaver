    name: CPE Team Sports
    description: >-
      This semester-long course includes instruction multiple activity units related to the concentrated physical education (CPE) topic of team sports. The school will use student input in developing which physical activity units will be offered during this course, however, team sports emphasizes the student's ability to function as a team and play different roles successfully. Team sports may include basketball, flag football, volleyball, and more. Each course offers standards-based instruction in the areas of health- and skill-related fitness and develop a personal fitness plan directly related to the CPE activity selected. Students will apply the knowledge of components and principles of health- and skill-related fitness when creating a personal fitness plan directly related to the CPE activity selected. Students are encouraged to enroll in the Foundations of Personal Fitness and Sport course (HPE 2004A) prior to taking SPE courses.
