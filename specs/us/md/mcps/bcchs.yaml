  - id: ENG2091A
    name: Poetry as Universal Literature A
    description: >-
      This is a full year course. In S1, students will: learn basics of English linguistics and phonemes and their application to English language rhyme, alliteration, consonance, assonance, etc.; learn fundamentals of stresses and syllables and how rhythm and meter are created in English; explore differences between English language poetry and other languages' poetic elements; learn poetic and rhetorical techniques beyond those commonly used in core literature classes and how those techniques can apply in prose as well as poetry. In S2, students will: focus on poetic structures, poetry through history, and poetry from around the world; learn poetic forms beyond common meter and the sonnet, including villanelles and sestinas; explore poetic traditions, such as pastoral, elegiac, and lyric poetry; read and analyze poetry from around the world, with discussion of challenges of translating poetry from one language to another; explore modern poetry forms, such as slam poetry and spoken word.
    credits: 0.5
    tags: [english]
    level: regular
    offered_terms: [fall]
    grade_levels: [10, 11, 12]
    prereqs:
      all_of: []
      any_of:
        - [ENG2000B, ENG2001B]
    notes: >-
      The published prerequisite is English 9.

