    description: >-
      Animation is an advanced level course focused on traditional and contemporary techniques and processes as applied to two or three-dimensional animation. This course emphasizes integrated use of drawing, design fundamentals, storyboarding, composition and visual communication. Students are challenged to create original works by synthesizing concepts and skills while engaging in the animation processes. This develops empathetic awareness and understanding of society, culture, and history resulting in students who value and respect diversity. Writing, academic language, and critical thinking skills are developed through artist statements, critiques, and the close reading of animated works as text.
