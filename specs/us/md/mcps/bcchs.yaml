  - id: ENR2016A
    name: Principles of Engineering A
    description: >-
      This is a broad-based survey course to help students understand engineering and engineering technology and identify career possibilities. This course provides an overview of engineering and engineering technology. Students develop problem solving skills by tackling real-world engineering problems. Through theory and practical hands-on experiences, students address the emerging social and political consequences of technological change. End of course exam to earn three college credits.
