  - id: SOC2112A
    name: IB History Americas 2 A
    description: >-
      This course surveys Latin American History in the 19th and 20th centuries and also looks at civil rights and social movements in the 20th century. IB History is a dynamic, contested, evidence-based discipline that involves an exciting engagement with the past. It is a rigorous intellectual discipline, focused around key historical concepts such as change, causation and significance. Topics covered include: Authoritarian States in the 20th century, the Cold War, and the move the Global War. This course will provide the second half of the IB History Diploma requirements, provided the student earns a grade of 4 or better and passes Semester B with a grade of D or better. Students must complete their IB History Internal Assessment by February and take the external IB History exam in May.
