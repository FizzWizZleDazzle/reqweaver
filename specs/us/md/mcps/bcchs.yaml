  - id: SOC2043A
    name: IB History 1 A
    description: >-
      This course, the first year of a required two-year sequence, surveys world history topics from the 8th to the 20th century, with emphasis on: the development of early modern states; the causes and effects of early modern wars; industrialization; independence movements; the rise of authoritarian states; causes and effects of 20th century wars, including the Cold War; the emergence and development of democratic states. The course includes a local choice of an in-depth study in the history of: Africa and the Middle East, The Americas, Asia and Oceana, and Europe.
