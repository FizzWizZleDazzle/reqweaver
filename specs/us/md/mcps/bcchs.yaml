  - id: ART2022A
    name: Fashion Illustration 1A
    description: >-
      Through interactions with and analysis of fashion, students will better understand society, culture, and history. Students will focus on drawing the human figure, both realistically and as stylized by the fashion industry. They will explore different materials and textiles used in designs for men, women, teens, and children. Students will demonstrate proficiency in illustration skills and concepts through guided experimentation, practice, and persistence. They will develop a personal narrative through original designs for various garments and accessories, and present a collection of fashion illustrations to communicate a selected theme. Writing, academic language, and critical-thinking skills are developed through artist statements, critiques, and the close reading of artworks as text.
