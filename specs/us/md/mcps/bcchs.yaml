    description: >-
      This course, the second year of a two-year sequence, provides an opportunity for in-depth study of Africa and/or the Middle East. The course includes locally chosen case studies of a range of historical phenomena including global trade, the effects of colonialism, nationalism and independence movements, ethnic conflicts, economic development, and the emergence and development of both democratic and authoritarian states. Students will also refine their understanding of historical methods and concepts in preparation for the HL History exam. Students who take both IB History 1 and IB History 2 Africa/Middle East will be prepared for the HL exam.
