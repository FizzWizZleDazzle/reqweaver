  - id: WBL2014A
    name: Internship A
    description: >-
      This paid or unpaid internship complements the students school program and is pursued under the supervision of school staff. Weekly in-school seminars explore career and workplace issues. Students will learn about society directly and explore various career options. Internships are at various worksite locations and coordinated and approved at the students home school. Hours required per semester for the internship experience are 75 hours. Students may be required by the sponsoring organization to provide appropriate documentation that may include a social security number and/or proof of citizenship. Students are expected to write and reflect on their experiences, have performance evaluations by their supervisors and track their hours in the work-based learning platform for their grade.
    credits: 0.5
    tags: [cte]
    level: advanced
