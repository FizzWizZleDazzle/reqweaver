  - id: ENR2014A
    name: Digital Electronics A
    description: >-
      This course introduces students to applied digital logic, a key element of careers in engineering and engineering technology. Students explore the smart circuits found in watches, calculators, video games, and computers. Students use industry-standard computer software to test and analyze digital circuitry. They design circuits to solve problems and use appropriate components to build their designs. Students use mathematics and science in solving real-world engineering problems. End of course exam to earn three college credits.
    credits: 0.5
    tags: [cte]
    level: advanced
    offered_terms: [fall]
