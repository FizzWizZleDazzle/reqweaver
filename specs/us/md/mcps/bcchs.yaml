  - id: ENG2045A
    name: IB English Language & Literature HL 1 A
    description: >-
      This first year of the course aims to develop students textual analysis skills and the understanding that texts, both literary and non-literary, can be seen as autonomous yet simultaneously related to culturally determined reading practices. The course develops an understanding of how language, culture, and context determine the ways in which meaning is constructed in texts. It also focuses on how to think critically about the different interactions between text, audience, and purpose.
