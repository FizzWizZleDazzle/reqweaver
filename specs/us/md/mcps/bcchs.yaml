  - id: ART2037A
    name: Darkroom Photography A
    description: >-
      Students will explore the fundamentals of darkroom photography (e.g. operating an SLR camera, processing film, and printing black and white photographs) to create original work. They will explore how to use formal qualities and compositional devices to make aesthetic choices that communicate narrative in a photograph. A collection of photographs will be selected and presented to communicate a theme or a personal narrative. Writing, academic language, and critical thinking skills are developed through artist statements, critiques, and the close reading of photographs as text.
