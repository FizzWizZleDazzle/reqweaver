    description: >-
      This course focuses on portfolio development by refining observational drawing and rendering skills. In addition, students will experiment with forms of drawing, compositional structures, concepts, media, and art-making approaches to communicate personal perceptions in original artworks. They will analyze how visual imagery influences understanding of and responses to the world. Students develop critical-thinking skills when interpreting and evaluating drawing by synthesizing both technical and aesthetic characteristics of drawing. Writing, academic language, and critical-thinking skills are developed through artist statements, critiques, and the close reading of artworks as text.
