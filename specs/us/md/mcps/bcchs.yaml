  - id: ENR2013A
    name: Computer Integrated Manufacturing A
    description: >-
      This course teaches the fundamentals of computerized manufacturing technology. It builds on the solid-modeling skills developed in the Introduction to Engineering Design course. Students use 3-D computer software to solve design problems. They assess their solutions through mass propriety analysis (the relationship of design, function, and materials), modify their designs, and use prototyping equipment to produce 3-D models.
