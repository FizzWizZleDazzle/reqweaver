  - id: ESL2061A
    name: English 10 for English Learners I A
    description: >-
      English Language Arts II (10th grade) courses usually offer a balanced focus on composition and literature. Typically, students learn about the alternate aims and audiences of written compositions by writing persuasive, critical, and creative multi-paragraph essays and compositions. Through the study of various genres of literature, students can improve their reading rate and comprehension and develop the skills to determine the author's intent and theme and to recognize the techniques used by the author to deliver his or her message. These courses also provide an explanation of the English language, enabling students to progress from a beginning level of understanding of English vocabulary and grammatical structures to a more comprehensive grasp of various formal and informal styles of using Academic English in the context of English Language Arts. These courses also provide an explanation of the English language, enabling students to progress from a beginning level of understanding of English vocabulary and grammatical structures to a more comprehensive grasp of various formal and informal styles of using Academic English in the context of English Language Arts. Per MSDE guidelines, only two ESOL courses can be used for English credit. This is one of the courses that may be offered for English credit.
