    name: Beginning Band A
    description: >-
      Beginning Band is for high school students with no instrumental music experience who wish to learn how to play an instrument from the woodwind, brass or percussion families. The development of skills necessary to perform MBDA Grades I and II music and prepare students for a high school band course is stressed. Areas such as elements of musical form, terms and symbols, tone production, instrument care, and the importance of practice habits are presented. Additional experiences may include athletic bands, solo/chamber performance, or musical theatre opportunities. In addition to performing music, creating and responding activities are included. Public performances during and after school may be required to meet course objectives.
