  - id: ENR2015A
    name: Engineering Design and Development A
    description: >-
      This is the capstone course for the Project Lead The Way (PLTW) advanced engineering program. At the end of the course, teams present their research papers and defend their projects to a panel of engineers, business leaders, and engineering college educators for a professional review and feedback. This course equips students with the independent study skills that they will need in postsecondary education and careers in engineering and engineering technology. Students create a portfolio for this course.
    credits: 0.5
    tags: [cte]
    level: advanced
    offered_terms: [fall]
    grade_levels: [11, 12]
    prereqs:
