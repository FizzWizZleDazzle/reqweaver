    name: Site-Based Work Exp A
    description: >-
      Taken concurrently with Career Seminar, this is the actual work experience required to finish the program for graduation. Students begin their job search, with support, in the junior year and summer before senior year so that they have procured a part time job for their senior year. The student will have an abbreviated schedule in order to accommodate their required work hours. 67.5 hours of work experience are required each semester for a total of 135 hours in order to graduate.
