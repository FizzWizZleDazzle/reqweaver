  # --- Social studies --------------------------------------------------------
  - id: SOC2000A
    name: US History A
    description: >-
      This course, a continuation of 8th grade U.S. history, surveys U.S. History from the turn of the century to 1940. In the first two units, students analyze and evaluate how migration, immigration, and industrialization transformed the United States. Unit three analyzes the changing role of the U.S. in world affairs through World War I. The final unit, Culture in Prosperity and Adversity, allows students to analyze the major political, social, economic, technological and cultural developments of the 1920s and 1930s.
    credits: 0.5
    tags: [social_studies]
    level: regular
    content: us_history_a
    offered_terms: [fall]
    grade_levels: [9, 10, 11, 12]
    prereqs:
      all_of: []
      any_of: []
  - id: SOC2000B
    name: US History B
    description: >-
      This course surveys U.S. history from World War II to the present. In Unit Five, The Common Good, students study the causes, course and consequences of World War II, including the war at home. The economic boom, social transformation and technological development of the postwar United States are covered. The struggle for Power in Postwar America, Unit Six, helps students to understand the struggle for racial and gender equality and the extension of civil liberties from 1945 to 1970. Unit Seven, Balance in Foreign Policy, helps students to understand how the Cold War and related conflicts influenced domestic politics and foreign policy from 1945 to the present. Finally, in Patterns in Contemporary America, students analyze the political, economic, social and cultural developments in contemporary America.
    credits: 0.5
    tags: [social_studies]
    level: regular
    content: us_history_b
    offered_terms: [spring]
    grade_levels: [9, 10, 11, 12]
    prereqs:
      all_of: [SOC2000A]
      any_of: []

  - id: SOC2001A
    name: Hon US History A
    description: >-
      This course is a continuation of eighth grade U.S. history. Students learn key concepts and events through reading, writing, document analysis, and historical thinking. In the first semester, students learn the effects of migration, immigration, and industrialization; the impact of United States involvement in world affairs through World War I; and major developments of the 1920s and 1930s. In the second semester, students learn the impact of World War II; the origins and effects of the Cold War; cultural changes in post-war America including the expansion of civil rights; and foreign and domestic policies between 1968 and 1991. This course is required for graduation.
    credits: 0.5
    tags: [social_studies]
    level: honors
    content: us_history_a
