specsheet: school
schema_version: 1
catalog_year: 2026
id: us/md/mcps/wj
kind: high_school
name: Walter Johnson High School (MCPS 2026-27 catalog)
credit_unit: carnegie
terms_per_year:
  - { id: fall,   sequence: 1 }
  - { id: spring, sequence: 2 }
  # Summer school offers select original-credit courses only. This is the
  # MCPS summer offering filtered to courses Walter Johnson lists: the
  # health and PE department file states that Health A is offered online in
  # summer school and that Health B is not, so HPE2047B is dropped, and
  # CPE Net Sports (HPE2011) is not part of the WJ PE offering. Verify
  # against the yearly summer catalog.
  - id: summer
    sequence: 3
    optional: true
    max_courses: 2
    offerings: [HPE2047A, HPE2016, SOC2004A, SOC2004B,
                MAT2000A, MAT2000B, MAT2003A, MAT2003B]
grade_levels: [9, 10, 11, 12]
max_courses_per_term: 7
pre_hs_credit:
  satisfies_prereqs: true
  counts_toward_grad: true

notes:
  - >-
    Sources - this sheet is built from the Walter Johnson department course bulletins and the school's registration site. The mathematics, science, child development and English files are the 2026-27 editions; the technology and computer science, visual art, health and physical education, and world languages files are the 2025-26 editions. Where only a 2025-26 file exists, its offering is recorded as current and should be re-checked against the 2026-27 file when it is published. Course descriptions for courses Winston Churchill also offers are taken from the district reference sheet (wchs.yaml) so that shared course ids carry identical text.
  - >-
    Mathematics - four credits are required, including one algebra credit and one geometry credit, and students must enroll in a mathematics course each year of high school. Neither rule is expressible as a credit total, so both are recorded here rather than in grad_requirements. Maryland adopted a new high school mathematics program (Integrated Algebra 1 and 2) that takes effect in 2027-28 and is not reflected in this catalog.
  - >-
    Science - of the three required NGSS-aligned credits, one must be a biology credit and one must be a physical science credit. The science file states that the elective science courses (Astronomy, Anatomy and Physiology, Forensic Science, Molecular Biology) do not count toward the MCPS graduation requirement. They carry the tag science_elective rather than science so that the science requirement cannot be met with them.
  - >-
    Technology - MSDE requires a state-approved technology course. The Walter Johnson courses labeled "Tech Credit" are TEC2000, TEC2016, ITC2083, and ITC2084. This is not recorded in grad_requirements because the subject tag vocabulary cannot single out the technology-approved subset of CTE courses.
  - >-
    Social studies - the department file requires U.S. History in grade 9, NSL Government in grade 10, and Modern World History in grade 11. AP U.S. History satisfies the U.S. History year, AP Government and Politics U.S. NSL satisfies the NSL Government requirement and may be taken in grade 9 in place of U.S. History, and AP World History satisfies the Modern World History requirement. The file states no credit total for social studies, so none is recorded.
  - >-
    English - the department file states no graduation requirement, so the English 9-12 sequence is recorded as four one-credit content-group requirements. Walter Johnson offers an on-level and an honors English 9; from grade 10 on, only the honors and AP tiers are listed.
  - >-
    Grade levels and prerequisites are taken from the Walter Johnson department files where they are stated, and from the district reference sheet otherwise. Where the two disagree the Walter Johnson wording wins and the course carries a note recording the difference.
  - >-
    Course ids that differ from the district reference sheet - the mathematics file writes the second year of two-year Algebra 2 as MAT2016C/MAT2016D, the technology file gives AP Computer Science A as ITC2007 rather than ITC2081, the English file gives Honors English 12 as ENG2006 rather than ENG2007, and the world languages file gives Chinese 1 as WLG2021 rather than WLG1002. Each course carries a note. Where the difference is only the semester-half suffix, the district A/B convention is kept so that A halves fall and B halves spring.
  - >-
    The English file prints the id ENG2031A/ENG2031B for both AP English 11 Language and Composition and AP English 12 Literature and Composition. ENG2031 is the Language and Composition id, so Literature and Composition is recorded under the district id ENG2032.
  - >-
    Summer offerings vary from year to year, so no course lists summer in offered_terms.
  - >-
    max_courses_per_term is set to 7, the standard MCPS seven-period day. The Walter Johnson files do not state a cap; verify against the school's bell schedule, and note that the double-period courses (AP Biology, AP Chemistry, and the double-period AP art and internship courses) consume two of the seven periods.
  - >-
    Content groups mark courses that teach the same material at different rigor tiers, so a student takes one or the other but not both. Groups are formed per semester half. A family is grouped only when no prerequisite path connects its members; where the catalog allows one tier to serve as a prerequisite for another, the two are a possible sequence rather than variants and are left ungrouped.
  - >-
    Biology, Chemistry, and Physics are each offered at an on-level and an honors tier at Walter Johnson, so each is a content group. AP Physics 1 joins the physics group: the science file states that no prior physics course is needed and that it is a first-year physics class.
  - >-
    AP BC Calculus (MAT2041A/B) excludes AP AB Calculus. The Walter Johnson mathematics file states the BC prerequisite as Honors Precalculus only, so unlike the district sheet there is no catalog path from AB to BC and the exclusion blocks nothing that the catalog allows.
  - >-
    AP Statistics (MAT2068A/B) and Honors Statistics (MAT2046A/B) are left ungrouped. Both state Algebra 2 as the prerequisite, but the district sheet records Honors Statistics as an accepted preparation for AP Statistics, so the two may be a sequence.
  - >-
    2YR Algebra 2 A/B (MAT2015A/B) is left out of the algebra2 content groups. It is the first year of the two-year stretch of Algebra 2 and 2YR Algebra 2 C/D requires it; grouping the two years together would make the two-year path unplannable. The second year is grouped with Algebra 2 and Honors Algebra 2.
  - >-
    French 3 (WLG2043A/B) and Honors French 3 (WLG2048A/B) are grouped: both follow French 2 and both lead to Honors French 4, so they are the same level at two tiers. Every other world language level is offered at a single tier.
  - >-
    AP Drawing (ART2062A/B) and AP Drawing DP (ART2063A/B) are grouped, as are AP 2D Photography (ART2040A/B) and its double-period form (ART2041A/B). The double-period AP courses that carry one id across both semesters, AP 2D Art and Design DP (ART2065) and AP 3D Art and Design DP (ART2067), are left ungrouped: a single-id full-year course cannot join per-half groups when a course may carry only one content id.
  - >-
    Economics is not offered as a survey course; AP Microeconomics (SOC2065) and AP Macroeconomics (SOC2064) are the only economics courses. Sociology is offered only as the CLEP/honors course (SOC2057A/SOC2058B), and psychology only as AP Psychology, Political Psychology and Behavior, and Positive Psychology, none of which are tiers of the same course.
  - >-
    Advanced Acting (ART2103) and Stage Design (ART2104) are listed by Walter Johnson as one-semester courses, first and second semester respectively, and Play Directing (ART2105) without a semester. They are recorded as ART2103A in fall, ART2104B in spring, and ART2105A in fall, following the district A/B convention.
  - >-
    The English department file lists Theatre 1, Advanced Acting, Stage Design, Music Theater, and Play Directing among the English electives; they are recorded here under fine arts, which is where the district reference sheet places them and which matches the file's own statement that Music Theater earns fine arts credit.
  - >-
    Career Seminar (NSS2034A/B) states Site-Based Work Experience (WBL2013A/B) as a corequisite and College/Career Research and Development (NSS2035A/B) as its prerequisite. The corequisite is recorded in a note rather than in coreqs, because the district reference sheet records neither and the engine rejects asymmetric pairs.
  - >-
    Courses recorded with grade_levels [9, 10, 11, 12] where the source states no grade range rely on their prerequisite chain to place them; this affects the child development and hospitality program sequences.
  - >-
    Double-period courses carry 0.5 credits per semester here, matching the district reference sheet, although the district catalog lists 1.0 credit per semester for some of them (AP 2D Photography DP, for example). They consume two of the seven periods either way.
  - >-
    The ESOL file lists sheltered sections of the on-level English courses (ENG2000A40, ENG2002A40, ENG2004A40, ENG2006A40) and ESOL-supported sections of Algebra 1, Geometry, U.S. History, and NSL Government, all carrying a 40 suffix on the standard course id. They are support sections of courses already listed rather than separate courses, and no description is published for them, so they are not recorded.
  - >-
    Walter Johnson lists several courses that the district course catalog does not recognize: Music Theater (ART2101) and TV Production (recorded under AMC2014 and AMC2015; see their notes). Each carries a note. Registration card and department file disagreements about an id are recorded on the course.

