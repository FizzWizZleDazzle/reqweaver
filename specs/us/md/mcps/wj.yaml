  - id: SOC2089
    name: American History Through Film
    description: >-
      In this one-semester class, students will study modern American history through the medium of film. This will be done through viewing, writing, and discussing both historical and contemporary pieces on topics related to the political, social, economic, and racial history of the United States. Besides examining these historical events, students will examine the legacy of racism, poverty, corruption, patriotism, civics, and ideology on contemporary American culture. In addition to each film's historical and cultural importance, the course will also concentrate on film appreciation and the study of cinematography.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      May only be taken for one semester, in either semester 1 or semester 2.

  - id: SOC2067
    name: Comparative Religions
    description: >-
      Comparative Religion courses survey and compare the various forms and values of several world religions offering students a basic understanding of the world's diverse religious faiths and practices Course topics typically include the belief systems of adherents the relationships among humans nature ancestors and the spiritual world and the historical development of each religion.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [10, 11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      A one-semester course, offered in either semester 1 or semester 2.

  - id: SOC2102
    name: Personal Finance
    description: >-
      This course is designed to help students identify and learn personal strategies for managing financial resources. Investment simulations are used to focus on the importance of managing funds and investing wisely. Topics include consumerism, personal finance, credit, and investment planning. Students may earn SSL hours upon successful completion of assignments and course.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      May only be taken for one semester, in either semester 1 or semester 2.

  - id: SOC2031
    name: Ancient Mediterranean Civilizations
    description: >-
      This course explores the history of Ancient Egypt, Greece, and Rome, with a focus on the relevance of these great civilizations to present day America. All three great civilizations are explored in depth, focusing on the cultural, political, military, economic, and social history of each. Learn how the pharaohs, mummies, and pyramids of Ancient Egypt collapsed under Greek control due to Alexander the Great, and then under Roman control due to Cleopatra and Julius Caesar. Then focus on the rise of Ancient Greece, with its famous mythology, philosophers, democracy, architecture, and clashes between Sparta and Athens. Finally, explore the glory and power of ancient Rome, and analyze how such a great civilization could collapse into the Dark Ages.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall]
    grade_levels: [10, 11, 12]
    prereqs:
      all_of: []
      any_of: []

  - id: SOC2032
    name: Medieval History
    description: >-
      After the glory of the Roman Empire, Europe collapsed into the Dark Ages. This course examines this tumultuous period between the fall of Rome and the rise of the Renaissance, roughly 500 to 1500 A.D., and focuses on the relevance of this time period to present day America. Topics include the rise of Christianity and Islam (and the conflict between them), Charlemagne, the Vikings, feudalism, the Black Death, the Crusades, the Hundred Years War, Genghis Khan, Marco Polo, the Inquisitions, and the beginning of the Renaissance.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [spring]
    grade_levels: [10, 11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      Taking this course after Ancient Mediterranean Civilizations is recommended but not required.

  - id: SOC2094
    name: APIDA Studies
    description: >-
      The goal of this course is to introduce students to the histories, social issues, cultures, and politics of people who identify under the umbrella term Asian/Pacific Islander/Desi/American (APIDA). "Asian American" is a term that was coined to build political power and solidarity among various ethnic groups (there is no single "Asian culture"). With this lens, students will engage with topics such as identity, racism, immigration, activism, and current events. By the end of the course, students will have developed an understanding of the rich diversity within what is broadly labeled as the "Asian" community in the United States.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [10, 11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      Offered first or second semester depending on enrollment.

  - id: SOC2059
    name: Law I
    description: >-
      This course is designed to help students understand the processes by which American society seeks justice and order through law, and ways in which people can participate in those processes. Students examine history and philosophy of law, how the law works and can be made to work in actual situations, and major substantive areas of law such as torts, property, criminal, and juvenile law.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall]
    grade_levels: [11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      Walter Johnson offers Law I in the first semester and Law II in the second; the district reference sheet carries a single Law course.

  - id: SOC2060
    name: Law II
    description: >-
      Law 2 is a one semester introductory course providing a review of the American legal system with a focus on civil law. Topics include individual rights and liberties, family law, and consumer law. Freedom of speech, of the press, of religion, the right to privacy, and discrimination law will be studied. Some of the family and consumer issues presented in class include marriage, legal issues related to single people who live together, paternity, legal issues in parent-child relationships, contracts, and deceptive sales practices. During the course, students analyze legal issues and case studies to illustrate civil law related principles. Class assignments and activities may also include mock trials, research projects, and video presentations.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [spring]
    grade_levels: [11, 12]
    prereqs:
      all_of: []
      any_of: []

  - id: SOC2063
    name: Philosophy
    description: >-
      This course acquaints students with the discipline and history of philosophy. Major philosophers and their works are studied with focus on such issues as the nature of the universe; the basic moral and intellectual superstructure of society; good and evil; free will and determinism; and the relationship of a person to other individuals and to the state. Current trends in philosophy are studied as well.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      Offered first or second semester depending on enrollment.

  - id: SOC2088
    name: Political Psychology and Behavior
    description: >-
      This semester-long course examines how we, as humans, have an innate need to belong, and individuals naturally form into groups of people who have similar interests. However, belonging to a group can have positive and negative consequences. In some instances, we become less empathetic toward outsiders and more polarized in our beliefs. Many of the topics in the core social studies curriculum involve conflict among groups: nationalism, imperialism, slavery, genocide, war, xenophobia, discrimination, identity politics, political campaigns, the role of the media and the press, political parties, divided government and legislative gridlock. Political psychology is an interdisciplinary field that applies concepts from social and cognitive psychology to understand issues encountered through the political process. This course will focus on those issues that are caused by, or result in, conflict among groups.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      Offered first or second semester depending on enrollment.

  - id: SOC2097
    name: Positive Psychology
    description: >-
      The Positive Psychology course allows students to learn how positive psychology can impact one's happiness and well-being and improve the condition of their community as a whole. Students will explore their expectations of what will make them happy and look at the research into why these expectations are often incorrect. Students will learn how the principles of positive psychology can lead to improved daily experiences and life satisfaction.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      Offered first or second semester depending on enrollment.

  - id: SOC2029
    name: Russian History
    description: >-
      Explore the history of Russia in this interesting and low-stress class. Learn more about the Cold War, Czars, Stalin, Rasputin, Ivan the Terrible, and much more.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [10, 11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      Offered first or second semester depending on enrollment.

  - id: SOC2051A
    name: Women's Studies
    description: >-
      Students will examine how the political, economic, and social status of women has changed over time in the United States and the world. Students will analyze how the experiences of women today often differ in a variety of cultural and socio-economic contexts. Students will examine how women have made advances in key areas of life including employment, education, health, media images, and family roles. Examples of women in the U.S. and world will be used to analyze how women have made significant contributions in addressing issues of national and global concern.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall, spring]
    grade_levels: [11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      Offered first or second semester depending on enrollment. The social studies file prints the id as SOC2051; the district catalog carries it as the pair SOC2051A/SOC2051B, and the grade 12 registration card lists a differently named course, Women's History SOC2106, in its place.

  - id: NSS2005
    name: Student Leader A
    description: >-
      In this course students will engage in a variety of real-life leadership experiences that will help them in future classes, jobs and beyond. Students will work together to plan, advertise and execute events for the student body. These events include, but are not limited to, Homecoming, blood drives, Pennies for Patients fundraising, and pep rallies. Whenever they are not planning, students will participate in skill building activities to strengthen communication, planning, and organization. They will learn about their own leadership styles and how to best utilize their skills to work with others in order to accomplish their goals.
    credits: 0.5
    tags: [social_studies]
    level: regular
    offered_terms: [fall]
    grade_levels: [10, 11, 12]
    prereqs:
      all_of: []
      any_of: []
    notes: >-
      The Walter Johnson social studies file prints no id for Student Leadership; the district ids are used. Enrollment is limited: SGA officers, class officers, and Minority Scholars Program executive board members are enrolled automatically and the remaining places are filled by application.

