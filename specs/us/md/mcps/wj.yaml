  - id: ART2108A
    name: Film Production & Performance A
    description: >-
      This course explores the tools, concepts and methods of moving image production. Emphasis is placed on storyboarding and planning, cinematography and composition, and post-production using Adobe or other editing software. Students will create short films that highlight a wide array of strategies to shape meaning including camera movement, dialog and editing among others. This course also explores the relationships between narrative, documentary, experimental, and video art genres. Through technical practice, readings, critiques and discussions, students develop a time-based language and apply it to a variety of film genres and concepts.
