  - id: WLG2046A
    name: French 6A
    description: >-
      French 6 will consider the breadth of French culture, to include signal achievements in French film, music, art, theater, and literature. Organized thematically, the works will include masterpieces originating both in France and in the wider Francophone world. Students will be expected to apply analytic techniques learned in other literary, art, and music courses as well as to master the uniquely French "explication de texte", where the reader learns to examine closely the precision and the authorial intent inherent in the written text or the viewed or oral experience provided by the author. This course may be considered the student's culminating high school experience in French.
    credits: 0.5
    tags: [world_language]
    level: advanced
    offered_terms: [fall]
    grade_levels: [11, 12]
    prereqs:
      all_of: [WLG2057B]
      any_of: []
