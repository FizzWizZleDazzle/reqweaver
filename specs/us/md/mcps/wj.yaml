  - id: ART2103A
    name: Advanced Acting
    description: >-
      This course provides complex development of acting skills and theories begun in Theatre 2. Carefully structured methods of role/character development are introduced. The vocal and physical techniques of period and stylized acting are studied. Group experiences such as Children's and Readers' Theatre are provided. This course may be repeated for credit.
    credits: 0.5
    tags: [fine_arts]
    level: advanced
    offered_terms: [fall]
    grade_levels: [10, 11, 12]
    prereqs:
      all_of: [ART2106B]
      any_of: []
    notes: >-
      Walter Johnson offers Advanced Acting in the first semester, in grades 10 through 12, with Theatre 1 or teacher permission as the prerequisite; the district reference sheet places it in the second semester after Theatre 2. The id is written ART2103 in the Walter Johnson file and carries the A suffix here for the fall half.

  - id: ART2104B
    name: Stage Design B
    description: >-
      Students study stage production and the design and mounting of stage presentations, with emphasis on problems of technical production. Students use advanced skills in both the design and construction aspects of technical theatre sets, costumes, lighting, sound, and properties. Students compare design/production approaches of various designers/directors and practice technical skills related to performance. This course may be repeated for credit.
    credits: 0.5
    tags: [fine_arts]
    level: regular
    offered_terms: [spring]
    grade_levels: [10, 11, 12]
    prereqs:
      all_of: [ART2106B]
      any_of: []
    notes: >-
      Walter Johnson offers Stage Design in the second semester only, with Theatre 1 or previous theatre experience as the prerequisite. No repeats for credit.

  - id: ART2105A
    name: Play Directing
    description: >-
      Students focus on the skills required in Theatre directing. Study centers on the director as interpretative and creative artist, selecting and casting the play, coordinating design functions, blocking the play, developing characterization, and rehearsing the play and developing an ensemble effect in performance. Through the study of various theories, students direct both traditional and experimental theatre forms as culminating productions. This course may be repeated for credit.
    credits: 0.5
    tags: [fine_arts]
    level: advanced
    offered_terms: [fall]
    grade_levels: [11, 12]
    prereqs:
      all_of: [ART2106B]
      any_of: []
    notes: >-
      Walter Johnson states the prerequisite as Theatre 1 and 2 but does not list a Theatre 2 course, so only Theatre 1 is recorded. This course may be repeated for credit. The file prints the id as ART2105 with no semester; the fall half suffix follows the district convention.

