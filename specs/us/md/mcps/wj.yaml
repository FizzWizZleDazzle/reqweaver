  - id: SOC2057A
    name: Sociology CLEP/Honors A
    description: >-
      Honors Sociology introduces students to the systematic study of the relationship between people and society while providing another, slightly different way to earn college credit. Students will examine the core American Sociological Association domains of study in the field of sociology which include: Sociological Perspective, Social Processes, Social Patterns, Institutions, and Social Stratification. Students enrolled in this course will have the opportunity to take the College Level Examination Placement (CLEP) exam for college credit. The Introductory Sociology CLEP exam is designed to assess an individual's knowledge of the material typically presented in an introductory sociology course at most colleges and universities. Policies for awarding credit for exam results vary by school.
    credits: 0.5
    tags: [social_studies]
    level: advanced
    offered_terms: [fall]
    grade_levels: [11, 12]
    prereqs:
      all_of: []
      any_of: []
