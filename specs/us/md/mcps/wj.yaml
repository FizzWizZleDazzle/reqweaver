  - id: ENG2044B
    name: Myth and Modern Culture B
    description: >-
      In the second semester of Myth and Modern Culture, we will continue to examine influential myths and tales. We will look at Native American tales, African American folklore and other folktales from New England to the untamed West. Other topics include the truth behind our favorite Fairy Tales, Cryptozoology, Hauntings, Urban Legends, and Ufology. Also, what myths and beliefs were absorbed by other cultures as they swept through Europe. What traditions have been passed on to us today? Semester A is not required to enroll in semester B. Like semester A, there are no outside assignments in this course; all the work is done in class.
