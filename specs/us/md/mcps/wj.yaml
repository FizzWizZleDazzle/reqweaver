  - id: WLG2101A
    name: Latin 1A
    description: >-
      As students progress through the sequence of Latin courses, they build a foundation of Latin vocabulary and grammar. They study aspects of Roman life and history and the works of major authors such as Cicero, Pliny, Horace, Ovid, Tibullus, or Plautus. In preparation for the AP Latin exam, students translate the Aeneid from Latin into English, analyzing Vergil's style as well as studying the cultural, social, and political context of the literature.
